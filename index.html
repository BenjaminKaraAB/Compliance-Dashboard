  // de pagina's (Loonheffingen, Teams, Klanten, enz.) — die werden dan onklikbaar zodra het klantpaneel
  // open stond tijdens een refresh. Nu bindOnce() dubbele listeners op de vaste buiten-#contentArea

  // hergebruiken.
  attachHandlers();

// Elke stap hieronder is defensief in een try/catch gezet: een fout in de Microsoft-sync
// (bijv. een verkeerd ingevuld App ID) mag de rest van het dashboard nooit blokkeren of
// een blanco pagina veroorzaken — render() moet hoe dan ook draaien.

// MSAL kan een 'interaction in progress'-vlag laten hangen in sessionStorage als een vorige
// inlogpoging (bijv. een gesloten pop-up, of een gecrashte pagina) niet netjes werd afgerond.
// Die vlag blokkeert daarna alle volgende inlogpogingen/stille token-ververste tot de gebruiker
// zijn browsergeschiedenis (en daarmee sessionStorage) wist. Bij het laden van deze pagina is er
// per definitie nog geen interactie bezig, dus we ruimen een eventueel achtergebleven vlag hier
// veilig op — dat voorkomt dat de gebruiker steeds handmatig zijn browsergeschiedenis moet wissen.
try{
  Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf('interaction.status')>-1) sessionStorage.removeItem(k); });
}catch(e){}

// zodat een refresh je niet terugzet naar het Overzicht.

}catch(e){}

    + '<h2>Er ging iets mis bij het laden</h2>'

    + '<p>Probeer de pagina te verversen. Blijft dit gebeuren, stuur deze foutmelding door.</p></div>';
}

/* ============================= COMMAND PALETTE (⌘K) =============================
   Snelle navigatie: druk Cmd+K (Mac) of Ctrl+K (Windows/Linux) en typ om klanten of pagina's te
   zoeken. Enter = openen, Esc = sluiten, ↑/↓ = navigeren. Werkt vanaf elke pagina, ook als een
   klantpaneel open staat. Bewust bovenop de bestaande overlay/panel-stack — z-index hoger dan
   het klant-paneel (z=41) zodat de palette altijd zichtbaar is. */
const CMDK_STATE = { open:false, query:'', idx:0 };
function cmdkResultaten(){
  const q = CMDK_STATE.query.trim().toLowerCase();
  const paginas = [
    {type:'pagina', label:'Overzicht',              view:'dashboard',    icon:'ti-layout-dashboard'},
    {type:'pagina', label:'Boekhouders',            view:'boekhouders',  icon:'ti-users-group'},
    {type:'pagina', label:'Teams',                  view:'teams',        icon:'ti-users'},
    {type:'pagina', label:'Klanten',                view:'klanten',      icon:'ti-building'},
    {type:'pagina', label:'Aanlevering & Saldo',    view:'aanlevering',  icon:'ti-cash'},
    {type:'pagina', label:'Loonheffingen',          view:'loonheffing',  icon:'ti-receipt'},
    {type:'pagina', label:'Autolijst',              view:'autolijst',    icon:'ti-car'},
    {type:'pagina', label:'Instellingen',           view:'instellingen', icon:'ti-settings'},
  ];
  const paginaHits = q ? paginas.filter(p=>p.label.toLowerCase().includes(q)) : paginas;
  const klantHits = q
    ? RAW_KLANTEN.filter(k=>k.naam.toLowerCase().includes(q) || (k.contact||'').toLowerCase().includes(q)).slice(0,20)
    : [];
  const results = [];
  paginaHits.forEach(p=>results.push({...p, key:'view:'+p.view}));
  klantHits.forEach(k=>{
    const b = bh(k.bh);
    results.push({type:'klant', label:k.naam, sub: (b?b.naam+' · ':'') + k.vorm, id:k.id, icon:'ti-user', key:'klant:'+k.id});
  });
  return results;
}
function renderCmdk(){
  let host = document.getElementById('cmdkHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'cmdkHost';
    document.body.appendChild(host);
  }
  if(!CMDK_STATE.open){ host.innerHTML=''; return; }
  const results = cmdkResultaten();
  if(CMDK_STATE.idx >= results.length) CMDK_STATE.idx = Math.max(0, results.length-1);
  const rijenHtml = results.map((r,i)=>`
    <div class="cmdk-rij ${i===CMDK_STATE.idx?'is-active':''}" data-cmdk-idx="${i}">
      <i class="ti ${r.icon}" style="font-size:16px; color:var(--muted); flex:none;" aria-hidden="true"></i>
      <div style="flex:1; min-width:0;">
        <div class="cmdk-label">${(r.label||'').replace(/</g,'&lt;')}</div>
        ${r.sub ? `<div class="cmdk-sub">${r.sub.replace(/</g,'&lt;')}</div>` : ''}
      </div>
      <div class="cmdk-type">${r.type}</div>
    </div>
  `).join('');
  host.innerHTML = `
    <div class="cmdk-overlay" data-cmdk-close></div>
    <div class="cmdk-panel">
      <div class="cmdk-input-wrap">
        <i class="ti ti-search" style="font-size:18px; color:var(--muted);" aria-hidden="true"></i>
        <input id="cmdkInput" placeholder="Zoek klant of pagina…" value="${CMDK_STATE.query.replace(/"/g,'&quot;')}" autocomplete="off"/>
        <span class="cmdk-esc">esc</span>
      </div>
      <div class="cmdk-body">
        ${results.length ? rijenHtml : '<div class="cmdk-leeg">Niets gevonden.</div>'}
      </div>
      <div class="cmdk-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigeren</span>
        <span><kbd>↵</kbd> openen</span>
        <span><kbd>esc</kbd> sluiten</span>
      </div>
    </div>
  `;
  const input = document.getElementById('cmdkInput');
  if(input){
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    input.addEventListener('input', e=>{ CMDK_STATE.query = e.target.value; CMDK_STATE.idx = 0; renderCmdk(); });
    input.addEventListener('keydown', e=>{
      const res = cmdkResultaten();
      if(e.key==='ArrowDown'){ e.preventDefault(); CMDK_STATE.idx = Math.min(res.length-1, CMDK_STATE.idx+1); renderCmdk(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); CMDK_STATE.idx = Math.max(0, CMDK_STATE.idx-1); renderCmdk(); }
      else if(e.key==='Enter'){ e.preventDefault(); cmdkKies(res[CMDK_STATE.idx]); }
      else if(e.key==='Escape'){ e.preventDefault(); cmdkSluiten(); }
    });
  }
  host.querySelectorAll('[data-cmdk-close]').forEach(el=>el.addEventListener('click', cmdkSluiten));
  host.querySelectorAll('[data-cmdk-idx]').forEach(el=>el.addEventListener('click', ()=>{
    const i = parseInt(el.dataset.cmdkIdx, 10);
    cmdkKies(cmdkResultaten()[i]);
  }));
}
function cmdkOpen(){ CMDK_STATE.open = true; CMDK_STATE.query = ''; CMDK_STATE.idx = 0; renderCmdk(); }
function cmdkSluiten(){ CMDK_STATE.open = false; renderCmdk(); }
function cmdkKies(r){
  if(!r) return;
  cmdkSluiten();
  if(r.type==='pagina'){
    STATE.view = r.view;
    STATE.panelKlant = null; STATE.editKlant = null; STATE.showAddKlant = false;
    render();
  } else if(r.type==='klant'){
    STATE.view = 'klanten';
    render();
    // Wacht kort tot render klaar is, open dan het klantpaneel
    setTimeout(()=>{ const klant = RAW_KLANTEN.find(k=>k.id===r.id); if(klant && typeof openKlantPanel==='function') openKlantPanel(klant); }, 30);
  }
}
document.addEventListener('keydown', e=>{
  if(e.shiftKey && e.key.toLowerCase()==='f' && !isTypingInField() && STATE.panelKlant){
    e.preventDefault();
    const panel = document.getElementById('panel');
    if(panel && panel.classList.contains('open')){ panel.classList.toggle('is-focus'); }
  }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(CMDK_STATE.open) cmdkSluiten(); else cmdkOpen();
  } else if(e.key==='Escape' && CMDK_STATE.open){
    cmdkSluiten();
  }
});

/* ============================= BULK-SELECTIE + ACTIEBAR =============================
   Checkbox-selectie in klantentabel + floating actiebar onderaan. Verwijderen via bulk hergebruikt
   de undo-toast (elke klant wordt individueel deleted en één samengevoegde undo-toast wordt getoond). */
function renderBulkBar(){
  let bar = document.getElementById('bulkActionBar');
  const n = STATE.selectedKlanten.size;
  if(n === 0){ if(bar) bar.remove(); return; }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'bulkActionBar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `
    <div class="bulk-count"><span class="bulk-num">${n}</span> geselecteerd</div>
    <button class="bulk-act" data-bulk-mail title="Herinneringsmail sturen naar selectie"><i class="ti ti-mail" aria-hidden="true"></i>Mail sturen</button>
    <select class="bulk-act" data-bulk-status-type title="Markeer selectie als ingediend" style="padding:6px 8px;">
      <option value="">Markeer ingediend…</option>
      <option value="OB">OB</option>
      <option value="VPB">VPB</option>
      <option value="LH">LH</option>
      <option value="JR">JR</option>
    </select>
    <button class="bulk-act" data-bulk-export title="Selectie exporteren"><i class="ti ti-download" aria-hidden="true"></i>Exporteren</button>
    <button class="bulk-act" data-bulk-remove title="Selectie leegmaken"><i class="ti ti-trash" aria-hidden="true"></i>Verwijderen</button>
    <button class="bulk-close" data-bulk-close title="Selectie leegmaken" aria-label="Sluiten"><i class="ti ti-x" aria-hidden="true"></i></button>
  `;
  bar.querySelector('[data-bulk-close]').addEventListener('click', ()=>{ STATE.selectedKlanten.clear(); document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers(); });
  bar.querySelector('[data-bulk-remove]').addEventListener('click', bulkVerwijderen);
  bar.querySelector('[data-bulk-export]').addEventListener('click', bulkExporteren);
  bar.querySelector('[data-bulk-mail]').addEventListener('click', bulkHerinneringSelectie);
  bar.querySelector('[data-bulk-status-type]').addEventListener('change', (e)=>{
    const type = e.target.value;
    if(!type) return;
    if(!confirm(`${STATE.selectedKlanten.size} klant(en) markeren als ingediend voor ${type}?`)) { e.target.value=''; return; }
    bulkMarkeerIngediend(type);
  });
}
function bulkVerwijderen(){
  const ids = Array.from(STATE.selectedKlanten);
  if(!ids.length) return;
  if(!confirm(`${ids.length} klant(en) verwijderen?`)) return;
  const snapshots = ids.map(id=>{
    const k = RAW_KLANTEN.find(x=>x.id===id);
    const store = STORE[id];
    const idx = RAW_KLANTEN.findIndex(x=>x.id===id);
    return k ? { klant: JSON.parse(JSON.stringify(k)), store: store?JSON.parse(JSON.stringify(store)):null, idx } : null;
  }).filter(Boolean);
  snapshots.forEach(s=>{ deleteKlant(s.klant.id); });
  logActiviteit(`${snapshots.length} klanten in bulk verwijderd`);
  STATE.selectedKlanten.clear();
  document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers();
  toast(`${snapshots.length} klant(en) verwijderd`, { duration:6000, undo: ()=>{
    snapshots.sort((a,b)=>a.idx-b.idx).forEach(s=>{
      RAW_KLANTEN.splice(s.idx, 0, s.klant);
      if(s.store) STORE[s.klant.id] = s.store;
    });
    persistMeta(); persist();
    logActiviteit(`Bulk-verwijdering ongedaan gemaakt (${snapshots.length} klanten)`);
    document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers();
    toast(`${snapshots.length} klant(en) hersteld`);
  }});
}
function bulkMarkeerIngediend(type){
  const ids = Array.from(STATE.selectedKlanten);
  if(!ids.length) return;
  let n = 0;
  ids.forEach(id=>{
    const klant = RAW_KLANTEN.find(x=>x.id===id);
    const f = STORE[id];
    if(!klant || !f || !f.dl || !f.dl[type] || f.dl[type].na) return;
    if(type==='LH'){ completeLhPeriode(klant, huidigeGebruiker()); }
    else {
      const entry = f.dl[type];
      const herh = entry.herhaling || 'geen';
      if(herh !== 'geen'){ entry.datum = advanceDate(entry.datum, herh); entry.status = null; }
      else { entry.status = 'ingediend'; }
    }
    n++;
  });
  persist();
  logActiviteit(`${n} klant(en) in bulk gemarkeerd als ingediend (${TYPE_LABEL[type]||type})`);
  STATE.selectedKlanten.clear();
  document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers();
  toast(`${n} klant(en) gemarkeerd als ingediend`);
}
async function bulkHerinneringSelectie(){
  const ids = Array.from(STATE.selectedKlanten);
  const klanten = ids.map(id=>RAW_KLANTEN.find(x=>x.id===id)).filter(Boolean);
  if(!klanten.length) return;
  if(!confirm(`Herinneringsmail versturen naar ${klanten.length} geselecteerde klant(en)?`)) return;
  await verstuurHerinneringenBulk(klanten);
  STATE.selectedKlanten.clear();
  document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers();
}
function bulkExporteren(){
  const ids = Array.from(STATE.selectedKlanten);
  const rijen = [['Naam','KvK','Vorm','Boekhouder','Email','Telefoon','Openstaand saldo']];
  ids.forEach(id=>{
    const k = RAW_KLANTEN.find(x=>x.id===id); if(!k) return;
    const b = bh(k.bh);
    rijen.push([k.naam, k.kvk||'', k.vorm||'', b?b.naam:'', k.email||'', k.tel||'', String(STORE[k.id]?STORE[k.id].saldo:0)]);
  });
  const csv = rijen.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `klantenexport-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`${ids.length} klant(en) geëxporteerd`);
}

/* ============================= NOTIFICATION CENTER =============================
   Bell-icoon in topbar. Toont recente items uit ACTIVITEITENLOG + door de app afgeleide meldingen
   (klanten waarvan een deadline vandaag naar "actie" is verschoven, sync-fouten). Ongelezen-count
   is het aantal items met een timestamp na de laatst-gelezen tijdstip in localStorage. */
const NOTIF_STATE = { open:false };
function _notifLaatstGelezen(){
  try{ return parseInt(localStorage.getItem('cd_notif_read_ts') || '0', 10) || 0; }catch(e){ return 0; }
}
function _notifMarkeerAllesGelezen(){
  try{ localStorage.setItem('cd_notif_read_ts', String(Date.now())); }catch(e){}
  updateNotifDot();
}
function _notifItems(){
  const items = [];
  // 1. Recente activiteitenlog (max 20)
  (ACTIVITEITENLOG||[]).slice(0, 20).forEach(a=>{
    if(!a || !a.ts) return;
    const t = new Date(a.ts).getTime();
    let icon = 'ti-activity', kleur = 'blauw';
    const act = String(a.actie||'');
    if(/verwijderd/i.test(act)){ icon='ti-trash'; kleur='rood'; }
    else if(/toegevoegd/i.test(act)){ icon='ti-user-plus'; kleur='groen'; }
    else if(/afgevinkt|ingediend|verstuurd/i.test(act)){ icon='ti-check'; kleur='groen'; }
    else if(/bijgewerkt|bewerkt/i.test(act)){ icon='ti-edit'; kleur='blauw'; }
    items.push({ts:t, icon, kleur, tekst:act, door:a.door||''});
  });
  // 2. Sync-fout (indien aanwezig)
  if(SYNC && SYNC.lastError){
    items.unshift({ts:Date.now(), icon:'ti-alert-triangle', kleur:'rood',
      tekst:'Sync-fout: '+SYNC.lastError, door:'Systeem'});
  }
  return items.sort((a,b)=>b.ts - a.ts).slice(0, 20);
}
function updateNotifDot(){
  const dot = document.getElementById('notifDot'); if(!dot) return;
  const laatstGelezen = _notifLaatstGelezen();
  const ongelezen = _notifItems().filter(i=>i.ts > laatstGelezen).length;
  dot.style.display = ongelezen > 0 ? 'block' : 'none';
}
function renderNotifDropdown(){
  let host = document.getElementById('notifHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'notifHost';
    document.body.appendChild(host);
  }
  if(!NOTIF_STATE.open){ host.innerHTML=''; return; }
  const items = _notifItems();
  const laatstGelezen = _notifLaatstGelezen();
  const kleurMap = {rood:'#fdeaea|#791f1f', groen:'#dcf7ec|#0f7550', oranje:'#fdf1de|#633806', blauw:'#e5f5fa|#0c447c'};
  const rijenHtml = items.map(i=>{
    const [bg, fg] = (kleurMap[i.kleur]||'#eef0f4|#556377').split('|');
    const ongelezen = i.ts > laatstGelezen;
    const tijdText = _relatievTijd(i.ts);
    return `<div class="notif-rij ${ongelezen?'is-ongelezen':''}">
      <div class="notif-icoon" style="background:${bg}; color:${fg};"><i class="ti ${i.icon}" style="font-size:16px;" aria-hidden="true"></i></div>
      <div class="notif-body">
        <div class="notif-tekst">${String(i.tekst).replace(/</g,'&lt;')}</div>
        <div class="notif-meta">${i.door ? i.door + ' · ' : ''}${tijdText}</div>
      </div>
      ${ongelezen ? '<span class="notif-nieuw"></span>' : ''}
    </div>`;
  }).join('');
  host.innerHTML = `
    <div class="notif-overlay" data-notif-close></div>
    <div class="notif-panel">
      <div class="notif-head">
        <span style="font-weight:600; font-size:14px;">Meldingen</span>
        <button class="notif-mark-read" data-notif-mark-read>Markeer alles gelezen</button>
      </div>
      <div class="notif-body-wrap">
        ${items.length ? rijenHtml : '<div class="notif-leeg">Geen meldingen.</div>'}
      </div>
    </div>
  `;
  host.querySelectorAll('[data-notif-close]').forEach(el=>el.addEventListener('click', notifSluiten));
  host.querySelectorAll('[data-notif-mark-read]').forEach(el=>el.addEventListener('click', ()=>{
    _notifMarkeerAllesGelezen(); renderNotifDropdown();
  }));
}
function _relatievTijd(ts){
  const sec = Math.round((Date.now() - ts)/1000);
  if(sec < 60) return 'zojuist';
  if(sec < 3600) return Math.floor(sec/60) + ' min geleden';
  if(sec < 86400) return Math.floor(sec/3600) + ' uur geleden';
  if(sec < 604800) return Math.floor(sec/86400) + ' dagen geleden';
  return new Date(ts).toLocaleDateString('nl-NL');
}
function notifOpen(){ NOTIF_STATE.open = true; renderNotifDropdown(); }
function notifSluiten(){ NOTIF_STATE.open = false; renderNotifDropdown(); _notifMarkeerAllesGelezen(); }

/* ============================= AI-ASSISTENT PANEEL =============================
   Chatpaneel dat vragen doorstuurt naar een kleine Cloudflare Worker (AI_WORKER_URL), die op zijn beurt
   een Cloudflare-gehost taalmodel aanroept via de Workers AI-binding. Geen API-key in deze broncode nodig
   — die logica zit in de Worker. aiContextSamenvatting() geeft de assistent een compacte, actuele
   samenvatting van de belangrijkste dashboarddata mee (geen volledige klantendump, om tokens/kosten en
   privacy-blootstelling te beperken). */
const AI_WORKER_URL = 'https://compliancebox-ai.benjamin-092.workers.dev';
const AI_STATE = { open:false, loading:false, messages: (function(){ try{ return JSON.parse(localStorage.getItem('cd_ai_messages')||'[]'); }catch(e){ return []; } })() };
function _aiBewaarBerichten(){
  try{ localStorage.setItem('cd_ai_messages', JSON.stringify(AI_STATE.messages.slice(-30))); }catch(e){}
}
/* Bouwt een volledige samenvatting van ALLE dashboarddata (niet meer alleen een top-15) voor de
   AI-assistent: per klant boekhouder, rechtsvorm, banksaldo, OB/VPB/LH/JR-status, loonheffing-
   voortgang + vaste notitie, en aantal auto's. Bij ~300-400 klanten blijft dit ruim binnen het
   context-venster van het model (128k tokens) en de kosten zijn verwaarloosbaar (~$0,01 per vraag). */
function aiContextSamenvatting(){
  try{
    const klantregels = RAW_KLANTEN.map(k=>{
      const f = STORE[k.id];
      if(!f) return `- ${k.naam}: (geen data)`;
      const boekhouderNaam = bh(k.bh) ? bh(k.bh).naam : 'onbekend';
      const statussen = ['OB','VPB','LH','JR'].map(t=>{
        const e = effDL(k,t);
        if(!e || e.na) return null;
        const s = statusOf(e);
        return `${t} ${fmtDate(e.datum)} (${s.key})`;
      }).filter(Boolean).join(', ');
      (f.dl.overige||[]).forEach(o=>{
        // overige deadlines apart meenemen, want die zitten niet in de OB/VPB/LH/JR-lijst hierboven
      });
      let lhInfo = '';
      if(k.doetLoonaangifte && f.lh){
        const gedaan = (f.lh.taken||[]).filter(t=>t.done).length;
        const totaal = (f.lh.taken||[]).length;
        lhInfo = ` | LH-taken ${gedaan}/${totaal}`;
        if(f.lh.overigeNotitie) lhInfo += ` | LH-vaste notitie: "${String(f.lh.overigeNotitie).slice(0,100)}"`;
      }
      const autoCount = AUTOS.filter(a=>a.klant===k.id).length;
      const notitie = f.notities ? ` | notitie: "${String(f.notities).slice(0,100)}"` : '';
      const afspraken = f.afspraken ? ` | afspraken: "${String(f.afspraken).slice(0,150)}"` : '';
      return `- ${k.naam} | vorm ${k.vorm||'onbekend'} | boekhouder ${boekhouderNaam} | saldo ${fmtEUR(f.saldo)} | ${statussen || 'geen lopende deadlines'}${lhInfo}${autoCount?` | ${autoCount} auto('s)`:''}${notitie}${afspraken}`;
    }).join('\n');

    const rows = allDeadlineRows();
    const cnt = {actie:0, nadert:0, schema:0, ingediend:0};
    rows.forEach(r=>cnt[r.st.key]++);
    const totalSaldo = RAW_KLANTEN.reduce((s,k)=>s+STORE[k.id].saldo,0);
    const teamsInfo = TEAMS.map(t=>t.naam).join(', ') || '(geen teams)';
    const bhInfo = BOEKHOUDERS.map(b=>b.naam).join(', ') || '(geen boekhouders)';

    const kennisbankTekst = (KENNISBANK.artikelen||[]).length ? KENNISBANK.artikelen.map(a=>{
      const cat = a.categorieId ? kbCategorieNaam(a.categorieId) : 'Algemeen';
      return `## [${cat}] ${a.titel}\n${a.inhoud||''}`;
    }).join('\n\n') : '(nog niets vastgelegd)';

    return `Vandaag: ${TODAY.toLocaleDateString('nl-NL')}.
Totaal ${RAW_KLANTEN.length} klanten, ${BOEKHOUDERS.length} boekhouders (${bhInfo}), ${TEAMS.length} teams (${teamsInfo}), ${AUTOS.length} auto('s) in de autolijst.
Deadlinestatus over alle klanten: ${cnt.actie} actie vereist, ${cnt.nadert} nadert, ${cnt.schema} op schema, ${cnt.ingediend} ingediend.
Totaal openstaand banksaldo over alle klanten: ${fmtEUR(totalSaldo)}.

Volledige klantenlijst met actuele status per klant:
${klantregels || '(geen klanten)'}

Interne kennisbank van AdministratieBox (onze eigen werkwijze/stappenplannen — gebruik dit als bron voor vragen over "hoe doen wij dit", niet alleen algemene kennis):
${kennisbankTekst}`;
  }catch(e){ return 'Geen dashboarddata beschikbaar.'; }
}
// Escaped HTML-tekst, met URLs omgezet naar aanklikbare links (voor bronvermeldingen bij
// internetzoekopdrachten) en newlines behouden via CSS white-space:pre-wrap op de bubbel.
function aiLinkify(tekst){
  const escaped = String(tekst).replace(/</g,'&lt;');
  return escaped.replace(/(https?:\/\/[^\s]+)/g, url=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}
function renderAiPanel(){
  let host = document.getElementById('aiHost');
  if(!host){ host = document.createElement('div'); host.id = 'aiHost'; document.body.appendChild(host); }
  if(!AI_STATE.open){ host.innerHTML=''; return; }
  const berichtenHtml = AI_STATE.messages.length ? AI_STATE.messages.map(m=>`
    <div class="ai-msg ${m.role}">
      ${m.role==='assistant' ? '<div class="ai-msg-avatar"><i class="ti ti-sparkles" aria-hidden="true"></i></div>' : ''}
      <div class="ai-msg-bubble">${aiLinkify(m.text)}</div>
    </div>`).join('') : `
    <div class="ai-empty">
      <i class="ti ti-sparkles" style="font-size:22px; color:var(--muted2);" aria-hidden="true"></i>
      <p>Stel een vraag over klanten, deadlines of taken.</p>
    </div>`;
  const typingHtml = AI_STATE.loading ? `
    <div class="ai-msg assistant">
      <div class="ai-msg-avatar"><i class="ti ti-sparkles" aria-hidden="true"></i></div>
      <div class="ai-msg-bubble ai-typing"><span></span><span></span><span></span></div>
    </div>` : '';
  host.innerHTML = `
    <div class="ai-overlay" data-ai-close></div>
    <div class="ai-panel">
      <div class="ai-head">
        <div style="display:flex; align-items:center; gap:8px;"><i class="ti ti-sparkles" style="color:var(--primary-dark);" aria-hidden="true"></i><span style="font-weight:600; font-size:14px;">AI-assistent</span></div>
        <button class="notif-mark-read" data-ai-close style="padding:4px 8px;"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
      <div class="ai-body-wrap" id="aiBodyWrap">${berichtenHtml}${typingHtml}</div>
      <div class="ai-foot">
        <input type="text" id="aiInput" placeholder="Vraag iets over klanten of deadlines…" autocomplete="off" ${AI_STATE.loading?'disabled':''}>
        <button class="btn sm primary" id="aiSendBtn" aria-label="Versturen" ${AI_STATE.loading?'disabled':''}><i class="ti ti-send" aria-hidden="true"></i></button>
      </div>
    </div>
  `;
  host.querySelectorAll('[data-ai-close]').forEach(el=>el.addEventListener('click', aiSluiten));
  const input = document.getElementById('aiInput');
  const stuur = ()=>{
    const tekst = (input.value||'').trim();
    if(!tekst || AI_STATE.loading) return;
    aiVerstuurBericht(tekst);
    input.value = '';
  };
  document.getElementById('aiSendBtn').addEventListener('click', stuur);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') stuur(); });
  if(!AI_STATE.loading) input.focus();
  const wrap = document.getElementById('aiBodyWrap');
  if(wrap) wrap.scrollTop = wrap.scrollHeight;
}
async function aiVerstuurBericht(tekst){
  AI_STATE.messages.push({role:'user', text:tekst});
  AI_STATE.loading = true;
  _aiBewaarBerichten();
  renderAiPanel();
  try{
    const res = await fetch(AI_WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: AI_STATE.messages.slice(-10).map(m=>({role:m.role, text:m.text})),
        context: aiContextSamenvatting()
      })
    });
    if(!res.ok){
      const errBody = await res.text().catch(()=> '');
      throw new Error(`Server gaf status ${res.status}${errBody ? ' — ' + errBody.slice(0,200) : ''}`);
    }
    const data = await res.json();
    AI_STATE.messages.push({role:'assistant', text: data.reply || 'Geen antwoord ontvangen.'});
  }catch(e){
    AI_STATE.messages.push({role:'assistant', text: 'Kon de AI-assistent niet bereiken (' + ((e&&e.message)||'onbekende fout') + '). Controleer of de Cloudflare Worker actief is en het adres in AI_WORKER_URL klopt.'});
  }
  AI_STATE.loading = false;
  _aiBewaarBerichten();
  renderAiPanel();
}
function aiOpen(){ AI_STATE.open = true; renderAiPanel(); }
function aiSluiten(){ AI_STATE.open = false; renderAiPanel(); }
