        if(f.saldoCredit===undefined) f.saldoCredit = 0;
        if(f.saldo===undefined) f.saldo = 0;
        if(f.txn===undefined) f.txn = 0;
        if(!f.sync) f.sync = new Date().toISOString().slice(0,10);
        if(!Array.isArray(f.items)) f.items = [];
        if(!Array.isArray(f.kanalen)) f.kanalen = ['email'];
        if(f.dagen1===undefined) f.dagen1 = 7;
        if(f.dagen2===undefined) f.dagen2 = 14;
        if(!Array.isArray(f.log)) f.log = [];
        if(f.notities===undefined) f.notities = '';
        if(f.afspraken===undefined) f.afspraken = '';
        if(!Array.isArray(f.akkoordLog)) f.akkoordLog = [];
        if(!Array.isArray(f.vpbAkkoordLog)) f.vpbAkkoordLog = [];
        if(!Array.isArray(f.fiscaleEenheidLog)) f.fiscaleEenheidLog = [];
        if(!Array.isArray(f.betalingsuitstelLog)) f.betalingsuitstelLog = [];
        if(!Array.isArray(f.arbeidsovereenkomstDgaLog)) f.arbeidsovereenkomstDgaLog = [];
        if(!Array.isArray(f.managementovereenkomstDgaLog)) f.managementovereenkomstDgaLog = [];
      } else {
        // Klant staat wel in RAW_KLANTEN maar heeft helemaal geen STORE-record (bijv. door een
        // onderbroken import) — zonder dit zou elke pagina die deze klant toont alsnog crashen.
        STORE[k.id] = { dl:JSON.parse(JSON.stringify(k.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn:0, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', akkoordLog:[], vpbAkkoordLog:[], fiscaleEenheidLog:[], betalingsuitstelLog:[], arbeidsovereenkomstDgaLog:[], managementovereenkomstDgaLog:[] };
      }
    }catch(e){
      console.error('Migratie van klant "'+(k && k.naam)+'" ('+(k && k.id)+') mislukt, klant wordt overgeslagen:', e);
    }
  });
  // Auto's (Autolijst): net als bij klanten migreert elke auto in zijn eigen try/catch, zodat één
  // beschadigd record nooit de hele opstart (en dus de hele pagina) kan laten crashen.
  if(!Array.isArray(AUTOS)) AUTOS = [];
  AUTOS.forEach(a=>{
    try{
      if(a.klant===undefined) a.klant = null;
      if(typeof a.merk !== 'string') a.merk = a.merk ? String(a.merk) : '';
      if(typeof a.kenteken !== 'string') a.kenteken = a.kenteken ? String(a.kenteken).toUpperCase() : '';
      if(a.klantBtwVrijgesteld !== 'ja') a.klantBtwVrijgesteld = 'nee';
      if(a.btwAuto !== 'ja') a.btwAuto = 'nee';
      if(a.gebruik !== 'Enkel zakelijk (onder 500 km prive)') a.gebruik = 'Zakelijk en prive (boven 500km prive)';
      if(a.elektrisch !== 'ja') a.elektrisch = 'nee';
      if(!['personenauto','bestelauto','motor','fiets'].includes(a.type)) a.type = 'personenauto';
      if(typeof a.aankoopdatum !== 'string') a.aankoopdatum = '';
      if(typeof a.verkoopdatum !== 'string') a.verkoopdatum = '';
      if(typeof a.datumEersteInschrijving !== 'string') a.datumEersteInschrijving = '';
      if(a.cataloguswaarde===undefined || a.cataloguswaarde===null || isNaN(Number(a.cataloguswaarde))) a.cataloguswaarde = 0;
      else a.cataloguswaarde = Number(a.cataloguswaarde);
      if(a.dagwaarde!==null && a.dagwaarde!==undefined && (a.dagwaarde==='' || isNaN(Number(a.dagwaarde)))) a.dagwaarde = null;
      else if(a.dagwaarde!==null && a.dagwaarde!==undefined) a.dagwaarde = Number(a.dagwaarde);
      else a.dagwaarde = null;
      if(a.vuzgAanwezig !== 'ja') a.vuzgAanwezig = 'nee';
      if(a.bijtellingViaSalaris !== 'Ja') a.bijtellingViaSalaris = 'Nee';
      if(typeof a.notities !== 'string') a.notities = '';
      if(a.rdwOverschrijvingen===undefined) a.rdwOverschrijvingen = null;
      if(a.rdwLaatsteCheck===undefined) a.rdwLaatsteCheck = null;
      if(a.rdwEigenaarGewijzigd===undefined) a.rdwEigenaarGewijzigd = false;
    }catch(e){
      console.error('Migratie van auto "'+(a && a.id)+'" mislukt:', e);
    }
  });
  // Bijtellingstabel: nooit leeg laten (anders vallen alle berekeningen terug op het forfaitaire
  // 25%-tarief) — vul zo nodig de standaardtabel opnieuw in.
  if(!Array.isArray(INVENTARIS_ITEMS)) INVENTARIS_ITEMS = [];
  if(!Array.isArray(LH_MAAND_BANNERS)) LH_MAAND_BANNERS = [];
  if(!NOTION_CFG || typeof NOTION_CFG !== 'object') NOTION_CFG = { workerUrl:'' };
  if(typeof NOTION_CFG.workerUrl !== 'string' || (NOTION_CFG.workerUrl && !/^https:\/\//.test(NOTION_CFG.workerUrl))) NOTION_CFG.workerUrl = '';
  if(LEERPAD && typeof LEERPAD !== 'object') LEERPAD = null;
  if(!LEERPAD_VOORTGANG || typeof LEERPAD_VOORTGANG !== 'object' || Array.isArray(LEERPAD_VOORTGANG)) LEERPAD_VOORTGANG = {};
  LH_MAAND_BANNERS = LH_MAAND_BANNERS.filter(b=>b && /^\d{4}-\d{2}$/.test(String(b.maand||'')) && String(b.tekst||'').trim());
  INVENTARIS_ITEMS.forEach(it=>{
    if(typeof it.naam !== 'string') it.naam = it.naam ? String(it.naam) : '';
    if(typeof it.omschrijving !== 'string') it.omschrijving = '';
    if(typeof it.serienummer !== 'string') it.serienummer = '';
    if(it.teruggegeven===undefined) it.teruggegeven = false;
    if(it.teruggegevenOp===undefined) it.teruggegevenOp = null;
    if(typeof it.notities !== 'string') it.notities = '';
  });
  if(!RDW_HERCHECK_CFG || typeof RDW_HERCHECK_CFG !== 'object') RDW_HERCHECK_CFG = { herhaling:'uit', laatsteAutoCheck:null };
  if(!['uit','wekelijks','maandelijks','per_kwartaal'].includes(RDW_HERCHECK_CFG.herhaling)) RDW_HERCHECK_CFG.herhaling = 'uit';
  if(!Array.isArray(BIJTELLING_TABEL) || !BIJTELLING_TABEL.length){
    BIJTELLING_TABEL = [
      {jaar:2017, laag:null, cap:null, algemeen:0.22},
      {jaar:2018, laag:null, cap:null, algemeen:0.22},
      {jaar:2019, laag:0.04, cap:50000, algemeen:0.22},
      {jaar:2020, laag:0.08, cap:45000, algemeen:0.22},
      {jaar:2021, laag:0.12, cap:40000, algemeen:0.22},
      {jaar:2022, laag:0.16, cap:35000, algemeen:0.22},
      {jaar:2023, laag:0.16, cap:30000, algemeen:0.22},
      {jaar:2024, laag:0.16, cap:30000, algemeen:0.22},
      {jaar:2025, laag:0.17, cap:30000, algemeen:0.22},
      {jaar:2026, laag:0.18, cap:30000, algemeen:0.22},
    ];
  }
  if(!Array.isArray(ACTIVITEITENLOG)) ACTIVITEITENLOG = [];
  if(!KENNISBANK || typeof KENNISBANK !== 'object') KENNISBANK = { categorieen:[], artikelen:[] };
  if(!Array.isArray(KENNISBANK.categorieen)) KENNISBANK.categorieen = [];
  if(!Array.isArray(KENNISBANK.artikelen)) KENNISBANK.artikelen = [];
  if(!RECHTEN || typeof RECHTEN !== 'object') RECHTEN = { adminEmails:['benjamin@administratiebox.nl'], lhBevoegdeBhIds:[], documentenVersturenActief:false };
  if(!Array.isArray(RECHTEN.adminEmails)) RECHTEN.adminEmails = ['benjamin@administratiebox.nl'];
  if(!Array.isArray(RECHTEN.lhBevoegdeBhIds)) RECHTEN.lhBevoegdeBhIds = [];
  if(RECHTEN.documentenVersturenActief === undefined){
    // Migratie van de oude, documenttype-specifieke sleutel (uit de tijd dat er alleen een IB-akkoordverklaring was).
    RECHTEN.documentenVersturenActief = RECHTEN.akkoordverklaringActief !== undefined ? !!RECHTEN.akkoordverklaringActief : false;
  }
  delete RECHTEN.akkoordverklaringActief;
  if(!KPI_OPERATIONEEL || typeof KPI_OPERATIONEEL !== 'object') KPI_OPERATIONEEL = {};
  if(!KPI_TACTISCH || typeof KPI_TACTISCH !== 'object') KPI_TACTISCH = {};
  ['Q1','Q2','Q3','Q4'].forEach(q=>{
    if(!KPI_TACTISCH[q] || typeof KPI_TACTISCH[q] !== 'object') KPI_TACTISCH[q] = { doel:'', pijlers:[] };
    if(typeof KPI_TACTISCH[q].doel !== 'string') KPI_TACTISCH[q].doel = '';
    if(!Array.isArray(KPI_TACTISCH[q].pijlers)) KPI_TACTISCH[q].pijlers = [];
  });
  if(!KPI_COMMERCIEEL || typeof KPI_COMMERCIEEL !== 'object') KPI_COMMERCIEEL = { week:null, boekhouders:{} };
  if(!KPI_COMMERCIEEL.boekhouders || typeof KPI_COMMERCIEEL.boekhouders !== 'object') KPI_COMMERCIEEL.boekhouders = {};
  /* Migratie van de vorige sessie (KPI_COMMERCIEEL.teams, per team ingevuld) naar KPI_COMMERCIEEL.boekhouders.
     De data landt hier nog onder de team-id als sleutel — de bestaande kgWeek->historie-migratie hieronder en
     de team->boekhouder-migratie verderop pikken die vervolgens vanzelf op en zetten hem definitief op de
     juiste boekhouder. */
  if(KPI_COMMERCIEEL.teams && typeof KPI_COMMERCIEEL.teams === 'object'){
    Object.keys(KPI_COMMERCIEEL.teams).forEach(teamId=>{
      const bron = KPI_COMMERCIEEL.teams[teamId];
      if(!bron || typeof bron !== 'object') return;
      if(!KPI_COMMERCIEEL.boekhouders[teamId]) KPI_COMMERCIEEL.boekhouders[teamId] = {};
      Object.assign(KPI_COMMERCIEEL.boekhouders[teamId], bron);
    });
    delete KPI_COMMERCIEEL.teams;
  }
  /* Migratie van de allereerste, kortstondige versie van Commerciele KPI's (losse kgWeek/kgTotaal/...
     velden, zonder historie) naar de huidige vorm met een historie-array. Dat maakt de lijndiagrammen
     mogelijk: elke opgeslagen week wordt nu een apart punt op de lijn in plaats van één overschreven
     "huidige stand". */
  Object.keys(KPI_COMMERCIEEL.boekhouders).forEach(id=>{
    const t = KPI_COMMERCIEEL.boekhouders[id];
    if(!t || typeof t !== 'object') { KPI_COMMERCIEEL.boekhouders[id] = { historie:[] }; return; }
    if(!Array.isArray(t.historie)){
      const oudeWeekWaarde = (typeof t.kgWeek==='number' || typeof t.convWeek==='number' || typeof t.nkWeek==='number');
      t.historie = (oudeWeekWaarde && KPI_COMMERCIEEL.week) ? [{week:KPI_COMMERCIEEL.week, kg:t.kgWeek||0, conv:t.convWeek||0, nk:t.nkWeek||0}] : [];
      delete t.kgWeek; delete t.kgTotaal; delete t.convWeek; delete t.convTotaal; delete t.nkWeek; delete t.nkTotaal;
    }
  });
  /* Migratie van de vorige sessie-versie van de KPI's (cijfers per TEAM) naar de huidige vorm (cijfers
     per BOEKHOUDER, met het teamcijfer als afgeleide som). Een team-sleutel kan niet één-op-één worden
     opgesplitst zonder te weten wie welk deel deed — beste poging: zet de waarden op de eerste
     boekhouder van dat team (bij een team van precies 1 persoon is dat toch al exact juist). */
  (function migreerKpiTeamNaarBoekhouder(){
    Object.keys(KPI_OPERATIONEEL).forEach(key=>{
      const isTeam = TEAMS.some(t=>t.id===key);
      const isBh = BOEKHOUDERS.some(b=>b.id===key);
      if(isTeam && !isBh){
        const leden = boekhoudersOfTeam(key);
        if(leden.length){ Object.assign(kpiOpVoorBh(leden[0].id), KPI_OPERATIONEEL[key]); }
        delete KPI_OPERATIONEEL[key];
      }
    });
    Object.keys(KPI_COMMERCIEEL.boekhouders).forEach(key=>{
      const isTeam = TEAMS.some(t=>t.id===key);
      const isBh = BOEKHOUDERS.some(b=>b.id===key);
      if(isTeam && !isBh){
        const leden = boekhoudersOfTeam(key);
        if(leden.length){
          const doel = kpiCommVoorBh(leden[0].id);
          (KPI_COMMERCIEEL.boekhouders[key].historie||[]).forEach(h=>{
            if(!doel.historie.some(x=>x.week===h.week)) doel.historie.push(h);
          });
          doel.historie.sort((a,b)=>a.week-b.week);
        }
        delete KPI_COMMERCIEEL.boekhouders[key];
      }
    });
    ['Q1','Q2','Q3','Q4'].forEach(q=>{
      KPI_TACTISCH[q].pijlers.forEach(p=>{
        if(p.teamId && !p.boekhouderId){
          const leden = boekhoudersOfTeam(p.teamId);
          if(leden.length) p.boekhouderId = leden[0].id;
          delete p.teamId;
        }
      });
    });
  })();
}

function kpiTactischGroepenHTML(kwartaal){

/* Tekent (of hertekent) de KPI-staafdiagrammen. Wordt na elke render() / attachHandlers()-cyclus op de
   Overzicht-pagina aangeroepen; no-opt vanzelf als de bijbehorende canvas niet in de DOM staat (paneel
   ingeklapt of in bewerkmodus — dan bestaat de canvas simpelweg niet, en breken we het bestaande
   Chart.js-object daarvoor gewoon af). Vereist dat Chart.js als losse <script> geladen is (zie
   index.html); als dat om wat voor reden dan ook niet lukt, doet deze functie stilletjes niets. Volgt
   dezelfde team-som/per-boekhouder-logica als de HTML (kpiEntiteiten()), zodat de lijnen altijd
   overeenkomen met wat er in de tabellen/kaarten staat. */
function renderKpiCharts(){
  if(typeof Chart === 'undefined') return;
  const { mode, items } = kpiEntiteiten();
  const historieVoor = (it)=> mode==='team' ? kpiCommHistorieVoorTeam(it.id) : kpiCommVoorBh(it.id).historie;
  const weken = (()=>{ const s = new Set(); items.forEach(it=>historieVoor(it).forEach(h=>s.add(h.week))); return [...s].sort((a,b)=>a-b); })();
  const definities = [
    { id:'kpiBtwChart', labels:['Q1','Q2','Q3','Q4'], data: items.map(it=>{ const d = mode==='team' ? kpiOpSomVoorTeam(it.id) : kpiOpVoorBh(it.id); return [d.btwQ1,d.btwQ2,d.btwQ3,d.btwQ4]; }) },
    { id:'kpiKgChart', labels: weken, data: items.map(it=>{ const h = historieVoor(it); return weken.map(w=>{ const p = h.find(x=>x.week===w); return p ? p.kg : null; }); }) },
    { id:'kpiConvChart', labels: weken, data: items.map(it=>{ const h = historieVoor(it); return weken.map(w=>{ const p = h.find(x=>x.week===w); return p ? p.conv : null; }); }) },
    { id:'kpiNkChart', labels: weken, data: items.map(it=>{ const h = historieVoor(it); return weken.map(w=>{ const p = h.find(x=>x.week===w); return p ? p.nk : null; }); }) },
  ];
  definities.forEach(def=>{
    if(KPI_CHARTS[def.id]){ KPI_CHARTS[def.id].destroy(); delete KPI_CHARTS[def.id]; }
    const canvas = document.getElementById(def.id);
    if(!canvas) return;
    KPI_CHARTS[def.id] = new Chart(canvas, {
      type:'bar',
      data:{ labels: def.labels, datasets: items.map((it,i)=>({
        label: it.naam, data: def.data[i], backgroundColor: kpiTeamKleur(i), borderRadius:4, maxBarThickness:28
      })) },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
          y:{ beginAtZero:true, grid:{ color:'#e1e0d9' }, ticks:{ color:'#898781', font:{size:11} } },
          x:{ grid:{ display:false }, ticks:{ color:'#898781', font:{size:11} } }
        }
      }
    });
  });
}
/* ============================= HERO-WELKOM BANNER =============================
   Boven het dashboard: begroeting + datum + automatisch samengestelde signalering van wat er
   deze week aandacht nodig heeft. Puur samenvattend — leest bestaande data (deadline-rows,
   heeftUrgenteHerinneringNodig, LH-periodes) uit, voegt zelf niets toe aan het datamodel. */
function heroGroet(){
  const uur = new Date().getHours();
  if(uur < 6) return 'Goedenavond';
  if(uur < 12) return 'Goedemorgen';
  if(uur < 18) return 'Goedemiddag';
  return 'Goedenavond';
}
function heroBannerHTML(rows, klantenGefilterd, cnt){
  const naamVol = huidigeGebruiker();
  const voornaam = (naamVol||'Benjamin').split(' ')[0];
  const initiaal = voornaam.slice(0,1).toUpperCase();
  const flagged = klantenGefilterd.filter(k=>heeftUrgenteHerinneringNodig(k));
  const lhBinnenkort = klantenGefilterd.filter(k=>{
    const entry = STORE[k.id] && STORE[k.id].dl && STORE[k.id].dl.LH;
    if(!entry || entry.na || entry.status==='ingediend') return false;
    const d = daysDiff(entry.datum);
    return d!==null && !isNaN(d) && d>=0 && d<=3;
  });
  const zonderKlantnr = klantenGefilterd.filter(k=>!k.extId).length;
  const delen = [];
  if(cnt.actie) delen.push(`<b>${cnt.actie}</b> deadline(s) verlopen of binnen 7 dagen`);
  if(lhBinnenkort.length) delen.push(`<b>${lhBinnenkort.length}</b> loonheffing-periode(s) sluiten binnen 3 dagen`);
  if(flagged.length) delen.push(`<b>${flagged.length}</b> klant(en) met openstaande transacties én naderende deadline`);
  if(zonderKlantnr) delen.push(`<b>${zonderKlantnr}</b> klant(en) zonder klantnummer`);
  const digest = delen.length
    ? `<div class="hero-digest">
        <i class="ti ti-sparkles" aria-hidden="true"></i>
        <div style="flex:1">
          <p class="hero-digest-title">Automatisch voor je gesignaleerd</p>
          <p class="hero-digest-body">${delen.join(' · ')}.</p>
          <div class="hero-digest-actions">
            ${flagged.length ? `<button class="btn sm" data-hero-bulk-herinnering>Verstuur herinneringen (${flagged.length})</button>` : ''}
            <button class="btn sm ghost" data-hero-weekoverzicht><i class="ti ti-mail" aria-hidden="true"></i> Weekoverzicht mailen</button>
          </div>
        </div>
      </div>`
    : `<div class="hero-digest-empty"><i class="ti ti-check" aria-hidden="true"></i> Niets dat nu om actie vraagt — alles op schema.</div>`;
  return `
  <div class="hero-banner">
    <div class="hero-top">
      <div>
        <p class="hero-date">${fmtDagVolledig(new Date())}</p>
        <h1 class="hero-greeting">${heroGroet()}, ${voornaam}</h1>
      </div>
      <div class="hero-avatar">${initiaal}</div>
    </div>
    ${digest}
  </div>`;
}
/* Verstuurt een korte herinneringsmail naar één klant (openstaande transacties + naderende deadline).
   Geen achtergrond-automatisering mogelijk op een statisch gehost dashboard zonder server — dit blijft
   dus altijd een bewuste, directe klik van de gebruiker (zelfde beperking als de bestaande document-mails). */
async function verstuurHerinneringMail(klant){
  if(!klant.email) return {ok:false, reden:'geen e-mailadres'};
  const b = bh(klant.bh);
  const f = STORE[klant.id];
  const open = f.items.filter(i=>!i.done).length;
  const body = `<div style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#1a1a1a;">
    <p>Beste ${(klant.contact||klant.naam||'').trim() || klant.naam},</p>
    <p>Wij zien nog ${open} openstaand aanleverpunt en/of ${fmtEUR(f.saldo)} openstaand banksaldo dat verwerking nodig heeft, terwijl er een deadline nadert. Zou u de ontbrekende stukken op korte termijn willen aanleveren?</p>
    <p>Met vriendelijke groet,<br>${b?b.naam:'AdministratieBox'}<br>AdministratieBox</p>
  </div>`;
  try{
    await sendGraphMail(klant.email, `Herinnering aanlevering — ${klant.naam}`, body, []);
    return {ok:true};
  }catch(e){ return {ok:false, reden: (e&&e.message) || 'onbekende fout'}; }
}
async function verstuurHerinneringenBulk(klanten){
  const metMail = klanten.filter(k=>k.email);
  const zonderMail = klanten.length - metMail.length;
  let gelukt = 0, mislukt = 0;
  for(const k of metMail){
    const r = await verstuurHerinneringMail(k);
    if(r.ok) gelukt++; else mislukt++;
  }
  logActiviteit(`${gelukt} herinneringsmail(s) verstuurd${mislukt?`, ${mislukt} mislukt`:''}${zonderMail?`, ${zonderMail} overgeslagen (geen e-mailadres)`:''}`);
  toast(`${gelukt} herinnering(en) verstuurd${mislukt||zonderMail ? ` · ${mislukt+zonderMail} overgeslagen` : ''}`);
}
/* Weekoverzicht: samenvatting van open taken/deadlines/saldo, eenklik naar het eigen mailadres van de
   ingelogde gebruiker. Ook dit is best-effort automatisering: er is geen achtergrondproces op GitHub
   Pages, dus het overzicht wordt pas verstuurd zodra iemand de app opent en op de knop klikt — niet
   ongevraagd op de achtergrond. Het venster onthoudt via localStorage wanneer het voor het laatst is
   getoond, zodat de suggestie niet elke dag terugkomt. */
function weekoverzichtHTML(rows, klantenGefilterd, cnt){
  const totalSaldo = klantenGefilterd.reduce((s,k)=>s+STORE[k.id].saldo,0);
  const nu = new Date();
  const rijen = rows.filter(r=>r.st.key==='actie'||r.st.key==='nadert').slice(0,20)
    .map(r=>`<tr><td>${r.klant.naam}</td><td>${typeof r.type==='string' && TYPE_LABEL[r.type] ? TYPE_LABEL[r.type] : r.type}</td><td>${fmtDate(r.entry.datum)}</td></tr>`).join('');
  return `<div style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#1a1a1a;">
    <p>Weekoverzicht ${fmtDagVolledig(nu)}</p>
    <p>${cnt.actie} deadline(s) vereisen actie, ${cnt.nadert} naderen. Totaal openstaand banksaldo: ${fmtEUR(totalSaldo)}.</p>
    ${rijen ? `<table style="border-collapse:collapse; width:100%;" cellpadding="6"><thead><tr style="text-align:left; border-bottom:1px solid #ccc;"><th>Klant</th><th>Type</th><th>Deadline</th></tr></thead><tbody>${rijen}</tbody></table>` : '<p>Geen urgente deadlines.</p>'}
  </div>`;
}
async function verstuurWeekoverzicht(rows, klantenGefilterd, cnt){
  const mail = huidigeGebruikerEmail();
  if(!mail || mail==='niet ingelogd'){ toast('Log eerst in om het weekoverzicht te versturen.'); return; }
  try{
    await sendGraphMail(mail, `Weekoverzicht compliance dashboard — ${fmtDatumLang(new Date())}`, weekoverzichtHTML(rows, klantenGefilterd, cnt), []);
    try{ localStorage.setItem('cd_laatste_weekoverzicht', new Date().toISOString()); }catch(e){}
    toast('Weekoverzicht verstuurd naar ' + mail);
  }catch(e){ toast('Versturen mislukt: ' + ((e&&e.message)||'onbekende fout')); }
}
function dashboardHTML(){
  const teamFilter = STATE.dashboardTeamFilter;
  const klantInTeam = (k)=>{ if(!teamFilter) return true; const b = bh(k.bh); return !!(b && b.team===teamFilter); };
  const klantenGefilterd = teamFilter ? RAW_KLANTEN.filter(klantInTeam) : RAW_KLANTEN;

  const rows = allDeadlineRows().filter(r=>klantInTeam(r.klant));
  const cnt = {actie:0, nadert:0, schema:0, ingediend:0};
  rows.forEach(r=>cnt[r.st.key]++);
  const totalSaldo = klantenGefilterd.reduce((s,k)=>s+STORE[k.id].saldo,0);

  const urgent = rows.filter(r=>r.st.key==='actie' || r.st.key==='nadert')
    .sort((a,b)=> (a.entry.status==='ingediend'?9999:daysDiff(a.entry.datum)) - (b.entry.status==='ingediend'?9999:daysDiff(b.entry.datum)))
    .slice(0,8);

  const types = ['OB','VPB','LH','JR','Overige'];
  const distRows = types.map(t=>{
    const trows = rows.filter(r=>r.type===t);
    const c = {actie:0,nadert:0,schema:0,ingediend:0};
    trows.forEach(r=>c[r.st.key]++);
    const total = trows.length || 1;
    return `<div class="distbar">
      <div class="label">${TYPE_LABEL[t]}</div>
      <div class="track">
        ${c.actie?`<div class="seg" style="width:${c.actie/total*100}%; background:var(--red)"></div>`:''}
        ${c.nadert?`<div class="seg" style="width:${c.nadert/total*100}%; background:var(--amber)"></div>`:''}
        ${c.ingediend?`<div class="seg" style="width:${c.ingediend/total*100}%; background:var(--blue)"></div>`:''}
        ${c.schema?`<div class="seg" style="width:${c.schema/total*100}%; background:var(--green)"></div>`:''}
      </div>
      <div class="nums">${c.actie} rood · ${c.nadert} oranje · ${c.schema} groen</div>
    </div>`;
  }).join('');

  const remindDue = klantenGefilterd.filter(k=>{
    const f = STORE[k.id];
    return f.saldo>0 || f.items.some(i=>!i.done);
  }).slice(0,6);

  const teamOptions = TEAMS.map(t=>`<option value="${t.id}" ${teamFilter===t.id?'selected':''}>${t.naam}</option>`).join('');
  const heroHTML = heroBannerHTML(rows, klantenGefilterd, cnt);
  const flagged = klantenGefilterd.filter(k=>heeftUrgenteHerinneringNodig(k));

  return `
  ${heroHTML}
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
    <label style="font-size:12.5px; color:var(--muted);">Weergave</label>
    <select id="filterTeamDashboard" style="padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;">
      <option value="">Algemeen overzicht (alle teams)</option>
      ${teamOptions}
    </select>
    ${teamFilter && teamOf(teamFilter) ? `<span class="hint">Gefilterd op team ${teamOf(teamFilter).naam} · ${klantenGefilterd.length} klant(en)</span>` : ''}
  </div>
  <div class="kpi-grid">
    <div class="kpi-card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="kpi-label">Totaal klanten</div>
        <i class="ti ti-users" style="font-size:16px; color:var(--muted2);" aria-hidden="true"></i>
      </div>
      <div class="kpi-value">${klantenGefilterd.length}</div>
      <div class="kpi-sub" style="color:var(--muted)">${teamFilter ? boekhoudersOfTeam(teamFilter).length : BOEKHOUDERS.length} boekhouders</div>
    </div>
    <div class="kpi-card red">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="kpi-label">Actie vereist</div>
        <i class="ti ti-alert-triangle" style="font-size:16px; color:var(--red);" aria-hidden="true"></i>
      </div>
      <div class="kpi-value">${cnt.actie}</div>
      <div class="kpi-sub" style="color:var(--red)">Verlopen of ≤ 7 dagen</div>
    </div>
    <div class="kpi-card amber">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="kpi-label">Deadline nadert</div>
        <i class="ti ti-clock" style="font-size:16px; color:var(--amber);" aria-hidden="true"></i>
      </div>
      <div class="kpi-value">${cnt.nadert}</div>
      <div class="kpi-sub" style="color:var(--amber)">Binnen 8–14 dagen</div>
    </div>
    <div class="kpi-card green">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="kpi-label">Op schema</div>
        <i class="ti ti-check" style="font-size:16px; color:var(--green);" aria-hidden="true"></i>
      </div>
      <div class="kpi-value">${cnt.schema}</div>
      <div class="kpi-sub" style="color:var(--green)">Ruim op tijd</div>
    </div>
    <div class="kpi-card blue">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="kpi-label">Open banksaldo</div>
        <i class="ti ti-wallet" style="font-size:16px; color:var(--primary);" aria-hidden="true"></i>
      </div>
      <div class="kpi-value" style="font-size:22px;">${fmtEUR(totalSaldo)}</div>
      <div class="kpi-sub" style="color:var(--muted)">${teamFilter ? 'Dit team' : 'Alle klanten'}</div>
    </div>
  </div>

  <div class="section" style="margin-bottom:0; border-radius:var(--radius) var(--radius) 0 0; padding:0 8px;">
    <div style="display:flex; gap:2px; flex-wrap:wrap;">
      <div data-dash-tegel="urgent" style="padding:12px 14px; font-size:12.5px; font-weight:500; cursor:pointer; color:${STATE.dashActieTegel==='urgent'?'var(--text)':'var(--muted)'}; border-bottom:2px solid ${STATE.dashActieTegel==='urgent'?'var(--text)':'transparent'};">Urgente acties ${urgent.length ? `<span style=\"color:var(--red);\">${urgent.length}</span>` : ''}</div>
      <div data-dash-tegel="herinnering" style="padding:12px 14px; font-size:12.5px; font-weight:500; cursor:pointer; color:${STATE.dashActieTegel==='herinnering'?'var(--text)':'var(--muted)'}; border-bottom:2px solid ${STATE.dashActieTegel==='herinnering'?'var(--text)':'transparent'};">Herinneringen ${flagged.length ? `<span style=\"color:var(--amber);\">${flagged.length}</span>` : ''}</div>
      <div data-dash-tegel="distributie" style="padding:12px 14px; font-size:12.5px; font-weight:500; cursor:pointer; color:${STATE.dashActieTegel==='distributie'?'var(--text)':'var(--muted)'}; border-bottom:2px solid ${STATE.dashActieTegel==='distributie'?'var(--text)':'transparent'};">Per deadlinecategorie</div>
      <div data-dash-tegel="aanleverpunt" style="padding:12px 14px; font-size:12.5px; font-weight:500; cursor:pointer; color:${STATE.dashActieTegel==='aanleverpunt'?'var(--text)':'var(--muted)'}; border-bottom:2px solid ${STATE.dashActieTegel==='aanleverpunt'?'var(--text)':'transparent'};">Aanlevering & saldo ${remindDue.length ? `<span style=\"color:var(--amber);\">${remindDue.length}</span>` : ''}</div>
    </div>
  </div>

  <div class="section" style="border-radius:0 0 var(--radius) var(--radius); border-top:none; margin-bottom:18px;">
    ${STATE.dashActieTegel==='urgent' ? `
    <div class="section-head"><h3>Urgente acties</h3><span class="hint">Gesorteerd op resterende tijd</span></div>
    <div class="section-body">
      ${urgent.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Type</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>
        ${urgent.map(r=>`<tr class="row-click" data-open-klant="${r.klant.id}">
          <td><div class="klant-name">${r.klant.naam}</div><div class="klant-meta">${r.klant.vorm}</div></td>
          <td>${bh(r.klant.bh).naam}</td>
          <td>${typeof r.type==='string' && TYPE_LABEL[r.type] ? TYPE_LABEL[r.type] : (r.entry.naam||r.type)}</td>
          <td>${fmtDate(r.entry.datum)}</td>
          <td>${badge(r.entry,{days:true})}</td>
          <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${r.klant.id}">Bekijk →</button></td>
        </tr>`).join('')}
      </tbody></table>` : `<div class="empty-state">Geen urgente acties — alles op schema.</div>`}
    </div>` : ''}
    ${STATE.dashActieTegel==='herinnering' ? `
    <div class="section-head"><h3><i class="ti ti-flag" aria-hidden="true"></i> Stuur een herinnering</h3><span class="hint">Deadline nadert/verstreken én banktransacties nog niet verwerkt</span></div>
    <div class="section-body">
      ${flagged.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Status</th><th>Openstaande transacties</th><th></th></tr></thead><tbody>
        ${flagged.map(k=>{ const w = worstStatus(k); const meta = STATUS_META[w];
          return `<tr class="row-click" data-open-klant="${k.id}">
            <td><div class="klant-name">${k.naam}</div></td>
            <td>${bh(k.bh).naam}</td>
            <td><span class="badge ${meta.cls}"><span class="dot ${meta.cls}"></span>${meta.label}</span></td>
            <td>${STORE[k.id].txn} transactie(s)</td>
            <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${k.id}">Bekijk →</button></td>
          </tr>`; }).join('')}
        </tbody></table>` : `<div class="empty-state">Niets dat nu om een herinnering vraagt.</div>`}
    </div>` : ''}
    ${STATE.dashActieTegel==='distributie' ? `
    <div class="section-head"><h3>Status per deadlinecategorie</h3><span class="hint">${rows.length} deadlines totaal</span></div>
    <div class="section-body" style="padding:10px 0;">${distRows}</div>` : ''}
    ${STATE.dashActieTegel==='aanleverpunt' ? `
    <div class="section-head"><h3>Aanlevering & banksaldo — aandachtspunten</h3><span class="hint">Klanten met openstaand saldo of ontbrekende stukken</span></div>
    <div class="section-body">
      ${remindDue.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Open saldo</th><th>Aan te leveren</th><th></th></tr></thead><tbody>
      ${remindDue.map(k=>{ const f=STORE[k.id]; const open=f.items.filter(i=>!i.done).length;
        return `<tr class="row-click" data-open-klant="${k.id}">
          <td><div class="klant-name">${k.naam}</div></td>
          <td>${bh(k.bh).naam}</td>
          <td>${fmtEUR(f.saldo)}</td>
          <td>${open? `<span class="badge amber"><span class="dot amber"></span>${open} item(s) open</span>` : `<span class="badge green"><span class="dot green"></span>Compleet</span>`}</td>
          <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${k.id}">Bekijk →</button></td>
        </tr>`; }).join('')}
      </tbody></table>` : `<div class="empty-state">Niets openstaand.</div>`}
    </div>` : ''}
  </div>

  ${kpiOverzichtHTML()}
  `;
}
/* ============================= VIEW: BOEKHOUDERS ============================= */
function boekhoudersHTML(){
  const cards = BOEKHOUDERS.map(b=>{
    const klanten = klantsOf(b.id);
    const c = {actie:0, nadert:0, schema:0};
    klanten.forEach(k=>{ const w = worstStatus(k); if(c[w]!==undefined) c[w]++; else c.schema++; });
    return `<div class="bh-card" data-nav-bh="${b.id}" style="position:relative;">
      <div style="position:absolute; top:10px; right:10px; display:flex; gap:4px;">
        <button class="btn sm ghost" data-edit-bh-btn="${b.id}" title="Boekhouder bewerken (o.a. kleur)" style="padding:4px 7px;"><i class="ti ti-pencil" aria-hidden="true"></i></button>
        ${isAdmin() ? `<button class="btn sm ghost" data-delete-bh="${b.id}" title="Boekhouder verwijderen" style="padding:4px 7px; color:var(--red);"><i class="ti ti-trash" aria-hidden="true"></i></button>` : ''}
      </div>
      <div class="bh-top">
        <div class="avatar" style="background:${b.kleur}">${initials(b.naam)}</div>
        <div><div class="bh-name">${b.naam}</div><div class="bh-role">${b.rol}${b.team && teamOf(b.team) ? ' · '+teamOf(b.team).naam : ''}</div></div>
      </div>
      <div class="bh-stats">
        <div class="bh-stat"><b style="color:var(--red)">${c.actie}</b><span>Actie</span></div>
        <div class="bh-stat"><b style="color:var(--amber)">${c.nadert}</b><span>Nadert</span></div>
        <div class="bh-stat"><b style="color:var(--green)">${c.schema}</b><span>Op schema</span></div>
      </div>
      <div class="bh-foot"><span>${klanten.length} klanten</span><span>Bekijk klanten →</span></div>
    </div>`;
  }).join('');
  return `
  <div class="section-head" style="padding:0 0 14px; border-bottom:none;">
    <h3 style="font-size:15px;">Boekhouders</h3>
    <button class="btn sm primary" data-add-bh-btn>+ Nieuwe boekhouder</button>
  </div>
  ${BOEKHOUDERS.length ? `<div class="bh-grid">${cards}</div>` : `<div class="section"><div class="empty-state">Nog geen boekhouders toegevoegd. Klik op "+ Nieuwe boekhouder" om te beginnen, of koppel Microsoft-sync bij Instellingen om bestaande gegevens op te halen.</div></div>`}`;
}

/* ============================= VIEW: TEAMS ============================= */
function teamsHTML(){
  const types = ['OB','VPB','LH','JR','Overige'];
  const cards = TEAMS.map(t=>{
    const leden = boekhoudersOfTeam(t.id);
    const klanten = klantenOfTeam(t.id);
    const klantIds = new Set(klanten.map(k=>k.id));
    const rows = allDeadlineRows().filter(r=>klantIds.has(r.klant.id));
    const perTypeRows = types.map(type=>{
      const trows = rows.filter(r=>r.type===type);
      const c = {actie:0,nadert:0,schema:0,ingediend:0};
      trows.forEach(r=>c[r.st.key]++);
      const open = c.actie + c.nadert;
      return `<tr>
        <td>${TYPE_LABEL[type]}</td>
        <td><span class="badge red"><span class="dot red"></span>${c.actie}</span></td>
        <td><span class="badge amber"><span class="dot amber"></span>${c.nadert}</span></td>
        <td><span class="badge green"><span class="dot green"></span>${c.schema}</span></td>
        <td style="font-weight:700;">${open}</td>
      </tr>`;
    }).join('');
    const totalOpen = rows.filter(r=>r.st.key==='actie'||r.st.key==='nadert').length;
    const bhOptionsToAdd = BOEKHOUDERS.filter(b=>b.team!==t.id).map(b=>`<option value="${b.id}">${b.naam}${b.team && teamOf(b.team) ? ' ('+teamOf(b.team).naam+')' : ''}</option>`).join('');

    return `<div class="section" style="margin-bottom:18px;">
      <div class="section-head">
        <div>
          <h3>${t.naam}</h3>
          <span class="hint">${leden.length} boekhouder(s) · ${klanten.length} klanten · ${totalOpen} deadline(s) nog open</span>
        </div>
        ${isAdmin() ? `<button class="btn sm ghost" data-delete-team="${t.id}" title="Team verwijderen" style="color:var(--red);"><i class="ti ti-trash" aria-hidden="true"></i> Verwijderen</button>` : ''}
      </div>
      <div class="section-body pad">
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
          ${leden.length ? leden.map(b=>`
            <span class="badge gray" style="gap:8px;">
              <span class="dot" style="background:${b.kleur}"></span>${b.naam}
              <button data-remove-from-team="${b.id}" title="Uit team halen" style="border:none; background:none; cursor:pointer; color:var(--muted); font-weight:700; padding:0 0 0 4px;"><i class="ti ti-x" aria-hidden="true"></i></button>
            </span>`).join('') : '<span style="font-size:12px; color:var(--muted2);">Nog geen boekhouders in dit team.</span>'}
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:18px;">
          <select data-team-add-select="${t.id}" style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;">
            <option value="">Boekhouder kiezen om toe te voegen…</option>
            ${bhOptionsToAdd}
          </select>
          <button class="btn sm primary" data-team-add-btn="${t.id}">+ Toevoegen</button>
        </div>
        <table>
          <thead><tr><th>Categorie</th><th>Actie vereist</th><th>Nadert</th><th>Op schema</th><th>Totaal open</th></tr></thead>
          <tbody>${perTypeRows || `<tr><td colspan="5" style="color:var(--muted2);">Geen klanten in dit team.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="section-head" style="padding:0 0 14px; border-bottom:none;">
    <h3 style="font-size:15px;">Teams</h3>
    <button class="btn sm primary" data-add-team-btn>+ Nieuw team</button>
  </div>
  ${TEAMS.length ? cards : `<div class="section"><div class="empty-state">Nog geen teams aangemaakt. Klik op "+ Nieuw team" om te beginnen.</div></div>`}`;
}

/* ============================= VIEW: KLANTEN ============================= */
function klantenHTML(){
  let list = RAW_KLANTEN.slice();
  if(STATE.bhFilter) list = list.filter(k=>k.bh===STATE.bhFilter);
  if(STATE.statusFilter) list = list.filter(k=>worstStatus(k)===STATE.statusFilter);
  if(STATE.search){
    const q = STATE.search.toLowerCase();
    list = list.filter(k=>k.naam.toLowerCase().includes(q) || bh(k.bh).naam.toLowerCase().includes(q));
  }
  const bhOptions = BOEKHOUDERS.map(b=>`<option value="${b.id}" ${STATE.bhFilter===b.id?'selected':''}>${b.naam}</option>`).join('');
  const magVerwijderen = isAdmin();
  const bhCache = new Map();
  const bhVoor = (id)=>{ if(!bhCache.has(id)) bhCache.set(id, bh(id)); return bhCache.get(id); };

  // Tellingen voor status-chips
  const tellingen = {alle: RAW_KLANTEN.length, actie:0, nadert:0, schema:0, ingediend:0};
  RAW_KLANTEN.forEach(k=>{ const w = worstStatus(k); if(tellingen[w]!==undefined) tellingen[w]++; });

  const chip = (val, label, count, kleurCls)=>{
    const actief = STATE.statusFilter===val;
    const base = 'padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .12s ease; border:1px solid transparent; font-weight:500;';
    const actiefStijl = kleurCls==='groen' ? 'background:var(--green-bg); border-color:var(--green-brd); color:var(--green);'
      : kleurCls==='rood' ? 'background:var(--red-bg); border-color:var(--red-brd); color:var(--red);'
      : kleurCls==='oranje' ? 'background:var(--amber-bg); border-color:var(--amber-brd); color:var(--amber);'
      : kleurCls==='blauw' ? 'background:var(--blue-bg); border-color:var(--blue-brd); color:var(--blue);'
      : 'background:var(--primary-bg); border-color:var(--green-brd); color:var(--primary-dark);';
    const inactiefStijl = 'background:transparent; border-color:var(--border); color:var(--muted);';
    return `<button data-status-chip="${val}" style="${base} ${actief?actiefStijl:inactiefStijl}">${label}<span style="opacity:.75;">${count}</span></button>`;
  };

  return `
  <div class="section">
    <div class="section-head">
      <h3>Klantenlijst</h3>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="view-toggle">
          <button data-klanten-view="tabel" class="${STATE.klantenView==='tabel'?'is-active':''}" title="Tabelweergave"><i class="ti ti-list" aria-hidden="true"></i></button>
          <button data-klanten-view="kaarten" class="${STATE.klantenView==='kaarten'?'is-active':''}" title="Kaartweergave"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
        </div>
        <label class="btn sm" style="cursor:pointer;">${ICONS.upload} Importeren<input type="file" id="klantenCsvUpload" accept=".csv,.xlsx,.xls" style="display:none;"></label>
        <button class="btn sm primary" data-add-klant-btn>+ Nieuwe klant</button>
      </div>
    </div>
    <div id="klantImportResult" style="padding:0 20px;"></div>
    <div style="padding:14px 20px 4px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${chip('', 'Alle', tellingen.alle, 'default')}
        ${chip('actie', 'Actie vereist', tellingen.actie, 'rood')}
        ${chip('nadert', 'Deadline nadert', tellingen.nadert, 'oranje')}
        ${chip('schema', 'Op schema', tellingen.schema, 'groen')}
        ${chip('ingediend', 'Ingediend', tellingen.ingediend, 'blauw')}
      </div>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <select id="filterBh" style="padding:6px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; background:var(--card);"><option value="">Alle boekhouders</option>${bhOptions}</select>
        <span style="font-size:12px; color:var(--muted);">${list.length} van ${RAW_KLANTEN.length}</span>
      </div>
    </div>
    <div class="section-body" style="padding-top:6px;">
      ${STATE.klantenView==='kaarten' ? `<div class="klanten-grid">${list.map(k=>{
        const w = worstStatus(k);
        const stripKleur = {actie:'#dc2626', nadert:'#c9770a', schema:'#22c58a', ingediend:'#0e7fa3'}[w] || '#e4e8f0';
        const stKl = {actie:{bg:'var(--red-bg)',fg:'var(--red)',lbl:'Actie'}, nadert:{bg:'var(--amber-bg)',fg:'var(--amber)',lbl:'Nadert'}, schema:{bg:'var(--green-bg)',fg:'var(--green)',lbl:'Op schema'}, ingediend:{bg:'var(--blue-bg)',fg:'var(--blue)',lbl:'Ingediend'}}[w] || {bg:'var(--gray-bg)',fg:'var(--muted)',lbl:'—'};
        const boekhouder = bhVoor(k.bh);
        const kolomKl = t=>{ const st = statusOf(effDL(k,t)).key; return ({actie:'#dc2626',nadert:'#c9770a',schema:'#22c58a',ingediend:'#0e7fa3',na:'#e4e8f0'})[st]||'#e4e8f0'; };
        const nextTypeArr = ['OB','VPB','LH','JR'].map(t=>({t, s:statusOf(effDL(k,t))})).filter(x=>x.s.dagen!==undefined).sort((a,b)=>a.s.dagen-b.s.dagen);
        const next = nextTypeArr[0];
        const nextText = next ? (next.s.dagen<0 ? `${TYPE_LABEL[next.t]}: ${Math.abs(next.s.dagen)}d te laat` : `${TYPE_LABEL[next.t]} in ${next.s.dagen}d`) : 'Geen deadlines';
        return `<div class="klant-kaart" data-open-klant="${k.id}">
          <div class="klant-kaart-strip" style="background:${stripKleur};"></div>
          <div class="klant-kaart-inner">
            <div class="klant-kaart-head">
              <div>
                <div class="klant-kaart-naam">${k.naam}${heeftUrgenteHerinneringNodig(k) ? ' <span style="color:var(--red);"><i class="ti ti-flag" aria-hidden="true"></i></span>' : ''}</div>
                <div class="klant-kaart-sub">${k.vorm} · ${boekhouder.naam}</div>
              </div>

/* KvK-bewaking: zonder KvK API-koppeling (die vereist een geregistreerd developer-account met eigen
   API-key) is er geen automatische controle mogelijk op uitschrijving/statuswijziging. Dit is het
   handmatige alternatief: een klant komt op de aandachtslijst zodra hij nooit gecontroleerd is, of de
   laatste controle langer dan KVK_CONTROLE_MAANDEN geleden is. Eén klik opent de klant in het KvK
   Handelsregister zoeken, een tweede klik zet de teller weer op nul. */
const KVK_CONTROLE_MAANDEN = 6;
function kvkControleVervaldatum(klant){
  if(!klant.kvkLaatsteControle) return null;
  const d = new Date(klant.kvkLaatsteControle);
  d.setMonth(d.getMonth() + KVK_CONTROLE_MAANDEN);
  return d;
}
function kvkControleNodig(klant){
  if(!klant.kvk) return false;
  if(!klant.kvkLaatsteControle) return true;
  const vervalt = kvkControleVervaldatum(klant);
  return vervalt ? vervalt <= TODAY : true;
}
function kvkBewakingHTML(){
  const metKvk = RAW_KLANTEN.filter(k=>k.kvk);
  const nodig = metKvk.filter(kvkControleNodig).sort((a,b)=>{
    const da = a.kvkLaatsteControle ? new Date(a.kvkLaatsteControle).getTime() : 0;
    const db = b.kvkLaatsteControle ? new Date(b.kvkLaatsteControle).getTime() : 0;
    return da - db; // langst geleden (of nooit) eerst
  });
  const zonderKvk = RAW_KLANTEN.length - metKvk.length;
  return `<div class="section" style="margin-top:18px;">
    <button data-kvk-bewaking-toggle style="width:100%; border:none; background:none; cursor:pointer; text-align:left; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:${STATE.kvkBewakingOpen?'1px solid var(--border)':'none'};">
      <div>
        <h3 style="margin:0; font-size:14.5px; font-weight:700;">KvK-bewaking</h3>
        <span class="hint">${nodig.length ? `${nodig.length} klant(en) toe aan een controle` : `alle klanten met KvK-nummer gecontroleerd binnen ${KVK_CONTROLE_MAANDEN} maanden`}</span>
      </div>
      <span style="font-size:16px; color:var(--muted); display:inline-block; transition:transform .15s; transform:rotate(${STATE.kvkBewakingOpen?'0':'-90'}deg);">▾</span>
    </button>
    ${STATE.kvkBewakingOpen ? `
    <div class="section-body pad">
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px;">Zonder KvK API-koppeling (vereist een eigen developer-account) kan uitschrijving of een statuswijziging niet automatisch worden gedetecteerd. Deze lijst herinnert je om klanten periodiek zelf even na te kijken in het Handelsregister — elke ${KVK_CONTROLE_MAANDEN} maanden, of vaker als je dat wilt.</p>
      ${nodig.length ? `<table><thead><tr><th>Klant</th><th>KvK-nummer</th><th>Laatste controle</th><th></th></tr></thead><tbody>
        ${nodig.map(k=>{
          const laatste = k.kvkLaatsteControle ? fmtDate(k.kvkLaatsteControle) : 'Nooit gecontroleerd';
          return `<tr>
            <td><div class="klant-name">${k.naam}</div></td>
            <td>${k.kvk}</td>
            <td>${laatste}</td>
            <td style="text-align:right; white-space:nowrap;">
              <a class="btn sm ghost" href="https://www.kvk.nl/zoeken/?kvknummer=${encodeURIComponent(k.kvk)}" target="_blank" rel="noopener">Bekijk op KvK.nl <i class="ti ti-external-link" aria-hidden="true"></i></a>
              <button class="btn sm" data-kvk-controle="${k.id}">Markeer als gecontroleerd</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody></table>` : `<div class="empty-state">Niets dat nu een controle nodig heeft.</div>`}
      ${zonderKvk ? `<p style="font-size:11px; color:var(--muted); margin:12px 0 0;">${zonderKvk} klant(en) hebben geen KvK-nummer ingevuld en staan daarom niet op deze lijst.</p>` : ''}
    </div>` : ''}
  </div>`;
}

/* ============================= VIEW: LOONHEFFINGEN ============================= */
function volgendeMaandTweedeWeek(){
  const d = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 14);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function bulkSetLhDeadlines(klantList){
  const datum = volgendeMaandTweedeWeek();
  klantList.forEach(k=>{
    const f = STORE[k.id];
    if(!f) return;
    f.dl.LH = { datum, status:null, herhaling:'maandelijks' };
  });
  persist();
  return datum;
}
function lhNotitiesJaarHTML(k, f){
  const jaarFilter = STATE.lhNotitiesJaar || TODAY.getFullYear();
  const alle = [];
  (f.lh.taken||[]).forEach(t=>{
    (t.aantekeningen||[]).forEach(n=>{
      if(n.ts) alle.push({ taak:t.naam, tekst:n.tekst, door:n.door, ts:n.ts });
    });
  });
  const jarenSet = new Set(alle.map(n=>new Date(n.ts).getFullYear()));
  jarenSet.add(TODAY.getFullYear());
  const jaren = Array.from(jarenSet).sort((a,b)=>b-a);
  const gefilterd = alle.filter(n=>new Date(n.ts).getFullYear()===jaarFilter).sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  const maandNaam = (ts)=> new Date(ts).toLocaleString('nl-NL',{month:'long'});
  const maandenVolgorde = [];
  gefilterd.forEach(n=>{ const m = maandNaam(n.ts); if(!maandenVolgorde.includes(m)) maandenVolgorde.push(m); });
  const perMaand = {};
  gefilterd.forEach(n=>{ const m = maandNaam(n.ts); (perMaand[m] = perMaand[m]||[]).push(n); });
  const inhoud = maandenVolgorde.length ? maandenVolgorde.map(maand => `
    <div style="margin-top:10px;">
      <div style="font-weight:600; font-size:11.5px; text-transform:capitalize; color:var(--muted); margin-bottom:4px;">${maand}</div>
      ${perMaand[maand].map(n => `
        <div style="padding:6px 8px; background:var(--bg); border:1px solid var(--border); border-radius:6px; margin-top:4px; max-width:460px;">
          <div style="font-size:10px; color:var(--muted); margin-bottom:2px;">${n.taak}</div>
          <div style="font-size:11.5px; word-break:break-word;">${(n.tekst||'').replace(/</g,'&lt;')}</div>
          <div style="color:var(--muted); font-size:10px; margin-top:2px;">${n.door||''} · ${new Date(n.ts).toLocaleString('nl-NL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
        </div>`).join('')}
    </div>`).join('') : `<div class="hint" style="margin-top:8px;">Geen notities in ${jaarFilter}.</div>`;
  return `
    <div style="margin-top:14px; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <b style="font-size:12px;">Notities ${jaarFilter} <span style="font-weight:400; color:var(--muted);">(${gefilterd.length})</span></b>
        ${jaren.length>1 ? `<select data-lh-notities-jaar="${k.id}" style="font-size:11.5px; padding:3px 6px; border:1px solid var(--border); border-radius:6px;">
          ${jaren.map(j=>`<option value="${j}" ${j===jaarFilter?'selected':''}>${j}</option>`).join('')}
        </select>` : ''}
      </div>
      ${inhoud}
    </div>`;
}
function lhVorigePeriodesHTML(k, f){
  const periodes = Array.isArray(f.lh && f.lh.periodes) ? f.lh.periodes.slice().reverse() : [];
  if(!periodes.length) return '';
  const expanded = STATE.lhPeriodesKlant === k.id;
  const detailId = STATE.lhPeriodeExpanded;
  const NL_MAANDEN_KORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const fmtDatumKort = (iso)=>{
    if(!iso) return '';

function lhBekekenMaand(){ return STATE.lhMaand || huidigeMaandKey(); }
function loonheffingOverzichtHTML(list, heeftDga, titel){
  if(!list.length) return '';
  const jaarNu = TODAY.getFullYear();
  const bekeken = lhBekekenMaand();
  const isHuidigeMaand = bekeken === huidigeMaandKey();
  const bewerkbaar = magLhBewerken();
  const takenDef = lhTakenDefinitie(heeftDga);
  const kolomAantal = 4 + takenDef.length; // Nr. + Werkgever + taken + Periodes + Volgende deadline

  // Open klanten in deze maand: periodeMaand == bekeken maand. In de huidige maand tellen ook
  // achterlopers mee (periodeMaand in het verleden) — open werk verdwijnt nooit uit "nu".
  const open = [];
  const afgerond = [];
  list.forEach(k=>{
    const f = syncLhTaken(k);
    if(f.lh.periodeMaand === bekeken || (isHuidigeMaand && f.lh.periodeMaand < bekeken)) open.push(k);
    const snap = (f.lh.periodes||[]).find(p=>p.maand===bekeken);
    if(snap) afgerond.push({k, snap});
  });
  if(!open.length && !afgerond.length){
    // Geen lopende periodes in deze maand (bijv. een toekomstige maand) — maar er kunnen wél
    // notities voor deze maand klaarstaan. Die tonen we hier, zodat controleren mogelijk is.
    const metNotitie = list.map(k=>{
      const f = STORE[k.id];
      const n = f && f.lh && Array.isArray(f.lh.maandNotities) ? f.lh.maandNotities.filter(x=>x.maand===bekeken) : [];
      return n.length ? {k, notities:n} : null;
    }).filter(Boolean).sort((a,b)=>a.k.naam.localeCompare(b.k.naam,'nl'));
    if(metNotitie.length){
      return `<div class="section" style="margin-bottom:18px;">
        <div class="section-head"><h3>${titel} — ${maandLabelVanKey(bekeken)}</h3><span class="hint">nog geen lopende periodes · ${metNotitie.length} klant(en) met een notitie voor deze maand</span></div>
        <div class="section-body">
          <table>
            <thead><tr><th>Nr.</th><th>Werkgever</th><th>⭐ Notitie voor ${maandLabelVanKey(bekeken)}</th></tr></thead>
            <tbody>${metNotitie.map(({k, notities})=>`<tr>
              <td style="color:var(--muted); font-variant-numeric:tabular-nums;">${k.extId||'—'}</td>
              <td><div class="klant-name">${k.naam}</div><div class="klant-meta">${bh(k.bh).naam}</div></td>
              <td>${notities.map(n=>escHtml(n.tekst)).join('<br>')}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
    }
    return `<div class="section" style="margin-bottom:18px;">
      <div class="section-head"><h3>${titel} — ${maandLabelVanKey(bekeken)}</h3><span class="hint">0 klant(en)</span></div>
      <div class="section-body pad"><div class="empty-state" style="padding:20px; font-size:12.5px;">Geen klanten in deze maand.</div></div>
    </div>`;
  }
  open.sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  afgerond.sort((a,b)=>a.k.naam.localeCompare(b.k.naam,'nl'));

  // Voortgangsfilter per tabel: alle / niets afgevinkt / bezig / alles klaar
  const groepSleutel = String(titel||'').toLowerCase().replace(/[^a-z]+/g,'');
  const voortgangVan = (k)=>{
    const f = syncLhTaken(k);
    const taken = f.lh.taken || [];
    const done = taken.filter(t=>t && t.done).length;
    if(!taken.length) return 'niets';
    if(done === 0) return 'niets';
    if(done === taken.length) return 'klaar';
    return 'bezig';
  };
  const voortgangPerKlant = new Map(open.map(k=>[k.id, voortgangVan(k)]));
  const telling = { alle: open.length, niets: 0, bezig: 0, klaar: 0 };
  voortgangPerKlant.forEach(v=>telling[v]++);

  const zichtbaarAfgerond = (actieveFilter === 'alle' || actieveFilter === 'klaar') ? afgerond : [];

  const openRijen = zichtbaarOpen.map((k,i)=>{
    const f = syncLhTaken(k);

    const periodesDitJaar = (f.lh.log||[]).filter(l=>l.actie==='periode-afgerond' && l.ts && new Date(l.ts).getFullYear()===jaarNu).length;
    const expanded = STATE.lhExpandedKlant === k.id;
    const notitieDezeMaand = !!(f.lh.maandNotities||[]).find(n=>n.maand===bekeken);
    const anderMaandNotities = !!(f.lh.maandNotities||[]).length && !notitieDezeMaand;
    const taakCellen = takenDef.map(def=>{
      const t = f.lh.taken.find(x=>x.naam===def.naam);

      const kleur = t.done ? boekhouderKleurVoorNaam(t.door) : null;
      const titelTxt = t.naam + (t.done ? ` — ✓ ${t.door}` : ' — nog niet afgerond deze periode');
      return `<td style="text-align:center;" title="${titelTxt.replace(/"/g,'&quot;')}"><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${kleur||'var(--border)'};"></span></td>`;
    }).join('');
    const ster = notitieDezeMaand ? `<span title="Notitie voor ${maandLabelVanKey(bekeken)}" style='margin-right:4px;'>⭐</span>` : (anderMaandNotities ? `<span title="Notitie klaargezet voor een andere maand" style='margin-right:4px; opacity:.45;'>⭐</span>` : '');
    const hoofdRij = `<tr class="row-click" data-lh-toggle-detail="${k.id}" style="${expanded?'background:var(--bg);':''}">
      <td style="color:var(--muted); font-variant-numeric:tabular-nums;">${expanded?'▾':'▸'} ${k.extId||'—'}</td>
      <td><div class="klant-name">${ster}${k.naam}</div><div class="klant-meta">${bh(k.bh).naam}</div></td>

    const detailRij = expanded ? `<tr><td colspan="${kolomAantal}" style="background:var(--bg); padding:16px 20px; border-bottom:1px solid var(--border);">${loonheffingKlantDetailHTML(k)}</td></tr>` : '';
    return hoofdRij + detailRij;
  }).join('');

  // Afgeronde klanten van deze maand: read-only rij uit de snapshot, met terugdraai-knop.
  const afgerondRijen = zichtbaarAfgerond.map(({k, snap}, i)=>{
    const taakCellen = takenDef.map(def=>{
      const st = (snap.taken||[]).find(x=>x.naam===def.naam);
      if(!st) return `<td style="text-align:center; color:var(--muted2);" title="${def.naam.replace(/"/g,'&quot;')} — niet van toepassing voor deze klant">—</td>`;
      const kleur = st.done ? boekhouderKleurVoorNaam(st.door) : null;
      const titelTxt = def.naam + (st.done ? ` — ✓ ${st.door}` : ' — niet afgevinkt bij afronden');
      return `<td style="text-align:center;" title="${titelTxt.replace(/"/g,'&quot;')}"><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${kleur||'var(--border)'};"></span></td>`;
    }).join('');
    const afgerondDatum = snap.afgerondOp ? new Date(snap.afgerondOp).toLocaleDateString('nl-NL',{day:'numeric', month:'short'}) : '';
    return `<tr style="opacity:.75;">
      <td style="color:var(--muted); font-variant-numeric:tabular-nums;">${k.extId||'—'}</td>
      <td><div class="klant-name">${k.naam}</div><div class="klant-meta">${bh(k.bh).naam}</div></td>
      ${taakCellen}
      <td colspan="2">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span style="font-size:11px; color:var(--green); background:var(--green-bg); padding:3px 10px; border-radius:20px; white-space:nowrap;">afgerond ${afgerondDatum}${snap.door?' · '+String(snap.door).split(' ')[0]:''}</span>
          ${bewerkbaar ? `<button class="btn sm ghost" data-lh-terugdraai="${k.id}|${snap.id}" title="Periode terugdraaien — klant komt terug in deze maand met de vinkjes zoals ze waren" style="padding:3px 9px; font-size:11px; color:var(--amber);">↺ Terugdraaien</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  const taakHeaders = takenDef.map((t,idx)=>`<th style="text-align:center;" title="${t.naam.replace(/"/g,'&quot;')}">${idx+1}</th>`).join('');
  const taakLegenda = takenDef.map((t,idx)=>`<span style="margin-right:14px;"><b>${idx+1}.</b> ${t.naam}</span>`).join('');
  const hintDelen = [];
  if(open.length) hintDelen.push(`${open.length} open`);
  if(afgerond.length) hintDelen.push(`${afgerond.length} afgerond`);
  const leegFilterRij = (!openRijen && !afgerondRijen) ? `<tr><td colspan="${kolomAantal}" style="text-align:center; padding:20px; color:var(--muted2); font-size:12.5px;">Geen klanten in deze stand — pas het filter hierboven aan.</td></tr>` : '';
  return `<div class="section" style="margin-bottom:18px;">
    <div class="section-head" style="flex-wrap:wrap; gap:8px;">
      <div>
        <h3>${titel} — ${maandLabelVanKey(bekeken)}</h3>
        <span class="hint">Klik op een klant voor aantekeningen en het afvinken van taken · ${hintDelen.join(' · ')}</span>
      </div>
      ${filterChips}
    </div>
    <div style="padding:12px 20px 0; font-size:11px; color:var(--muted); line-height:1.8;">${taakLegenda}</div>
    <div class="section-body" style="overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Werkgever</th>${taakHeaders}<th style="text-align:center;">Periodes ${jaarNu}</th><th>Volgende deadline</th></tr></thead>
        <tbody>${openRijen}${afgerondRijen}${leegFilterRij}</tbody>
      </table>
    </div>
  </div>`;
}

// Zoekt de taken-status van een klant voor een specifieke maand: als die periode al is afgerond
// (via "Periode afronden"), de bewaarde snapshot van dat moment; als het de LOPENDE (nog niet
// afgeronde) maand is, de actuele/live taken. Voor overige maanden (nog niet begonnen, of een
// afgeronde periode die niet in deze maand viel) is er geen zinvolle data → null.
function lhTakenVoorMaand(f, jaar, maand, huidigJaar, huidigMaand){
  const periodes = (f.lh && Array.isArray(f.lh.periodes)) ? f.lh.periodes : [];
  const snap = periodes.find(p=>{
    if(!p.afgerondOp) return false;
    const d = new Date(p.afgerondOp);
    return !isNaN(d.getTime()) && d.getFullYear()===jaar && d.getMonth()===maand;
  });
  if(snap) return snap.taken;
  if(jaar===huidigJaar && maand===huidigMaand && f.lh && Array.isArray(f.lh.taken)) return f.lh.taken;
  return null;
}
function lhKalenderHTML(list){
  // Compact maandoverzicht bovenaan Loonheffingen (2 maanden terug t/m 3 maanden vooruit). Drie
  // rijen: (1) daadwerkelijk afgeronde periodes (via "Periode afronden"), (2) klanten waarbij taak 1
  // en 2 ("Salarissen verwerken" + "Salaris- en betaallijst dossier werkgever") zijn afgevinkt, (3)
  // klanten waarbij taak 3 en 4 ("Aangifte in dossier" + "LJP dossier") zijn afgevinkt — voor
  // afgeronde (verleden) maanden staat dat vrijwel altijd op (bijna) 100%, voor de lopende maand
  // geeft het echte tussentijdse voortgang.
  const NL_MAAND_KORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const huidigJaar = TODAY.getFullYear(), huidigMaand = TODAY.getMonth();
  const maanden = [];
  for(let i=-2; i<=3; i++){
    const d = new Date(huidigJaar, huidigMaand + i, 1);
    maanden.push({ jaar:d.getFullYear(), maand:d.getMonth(), afgerond:0, klanten:[], salaris:0, lhVerwerkt:0 });
  }
  list.forEach(k=>{
    const f = STORE[k.id];
    if(!f) return;
    const periodes = (f.lh && Array.isArray(f.lh.periodes)) ? f.lh.periodes : [];
    periodes.forEach(p=>{
      if(!p.afgerondOp) return;
      const d = new Date(p.afgerondOp);
      if(isNaN(d.getTime())) return;
      const m = maanden.find(mm=>mm.jaar===d.getFullYear() && mm.maand===d.getMonth());
      if(m){ m.afgerond++; m.klanten.push(k.naam); }
    });
    maanden.forEach(m=>{
      const taken = lhTakenVoorMaand(f, m.jaar, m.maand, huidigJaar, huidigMaand);
      if(!taken) return;
      if(taken[0] && taken[0].done && taken[1] && taken[1].done) m.salaris++;
      if(taken[2] && taken[2].done && taken[3] && taken[3].done) m.lhVerwerkt++;
    });
  });
  const totaalKlanten = list.length;
  const maxAfgerond = Math.max(1, totaalKlanten, ...maanden.map(m=>m.afgerond));
  const maxSalaris = Math.max(1, ...maanden.map(m=>m.salaris));
  const maxLh = Math.max(1, ...maanden.map(m=>m.lhVerwerkt));

  const maandLabel = m => `${m.jaar===huidigJaar && m.maand===huidigMaand ? 'nu' : NL_MAAND_KORT[m.maand]}`;

  const afgerondHtml = maanden.map(m=>{
    const isNu = m.jaar===huidigJaar && m.maand===huidigMaand;
    const pct = totaalKlanten ? Math.round((m.afgerond / totaalKlanten) * 100) : 0;
    const kleur = m.afgerond===0 ? 'var(--gray-bg)' : (pct>=100 ? '#22c58a' : (isNu ? '#c9770a' : '#94a0bb'));
    const kleurText = m.afgerond===0 ? 'var(--muted2)' : (pct>=100 ? '#fff' : 'var(--text)');
    const hoogte = Math.max(10, (m.afgerond / maxAfgerond) * 42);
    const label = `${NL_MAAND_KORT[m.maand]} ${m.jaar}`;
    return `<div class="lh-week ${isNu?'is-nu':''}" title="${label}: ${m.afgerond} van ${totaalKlanten} loonheffingen afgerond${m.klanten.length?' — '+m.klanten.slice(0,5).join(', ')+(m.klanten.length>5?'…':''):''}">
      <div class="lh-week-nr">${maandLabel(m)}</div>
      <div class="lh-week-bar-wrap">
        <div class="lh-week-bar" style="height:${hoogte}px; background:${kleur};">
          ${totaalKlanten ? `<span style="color:${kleurText};">${m.afgerond}/${totaalKlanten}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  const miniRijHtml = (waarde, kleur, kleurText, max)=>{
    const hoogte = waarde ? Math.max(8, (waarde / max) * 26) : 2;
    return `<div class="lh-week" style="flex:1;">
      <div class="lh-week-bar-wrap" style="height:30px;">
        <div class="lh-week-bar" style="height:${hoogte}px; background:${waarde?kleur:'var(--gray-bg)'}; min-width:100%;">
          <span style="color:${waarde?kleurText:'var(--muted2)'}; font-size:11px;">${waarde}</span>
        </div>
      </div>
    </div>`;
  };
  const salarisHtml = maanden.map(m=>miniRijHtml(m.salaris, '#bfe4ee', '#0c447c', maxSalaris)).join('');
  const lhVerwerktHtml = maanden.map(m=>miniRijHtml(m.lhVerwerkt, '#bfe6d2', '#085041', maxLh)).join('');
  const maandLabelsHtml = maanden.map(m=>{
    const isNu = m.jaar===huidigJaar && m.maand===huidigMaand;
    return `<div class="lh-week" style="flex:1;"><div class="lh-week-datum" style="${isNu?'color:var(--amber); font-weight:600;':''}">${maandLabel(m)}</div></div>`;
  }).join('');

  const huidigeMaandData = maanden.find(m=>m.jaar===huidigJaar && m.maand===huidigMaand);
  const huidigAfgerond = huidigeMaandData ? huidigeMaandData.afgerond : 0;

  return `<div class="section" style="margin-bottom:18px;">
    <div class="section-head">
      <h3>Loonheffingen per maand</h3>
      <span class="hint">${huidigAfgerond} van ${totaalKlanten} afgerond deze maand</span>
    </div>
    <div class="section-body pad" style="padding:18px 20px 14px;">
      <div style="font-size:11px; font-weight:600; color:var(--muted2); margin-bottom:6px;">Afgerond (periode afgesloten)</div>
      <div class="lh-kalender" style="margin-bottom:14px;">${afgerondHtml}</div>
      <div style="font-size:11px; font-weight:600; color:var(--muted2); margin-bottom:6px;">Salarissen verwerkt (taak 1 en 2)</div>
      <div class="lh-kalender" style="margin-bottom:14px;">${salarisHtml}</div>
      <div style="font-size:11px; font-weight:600; color:var(--muted2); margin-bottom:6px;">Loonheffingen verwerkt (taak 3 en 4)</div>
      <div class="lh-kalender" style="margin-bottom:6px;">${lhVerwerktHtml}</div>
      <div class="lh-kalender" style="margin-bottom:10px;">${maandLabelsHtml}</div>
      <div style="display:flex; gap:14px; margin-top:4px; font-size:11px; color:var(--muted);">
        <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:2px; background:#c9770a; display:inline-block;"></span>Deze maand</span>
        <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:2px; background:#94a0bb; display:inline-block;"></span>Nog niet volledig</span>
        <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:2px; background:#22c58a; display:inline-block;"></span>Volledig afgerond</span>
      </div>
    </div>
  </div>`;
}
// De legenda bovenaan Loonheffingen toont bewust alleen de collega's die daadwerkelijk

// LH-klant. Soepele naammatch (net als boekhouderKleurVoorNaam) zodat kleine schrijfverschillen
// (bijv. alleen voornaam) geen probleem zijn.
const SALARISADMINISTRATIE_NAMEN = ['Gemma Ros', 'Seta Ibrahim', 'Romee Nijland'];
function isSalarisadministratieBh(naam){
  if(!naam) return false;
  const n = naam.trim().toLowerCase();
  return SALARISADMINISTRATIE_NAMEN.some(sn=>{
    const s = sn.toLowerCase();
    return n===s || n.includes(s) || s.includes(n);
  });
}

      <label class="btn sm primary" style="cursor:pointer;">${ICONS.upload} Excel-bestand kiezen<input type="file" id="lhKlantenImportFile" accept=".xlsx,.xls" style="display:none;"></label>

function autoBedragCel(bedrag){
  if(bedrag===null) return `<span class="badge gray"><span class="dot gray"></span>N.v.t.</span>`;

function autoWaarschuwingen(auto){
  const w = [];
  if(!auto.datumEersteInschrijving) w.push('Geen datum 1e inschrijving ingevuld — berekening kan niet kloppen.');
  if(!auto.cataloguswaarde) w.push('Geen cataloguswaarde ingevuld.');
  if(isJongtimer(auto) && (auto.dagwaarde===null || auto.dagwaarde===undefined)) w.push('Youngtimer zonder dagwaarde — bijtelling staat nu op €0.');
  if(auto.rdwEigenaarGewijzigd) w.push('RDW: kenteken is vaker overgeschreven dan bij de vorige hercheck — mogelijk van eigenaar gewisseld. Controleer of dit voertuig nog bij deze klant hoort.');
  return w;
}

/* Admin-pagina: secties zijn inklapbaar en herschikbaar met de pijltjes in de sectiekop.

function adminPaneelPrefs(){
  let p = {};
  try{ p = JSON.parse(localStorage.getItem('cd_admin_paneel')||'{}') || {}; }catch(e){ p = {}; }
  const volgorde = Array.isArray(p.volgorde) ? p.volgorde.filter((k,i,arr)=>ADMIN_SECTIES.includes(k) && arr.indexOf(k)===i) : [];
  ADMIN_SECTIES.forEach(k=>{ if(!volgorde.includes(k)) volgorde.push(k); });
  const open = (p.open && typeof p.open==='object') ? p.open : {};
  return { volgorde, open };
}

/* RDW-koppeling: haalt actuele voertuiggegevens op bij de open data van de RDW
   (opendata.rdw.nl), gratis en publiek toegankelijk, geen API-key nodig. Wordt aangeroepen
   zodra het kenteken-veld bij "Auto toevoegen/bewerken" het focus verliest. */
async function rdwOphalenKenteken(kentekenRuw){
  const kenteken = String(kentekenRuw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(kenteken.length < 5) return null;
  try{
    const [vRes, bRes] = await Promise.all([
      fetch(`https://opendata.rdw.nl/resource/m9d7-ebf2.json?kenteken=${kenteken}`),
      fetch(`https://opendata.rdw.nl/resource/8ys7-d773.json?kenteken=${kenteken}`).catch(()=>null)
    ]);
    if(!vRes || !vRes.ok) return null;
    const vData = await vRes.json();
    if(!vData || !vData.length) return null;
    const v = vData[0];
    let bData = [];
    try{ if(bRes && bRes.ok) bData = await bRes.json(); }catch(e){}
    const brandstoffen = (bData||[]).map(b=>String(b.brandstof_omschrijving||'').toLowerCase());
    const elektrisch = brandstoffen.some(b=>b.includes('elektriciteit')) ? 'ja' : 'nee';
    const typeMap = { 'personenauto':'personenauto', 'bedrijfsauto':'bestelauto', 'motorfiets':'motor', 'bromfiets':'motor' };
    const type = typeMap[String(v.voertuigsoort||'').toLowerCase()] || '';
    let datumEersteInschrijving = '';
    if(v.datum_eerste_toelating_dt){
      datumEersteInschrijving = String(v.datum_eerste_toelating_dt).slice(0,10);
    } else if(v.datum_eerste_toelating){
      const sD = String(v.datum_eerste_toelating);
      if(sD.length===8) datumEersteInschrijving = `${sD.slice(0,4)}-${sD.slice(4,6)}-${sD.slice(6,8)}`;
    }
    let catalogusprijs = null;
    if(v.catalogusprijs !== undefined && v.catalogusprijs !== null && v.catalogusprijs !== ''){
      const cp = Number(v.catalogusprijs);
      if(!isNaN(cp)) catalogusprijs = cp;
    }
    let overschrijvingen = null;
    if(v.aantal_keer_overschrijving !== undefined && v.aantal_keer_overschrijving !== null && v.aantal_keer_overschrijving !== ''){
      const n = Number(v.aantal_keer_overschrijving);
      if(!isNaN(n)) overschrijvingen = n;
    }
    return { merk: v.merk||'', type, elektrisch, datumEersteInschrijving, catalogusprijs, overschrijvingen };
  }catch(e){
    return null;
  }
}
/* RDW hercheck: vergelijkt "aantal_keer_overschrijving" (publiek, geen naam/BSN — RDW open data bevat
   geen eigenaargegevens) met de vorige bekende stand per auto. Een toename betekent dat het kenteken
   sinds de vorige check opnieuw is overgeschreven — een sterke indicatie dat het voertuig van eigenaar
   is gewisseld, al is dit geen 100% garantie (bijv. een tenaamstelling-correctie telt ook mee). Puur
   best-effort: geen achtergrondproces mogelijk op een statisch gehost dashboard, dus dit draait alleen
   wanneer iemand op de knop klikt. Bij de eerste check per auto wordt alleen een nulmeting vastgelegd
   (geen waarschuwing) — pas bij een volgende check kan een toename worden gesignaleerd. */
async function rdwHercheckAlleAutos(){
  const metKenteken = AUTOS.filter(a=>a.kenteken && a.kenteken.trim());
  const report = { gecontroleerd:0, nieuweWaarschuwingen:0, nulmeting:0, mislukt:0, overgeslagen: AUTOS.length - metKenteken.length };
  for(const auto of metKenteken){
    try{
      const info = await rdwOphalenKenteken(auto.kenteken);
      if(!info || info.overschrijvingen===null || info.overschrijvingen===undefined){ report.mislukt++; continue; }
      const vorige = auto.rdwOverschrijvingen;
      if(vorige !== null && vorige !== undefined && info.overschrijvingen > vorige){
        auto.rdwEigenaarGewijzigd = true;
        report.nieuweWaarschuwingen++;
        logActiviteit(`RDW hercheck: kenteken ${auto.kenteken} vaker overgeschreven (${vorige} → ${info.overschrijvingen}) — mogelijk van eigenaar gewisseld`);
      } else if(vorige === null || vorige === undefined){
        report.nulmeting++;
      }
      auto.rdwOverschrijvingen = info.overschrijvingen;
      auto.rdwLaatsteCheck = new Date().toISOString().slice(0,10);
      report.gecontroleerd++;
    }catch(e){
      report.mislukt++;
    }
  }
  persistMeta();
  return report;
}
function rdwHercheckIntervalDagen(){
  return { wekelijks:7, maandelijks:30, per_kwartaal:90 }[RDW_HERCHECK_CFG.herhaling] || null;
}
function rdwHercheckAutoNodig(){
  const dagen = rdwHercheckIntervalDagen();
  if(!dagen) return false;
  if(!RDW_HERCHECK_CFG.laatsteAutoCheck) return true;
  const verschilMs = new Date() - new Date(RDW_HERCHECK_CFG.laatsteAutoCheck);
  return (verschilMs / (1000*60*60*24)) >= dagen;
}
/* Best-effort automatisering: geen achtergrondproces mogelijk op een statisch gehost dashboard, dus dit
   draait alleen wanneer iemand het dashboard toevallig open heeft ná het verstrijken van de gekozen
   termijn. laatsteAutoCheck wordt meteen bijgewerkt (vóór de RDW-aanroepen) en gesynchroniseerd, zodat
   niet elke gelijktijdig geopende browser de check nog eens dubbel start. */
async function rdwHercheckAutoUitvoeren(){
  RDW_HERCHECK_CFG.laatsteAutoCheck = new Date().toISOString().slice(0,10);
  persistMeta();
  try{
    const report = await rdwHercheckAlleAutos();
    logActiviteit(`RDW hercheck automatisch uitgevoerd (${RDW_HERCHECK_CFG.herhaling}): ${report.gecontroleerd} gecontroleerd${report.nieuweWaarschuwingen ? `, ${report.nieuweWaarschuwingen} mogelijke eigenaarswissel(s)` : ''}`);
    if(report.nieuweWaarschuwingen) toast(`Automatische RDW hercheck: ${report.nieuweWaarschuwingen} auto('s) mogelijk van eigenaar gewisseld.`);
    if(STATE.view==='autolijst'){ const el = document.getElementById('contentArea'); if(el){ el.innerHTML = viewHTML(); attachHandlers(); } }
  }catch(e){ console.error('Automatische RDW hercheck mislukt:', e); }
}
async function rdwHercheckUitvoeren(){
  const btn = document.getElementById('rdwHercheckBtn');
  const box = document.getElementById('rdwHercheckResult');
  if(btn){ btn.disabled = true; btn.textContent = 'Bezig met controleren…'; }
  if(box) box.innerHTML = `<div class="banner">RDW-gegevens worden opnieuw opgehaald voor ${AUTOS.filter(a=>a.kenteken).length} auto('s)…</div>`;
  try{
    const report = await rdwHercheckAlleAutos();
    if(box){
      box.innerHTML = `<div class="banner"${report.nieuweWaarschuwingen ? ` style="border-color:var(--amber-brd); color:#8a4b06;"` : ''}>
        <i class="ti ti-${report.nieuweWaarschuwingen ? 'alert-triangle' : 'circle-check'}" aria-hidden="true"></i>
        <b>${report.gecontroleerd}</b> auto('s) gecontroleerd bij de RDW.
        ${report.nieuweWaarschuwingen ? ` <b>${report.nieuweWaarschuwingen}</b> mogelijk van eigenaar gewisseld — te herkennen aan het waarschuwingsicoon in de kentekenkolom.` : ' Geen aanwijzingen voor een eigenaarswissel gevonden.'}
        ${report.nulmeting ? `<br>${report.nulmeting} auto('s) voor het eerst gecontroleerd (nulmeting vastgelegd, pas bij de volgende hercheck zichtbaar).` : ''}
        ${report.mislukt ? `<br>${report.mislukt} auto('s) niet op te vragen bij de RDW (onbekend kenteken of tijdelijk niet bereikbaar).` : ''}
        ${report.overgeslagen ? `<br>${report.overgeslagen} auto('s) overgeslagen (geen kenteken ingevuld).` : ''}
      </div>`;
    }
    toast(`RDW hercheck klaar: ${report.gecontroleerd} gecontroleerd${report.nieuweWaarschuwingen ? `, ${report.nieuweWaarschuwingen} mogelijke eigenaarswissel(s)` : ''}.`);
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }catch(e){
    if(box) box.innerHTML = `<div class="banner" style="border-color:var(--red); color:var(--red);"><i class="ti ti-alert-circle" aria-hidden="true"></i> RDW hercheck mislukt: ${((e&&e.message)||e)}</div>`;
    if(btn){ btn.disabled = false; btn.textContent = 'RDW hercheck uitvoeren'; }
  }
}

function openAddAutoPanel(silent){

  const auto = STATE.editAuto ? AUTOS.find(a=>a.id===STATE.editAuto) : null;
  panel.innerHTML = autoFormHTML(auto);
  requestAnimationFrame(()=>{ panel.classList.add('open'); overlay.classList.add('open'); });
  document.querySelectorAll('[data-panel-focus]').forEach(el=>el.addEventListener('click', ()=>{
    const panel = document.getElementById('panel');
    if(panel){ panel.classList.toggle('is-focus'); }

  document.querySelector('[data-close-panel]').addEventListener('click', closePanel);
  const kentekenInput = document.getElementById('autoKenteken');
  const kentekenStatusEl = document.getElementById('autoKentekenStatus');
  let rdwOpvraagBezig = false;
  async function probeerRdwOphalen(){
    if(!kentekenInput) return;
    const raw = kentekenInput.value;
    const kentekenNorm = raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(kentekenNorm.length < 5){ if(kentekenStatusEl) kentekenStatusEl.textContent=''; return; }
    if(rdwOpvraagBezig) return;

    const info = await rdwOphalenKenteken(raw);
    rdwOpvraagBezig = false;
    if(!kentekenInput.isConnected) return;
    if(!info){ if(kentekenStatusEl) kentekenStatusEl.textContent = 'Geen RDW-gegevens gevonden voor dit kenteken.'; return; }
    const merkEl = document.getElementById('autoMerk');
    const typeEl = document.getElementById('autoType');
    const elektrischEl = document.getElementById('autoElektrisch');
    const inschrijvingEl = document.getElementById('autoDatumEersteInschrijving');
    if(info.merk && merkEl) merkEl.value = info.merk;
    if(info.type && typeEl) typeEl.value = info.type;
    if(info.elektrisch && elektrischEl) elektrischEl.value = info.elektrisch;
    if(info.datumEersteInschrijving && inschrijvingEl) inschrijvingEl.value = datumNaarInvoer(info.datumEersteInschrijving);
    const cataloguswaardeEl = document.getElementById('autoCataloguswaarde');
    if(info.catalogusprijs !== null && info.catalogusprijs !== undefined && cataloguswaardeEl) cataloguswaardeEl.value = info.catalogusprijs;
    if(kentekenStatusEl) kentekenStatusEl.textContent = (info.catalogusprijs !== null && info.catalogusprijs !== undefined)
      ? 'RDW-gegevens opgehaald ✓ incl. cataloguswaarde (controleer en pas zo nodig aan)'
      : 'RDW-gegevens opgehaald ✓ — geen cataloguswaarde bekend bij RDW voor dit kenteken (zelf invullen)';
  }
  if(kentekenInput) kentekenInput.addEventListener('blur', probeerRdwOphalen);
  document.querySelector('[data-save-auto]').addEventListener('click', ()=>{
    const klantId = document.getElementById('autoKlant').value;
    if(!klantId){ toast('Kies een klant.'); return; }
    const data = {
      klant: klantId,
      merk: document.getElementById('autoMerk').value,
      kenteken: document.getElementById('autoKenteken').value,
      type: document.getElementById('autoType').value,
      gebruik: document.getElementById('autoGebruik').value,
      elektrisch: document.getElementById('autoElektrisch').value,
      btwAuto: document.getElementById('autoBtwAuto').value,
      klantBtwVrijgesteld: document.getElementById('autoKlantBtwVrijgesteld').value,
      aankoopdatum: invoerNaarDatum(document.getElementById('autoAankoopdatum').value),
      verkoopdatum: invoerNaarDatum(document.getElementById('autoVerkoopdatum').value),
      datumEersteInschrijving: invoerNaarDatum(document.getElementById('autoDatumEersteInschrijving').value),
      cataloguswaarde: document.getElementById('autoCataloguswaarde').value,
      dagwaarde: document.getElementById('autoDagwaarde').value,
      vuzgAanwezig: document.getElementById('autoVuzgAanwezig').value,
      bijtellingViaSalaris: document.getElementById('autoBijtellingViaSalaris').value,
      notities: document.getElementById('autoNotities').value,
    };
    if(STATE.editAuto){
      updateAuto(STATE.editAuto, data);
      toast('Auto bijgewerkt.');
    } else {
      addAuto(data);
