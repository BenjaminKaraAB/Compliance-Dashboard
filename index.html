<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliance Dashboard — Administratiebox</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --navy:#0b1220; --navy2:#141f38; --navy3:#1c2a4a;
    --bg:#f6f8fb; --card:#ffffff; --border:#e8ecf3;
    --text:#0f172a; --muted:#556377; --muted2:#94a0bb;
    --primary:#22c58a; --primary-dark:#1ba872; --primary-bg:#dcf7ec;
    --red:#dc2626; --red-bg:#fdeaea; --red-brd:#f6c9c9;
    --amber:#c9770a; --amber-bg:#fdf1de; --amber-brd:#f3d9a8;
    --green:#15884f; --green-bg:#e5f6ee; --green-brd:#bfe6d2;
    --blue:#0e7fa3; --blue-bg:#e5f5fa; --blue-brd:#bfe4ee;
    --gray-bg:#eef0f4; --gray-brd:#dde1ea;
    --radius:12px;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    --shadow-lg:0 4px 8px rgba(15,23,42,.04), 0 16px 40px rgba(15,23,42,.08);
    color-scheme: light;
  }
  html[data-theme="dark"]{
    --bg:#0b1220; --card:#0f172a; --border:#1e293b;
    --text:#f1f5f9; --muted:#94a0bb; --muted2:#64748b;
    --primary:#22c58a; --primary-dark:#4be8a8; --primary-bg:rgba(34,197,138,.13);
    --red:#f87171; --red-bg:#3d1414; --red-brd:#7f1d1d;
    --amber:#fbbf24; --amber-bg:#3d2c14; --amber-brd:#78350f;
    --green:#4ade80; --green-bg:#14311f; --green-brd:#166534;
    --blue:#60a5fa; --blue-bg:#0e2a44; --blue-brd:#1e3a5f;
    --gray-bg:#1e293b; --gray-brd:#334155;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    --shadow-lg:0 4px 8px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { scrollbar-width:thin; scrollbar-color: var(--muted2) transparent; }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover{ background:var(--muted2); background-clip:padding-box; }
    html[data-theme="dark"] .sidebar{background:#0f172a; border-right-color:#1e293b;}
  html[data-theme="dark"] .brand-name{color:#f1f5f9;}
  html[data-theme="dark"] .topbar{background:#0f172a; border-bottom-color:#1e293b;}
  html[data-theme="dark"] table thead th{background:#1a2438; color:#94a0bb;}
  html[data-theme="dark"] tbody tr.row-click:hover{background:#152036;}
  html[data-theme="dark"] .nav-item:hover{background:#152036; color:#f1f5f9;}
  html[data-theme="dark"] .dl-card.dl-card-na{background:#1e293b;}
  html[data-theme="dark"] .lh-week.is-nu{background:rgba(201,119,10,.16);}
  html[data-theme="dark"] .panel{background:#0b1220;}
  html[data-theme="dark"] .panel-section{background:#0f172a; border-color:#1e293b;}
  html[data-theme="dark"] .panel-section h4{background:#152036; color:#94a0bb;}
  html[data-theme="dark"] .kpi-card{background:#0f172a; border-color:#1e293b;}
  html[data-theme="dark"] .section{background:#0f172a; border-color:#1e293b;}
  html[data-theme="dark"] .btn{background:#1e293b; color:#f1f5f9; border-color:#334155;}
  html[data-theme="dark"] .btn:hover{background:#334155;}
  html[data-theme="dark"] .btn.primary{background:#22c58a; color:#0b1220;}
  html[data-theme="dark"] .btn.primary:hover{background:#4be8a8;}
  html[data-theme="dark"] .today-pill{background:#1e293b; border-color:#334155; color:#94a0bb;}
  html[data-theme="dark"] .search-wrap input{background:#1e293b; border-color:#334155; color:#f1f5f9;}
  html[data-theme="dark"] .search-wrap input:focus{background:#152036;}
  html[data-theme="dark"] .search-wrap .search-kbd{background:#0f172a; border-color:#334155; color:#94a0bb;}
  html[data-theme="dark"] input[type=text], html[data-theme="dark"] input[type=number], html[data-theme="dark"] select, html[data-theme="dark"] textarea{background:#152036; color:#f1f5f9; border-color:#334155;}
  html[data-theme="dark"] .toast{background:#0f172a; border-color:#334155;}
  html[data-theme="dark"] .nav-item.active{background:rgba(34,197,138,.13); color:#4be8a8;}
  html[data-theme="dark"] .nav-item.active svg{color:#4be8a8;}
  html[data-theme="dark"] .banner{background:rgba(34,197,138,.10); border-color:rgba(34,197,138,.25); color:#4be8a8;}
  html[data-theme="dark"] #cmdkHost .cmdk-panel{background:#0f172a; border-color:#334155;}
  html[data-theme="dark"] #cmdkHost .cmdk-rij:hover, html[data-theme="dark"] #cmdkHost .cmdk-rij.is-active{background:rgba(34,197,138,.13);}

  .hero-banner{background:linear-gradient(180deg, var(--card) 0%, var(--card) 100%); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:18px; position:relative; overflow:hidden;}
  .hero-banner::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--primary);}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px;}
  .hero-date{font-size:12.5px; color:var(--muted); margin:0 0 4px;}
  .hero-greeting{font-size:21px; font-weight:700; margin:0; color:var(--text);}
  .hero-avatar{width:38px; height:38px; border-radius:50%; background:var(--primary-bg); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .hero-stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:14px;}
  .hero-stat{background:var(--bg); border-radius:10px; padding:10px 12px;}
  .hero-stat .n{font-size:20px; font-weight:700; line-height:1.2;}
  .hero-stat .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .hero-digest{background:var(--primary-bg); border-radius:10px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;}
  .hero-digest i{font-size:17px; color:var(--primary-dark); margin-top:1px; flex-shrink:0;}
  .hero-digest-title{font-size:12.5px; font-weight:700; color:var(--primary-dark); margin:0 0 3px;}
  .hero-digest-body{font-size:12.5px; color:var(--primary-dark); margin:0; line-height:1.55;}
  .hero-digest-empty{background:var(--bg); border-radius:10px; padding:12px 14px; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12.5px;}
  .hero-digest-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .hero-digest-actions button{font-size:12px; padding:6px 12px;}
  html[data-theme="dark"] .hero-stat{background:rgba(255,255,255,.03);}

  .panel-section{scroll-margin-top:52px;}
  .panel-section-head{position:sticky; top:0; z-index:5; background:var(--card); display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid var(--border); margin-bottom:10px;}
  .panel-section-head i{font-size:16px; color:var(--muted);}
  .panel-section-head .t{font-size:13px; font-weight:700; color:var(--text);}
  html[data-theme="dark"] .panel-section-head{background:var(--card);}

  button, .btn{transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;}
  button:hover:not(:disabled), .btn:hover{transform:translateY(-1px);}
  button:active:not(:disabled), .btn:active{transform:translateY(0); transition-duration:.05s;}
  button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:6px;}
  .bulk-act:hover, .bulk-close:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}

  .ai-launch-btn{background:var(--primary-bg); border:1px solid transparent; color:var(--primary-dark);}
  .ai-launch-btn:hover{background:var(--primary-bg); filter:brightness(0.97);}
  .nav-badge{margin-left:auto; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; background:var(--amber-bg); color:#8a4b06; padding:2px 6px; border-radius:20px;}
  html[data-theme="dark"] .nav-badge{background:rgba(250,199,117,.16); color:#facc7a;}
  #aiHost .ai-overlay{position:fixed; inset:0; z-index:70;}
  #aiHost .ai-panel{position:fixed; top:60px; right:22px; width:380px; max-width:calc(100vw - 44px); height:min(560px, 70vh); background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); z-index:71; overflow:hidden; display:flex; flex-direction:column; animation:notifIn .18s cubic-bezier(.16,1,.3,1);}
  #aiHost .ai-head{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  #aiHost .ai-badge{font-size:9.5px; font-weight:700; text-transform:uppercase; background:var(--amber-bg); color:#8a4b06; padding:2px 6px; border-radius:20px;}
  #aiHost .ai-body-wrap{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
  #aiHost .ai-empty{margin:auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; max-width:220px;}
  #aiHost .ai-msg{display:flex; gap:8px; align-items:flex-start;}
  #aiHost .ai-msg.user{justify-content:flex-end;}
  #aiHost .ai-msg-avatar{width:24px; height:24px; border-radius:50%; background:var(--primary-bg); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px;}
  #aiHost .ai-msg-bubble{font-size:12.5px; line-height:1.5; padding:8px 11px; border-radius:12px; max-width:78%; background:var(--bg);}
  #aiHost .ai-msg-bubble{white-space:pre-wrap; word-break:break-word;}
  #aiHost .ai-msg-bubble a{color:inherit; text-decoration:underline;}
  #aiHost .ai-msg.user .ai-msg-bubble{background:var(--primary); color:#fff; border-radius:12px 12px 2px 12px;}
  #aiHost .ai-msg.assistant .ai-msg-bubble{border-radius:12px 12px 12px 2px;}
  #aiHost .ai-foot{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border);}
  #aiHost .ai-foot input{flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; background:var(--card); color:var(--text);}
  #aiHost .ai-typing{display:flex; gap:4px; align-items:center; padding:11px 12px;}
  #aiHost .ai-typing span{width:5px; height:5px; border-radius:50%; background:var(--muted2); animation:aiTyping 1s infinite ease-in-out;}
  #aiHost .ai-typing span:nth-child(2){animation-delay:.15s;} #aiHost .ai-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes aiTyping{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-2px);}}

  /* Force light-mode voor elementen die expliciet [data-theme=light] hebben — nodig voor de verborgen
     PDF-render-wrapper zodat de PDF nooit dark-mode kleuren pakt. */
  [data-theme="light"]{
    --bg:#f6f8fb; --card:#ffffff; --border:#e8ecf3;
    --text:#0f172a; --muted:#556377; --muted2:#94a0bb;
    --primary:#22c58a; --primary-dark:#1ba872; --primary-bg:#dcf7ec;
    --red:#dc2626; --red-bg:#fdeaea; --red-brd:#f6c9c9;
    --amber:#c9770a; --amber-bg:#fdf1de; --amber-brd:#f3d9a8;
    --green:#15884f; --green-bg:#e5f6ee; --green-brd:#bfe6d2;
    --blue:#0e7fa3; --blue-bg:#e5f5fa; --blue-brd:#bfe4ee;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased;
    font-feature-settings: 'cv02','cv03','cv04','cv11';
  }
  #app{display:flex; min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:250px; flex:0 0 250px; background:#ffffff; border-right:1px solid var(--border);
    color:var(--text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    transition: width .18s ease, flex-basis .18s ease;
  }
  .sidebar.is-collapsed{width:64px; flex-basis:64px;}
  .sidebar.is-collapsed .brand-name,
  .sidebar.is-collapsed .brand-sub,
  .sidebar.is-collapsed .nav-group-label,
  .sidebar.is-collapsed .nav-item span,
  .sidebar.is-collapsed .nav-foot .user{display:none;}
  .sidebar.is-collapsed .brand{padding:12px; align-items:center;}
  .sidebar.is-collapsed .brand-row{justify-content:center; gap:0; width:100%;}
  .sidebar.is-collapsed .sidebar-collapse-btn{margin-left:0;}
  .sidebar.is-collapsed .nav-item{justify-content:center; padding:10px 8px;}
  .sidebar.is-collapsed .nav-item.active::before{left:-8px;}
  .sidebar.is-collapsed .nav-foot{padding:12px; justify-content:center;}
  .sidebar-collapse-btn{margin-left:auto; background:transparent; border:none; color:var(--muted); cursor:pointer; padding:4px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background .12s ease;}
  .sidebar-collapse-btn:hover{background:var(--bg); color:var(--text);}
  .sidebar-collapse-btn i{font-size:16px;}
  .sidebar.is-collapsed .sidebar-collapse-btn i::before{content:'\ea48';}
  .brand{padding:20px 18px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:34px; height:34px; flex:0 0 34px;}
  .brand-name{font-size:16px; font-weight:800; letter-spacing:.2px; color:var(--text);}
  .brand-sub{font-size:10.5px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; font-weight:600;}
  .nav{flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
  .nav-group-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted2);
    padding:14px 14px 6px; font-weight:700;
  }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px;
    color:var(--text); font-size:13.5px; font-weight:500; cursor:pointer; border:none; background:none; text-align:left; width:100%;
    transition: background .12s ease, color .12s ease; position:relative;
  }
  .nav-item svg{flex:0 0 18px; width:18px; height:18px; opacity:.65; transition:opacity .12s ease;}
  .nav-item:hover{background:#f4f6f9; color:var(--text);}
  .nav-item:hover svg{opacity:.95;}
  .nav-item.active{background:var(--primary-bg); color:var(--primary-dark); font-weight:600;}
  .nav-item.active svg{opacity:1; color:var(--primary-dark);}
  .nav-item.active::before{content:''; position:absolute; left:-12px; top:9px; bottom:9px; width:3px; background:var(--primary); border-radius:0 3px 3px 0;}
  .nav-item:focus-visible{outline:2px solid var(--primary); outline-offset:1px;}

  .nav-foot{padding:14px 16px 16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .nav-foot .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;}
  .nav-foot .user{min-width:0;}
  .nav-foot .user-name{font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-foot .user-mail{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-foot .app-version{font-size:9.5px; color:var(--muted); opacity:.6; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.02em;}

  /* MAIN */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--border); padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  }
  .page-title{font-size:18px; font-weight:700;}
  .page-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .search-wrap{position:relative; width:300px;}
  .search-wrap input{
    width:100%; padding:9px 12px 9px 34px; border:1px solid var(--border); border-radius:9px; font-size:13px;
    background:var(--bg); outline:none; transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;
    font-family:inherit;
  }
  .search-wrap input:focus{border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px rgba(34,197,138,.15);}
  .search-wrap svg{position:absolute; left:10px; top:9px; width:15px; height:15px; color:var(--muted2);}
  .search-wrap .search-kbd{position:absolute; right:10px; top:8px; font-size:10.5px; color:var(--muted); background:#fff; padding:2px 6px; border-radius:4px; border:1px solid var(--border); font-family:ui-monospace,monospace;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .today-pill{font-size:12px; color:var(--muted); background:var(--bg); border:1px solid var(--border); padding:7px 12px; border-radius:20px;}

  .content{padding:24px 28px 60px; flex:1;}

  /* KPI cards */
  .kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px;}
  .kpi-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .kpi-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--muted2); border-radius:var(--radius) 0 0 var(--radius);}
  .kpi-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-1px);}
  .kpi-label{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
  .kpi-value{font-size:28px; font-weight:800; margin-top:6px; letter-spacing:-.5px; color:var(--text);}
  .kpi-sub{font-size:11.5px; margin-top:4px; font-weight:600;}
  .kpi-card.red::before{background:var(--red);}    .kpi-card.red .kpi-value{color:var(--red);}
  .kpi-card.amber::before{background:var(--amber);} .kpi-card.amber .kpi-value{color:var(--amber);}
  .kpi-card.green::before{background:var(--green);} .kpi-card.green .kpi-value{color:var(--green);}
  .kpi-card.blue::before{background:var(--primary);} .kpi-card.blue .kpi-value{color:var(--primary);}
  .dash-tegels{grid-template-columns:repeat(4,1fr);}

  .section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
  .section-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .section-head h3{margin:0; font-size:14.5px; font-weight:700; letter-spacing:-.1px;}
  .section-head .hint{font-size:12px; color:var(--muted);}
  .section-body{padding:6px 0;}
  .section-body.pad{padding:18px 20px;}
  [data-kpi-toggle]:hover, [data-lh-import-toggle]:hover{background:var(--bg) !important; transition:background .14s var(--ease);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    padding:12px 20px; border-bottom:1px solid var(--border); font-weight:700; white-space:nowrap;
    background:#fafbfd;
  }
  tbody td{padding:12px 20px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.row-click{cursor:pointer; transition:background .16s var(--ease);}
  tbody tr.row-click:hover{background:#f4faf7;}
  .view-toggle{display:flex; padding:3px; background:var(--bg); border-radius:8px; border:1px solid var(--border);}
  .view-toggle button{padding:5px 8px; background:transparent; border:none; border-radius:6px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .12s;}
  .view-toggle button.is-active{background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .view-toggle button i{font-size:15px;}
  .klanten-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; padding:16px 20px 20px;}
  .klant-kaart{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease); position:relative;}
  .klant-kaart:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg); border-color:var(--muted2);}
  .klant-kaart-strip{position:absolute; top:0; left:0; right:0; height:3px;}
  .klant-kaart-inner{padding:14px;}
  .klant-kaart-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px;}
  .klant-kaart-naam{font-weight:600; font-size:13.5px; color:var(--text); line-height:1.3;}
  .klant-kaart-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .klant-kaart-badge{padding:3px 8px; border-radius:12px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; flex:none; white-space:nowrap;}
  .klant-kaart-stripes{display:flex; gap:3px; margin-bottom:10px;}
  .klant-kaart-stripes > div{flex:1; height:4px; border-radius:2px;}
  .klant-kaart-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px;}
  .klant-kaart-saldo{color:var(--muted);}
  tbody tr.klant-rij .strip-cel{padding:0; width:4px; position:relative;}
  tbody tr.klant-rij .rij-strip{position:absolute; left:0; top:6px; bottom:6px; width:3px; border-radius:0 2px 2px 0;}
  tbody tr.klant-rij:hover .rij-strip{width:4px;}
  .klant-cell{display:flex; align-items:center; gap:10px;}
  .klant-avatar{width:32px; height:32px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; letter-spacing:.3px; flex:none; box-shadow:inset 0 -1px 0 rgba(0,0,0,.08);}
  .klant-name{font-weight:700; color:var(--text); line-height:1.35;}
  .klant-meta{font-size:11.5px; color:var(--muted); margin-top:1px;}

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
    border:1px solid transparent; white-space:nowrap; letter-spacing:.1px;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .badge.red{background:var(--red-bg); color:var(--red); border-color:var(--red-brd);}
  .badge.amber{background:var(--amber-bg); color:var(--amber); border-color:var(--amber-brd);}
  .badge.green{background:var(--green-bg); color:var(--green); border-color:var(--green-brd);}
  .badge.blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-brd);}
  .badge.gray{background:var(--gray-bg); color:var(--muted); border-color:var(--gray-brd);}
  .badge .dot.red{background:var(--red);} .badge .dot.amber{background:var(--amber);}
  .badge .dot.green{background:var(--green);} .badge .dot.blue{background:var(--blue);} .badge .dot.gray{background:var(--muted2);}

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer;
  }
  .btn:hover{background:var(--bg);}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 1px 2px rgba(34,197,138,.25);}
  .btn.primary:hover{background:var(--primary-dark); border-color:var(--primary-dark); box-shadow:0 2px 6px rgba(34,197,138,.35);}
  .btn{transition: background .14s var(--ease), border-color .14s var(--ease), box-shadow .14s var(--ease), transform .1s var(--ease);}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--primary); outline-offset:1px;}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:var(--bg);}
  .btn.sm{padding:6px 10px; font-size:11.5px;}
  .btn.dark{background:#131417; border-color:#131417; color:#fff;}
  .btn.dark:hover{background:#2a2c31; border-color:#2a2c31;}
  .btn.danger{color:var(--red); border-color:var(--red-brd); background:var(--red-bg);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .filters{display:flex; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center;}
  select, .txt-input{
    padding:8px 11px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; background:#fff; color:var(--text); outline:none;
  }
  select, .txt-input{transition:border-color .12s ease, box-shadow .12s ease;}
  select:focus, .txt-input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(34,197,138,.15);}

  /* boekhouder cards */
  .bh-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .bh-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; cursor:pointer; transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);}
  .bh-card:hover{border-color:var(--primary); transform:translateY(-1px); box-shadow:var(--shadow-lg);}
  .bh-top{display:flex; align-items:center; gap:12px;}
  .avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; flex:none;}
  .bh-name{font-weight:700; font-size:14.5px;}
  .bh-role{font-size:11.5px; color:var(--muted);}
  .bh-stats{display:flex; gap:8px; margin-top:16px;}
  .bh-stat{flex:1; text-align:center; background:var(--bg); border-radius:8px; padding:8px 4px;}
  .bh-stat b{display:block; font-size:16px;}
  .bh-stat span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .bh-foot{margin-top:14px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted);}

  /* status dist bars */
  .distbar{display:flex; align-items:center; gap:10px; padding:9px 20px;}
  .distbar .label{width:150px; font-size:12.5px; font-weight:600; flex:none;}
  .distbar .track{flex:1; height:9px; border-radius:6px; background:var(--gray-bg); overflow:hidden; display:flex;}
  .distbar .seg{height:100%;}
  .distbar .nums{width:150px; text-align:right; font-size:11.5px; color:var(--muted); flex:none;}

  /* Slide over */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.35); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .18s; z-index:40;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .panel{
    position:fixed; top:0; right:0; height:100vh; width:600px; max-width:94vw; background:var(--bg);
    transform:translateX(100%); transition:transform .28s cubic-bezier(.16,1,.3,1), width .22s ease, max-width .22s ease; z-index:41; display:flex; flex-direction:column;
    box-shadow:-12px 0 40px rgba(15,23,42,.16);
  }
  .panel.open{transform:translateX(0);}
  .panel.is-focus{width:100vw; max-width:100vw;}
  .panel.is-focus .panel-body{max-width:960px; margin:0 auto; padding:24px 32px 80px;}
  .panel.is-focus .panel-head{padding:24px 32px;}
  .panel.is-focus .panel-head-top{max-width:960px; margin:0 auto; width:100%;}
  .panel-head{background:#131417; color:#fff; padding:22px 24px; flex:none;}
  .panel-head-top{display:flex; justify-content:space-between; align-items:flex-start;}
  a.btn{text-decoration:none;}
  .panel-close{background:rgba(255,255,255,.1); border:none; color:#fff; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; transition:background .12s ease;}
  .panel-close:hover{background:rgba(255,255,255,.2);}
  .panel-klant-name{font-size:19px; font-weight:800; margin-top:2px;}
  .panel-klant-meta{font-size:12px; color:rgba(255,255,255,.85); margin-top:5px; display:flex; gap:14px; flex-wrap:wrap;}
  .panel-body{flex:1; overflow-y:auto; padding:20px 24px 80px;}
  .panel-section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;}
  .panel-section h4{margin:0; padding:13px 16px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; background:#fafbfd;}
  .panel-section .inner{padding:14px 16px;}

  .deadline-grid{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; padding:14px 16px;}
  .dl-card{border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column;}
  .dl-card.dl-card-na{background:#eef0f4; opacity:.7;}
  .dl-card .dl-card-inner{padding:10px 12px;}
  .dl-card .dl-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; font-weight:600;}
  .dl-card .dl-big{font-size:15px; font-weight:700; margin-top:5px; letter-spacing:-0.2px;}
  .dl-card .dl-small{font-size:11px; margin-top:2px;}
  .dl-card .dl-card-actions{padding:8px 10px; display:flex; gap:4px; flex-direction:column;}
  .dl-card .dl-card-actions select, .dl-card .dl-card-actions button{width:100%;}
  .dl-na{color:var(--muted2); font-size:12px; padding:14px 16px;}

  .overige-row{display:flex; align-items:center; justify-content:space-between; padding:9px 16px; border-top:1px solid var(--border);}
  .overige-row:first-child{border-top:none;}
  .overige-left b{font-size:12.5px;} .overige-left div{font-size:11.5px; color:var(--muted); margin-top:1px;}

  .field-row{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
  .field-row label{width:150px; font-size:12.5px; color:var(--muted); flex:none;}
  .field-row input[type=text], .field-row input[type=number]{
    flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;
  }
  .checklist-item{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--border); font-size:12.5px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item.done label{text-decoration:line-through; color:var(--muted2);}
  .checklist-item input[type=checkbox]{width:15px; height:15px;}
  .add-item-row{display:flex; gap:6px; margin-top:8px;}
  .add-item-row input{flex:1; padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;}

  .chan-row{display:flex; gap:14px; margin-bottom:10px; font-size:12.5px;}
  .chan-row label{display:flex; align-items:center; gap:6px;}
  .rem-actions{display:flex; gap:8px; margin-top:6px;}
  .rem-log{margin-top:10px; border-top:1px solid var(--border); padding-top:10px;}
  .rem-log-item{font-size:11.5px; color:var(--muted); padding:4px 0; display:flex; gap:8px;}
  .rem-log-empty{font-size:12px; color:var(--muted2); font-style:italic;}

  .banner{background:var(--primary-bg); border:1px solid #b6ecd2; color:#0f7550; border-radius:9px; padding:10px 13px; font-size:11.5px; margin-bottom:14px; line-height:1.5;}
  textarea{width:100%; min-height:70px; border:1px solid var(--border); border-radius:8px; padding:9px; font-size:12.5px; font-family:inherit; resize:vertical;}

  .toast-wrap{position:fixed; bottom:22px; right:22px; z-index:60; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:#0f172a; color:#fff; padding:12px 16px 12px 18px; border-radius:10px;
    font-size:12.5px; box-shadow:var(--shadow-lg); max-width:340px;
    animation:slidein .22s cubic-bezier(.16,1,.3,1); position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
  }
  .toast::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary);}
  .toast-undo{background:transparent; border:1px solid rgba(255,255,255,.25); color:var(--primary); padding:5px 11px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:background .12s;}
  .toast-undo:hover{background:rgba(34,197,138,.15);}
  @keyframes slidein{from{transform:translateY(14px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  .empty-state{padding:48px 24px; text-align:center; color:var(--muted); font-size:13px; line-height:1.6;}
  .saldo-edit{display:inline-flex; align-items:center; gap:6px;}
  .saldo-edit input{width:100px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12.5px;}

  /* LH kalender */
  .lh-kalender{display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; align-items:end;}
  .lh-week{display:flex; flex-direction:column; align-items:center; padding:4px 2px; border-radius:8px; transition:background .12s;}
  .lh-week.is-nu{background:#fdf1de;}
  .lh-week-nr{font-size:10px; color:var(--muted); font-weight:500; margin-bottom:4px;}
  .lh-week-bar-wrap{width:100%; display:flex; align-items:flex-end; justify-content:center; min-height:44px;}
  .lh-week-bar{width:100%; min-height:10px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; transition:opacity .12s;}
  .lh-week-bar:hover{opacity:.85;}
  .lh-week-datum{font-size:10.5px; color:var(--muted); margin-top:6px;}

  /* Bulk-actie bar */
  #bulkActionBar{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:8px 12px 8px 16px; border-radius:12px; display:flex; align-items:center; gap:10px; box-shadow:0 12px 32px rgba(15,23,42,.24); z-index:55; border:1px solid rgba(255,255,255,.08); animation:bulkIn .22s cubic-bezier(.16,1,.3,1);}
  @keyframes bulkIn{from{transform:translate(-50%, 20px); opacity:0;} to{transform:translate(-50%, 0); opacity:1;}}
  #bulkActionBar .bulk-count{display:flex; align-items:center; gap:8px; padding-right:10px; border-right:1px solid rgba(255,255,255,.15); font-size:12.5px; font-weight:500;}
  #bulkActionBar .bulk-num{width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
  #bulkActionBar .bulk-act{background:rgba(255,255,255,.08); border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:500; display:flex; align-items:center; gap:6px; cursor:pointer; transition:background .12s;}
  #bulkActionBar .bulk-act:hover{background:rgba(255,255,255,.16);}
  #bulkActionBar .bulk-act i{font-size:14px;}
  #bulkActionBar .bulk-close{background:transparent; border:none; color:#a9b4d4; padding:6px 8px; cursor:pointer; border-radius:6px;}
  #bulkActionBar .bulk-close:hover{background:rgba(255,255,255,.1); color:#fff;}
  tbody tr.klant-rij.is-selected{background:var(--primary-bg);}

  /* Notification center */
  .notif-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--primary); border:2px solid var(--card); animation:pulseNotif 2.4s ease-in-out infinite;}
  @keyframes pulseNotif{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.15); opacity:.85;}}
  #notifHost .notif-overlay{position:fixed; inset:0; z-index:70;}
  #notifHost .notif-panel{position:fixed; top:60px; right:22px; width:380px; max-width:calc(100vw - 44px); max-height:70vh; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); z-index:71; overflow:hidden; display:flex; flex-direction:column; animation:notifIn .18s cubic-bezier(.16,1,.3,1);}
  @keyframes notifIn{from{transform:translateY(-6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  #notifHost .notif-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  #notifHost .notif-mark-read{background:transparent; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; padding:2px 4px;}
  #notifHost .notif-mark-read:hover{color:var(--text);}
  #notifHost .notif-body-wrap{overflow-y:auto; flex:1;}
  #notifHost .notif-rij{padding:12px 16px; display:flex; gap:12px; align-items:flex-start; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s;}
  #notifHost .notif-rij:hover{background:var(--primary-bg);}
  #notifHost .notif-rij.is-ongelezen{background:var(--primary-bg);}
  #notifHost .notif-rij.is-ongelezen:hover{background:var(--primary-bg); filter:brightness(0.96);}
  #notifHost .notif-icoon{width:32px; height:32px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center;}
  #notifHost .notif-body{flex:1; min-width:0;}
  #notifHost .notif-tekst{font-size:13px; line-height:1.4; color:var(--text);}
  #notifHost .notif-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  #notifHost .notif-nieuw{width:7px; height:7px; border-radius:50%; background:var(--primary); margin-top:6px; flex:none;}
  #notifHost .notif-leeg{padding:24px; text-align:center; color:var(--muted); font-size:13px;}

  /* Command palette */
  #cmdkHost .cmdk-overlay{position:fixed; inset:0; background:rgba(15,23,42,.35); backdrop-filter:blur(2px); z-index:80;}
  #cmdkHost .cmdk-panel{position:fixed; top:14vh; left:50%; transform:translateX(-50%); width:560px; max-width:92vw; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-lg); z-index:81; overflow:hidden; display:flex; flex-direction:column;}
  #cmdkHost .cmdk-input-wrap{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border);}
  #cmdkHost .cmdk-input-wrap input{flex:1; border:none; outline:none; font-size:15px; background:transparent; font-family:inherit; color:var(--text);}
  #cmdkHost .cmdk-input-wrap input::placeholder{color:var(--muted2);}
  #cmdkHost .cmdk-esc{font-size:10.5px; color:var(--muted); background:var(--bg); padding:3px 6px; border-radius:5px; border:1px solid var(--border); font-family:ui-monospace,monospace;}
  #cmdkHost .cmdk-body{max-height:380px; overflow-y:auto; padding:6px;}
  #cmdkHost .cmdk-rij{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px; cursor:pointer; transition:background .08s;}
  #cmdkHost .cmdk-rij:hover, #cmdkHost .cmdk-rij.is-active{background:var(--primary-bg);}
  #cmdkHost .cmdk-rij.is-active i{color:var(--primary-dark);}
  #cmdkHost .cmdk-label{font-size:13.5px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #cmdkHost .cmdk-sub{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #cmdkHost .cmdk-type{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted2); background:var(--bg); padding:2px 7px; border-radius:5px; font-weight:600;}
  #cmdkHost .cmdk-leeg{padding:22px; text-align:center; color:var(--muted); font-size:13px;}
  #cmdkHost .cmdk-foot{display:flex; gap:14px; padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); background:var(--bg);}
  #cmdkHost kbd{font-family:ui-monospace,monospace; background:var(--card); border:1px solid var(--border); padding:1px 5px; border-radius:4px; font-size:10.5px; margin-right:4px;}

  @media (max-width:1100px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} .dash-tegels{grid-template-columns:repeat(2,1fr);} .bh-grid{grid-template-columns:repeat(2,1fr);} }

/* ===== Teams-replica (msteams-pagina) ===== */
.tm-wrap{display:flex; height:560px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--card);}
.tm-rail{width:64px; background:#444791; display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:2px; flex-shrink:0;}
.tm-rail-item{width:52px; padding:7px 0 5px; border-radius:8px; text-align:center; cursor:pointer; color:#c7c9f0; font-size:9.5px; line-height:1.3; border:none; background:none;}
.tm-rail-item i{font-size:19px; display:block; margin-bottom:1px;}
.tm-rail-item.is-actief{color:#fff; background:rgba(255,255,255,.14);}
.tm-rail-item:hover{color:#fff;}
.tm-lijst{width:270px; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; background:var(--bg);}
.tm-item{padding:9px 12px; cursor:pointer; display:flex; gap:9px; align-items:center; border-left:3px solid transparent;}
.tm-item:hover{background:var(--card);}
.tm-item.is-actief{background:var(--card); border-left-color:#5B5FC7;}
.tm-avatar{position:relative; flex-shrink:0;}
.tm-avatar .cirkel{width:30px; height:30px; border-radius:50%; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
.tm-presence{position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; border:2px solid var(--bg);}
.tm-dag{text-align:center; font-size:10.5px; color:var(--muted2); margin:10px 0 4px; display:flex; align-items:center; gap:10px;}
.tm-dag::before,.tm-dag::after{content:''; flex:1; height:1px; background:var(--border);}
.tm-bubbel{max-width:70%; padding:7px 12px; border-radius:6px; font-size:12.5px; line-height:1.5; background:var(--card); border:1px solid var(--border); align-self:flex-start; position:relative;}
.tm-bubbel.is-eigen{background:#E8EBFA; border-color:#dfe3f7; color:#242424; align-self:flex-end;}
html[data-theme="dark"] .tm-bubbel.is-eigen{background:#3d3f78; border-color:#4a4d8f; color:#f1f5f9;}
.tm-mention{background:#E8EBFA; color:#4F52B2; border-radius:4px; padding:0 3px; font-weight:600;}
html[data-theme="dark"] .tm-mention{background:#3d3f78; color:#c7c9f0;}
.tm-reactie{display:inline-flex; align-items:center; gap:3px; border:1px solid var(--border); background:var(--card); border-radius:10px; padding:0 7px; font-size:10.5px; margin-top:3px;}
.tm-compose{display:flex; gap:8px; align-items:flex-end; padding:10px 14px; border-top:1px solid var(--border); position:relative;}
.tm-compose input{flex:1; padding:9px 12px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; background:var(--card); color:var(--text);}
.tm-emoji-grid{position:absolute; bottom:52px; right:56px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px; display:grid; grid-template-columns:repeat(6,1fr); gap:4px; box-shadow:0 6px 24px rgba(0,0,0,.12); z-index:30;}
.tm-emoji-grid button{border:none; background:none; font-size:18px; cursor:pointer; padding:3px; border-radius:6px;}
.tm-emoji-grid button:hover{background:var(--bg);}
.app-teller{position:absolute; top:4px; right:6px; background:#C4314B; color:#fff; font-size:9px; font-weight:700; border-radius:8px; padding:0 4px; min-width:14px; text-align:center; line-height:14px;}
.nav-app-teller{margin-left:auto; background:#C4314B; color:#fff; font-size:10px; font-weight:700; border-radius:9px; padding:1px 6px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>


/* ============================= DATA ============================= */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
// Versienummer van het dashboard: wordt getoond onder de profielnaam linksonder in de sidebar,
// zodat direct te zien is welke build er open staat (handig bij het testen na een nieuwe deploy).
const APP_VERSION = '2026.08.18.21';

/* Dark mode: bewaar keuze in localStorage, val terug op systeem-voorkeur. */
function _themeRoot(){ return (typeof document!=='undefined' && document.documentElement) ? document.documentElement : null; }
function initTheme(){
  const root = _themeRoot(); if(!root || !root.setAttribute) return;
  try{
    const saved = localStorage.getItem('cd_theme');
    if(saved==='dark' || saved==='light'){ root.setAttribute('data-theme', saved); }
    else if(typeof window!=='undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      root.setAttribute('data-theme', 'dark');
    }
  }catch(e){}
}
function toggleTheme(){
  const root = _themeRoot(); if(!root || !root.setAttribute) return;
  const nu = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', nu);
  try{ localStorage.setItem('cd_theme', nu); }catch(e){}
  updateThemeButton();
}
function updateThemeButton(){
  const btn = document.getElementById('themeToggleBtn'); if(!btn) return;
  const root = _themeRoot();
  const isDark = root && root.getAttribute && root.getAttribute('data-theme')==='dark';
  btn.innerHTML = `<i class="ti ${isDark?'ti-sun':'ti-moon'}" aria-hidden="true"></i>`;
  btn.title = isDark ? 'Naar licht thema' : 'Naar donker thema';
}
initTheme();
const NL_MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function fmtDatumLang(date){ return `${date.getDate()} ${NL_MAANDEN[date.getMonth()]} ${date.getFullYear()}`; }
const NL_DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
function fmtDagVolledig(date){ return `${NL_DAGEN[date.getDay()][0].toUpperCase()}${NL_DAGEN[date.getDay()].slice(1)} ${date.getDate()} ${NL_MAANDEN[date.getMonth()]}`; }

function normaliseerIbData(ib){

  const storeSnap = STORE[id] ? JSON.parse(JSON.stringify(STORE[id])) : null;
  const originalIdx = RAW_KLANTEN.findIndex(x=>x.id===id);
  logActiviteit(`Klant verwijderd: "${k.naam}"`);

/* KPI-helpers: geven altijd een gevulde rij terug voor een BOEKHOUDER (lazy-init, net als
   syncLhTaken() dat voor Loonheffingen doet) zodat een nieuwe boekhouder meteen een KPI-rij heeft
   zonder aparte migratiestap. Teamcijfers worden nergens apart opgeslagen — die zijn altijd de som
   van de boekhouders in dat team, berekend door kpiOpSomVoorTeam() / kpiCommHistorieVoorTeam(). */
function kpiOpVoorBh(bhId){
  if(!KPI_OPERATIONEEL[bhId]) KPI_OPERATIONEEL[bhId] = { inbox:0, bankmutaties:0, jaarrekeningen:0, klanten:0, btwQ1:0, btwQ2:0, btwQ3:0, btwQ4:0 };
  return KPI_OPERATIONEEL[bhId];
}
function kpiOpSomVoorTeam(teamId){
  const velden = ['inbox','bankmutaties','jaarrekeningen','klanten','btwQ1','btwQ2','btwQ3','btwQ4'];
  const som = {}; velden.forEach(v=>som[v]=0);
  boekhoudersOfTeam(teamId).forEach(b=>{
    const d = kpiOpVoorBh(b.id);
    velden.forEach(v=>som[v]+=(d[v]||0));
  });
  return som;
}
function kpiCommVoorBh(bhId){
  if(!KPI_COMMERCIEEL.boekhouders[bhId]) KPI_COMMERCIEEL.boekhouders[bhId] = { historie:[] };
  if(!Array.isArray(KPI_COMMERCIEEL.boekhouders[bhId].historie)) KPI_COMMERCIEEL.boekhouders[bhId].historie = [];
  return KPI_COMMERCIEEL.boekhouders[bhId];
}
/* Slaat (of overschrijft) één weekpunt op in de historie van een boekhouder — dit is de basis voor de
   lijndiagrammen. Een tweede keer opslaan voor dezelfde week overschrijft dat punt in plaats van een
   dubbele toe te voegen, zodat je een foutje in een eerder ingevulde week gewoon kunt corrigeren. */
function kpiCommUpsertWeek(bhId, week, kg, conv, nk){
  const d = kpiCommVoorBh(bhId);
  const bestaand = d.historie.find(h=>h.week===week);
  if(bestaand){ Object.assign(bestaand, {kg, conv, nk}); }
  else { d.historie.push({week, kg, conv, nk}); d.historie.sort((a,b)=>a.week-b.week); }
}
function kpiCommWeekData(bhId, week){
  const d = kpiCommVoorBh(bhId);
  return d.historie.find(h=>h.week===week) || {week, kg:0, conv:0, nk:0};
}
/* Som van kg/nk en gemiddelde conv over de historie van één boekhouder. */
function kpiCommTotalen(bhId){
  const historie = kpiCommVoorBh(bhId).historie;
  if(!historie.length) return { kgTotaal:0, convTotaal:0, nkTotaal:0 };
  const kgTotaal = historie.reduce((s,h)=>s+(h.kg||0),0);
  const nkTotaal = historie.reduce((s,h)=>s+(h.nk||0),0);
  const convTotaal = Math.round(historie.reduce((s,h)=>s+(h.conv||0),0) / historie.length);
  return { kgTotaal, convTotaal, nkTotaal };
}
/* Alle weken die voorkomen in de historie van de gegeven boekhouder-id's (of van iedereen als geen
   lijst wordt meegegeven) — gebruikt als gedeelde x-as voor de lijndiagrammen. */
function kpiAlleWeken(bhIds){
  const ids = bhIds || Object.keys(KPI_COMMERCIEEL.boekhouders);
  const weken = new Set();
  ids.forEach(bhId=>{ kpiCommVoorBh(bhId).historie.forEach(h=>weken.add(h.week)); });
  return [...weken].sort((a,b)=>a-b);
}
/* Som per week van kg/nk (en gemiddelde conv) over alle boekhouders van een team — dit vormt de
   "teamlijn" op het algemene overzicht (zonder teamfilter). */
function kpiCommHistorieVoorTeam(teamId){
  const leden = boekhoudersOfTeam(teamId).map(b=>b.id);
  const weken = kpiAlleWeken(leden);
  return weken.map(w=>{
    let kg=0, nk=0, convSom=0, convAantal=0;
    leden.forEach(bhId=>{
      const punt = kpiCommVoorBh(bhId).historie.find(h=>h.week===w);
      if(punt){ kg+=(punt.kg||0); nk+=(punt.nk||0); convSom+=(punt.conv||0); convAantal++; }
    });
    return { week:w, kg, nk, conv: convAantal ? Math.round(convSom/convAantal) : 0 };
  });
}
function kpiTeamKleur(idx){
  const palet = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
  return palet[idx % palet.length];
}

/* Ruwe weeknummer-schatting (geen strikte ISO-8601-weekberekening) — precies genoeg om als
   standaardwaarde te dienen bij het invullen van de commerciele KPI's; de gebruiker kan het weeknummer
   altijd zelf overschrijven. */
function kpiHuidigeWeek(){
  const start = new Date(TODAY.getFullYear(), 0, 1);

/* ============================= CLOUD SYNC (Microsoft-login via Graph API) =============================
   Dit dashboard werkt standaard lokaal (per browser). Om data live te delen tussen collega's koppel je
   het rechtstreeks aan een SharePoint-lijst via je eigen Microsoft-account (MSAL-login) en de Microsoft
   Graph API — gratis, geen Power Automate nodig. Zie de handleidingen "Dashboard hosten op GitHub Pages"
   en "Azure AD app-registratie". Werkt alléén als het dashboard vanaf een echte https-URL wordt geopend
   (niet als lokaal dubbelgeklikt bestand) — dat is een vereiste van Microsoft's inlogscherm. */
const SYNC_KEY = 'compliance_dashboard_sync_v1';
let SYNC = {
  clientId:'', tenantId:'', siteUrl:'', listName:'ComplianceDashboardData',
  enabled:false, lastSync:null, lastError:null, account:null, siteId:null, listId:null,
  pendingLocalChanges:false
};
let msalInstance = null;
let msalInitPromise = null;
/* 'Mail.Send' is nodig voor het automatisch versturen van documenten (bijv. de akkoordverklaring
   aangifte IB) rechtstreeks vanuit het ingelogde Microsoft-account via Graph — dit vraagt bij de
   eerstvolgende keer inloggen (of opnieuw inloggen) om een extra toestemming van de gebruiker. */
const GRAPH_SCOPES = ['User.Read', 'Sites.ReadWrite.All', 'Mail.Send', 'Chat.ReadWrite', 'Mail.ReadWrite', 'Files.ReadWrite'];

function loadSync(){
  try{ const raw = localStorage.getItem(SYNC_KEY); if(raw) SYNC = Object.assign(SYNC, JSON.parse(raw)); }catch(e){}
  if(SYNC.enabled && SYNC.clientId) getMsalInstance(); // warmt alvast op; consumenten wachten er zelf op
}
function saveSyncConfig(cfg){
  SYNC = Object.assign(SYNC, cfg);
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }catch(e){}
}
function persistSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }catch(e){} updateSyncIndicator(); }

function isAdmin(){
  if(!SYNC.account || !SYNC.account.username) return false;
  const list = (RECHTEN.adminEmails||[]).map(e=>e.toLowerCase().trim());

/* MSAL v3 vereist dat initialize() wordt aangeroepen en afgewacht vóórdat andere MSAL-API's gebruikt
   mogen worden. getMsalInstance() geeft daarom altijd een Promise terug (nooit direct de instantie),
   en cachet die Promise zodat meerdere gelijktijdige aanroepen niet twee keer initialiseren. */
function getMsalInstance(){
  if(msalInitPromise) return msalInitPromise;
  if(!SYNC.clientId) return Promise.resolve(null);
  if(typeof msal === 'undefined'){
    SYNC.lastError = 'Kon de Microsoft-inlogbibliotheek niet laden (geen internetverbinding?).';
    persistSync();
    return Promise.resolve(null);
  }
  // Belangrijk: PublicClientApplication valideert de configuratie synchroon en kan direct
  // een exception gooien (niet alleen een afgewezen Promise) bij een ongeldig App ID/Tenant ID.
  // Zonder deze try/catch zou dat de hele pagina blanco laten (render() zou nooit meer draaien).
  try{
    msalInstance = new msal.PublicClientApplication({
      auth:{
        clientId: SYNC.clientId,
        authority: 'https://login.microsoftonline.com/' + (SYNC.tenantId || 'organizations'),
        redirectUri: window.location.origin + window.location.pathname
      },
      cache:{ cacheLocation:'localStorage' }
    });
    msalInitPromise = msalInstance.initialize()
      .then(()=> {
        // handleRedirectPromise bestaat niet in alle MSAL-versies; defensief oproepen.
        if(typeof msalInstance.handleRedirectPromise === 'function'){
          return msalInstance.handleRedirectPromise().catch(()=>null);
        }
        return null;
      })
      .then(()=> {
        // Sommige eerdere afgebroken interacties laten een 'interaction.status'-vlag in localStorage
        // staan die MSAL later fout interpreteert als "er loopt nog een popup"; die ruimen we hier
        // opdat de eerstvolgende loginPopup() weer normaal opengaat.
        try{ localStorage.removeItem('msal.interaction.status'); }catch(_e){}
        return msalInstance;
      })
      .catch(e=>{
        msalInitPromise = null;
        SYNC.lastError = e.message || 'Initialiseren van Microsoft-login mislukt';
        persistSync();
        return null;
      });
  }catch(e){
    msalInstance = null; msalInitPromise = null;
    SYNC.lastError = 'Microsoft-login kon niet worden opgezet: ' + (e.message || e);
    persistSync();
    return Promise.resolve(null);
  }
  return msalInitPromise;
}
let _signInBezig = false;
async function signIn(){
  // Voorkomt dubbelklikken: als er al een popup open staat, negeer verdere klikken tot die klaar is.
  // Dat is óók een oorzaak van "Interaction is currently in progress" — MSAL tolereert geen
  // parallelle loginPopup()-aanroepen.
  if(_signInBezig){ toast('Er staat al een Microsoft-inlogvenster open. Rond die eerst af.'); return false; }
  const app = await getMsalInstance();
  if(!app){ toast('Vul eerst een geldig App ID in.'); return false; }
  _signInBezig = true;
  try{
    const res = await app.loginPopup({ scopes: GRAPH_SCOPES });
    SYNC.account = { username: res.account.username, name: res.account.name };
    SYNC.lastError = null;
    persistSync();
    toast('Ingelogd als ' + res.account.username);
    return true;
  }catch(e){
    const msg = e.errorMessage || e.message || 'Inloggen mislukt';
    // Specifieke fout waarbij MSAL denkt dat er nog een interactie loopt: ruim de state op zodat
    // een tweede klik direct wél lukt (i.p.v. dat de gebruiker de pagina moet verversen).
    if(/interaction[_ ]is[_ ]currently[_ ]in[_ ]progress|interaction[_ ]in[_ ]progress/i.test(msg)){
      try{ localStorage.removeItem('msal.interaction.status'); }catch(_e){}
      Object.keys(localStorage).forEach(k=>{ if(/^msal\..*interaction/i.test(k)){ try{localStorage.removeItem(k);}catch(_e){} } });
      SYNC.lastError = null;
      persistSync();
      toast('Vorige inlogpoging bleef hangen — opgeruimd. Klik nu nogmaals op "Inloggen".');
      return false;
    }
    SYNC.lastError = msg;
    persistSync();
    toast('Inloggen mislukt: ' + SYNC.lastError);
    return false;
  } finally {
    _signInBezig = false;
  }
}
function signOutOfMsal(){
  if(msalInstance){
    const accounts = msalInstance.getAllAccounts();
    if(accounts[0]) msalInstance.logoutPopup({ account: accounts[0] }).catch(()=>{});
  }
  SYNC.account = null; SYNC.siteId = null; SYNC.listId = null;
  persistSync();
}
async function getGraphToken(allowInteractive){
  const app = await getMsalInstance();
  if(!app) throw new Error('Geen App ID geconfigureerd');
  const accounts = app.getAllAccounts();
  if(!accounts.length) throw new Error('Niet ingelogd — klik eerst op "Inloggen met Microsoft".');
  // MSAL kan in edge-cases (third-party cookies uit, verlopen refresh-token, verwijderd account
  // in Azure AD) een resultaat teruggeven waarin accessToken leeg is. Als we dat blind aan Graph
  // sturen, krijg je 400 "InvalidAuthenticationToken: Access token is empty." Vandaar de expliciete
  // check + doorgaan naar de interactieve popup als dat mag.
  const hasToken = (r)=> r && typeof r.accessToken === 'string' && r.accessToken.length > 0;
  try{
    const res = await app.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: accounts[0] });
    if(hasToken(res)) return res.accessToken;
    // Silent lukte "technisch" maar leverde niks bruikbaars — behandel als interactieve-heraanvraag.
    if(!allowInteractive) throw new Error('Access token leeg — opnieuw inloggen vereist.');
  }catch(e){
    // Automatische achtergrond-sync mag NOOIT ongevraagd een Microsoft-inlog-pop-up openen:
    // browsers blokkeren pop-ups die niet uit een klik van de gebruiker voortkomen, dus die
    // poging mislukt toch alleen maar stilletjes — en gaf hier bovendien de verwarrende
    // "Sync mislukt"-status na elke verversing.
    if(!allowInteractive) throw e;
  }
  const res = await app.acquireTokenPopup({ scopes: GRAPH_SCOPES });
  if(!hasToken(res)) throw new Error('Microsoft-inlog gaf geen bruikbaar access token terug.');
  return res.accessToken;
}
async function graphFetch(url, opts={}, allowInteractive){
  const token = await getGraphToken(allowInteractive);
  const res = await fetch(url, Object.assign({}, opts, {
    headers: Object.assign({ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, opts.headers||{})
  }));
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    // Diagnose-hulp voor de meest voorkomende oorzaken van een 400 op een PATCH naar het item:
    // (a) payload > SharePoint kolom-limiet (standaard 63999 tekens voor "Multiple lines of text");
    // (b) item 1 bestaat niet meer (bijv. handmatig verwijderd of een nieuwe lijst zonder de dummy-rij).
    let extra = '';
    if(res.status === 400 && opts && opts.method === 'PATCH'){
      const bodyLen = (opts.body||'').length;
      if(bodyLen > 60000){
        extra = ' — TIP: de datahoeveelheid (' + Math.round(bodyLen/1024) + ' kB) is groter dan het standaard SharePoint-kolomlimiet (~63 kB). Zet in SharePoint bij de "Data"-kolom de instelling "Aantal regels voor bewerking" hoger of gebruik het "Unlimited length"-vinkje bij "Multiple lines of text".';
      } else if(/itemNotFound|does not exist|not found/i.test(text)){
        extra = ' — TIP: item 1 bestaat niet meer in de SharePoint-lijst. Voeg een nieuw item (mag leeg zijn) toe met Id 1.';
      }
    }
    throw new Error('Graph-fout '+res.status+': '+text.slice(0,250)+extra);
  }
  // 204 (bijv. PATCH) en 202 (bijv. /me/sendMail — "Accepted", zonder body) geven allebei geen
  // JSON-body terug; res.json() zou daar in beide gevallen op stuklopen.
  if(res.status === 204 || res.status === 202) return null;
  return res.json();
}
/* Verstuurt een e-mail namens de ingelogde gebruiker via Microsoft Graph (POST /me/sendMail), met
   'saveToSentItems' aan zodat hij ook in de Verzonden Items van de afzender terechtkomt. Gebruikt
   dezelfde login/token-flow (en dus dezelfde 'Mail.Send'-scope) als de SharePoint-sync hierboven.
   allowInteractive=true, want dit wordt altijd rechtstreeks door een klik van de gebruiker aangeroepen
   (nooit door de automatische achtergrond-sync) — een interactieve Microsoft-popup mag dus wél. */
async function sendGraphMail(to, subject, bodyHtml, attachments){
  const payload = {
    message: {
      subject,
      body: { contentType:'HTML', content: bodyHtml },
      toRecipients: [{ emailAddress: { address: to } }],
      attachments: (attachments||[]).map(a=>({
        '@odata.type': '#microsoft.graph.fileAttachment',
        name: a.name,
        contentType: a.contentType,
        contentBytes: a.base64
      }))
    },
    saveToSentItems: true
  };
  await graphFetch('https://graph.microsoft.com/v1.0/me/sendMail', { method:'POST', body: JSON.stringify(payload) }, true);
}
async function resolveSiteAndList(allowInteractive){
  if(SYNC.siteId && SYNC.listId) return;
  if(!SYNC.siteUrl) throw new Error('Vul eerst het SharePoint site-adres in bij Instellingen.');
  const u = new URL(SYNC.siteUrl);
  const siteRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${u.hostname}:${u.pathname}`, {}, allowInteractive);
  SYNC.siteId = siteRes.id;
  const filter = encodeURIComponent(`displayName eq '${SYNC.listName}'`);
  const listsRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists?$filter=${filter}`, {}, allowInteractive);
  if(!listsRes.value || !listsRes.value.length) throw new Error(`Lijst '${SYNC.listName}' niet gevonden op deze site.`);
  SYNC.listId = listsRes.value[0].id;
  persistSync();
}
/* ============================= SYNC-COMPRESSIE =============================
   SharePoint's "Multiple lines of text"-kolom heeft een limiet (~63 KB standaard, tot ~256 KB met
   "Unlimited length" aangevinkt). Bij grote datasets (veel klanten, logs, KPI-historie) knalt de
   ongecomprimeerde JSON daar snel overheen — 2 à 3 MB is niet uitzonderlijk.
   Oplossing: gzip de JSON vóór verzending (typisch 5-10× kleiner) en base64-encodeer het resultaat
   zodat het als tekst in het SharePoint-veld past. Bij het lezen detecteren we automatisch aan de
   prefix ("GZIP:") of de content gecomprimeerd is; anders parsen we als plain JSON — zo blijft de
   sync backward-compatible met bestaande SharePoint-data die nog niet gecomprimeerd is. */
const GZIP_PREFIX = 'GZIP:';
async function gzipEncodeTekst(str){
  if(typeof CompressionStream === 'undefined') return null; // oudere browsers → val terug op plain
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  const bytes = new Uint8Array(buf);
  let bin = '';
  // Chunked toString voor grote arrays; anders overschrijden we de call-stack met apply().
  for(let i=0; i<bytes.length; i+=8192){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
  }
  return GZIP_PREFIX + btoa(bin);
}
async function gzipDecodeTekst(str){
  if(typeof DecompressionStream === 'undefined') throw new Error('DecompressionStream niet ondersteund in deze browser.');
  const b64 = str.slice(GZIP_PREFIX.length);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

let pushTimer = null;
function pushRemoteDebounced(){
  if(!SYNC.enabled || !SYNC.account) return;
  // Markeer meteen dat er lokale wijzigingen zijn die nog niet gepusht zijn. Cruciaal want zonder
  // dit vlagje kon een periodieke fetchRemoteAndMerge (elke 45s) tussentijds de zojuist gemaakte
  // wijziging overschrijven met de OUDE remote versie — precies het bug-scenario met de klant-
  // website die na een refresh verdwenen leek.
  SYNC.pendingLocalChanges = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(allowInteractive){
  if(!SYNC.enabled || !SYNC.account) return false;
  try{
    await resolveSiteAndList(!!allowInteractive);
    const rawJson = JSON.stringify({ boekhouders: BOEKHOUDERS, klanten: RAW_KLANTEN, teams: TEAMS, store: STORE, rechten: RECHTEN, autos: AUTOS, bijtellingTabel: BIJTELLING_TABEL, activiteitenlog: ACTIVITEITENLOG, kpiOperationeel: KPI_OPERATIONEEL, kpiTactisch: KPI_TACTISCH, kpiCommercieel: KPI_COMMERCIEEL, kennisbank: KENNISBANK, rdwHercheckCfg: RDW_HERCHECK_CFG, inventarisItems: INVENTARIS_ITEMS, lhMaandBanners: LH_MAAND_BANNERS, leerpad: LEERPAD, leerpadVoortgang: LEERPAD_VOORTGANG, notionCfg: NOTION_CFG });
    // Gzip + base64. Als de browser CompressionStream niet ondersteunt val je terug op plain JSON
    // (met alle risico op de SharePoint-limiet); dat gebeurt alleen in echt oude browsers.
    let dataStr = await gzipEncodeTekst(rawJson);
    if(!dataStr) dataStr = rawJson;
    await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists/${SYNC.listId}/items/1/fields`, {
      method:'PATCH', body: JSON.stringify({ Data: dataStr })
    }, !!allowInteractive);
    // Bewaar grootten om in de Instellingen-status te tonen hoe vol SharePoint zit.
    SYNC.lastPayloadRawBytes = rawJson.length;
    SYNC.lastPayloadGzBytes = dataStr.length;
    SYNC.lastPayloadCompressed = (dataStr !== rawJson);
    SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null;
    SYNC.pendingLocalChanges = false; // succesvol gepusht → niets meer pending
    // Onthoud direct de string die we net hebben verzonden (gecomprimeerd of niet) zodat een fetch
    // die exact deze data terugkrijgt niet nutteloos opnieuw parse+migrate+render triggert.
    try{ laatstVerwerkteSyncData = dataStr; }catch(_e){}
    console.log(`[sync push] ${SYNC.lastPayloadCompressed?'gzip':'plain'} — ${(SYNC.lastPayloadGzBytes/1024).toFixed(1)} KB verzonden` + (SYNC.lastPayloadCompressed ? ` (was ${(SYNC.lastPayloadRawBytes/1024).toFixed(1)} KB ongecomprimeerd)` : ''));
    updateSyncIndicator();
    persistSync();
    return true;
  }catch(e){
    SYNC.lastError = e.message || 'Onbekende fout';
    // Pending blijft true — bij de volgende gelegenheid proberen we opnieuw.
    updateSyncIndicator();
    persistSync();
    return false;
  }
}
// Voorkomt dat een volgende periodieke sync-poging start terwijl een vorige (bijv. door een trage
// verbinding of een inmiddels groot databestand) nog bezig is — anders kunnen twee cycli van
// parse+migrate+render over elkaar heen gaan lopen en de pagina blokkeren.
let syncInFlight = false;
// Onthoudt de laatst verwerkte ruwe JSON-tekst uit SharePoint. Als er niets is veranderd sinds de
// vorige sync, slaan we het hele parse/migrate/persist/render-traject over — dat is verreweg het
// vaakst het geval, en juist dat zware werk (bij honderden klanten met logboeken/aantekeningen)
// was de meest waarschijnlijke oorzaak van "pagina reageert niet".
let laatstVerwerkteSyncData = null;
async function fetchRemoteAndMerge(showFeedback){
  if(!SYNC.enabled || !SYNC.account) return;
  if(syncInFlight) return;
  syncInFlight = true;
  // Als er lokale wijzigingen open staan die nog niet succesvol naar SharePoint zijn geschreven,
  // moeten we die EERST pushen — anders overschrijft de fetch straks de lokale versie met de
  // oudere remote versie. Als push mislukt → we ZIEN AF van de fetch, zodat het lokale werk
  // in ieder geval nog in localStorage staat en bij een volgende gelegenheid opnieuw geprobeerd
  // kan worden. Dit was de bug bij het toevoegen van klant.website: push faalde stiletjes en
  // een paar seconden later kwam de periodieke fetch die het weer weghaalde.
  if(SYNC.pendingLocalChanges){
    // Als er nog een debounce loopt, forceer 'em nu meteen door de timer te wissen.
    if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; }
    const gelukt = await pushRemote(!!showFeedback);
    if(!gelukt){
      syncInFlight = false;
      if(showFeedback) toast('Lokale wijzigingen konden niet naar SharePoint worden gestuurd — fetch is overgeslagen om je werk niet te verliezen. Fout: ' + (SYNC.lastError||'onbekend'));
      return;
    }
  }
  try{
    await resolveSiteAndList(showFeedback);
    const itemRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists/${SYNC.listId}/items/1?expand=fields`, {}, showFeedback);
    let rawData = itemRes && itemRes.fields ? itemRes.fields.Data : null;
    // Backward-compat: detecteer of de content gecomprimeerd is en decomprimeer indien nodig.
    // De cache-vergelijking (laatstVerwerkteSyncData) blijft op de RUWE (gecomprimeerde) string
    // zodat we ook bij ongewijzigde SharePoint-content geen decompress-werk hoeven doen.
    if(typeof rawData === 'string' && rawData === laatstVerwerkteSyncData){
      // Ongewijzigd t.o.v. de vorige keer: alleen de sync-status bijwerken, verder niets doen.
      SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null;
      updateSyncIndicator();
      if(showFeedback) toast('Gesynchroniseerd met gedeelde data (geen wijzigingen).');
    } else {
      let json = rawData;
      if(typeof json === 'string'){
        try{
          if(json.indexOf(GZIP_PREFIX) === 0) json = await gzipDecodeTekst(json);
          json = JSON.parse(json);
        }catch(e){ json = null; }
      }
      if(json && json.klanten){
        BOEKHOUDERS = json.boekhouders && json.boekhouders.length ? json.boekhouders : BOEKHOUDERS; invalidateBhIndex();
        RAW_KLANTEN = json.klanten && json.klanten.length ? json.klanten : RAW_KLANTEN;
        TEAMS = json.teams && json.teams.length ? json.teams : TEAMS;
        STORE = json.store || STORE;
        RECHTEN = json.rechten ? Object.assign({}, RECHTEN, json.rechten) : RECHTEN;
        AUTOS = json.autos && json.autos.length ? json.autos : AUTOS;
        BIJTELLING_TABEL = json.bijtellingTabel && json.bijtellingTabel.length ? json.bijtellingTabel : BIJTELLING_TABEL;
        ACTIVITEITENLOG = json.activiteitenlog && json.activiteitenlog.length ? json.activiteitenlog : ACTIVITEITENLOG;
        KPI_OPERATIONEEL = json.kpiOperationeel || KPI_OPERATIONEEL;
        KPI_TACTISCH = json.kpiTactisch || KPI_TACTISCH;
        KPI_COMMERCIEEL = json.kpiCommercieel || KPI_COMMERCIEEL;
        KENNISBANK = json.kennisbank ? Object.assign({categorieen:[], artikelen:[]}, json.kennisbank) : KENNISBANK;
        RDW_HERCHECK_CFG = json.rdwHercheckCfg ? Object.assign({herhaling:'uit', laatsteAutoCheck:null}, json.rdwHercheckCfg) : RDW_HERCHECK_CFG;
        INVENTARIS_ITEMS = json.inventarisItems && json.inventarisItems.length ? json.inventarisItems : INVENTARIS_ITEMS;
        LH_MAAND_BANNERS = json.lhMaandBanners && json.lhMaandBanners.length ? json.lhMaandBanners : LH_MAAND_BANNERS;
        NOTION_CFG = json.notionCfg && typeof json.notionCfg==='object' ? Object.assign({workerUrl:''}, json.notionCfg) : NOTION_CFG;
        LEERPAD = json.leerpad || LEERPAD;
        LEERPAD_VOORTGANG = json.leerpadVoortgang || LEERPAD_VOORTGANG;
        migrateData();
        try{ localStorage.setItem(META_KEY, JSON.stringify({boekhouders:BOEKHOUDERS, klanten:RAW_KLANTEN, teams:TEAMS, rechten:RECHTEN, autos:AUTOS, bijtellingTabel:BIJTELLING_TABEL, activiteitenlog:ACTIVITEITENLOG, kpiOperationeel:KPI_OPERATIONEEL, kpiTactisch:KPI_TACTISCH, kpiCommercieel:KPI_COMMERCIEEL, kennisbank:KENNISBANK, rdwHercheckCfg:RDW_HERCHECK_CFG, inventarisItems:INVENTARIS_ITEMS, lhMaandBanners:LH_MAAND_BANNERS, leerpad:LEERPAD, leerpadVoortgang:LEERPAD_VOORTGANG, notionCfg:NOTION_CFG})); }catch(e){}
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }catch(e){}
        if(typeof rawData === 'string') laatstVerwerkteSyncData = rawData;
        SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null;
        if(!STATE.panelKlant && !STATE.showAddKlant && !STATE.showAddBh && !isTypingInField()) render(); else updateSyncIndicator();
        if(showFeedback) toast('Gesynchroniseerd met gedeelde data.');
      }
    }
  }catch(e){
    SYNC.lastError = e.message || 'Onbekende fout';
    if(showFeedback) toast('Synchroniseren mislukt: '+SYNC.lastError);
  }
  syncInFlight = false;
  persistSync();
}
function updateSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  if(!SYNC.enabled || !SYNC.account){ el.innerHTML = '<i class="ti ti-cloud-off" aria-hidden="true"></i> Niet gekoppeld'; el.style.color = 'var(--muted)'; return; }
  if(SYNC.lastError){ el.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i> Sync mislukt'; el.style.color = 'var(--red)'; return; }
  el.innerHTML = '<i class="ti ti-cloud" aria-hidden="true"></i> '+SYNC.account.username+(SYNC.lastSync ? ' · '+new Date(SYNC.lastSync).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '');
  el.style.color = 'var(--green)';
}

/* ============================= BESTANDEN INLEZEN (CSV/Excel, gedeeld door importers) ============================= */
function detectDelimiter(text){
  const firstLine = text.split(/\r?\n/)[0] || '';
  const semis = (firstLine.match(/;/g)||[]).length;
  const commas = (firstLine.match(/,/g)||[]).length;
  return semis > commas ? ';' : ',';
}
// Quote-bewuste parser: respecteert aanhalingstekens, ook als een veld daarbinnen een komma/puntkomma
// of een regeleinde bevat (komt vaak voor in banktransactie-exports).
function parseDelimitedText(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === delimiter){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field!=='' || row.length){ row.push(field); if(!(row.length===1 && row[0]==='')) rows.push(row); }
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (r[idx]||'').trim(); });
    return obj;
  });
}
function findField(obj, candidates){
  const keys = Object.keys(obj);
  for(const cand of candidates){
    const key = keys.find(k=>k.toLowerCase().trim() === cand.toLowerCase());
    if(key) return obj[key];
  }
  return '';
}
function parseDutchAmount(str){
  const cleaned = String(str==null?'0':str).trim().replace(/\./g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
// Leest een File (csv/xlsx/xls) in en geeft via callback(objects, error) een array van rij-objecten terug
// (elke rij als {kolomnaam: waarde}, op basis van de header-rij).
function readTabularFile(file, callback){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext === 'csv' || ext === 'txt'){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const text = ev.target.result;
      const delim = detectDelimiter(text);
      const rows = parseDelimitedText(text, delim);
      callback(rowsToObjects(rows), null);
    };
    reader.onerror = ()=> callback(null, 'Bestand kon niet gelezen worden.');
    reader.readAsText(file);
  } else if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined'){ callback(null, 'Kon de Excel-bibliotheek niet laden (geen internetverbinding?).'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const objects = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
        callback(objects, null);
      }catch(err){ callback(null, 'Kon het Excel-bestand niet lezen: '+(err.message||err)); }
    };
    reader.onerror = ()=> callback(null, 'Bestand kon niet gelezen worden.');
    reader.readAsArrayBuffer(file);
  } else {
    callback(null, 'Onbekend bestandstype. Gebruik .csv, .xlsx of .xls.');
  }
}

/* ============================= HELPERS ============================= */
function fmtEUR(n){ return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n||0); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(str){ if(!str) return '—'; const dt=new Date(str+'T00:00:00'); if(isNaN(dt.getTime())) return '—'; return dt.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'}); }
function datumNaarInvoer(iso){
  // Zet interne ISO-datum (JJJJ-MM-DD) om naar het invoerformaat DD-MM-JJJJ voor formuliervelden.
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
  const [j,m,d] = iso.split('-');
  return `${d}-${m}-${j}`;
}
function invoerNaarDatum(str){
  // Zet een DD-MM-JJJJ invoer om naar de interne ISO-datum (JJJJ-MM-DD). Geeft '' terug bij een ongeldige invoer.
  str = (str||'').trim();
  const m = str.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(!m) return '';
  const dag = +m[1], maand = +m[2];
  if(maand<1 || maand>12 || dag<1 || dag>31) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function daysDiff(str){ const dt=new Date(str+'T00:00:00'); return Math.round((dt-TODAY)/86400000); }

function statusOf(entry){
  if(!entry || entry.na) return {key:'na'};
  if(entry.status==='ingediend') return {key:'ingediend'};
  const dd = daysDiff(entry.datum);
  if(dd<=7) return {key:'actie', dagen:dd};
  if(dd<=14) return {key:'nadert', dagen:dd};
  return {key:'schema', dagen:dd};
}
const STATUS_META = {
  actie:{label:'Actie vereist', cls:'red'},
  nadert:{label:'Deadline nadert', cls:'amber'},
  schema:{label:'Op schema', cls:'green'},
  ingediend:{label:'Ingediend', cls:'blue'},
  na:{label:'N.v.t.', cls:'gray'},
};
function badge(entry, opts){
  const st = statusOf(entry); const meta = STATUS_META[st.key];
  let extra = '';
  if(opts && opts.days && st.dagen!==undefined){
    extra = st.dagen<0 ? ` · ${Math.abs(st.dagen)}d te laat` : ` · nog ${st.dagen}d`;
  }
  return `<span class="badge ${meta.cls}"><span class="dot ${meta.cls}"></span>${meta.label}${extra}</span>`;
}
function worstStatus(klant){
  const order = {actie:0, nadert:1, ingediend:2, schema:3, na:4};
  let worst = 'na';
  ['OB','VPB','LH','JR'].forEach(t=>{
    const s = statusOf(effDL(klant,t)).key;
    if(order[s] < order[worst]) worst = s;
  });
  (STORE[klant.id].dl.overige||[]).forEach(o=>{
    const s = statusOf(o).key;
    if(order[s] < order[worst]) worst = s;
  });
  if(worst==='na') worst='schema';

}

// Geen automatische verzending — dit signaleert alleen (voor de boekhouder om zelf een
// herinnering te sturen) wanneer een deadline nadert/verstreken is én er nog openstaande
// banktransacties zijn die nog verwerkt moeten worden.
function heeftUrgenteHerinneringNodig(klant){
  const f = STORE[klant.id];
  if(!f || !((f.txn||0) > 0)) return false;
  const types = ['OB','VPB','LH','JR'];
  const dringend = (entry)=>{ const s = statusOf(entry).key; return s==='actie' || s==='nadert'; };
  if(types.some(t=>{ const e = f.dl[t]; return e && !e.na && dringend(e); })) return true;
  if((f.dl.overige||[]).some(o=>dringend(o))) return true;
  return false;
}
