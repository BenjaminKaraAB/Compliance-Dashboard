<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliance Dashboard — Administratiebox</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --navy:#0b1220; --navy2:#141f38; --navy3:#1c2a4a;
    --bg:#f2f4f8; --card:#ffffff; --border:#e4e8f0;
    --text:#16213a; --muted:#65708a; --muted2:#94a0bb;
    --primary:#2f5dfc; --primary-dark:#1e46e0; --primary-bg:#e9eefe;
    --red:#dc2626; --red-bg:#fdeaea; --red-brd:#f6c9c9;
    --amber:#c9770a; --amber-bg:#fdf1de; --amber-brd:#f3d9a8;
    --green:#15884f; --green-bg:#e5f6ee; --green-brd:#bfe6d2;
    --blue:#0e7fa3; --blue-bg:#e5f5fa; --blue-brd:#bfe4ee;
    --gray-bg:#eef0f4; --gray-brd:#dde1ea;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,50,.04), 0 4px 16px rgba(16,24,50,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:250px; flex:0 0 250px; background:linear-gradient(180deg,var(--navy),var(--navy2) 60%, var(--navy3));
    color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-name{font-size:16px; font-weight:700; letter-spacing:.2px;}
  .brand-sub{font-size:11.5px; color:#93a0c4; margin-top:3px; letter-spacing:.3px; text-transform:uppercase;}
  .nav{flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    color:#c4cde6; font-size:13.5px; font-weight:500; cursor:pointer; border:none; background:none; text-align:left; width:100%;
  }
  .nav-item svg{flex:0 0 17px; width:17px; height:17px; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--primary); color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-foot{padding:14px 20px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:#7c88ab;}
  .nav-foot b{color:#c4cde6;}

  /* MAIN */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--border); padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  }
  .page-title{font-size:18px; font-weight:700;}
  .page-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .search-wrap{position:relative; width:280px;}
  .search-wrap input{
    width:100%; padding:9px 12px 9px 32px; border:1px solid var(--border); border-radius:9px; font-size:13px;
    background:var(--bg); outline:none;
  }
  .search-wrap input:focus{border-color:var(--primary); background:#fff;}
  .search-wrap svg{position:absolute; left:10px; top:9px; width:15px; height:15px; color:var(--muted2);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .today-pill{font-size:12px; color:var(--muted); background:var(--bg); border:1px solid var(--border); padding:7px 12px; border-radius:20px;}

  .content{padding:24px 28px 60px; flex:1;}

  /* KPI cards */
  .kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px;}
  .kpi-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .kpi-label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
  .kpi-value{font-size:26px; font-weight:800; margin-top:6px; letter-spacing:-.3px;}
  .kpi-sub{font-size:11.5px; margin-top:4px; font-weight:600;}
  .kpi-card.red .kpi-value{color:var(--red);} .kpi-card.amber .kpi-value{color:var(--amber);}
  .kpi-card.green .kpi-value{color:var(--green);} .kpi-card.blue .kpi-value{color:var(--primary);}

  .section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
  .section-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
  .section-head h3{margin:0; font-size:14.5px; font-weight:700;}
  .section-head .hint{font-size:12px; color:var(--muted);}
  .section-body{padding:6px 0;}
  .section-body.pad{padding:18px 20px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
    padding:10px 20px; border-bottom:1px solid var(--border); font-weight:700; white-space:nowrap;
  }
  tbody td{padding:11px 20px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.row-click{cursor:pointer;}
  tbody tr.row-click:hover{background:#f7f9fd;}
  .klant-name{font-weight:700; color:var(--text);}
  .klant-meta{font-size:11.5px; color:var(--muted); margin-top:1px;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:20px; font-size:11.5px; font-weight:700;
    border:1px solid transparent; white-space:nowrap;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .badge.red{background:var(--red-bg); color:var(--red); border-color:var(--red-brd);}
  .badge.amber{background:var(--amber-bg); color:var(--amber); border-color:var(--amber-brd);}
  .badge.green{background:var(--green-bg); color:var(--green); border-color:var(--green-brd);}
  .badge.blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-brd);}
  .badge.gray{background:var(--gray-bg); color:var(--muted); border-color:var(--gray-brd);}
  .badge .dot.red{background:var(--red);} .badge .dot.amber{background:var(--amber);}
  .badge .dot.green{background:var(--green);} .badge .dot.blue{background:var(--blue);} .badge .dot.gray{background:var(--muted2);}

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer;
  }
  .btn:hover{background:var(--bg);}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:var(--bg);}
  .btn.sm{padding:6px 10px; font-size:11.5px;}
  .btn.danger{color:var(--red); border-color:var(--red-brd); background:var(--red-bg);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .filters{display:flex; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center;}
  select, .txt-input{
    padding:8px 11px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; background:#fff; color:var(--text); outline:none;
  }
  select:focus, .txt-input:focus{border-color:var(--primary);}

  /* boekhouder cards */
  .bh-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .bh-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; cursor:pointer; transition:transform .1s;}
  .bh-card:hover{border-color:var(--primary);}
  .bh-top{display:flex; align-items:center; gap:12px;}
  .avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; flex:none;}
  .bh-name{font-weight:700; font-size:14.5px;}
  .bh-role{font-size:11.5px; color:var(--muted);}
  .bh-stats{display:flex; gap:8px; margin-top:16px;}
  .bh-stat{flex:1; text-align:center; background:var(--bg); border-radius:8px; padding:8px 4px;}
  .bh-stat b{display:block; font-size:16px;}
  .bh-stat span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .bh-foot{margin-top:14px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted);}

  /* status dist bars */
  .distbar{display:flex; align-items:center; gap:10px; padding:9px 20px;}
  .distbar .label{width:150px; font-size:12.5px; font-weight:600; flex:none;}
  .distbar .track{flex:1; height:9px; border-radius:6px; background:var(--gray-bg); overflow:hidden; display:flex;}
  .distbar .seg{height:100%;}
  .distbar .nums{width:150px; text-align:right; font-size:11.5px; color:var(--muted); flex:none;}

  /* Slide over */
  .overlay{position:fixed; inset:0; background:rgba(11,18,32,.45); opacity:0; pointer-events:none; transition:opacity .18s; z-index:40;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .panel{
    position:fixed; top:0; right:0; height:100vh; width:560px; max-width:92vw; background:var(--bg);
    transform:translateX(100%); transition:transform .22s ease; z-index:41; display:flex; flex-direction:column;
    box-shadow:-8px 0 30px rgba(0,0,0,.15);
  }
  .panel.open{transform:translateX(0);}
  .panel-head{background:var(--navy); color:#fff; padding:22px 24px; flex:none;}
  .panel-head-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .panel-close{background:rgba(255,255,255,.1); border:none; color:#fff; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px;}
  .panel-close:hover{background:rgba(255,255,255,.2);}
  .panel-klant-name{font-size:19px; font-weight:800; margin-top:2px;}
  .panel-klant-meta{font-size:12px; color:#a9b4d4; margin-top:5px; display:flex; gap:14px; flex-wrap:wrap;}
  .panel-body{flex:1; overflow-y:auto; padding:20px 24px 80px;}
  .panel-section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;}
  .panel-section h4{margin:0; padding:13px 16px; border-bottom:1px solid var(--border); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;}
  .panel-section .inner{padding:14px 16px;}

  .deadline-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px;}
  .dl-card{border:1px solid var(--border); border-radius:9px; padding:11px 12px;}
  .dl-card .dl-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .dl-card .dl-name{font-weight:700; font-size:12.5px;}
  .dl-card .dl-date{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .dl-card .dl-days{font-size:11px; margin-top:4px; font-weight:600;}
  .dl-card .dl-actions{margin-top:8px; display:flex; gap:6px;}
  .dl-na{color:var(--muted2); font-size:12px; padding:14px 16px;}

  .overige-row{display:flex; align-items:center; justify-content:space-between; padding:9px 16px; border-top:1px solid var(--border);}
  .overige-row:first-child{border-top:none;}
  .overige-left b{font-size:12.5px;} .overige-left div{font-size:11.5px; color:var(--muted); margin-top:1px;}

  .field-row{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
  .field-row label{width:150px; font-size:12.5px; color:var(--muted); flex:none;}
  .field-row input[type=text], .field-row input[type=number]{
    flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;
  }
  .checklist-item{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--border); font-size:12.5px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item.done label{text-decoration:line-through; color:var(--muted2);}
  .checklist-item input[type=checkbox]{width:15px; height:15px;}
  .add-item-row{display:flex; gap:6px; margin-top:8px;}
  .add-item-row input{flex:1; padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;}

  .chan-row{display:flex; gap:14px; margin-bottom:10px; font-size:12.5px;}
  .chan-row label{display:flex; align-items:center; gap:6px;}
  .rem-actions{display:flex; gap:8px; margin-top:6px;}
  .rem-log{margin-top:10px; border-top:1px solid var(--border); padding-top:10px;}
  .rem-log-item{font-size:11.5px; color:var(--muted); padding:4px 0; display:flex; gap:8px;}
  .rem-log-empty{font-size:12px; color:var(--muted2); font-style:italic;}

  .banner{background:var(--primary-bg); border:1px solid #cddbff; color:var(--primary-dark); border-radius:9px; padding:10px 13px; font-size:11.5px; margin-bottom:14px; line-height:1.5;}
  textarea{width:100%; min-height:70px; border:1px solid var(--border); border-radius:8px; padding:9px; font-size:12.5px; font-family:inherit; resize:vertical;}

  .toast-wrap{position:fixed; bottom:22px; right:22px; z-index:60; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--navy); color:#fff; padding:12px 16px; border-radius:9px; font-size:12.5px; box-shadow:var(--shadow); max-width:320px; animation:slidein .18s ease;}
  @keyframes slidein{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  .empty-state{padding:40px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .saldo-edit{display:inline-flex; align-items:center; gap:6px;}
  .saldo-edit input{width:100px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12.5px;}

  @media (max-width:1100px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} .bh-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>


/* ============================= DATA ============================= */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

/* Geen voorbeeld-/demodata: dit bestand wordt publiek gehost (GitHub Pages), dus er staan bewust geen
   klant- of boekhoudernamen in de broncode — ook geen fictieve. Voeg klanten/boekhouders toe via de
   knoppen in het dashboard, of koppel de Microsoft-sync (zie Instellingen) om echte data op te halen. */
let BOEKHOUDERS = [];
let TEAMS = [];
/* Rechten (wie is beheerder, wie mag Loonheffingen bewerken) horen bij de GEDEELDE data — niet bij de
   lokale SYNC-instellingen — zodat een wijziging door de beheerder ook echt bij collega's doorkomt zodra
   zij synchroniseren. Voorheen stonden deze velden per ongeluk alleen lokaal in de browser. */
let RECHTEN = { adminEmails:['benjamin@administratiebox.nl'], lhBevoegdeBhIds:[] };
/* Auto's (Autolijst) horen, net als klanten/boekhouders, bij de GEDEELDE data. */
let AUTOS = [];
/* Activiteitenlogboek: een gedeeld, alleen-lezen-voor-niet-beheerders overzicht van wie wat heeft
   gedaan (klanten/boekhouders/teams/auto's toevoegen of verwijderen, imports, wijzigingen aan de
   bijtellingstabel of aan de rechten). Alleen zichtbaar bij Instellingen voor beheerders. Wordt begrensd
   op de laatste 500 gebeurtenissen om de opslag niet onbeperkt te laten groeien. */
let ACTIVITEITENLOG = [];
/* KPI-overzicht op de Overzicht-pagina (onder "Urgente acties"). Alle drie de blokken worden
   handmatig ingevuld door beheerders — er wordt niets automatisch berekend uit klant-/dossierdata.
   - KPI_OPERATIONEEL: per team één rij (inbox, bankmutaties, jaarrekeningen, klanten, BTW Q1-Q4).
   - KPI_TACTISCH: per kwartaal een doel + een platte lijst pijlers (elke pijler hoort bij één team).
   - KPI_COMMERCIEEL: één gezamenlijk weeknummer + per team kennismakingsgesprekken/conversieratio/
     nieuwe klanten (steeds "deze week" en "totaal"). */
let KPI_OPERATIONEEL = {};
let KPI_TACTISCH = {
  Q1: { doel:'', pijlers:[] },
  Q2: { doel:'', pijlers:[] },
  Q3: { doel:'', pijlers:[] },
  Q4: { doel:'', pijlers:[] },
};
let KPI_COMMERCIEEL = { week:null, teams:{} };
/* Bijtellingspercentages per jaar — overneemt exact de tabel uit "Bijtelling" in het Excel-bestand.
   laag/cap = alleen relevant voor elektrische auto's (verlaagd tarief tot de cap, algemeen tarief
   daarboven); voor 2017/2018 was er nog geen verlaagd tarief (laag/cap = null). Beheerders kunnen hier
   later gewoon een nieuw jaar aan toevoegen zodra de Belastingdienst nieuwe percentages publiceert —
   geen codewijziging nodig. Auto's van vóór 2017 gebruiken altijd 25% (net als in het Excel-bestand). */
let BIJTELLING_TABEL = [
  {jaar:2017, laag:null, cap:null, algemeen:0.22},
  {jaar:2018, laag:null, cap:null, algemeen:0.22},
  {jaar:2019, laag:0.04, cap:50000, algemeen:0.22},
  {jaar:2020, laag:0.08, cap:45000, algemeen:0.22},
  {jaar:2021, laag:0.12, cap:40000, algemeen:0.22},
  {jaar:2022, laag:0.16, cap:35000, algemeen:0.22},
  {jaar:2023, laag:0.16, cap:30000, algemeen:0.22},
  {jaar:2024, laag:0.16, cap:30000, algemeen:0.22},
  {jaar:2025, laag:0.17, cap:30000, algemeen:0.22},
  {jaar:2026, laag:0.18, cap:30000, algemeen:0.22},
];

function d(offsetDays){ const dt=new Date(TODAY); dt.setDate(dt.getDate()+offsetDays); return dt.toISOString().slice(0,10); }
function DL(datum, status=null){ return {datum, status}; }
function NA(){ return {na:true}; }

let RAW_KLANTEN = [];

/* Nieuw toegevoegde klanten/boekhouders (lokaal, per browser) worden hier bovenop de voorbeelddata geladen. */
const META_KEY = 'compliance_dashboard_meta_v1';
function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.boekhouders && parsed.boekhouders.length) BOEKHOUDERS = parsed.boekhouders;
      if(parsed.klanten && parsed.klanten.length) RAW_KLANTEN = parsed.klanten;
      if(parsed.teams && parsed.teams.length) TEAMS = parsed.teams;
      if(parsed.rechten) RECHTEN = Object.assign({}, RECHTEN, parsed.rechten);
      if(parsed.autos && parsed.autos.length) AUTOS = parsed.autos;
      if(parsed.bijtellingTabel && parsed.bijtellingTabel.length) BIJTELLING_TABEL = parsed.bijtellingTabel;
      if(parsed.activiteitenlog && parsed.activiteitenlog.length) ACTIVITEITENLOG = parsed.activiteitenlog;
      if(parsed.kpiOperationeel) KPI_OPERATIONEEL = parsed.kpiOperationeel;
      if(parsed.kpiTactisch) KPI_TACTISCH = parsed.kpiTactisch;
      if(parsed.kpiCommercieel) KPI_COMMERCIEEL = parsed.kpiCommercieel;
    }
  }catch(e){}
}
let persistMetaTimer = null;
function flushPersistMeta(){
  clearTimeout(persistMetaTimer); persistMetaTimer = null;
  try{ localStorage.setItem(META_KEY, JSON.stringify({boekhouders:BOEKHOUDERS, klanten:RAW_KLANTEN, teams:TEAMS, rechten:RECHTEN, autos:AUTOS, bijtellingTabel:BIJTELLING_TABEL, activiteitenlog:ACTIVITEITENLOG, kpiOperationeel:KPI_OPERATIONEEL, kpiTactisch:KPI_TACTISCH, kpiCommercieel:KPI_COMMERCIEEL})); }catch(e){}
}
function persistMeta(){
  clearTimeout(persistMetaTimer);
  persistMetaTimer = setTimeout(flushPersistMeta, 400);
  pushRemoteDebounced();
}
loadMeta();

function nextId(list, prefix){ let n=list.length+1; while(list.some(x=>x.id===prefix+n)) n++; return prefix+n; }
// Schrijft één regel weg in het gedeelde activiteitenlogboek (alleen zichtbaar voor beheerders bij
// Instellingen). huidigeGebruiker() staat verderop in het bestand maar is door hoisting al beschikbaar
// tegen de tijd dat deze functie daadwerkelijk wordt aangeroepen (bij een gebruikersactie).
function logActiviteit(actie){
  try{
    ACTIVITEITENLOG.unshift({
      id:'act'+Date.now()+Math.floor(Math.random()*10000),
      ts:new Date().toISOString(),
      door: (typeof huidigeGebruiker==='function') ? huidigeGebruiker() : 'Onbekende gebruiker',
      actie,
    });
    if(ACTIVITEITENLOG.length > 500) ACTIVITEITENLOG.length = 500;
  }catch(e){ console.error('Wegschrijven activiteitenlog mislukt:', e); }
}
function addKlant(data){
  const id = nextId(RAW_KLANTEN,'k');
  const dateOrNa = (v, herhaling)=> v ? Object.assign(DL(v), {herhaling:herhaling||'geen'}) : NA();
  const klant = {
    id, naam:data.naam, vorm:data.vorm, bh:data.bh, kvk:data.kvk||'',
    contact:data.contact||'', email:data.email||'', tel:data.tel||'',
    doetLoonaangifte: !!data.doetLoonaangifte,
    heeftDga: !!data.heeftDga,
    staatOpHold: !!data.staatOpHold,
    opHoldReden: data.opHoldReden || '',

/* ============================= CLOUD SYNC (Microsoft-login via Graph API) =============================
   Dit dashboard werkt standaard lokaal (per browser). Om data live te delen tussen collega's koppel je
   het rechtstreeks aan een SharePoint-lijst via je eigen Microsoft-account (MSAL-login) en de Microsoft
   Graph API — gratis, geen Power Automate nodig. Zie de handleidingen "Dashboard hosten op GitHub Pages"
   en "Azure AD app-registratie". Werkt alléén als het dashboard vanaf een echte https-URL wordt geopend
   (niet als lokaal dubbelgeklikt bestand) — dat is een vereiste van Microsoft's inlogscherm. */
const SYNC_KEY = 'compliance_dashboard_sync_v1';
let SYNC = {
  clientId:'', tenantId:'', siteUrl:'', listName:'ComplianceDashboardData',
  enabled:false, lastSync:null, lastError:null, account:null, siteId:null, listId:null
};
let msalInstance = null;
let msalInitPromise = null;
const GRAPH_SCOPES = ['Sites.ReadWrite.All'];

function loadSync(){
  try{ const raw = localStorage.getItem(SYNC_KEY); if(raw) SYNC = Object.assign(SYNC, JSON.parse(raw)); }catch(e){}
  if(SYNC.enabled && SYNC.clientId) getMsalInstance(); // warmt alvast op; consumenten wachten er zelf op
}
function saveSyncConfig(cfg){
  SYNC = Object.assign(SYNC, cfg);
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }catch(e){}
}
function persistSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }catch(e){} updateSyncIndicator(); }

function isAdmin(){

/* MSAL v3 vereist dat initialize() wordt aangeroepen en afgewacht vóórdat andere MSAL-API's gebruikt
   mogen worden. getMsalInstance() geeft daarom altijd een Promise terug (nooit direct de instantie),
   en cachet die Promise zodat meerdere gelijktijdige aanroepen niet twee keer initialiseren. */
function getMsalInstance(){
  if(msalInitPromise) return msalInitPromise;
  if(!SYNC.clientId) return Promise.resolve(null);
  if(typeof msal === 'undefined'){
    SYNC.lastError = 'Kon de Microsoft-inlogbibliotheek niet laden (geen internetverbinding?).';
    persistSync();
    return Promise.resolve(null);
  }
  // Belangrijk: PublicClientApplication valideert de configuratie synchroon en kan direct
  // een exception gooien (niet alleen een afgewezen Promise) bij een ongeldig App ID/Tenant ID.
  // Zonder deze try/catch zou dat de hele pagina blanco laten (render() zou nooit meer draaien).
  try{
    msalInstance = new msal.PublicClientApplication({
      auth:{
        clientId: SYNC.clientId,
        authority: 'https://login.microsoftonline.com/' + (SYNC.tenantId || 'organizations'),
        redirectUri: window.location.origin + window.location.pathname
      },
      cache:{ cacheLocation:'localStorage' }
    });
    msalInitPromise = msalInstance.initialize().then(()=>msalInstance).catch(e=>{
      msalInitPromise = null;
      SYNC.lastError = e.message || 'Initialiseren van Microsoft-login mislukt';
      persistSync();
      return null;
    });
  }catch(e){
    msalInstance = null; msalInitPromise = null;
    SYNC.lastError = 'Microsoft-login kon niet worden opgezet: ' + (e.message || e);
    persistSync();
    return Promise.resolve(null);
  }
  return msalInitPromise;
}
async function signIn(){
  const app = await getMsalInstance();
  if(!app){ toast('Vul eerst een geldig App ID in.'); return false; }
  try{
    const res = await app.loginPopup({ scopes: GRAPH_SCOPES });
    SYNC.account = { username: res.account.username, name: res.account.name };
    SYNC.lastError = null;
    persistSync();
    toast('Ingelogd als ' + res.account.username);
    return true;
  }catch(e){
    SYNC.lastError = e.errorMessage || e.message || 'Inloggen mislukt';
    persistSync();
    toast('Inloggen mislukt: ' + SYNC.lastError);
    return false;
  }
}
function signOutOfMsal(){
  if(msalInstance){
    const accounts = msalInstance.getAllAccounts();
    if(accounts[0]) msalInstance.logoutPopup({ account: accounts[0] }).catch(()=>{});
  }
  SYNC.account = null; SYNC.siteId = null; SYNC.listId = null;
  persistSync();
}
async function getGraphToken(allowInteractive){
  const app = await getMsalInstance();
  if(!app) throw new Error('Geen App ID geconfigureerd');
  const accounts = app.getAllAccounts();
  if(!accounts.length) throw new Error('Niet ingelogd — klik eerst op "Inloggen met Microsoft".');
  try{
    const res = await app.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: accounts[0] });
    return res.accessToken;
  }catch(e){
    // Automatische achtergrond-sync (bij het laden van de pagina en elke 45s) mag NOOIT ongevraagd
    // een Microsoft-inlog-pop-up openen: browsers blokkeren pop-ups die niet direct uit een klik van
    // de gebruiker voortkomen, dus die poging mislukt toch alleen maar stilletjes — en gaf hier
    // bovendien de verwarrende "Sync mislukt"-status na elke verversing. Alleen een expliciete,
    // door de gebruiker aangeklikte actie (de "Sync nu"-knop, of opnieuw inloggen) mag interactief
    // een pop-up openen.
    if(!allowInteractive) throw e;
    const res = await app.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    return res.accessToken;
  }
}
async function graphFetch(url, opts={}, allowInteractive){
  const token = await getGraphToken(allowInteractive);
  const res = await fetch(url, Object.assign({}, opts, {
    headers: Object.assign({ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, opts.headers||{})
  }));
  if(!res.ok){ const text = await res.text().catch(()=>''); throw new Error('Graph-fout '+res.status+': '+text.slice(0,200)); }
  if(res.status === 204) return null;
  return res.json();
}
async function resolveSiteAndList(allowInteractive){
  if(SYNC.siteId && SYNC.listId) return;
  if(!SYNC.siteUrl) throw new Error('Vul eerst het SharePoint site-adres in bij Instellingen.');
  const u = new URL(SYNC.siteUrl);
  const siteRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${u.hostname}:${u.pathname}`, {}, allowInteractive);
  SYNC.siteId = siteRes.id;
  const filter = encodeURIComponent(`displayName eq '${SYNC.listName}'`);
  const listsRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists?$filter=${filter}`, {}, allowInteractive);
  if(!listsRes.value || !listsRes.value.length) throw new Error(`Lijst '${SYNC.listName}' niet gevonden op deze site.`);
  SYNC.listId = listsRes.value[0].id;
  persistSync();
}
let pushTimer = null;
function pushRemoteDebounced(){
  if(!SYNC.enabled || !SYNC.account) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 900);
}
async function pushRemote(){
  if(!SYNC.enabled || !SYNC.account) return;
  try{
    await resolveSiteAndList(false);
    const dataStr = JSON.stringify({ boekhouders: BOEKHOUDERS, klanten: RAW_KLANTEN, teams: TEAMS, store: STORE, rechten: RECHTEN, autos: AUTOS, bijtellingTabel: BIJTELLING_TABEL, activiteitenlog: ACTIVITEITENLOG, kpiOperationeel: KPI_OPERATIONEEL, kpiTactisch: KPI_TACTISCH, kpiCommercieel: KPI_COMMERCIEEL });
    await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists/${SYNC.listId}/items/1/fields`, {
      method:'PATCH', body: JSON.stringify({ Data: dataStr })
    }, false);
    SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null;
  }catch(e){
    SYNC.lastError = e.message || 'Onbekende fout';
  }
  persistSync();
}
// Voorkomt dat een volgende periodieke sync-poging start terwijl een vorige (bijv. door een trage
// verbinding of een inmiddels groot databestand) nog bezig is — anders kunnen twee cycli van
// parse+migrate+render over elkaar heen gaan lopen en de pagina blokkeren.
let syncInFlight = false;
// Onthoudt de laatst verwerkte ruwe JSON-tekst uit SharePoint. Als er niets is veranderd sinds de
// vorige sync, slaan we het hele parse/migrate/persist/render-traject over — dat is verreweg het
// vaakst het geval, en juist dat zware werk (bij honderden klanten met logboeken/aantekeningen)
// was de meest waarschijnlijke oorzaak van "pagina reageert niet".
let laatstVerwerkteSyncData = null;
async function fetchRemoteAndMerge(showFeedback){
  if(!SYNC.enabled || !SYNC.account) return;
  if(syncInFlight) return;
  syncInFlight = true;
  try{
    await resolveSiteAndList(showFeedback);
    const itemRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${SYNC.siteId}/lists/${SYNC.listId}/items/1?expand=fields`, {}, showFeedback);
    const rawData = itemRes && itemRes.fields ? itemRes.fields.Data : null;
    if(typeof rawData === 'string' && rawData === laatstVerwerkteSyncData){
      // Ongewijzigd t.o.v. de vorige keer: alleen de sync-status bijwerken, verder niets doen.
      SYNC.lastSync = new Date().toISOString(); SYNC.lastError = null;
      updateSyncIndicator();
      if(showFeedback) toast('Gesynchroniseerd met gedeelde data (geen wijzigingen).');
    } else {
      let json = rawData;
      if(typeof json === 'string'){ try{ json = JSON.parse(json); }catch(e){ json = null; } }
      if(json && json.klanten){
        BOEKHOUDERS = json.boekhouders && json.boekhouders.length ? json.boekhouders : BOEKHOUDERS;
        RAW_KLANTEN = json.klanten && json.klanten.length ? json.klanten : RAW_KLANTEN;
        TEAMS = json.teams && json.teams.length ? json.teams : TEAMS;
        STORE = json.store || STORE;
        RECHTEN = json.rechten ? Object.assign({}, RECHTEN, json.rechten) : RECHTEN;
        AUTOS = json.autos && json.autos.length ? json.autos : AUTOS;
        BIJTELLING_TABEL = json.bijtellingTabel && json.bijtellingTabel.length ? json.bijtellingTabel : BIJTELLING_TABEL;

/* ============================= BESTANDEN INLEZEN (CSV/Excel, gedeeld door importers) ============================= */
function detectDelimiter(text){
  const firstLine = text.split(/\r?\n/)[0] || '';
  const semis = (firstLine.match(/;/g)||[]).length;
  const commas = (firstLine.match(/,/g)||[]).length;
  return semis > commas ? ';' : ',';
}
// Quote-bewuste parser: respecteert aanhalingstekens, ook als een veld daarbinnen een komma/puntkomma
// of een regeleinde bevat (komt vaak voor in banktransactie-exports).
function parseDelimitedText(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === delimiter){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field!=='' || row.length){ row.push(field); if(!(row.length===1 && row[0]==='')) rows.push(row); }
  return rows;
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (r[idx]||'').trim(); });
    return obj;
  });
}
function findField(obj, candidates){
  const keys = Object.keys(obj);
  for(const cand of candidates){
    const key = keys.find(k=>k.toLowerCase().trim() === cand.toLowerCase());
    if(key) return obj[key];
  }
  return '';
}
function parseDutchAmount(str){
  const cleaned = String(str==null?'0':str).trim().replace(/\./g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
// Leest een File (csv/xlsx/xls) in en geeft via callback(objects, error) een array van rij-objecten terug
// (elke rij als {kolomnaam: waarde}, op basis van de header-rij).
function readTabularFile(file, callback){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext === 'csv' || ext === 'txt'){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const text = ev.target.result;
      const delim = detectDelimiter(text);
      const rows = parseDelimitedText(text, delim);
      callback(rowsToObjects(rows), null);
    };
    reader.onerror = ()=> callback(null, 'Bestand kon niet gelezen worden.');
    reader.readAsText(file);
  } else if(ext === 'xlsx' || ext === 'xls'){
    if(typeof XLSX === 'undefined'){ callback(null, 'Kon de Excel-bibliotheek niet laden (geen internetverbinding?).'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const objects = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
        callback(objects, null);
      }catch(err){ callback(null, 'Kon het Excel-bestand niet lezen: '+(err.message||err)); }
    };
    reader.onerror = ()=> callback(null, 'Bestand kon niet gelezen worden.');
    reader.readAsArrayBuffer(file);
  } else {
    callback(null, 'Onbekend bestandstype. Gebruik .csv, .xlsx of .xls.');
  }
}

/* ============================= HELPERS ============================= */
function fmtEUR(n){ return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n||0); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(str){ if(!str) return '—'; const dt=new Date(str+'T00:00:00'); return dt.toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'}); }
function datumNaarInvoer(iso){
  // Zet interne ISO-datum (JJJJ-MM-DD) om naar het invoerformaat DD-MM-JJJJ voor formuliervelden.
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
  const [j,m,d] = iso.split('-');
  return `${d}-${m}-${j}`;
}
function invoerNaarDatum(str){
  // Zet een DD-MM-JJJJ invoer om naar de interne ISO-datum (JJJJ-MM-DD). Geeft '' terug bij een ongeldige invoer.
  str = (str||'').trim();
  const m = str.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(!m) return '';
  const dag = +m[1], maand = +m[2];
  if(maand<1 || maand>12 || dag<1 || dag>31) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function daysDiff(str){ const dt=new Date(str+'T00:00:00'); return Math.round((dt-TODAY)/86400000); }

function statusOf(entry){
  if(!entry || entry.na) return {key:'na'};
  if(entry.status==='ingediend') return {key:'ingediend'};
  const dd = daysDiff(entry.datum);
  if(dd<=7) return {key:'actie', dagen:dd};
  if(dd<=30) return {key:'nadert', dagen:dd};
  return {key:'schema', dagen:dd};
}
const STATUS_META = {
  actie:{label:'Actie vereist', cls:'red'},
  nadert:{label:'Deadline nadert', cls:'amber'},
  schema:{label:'Op schema', cls:'green'},
  ingediend:{label:'Ingediend', cls:'blue'},
  na:{label:'N.v.t.', cls:'gray'},
};
function badge(entry, opts){
  const st = statusOf(entry); const meta = STATUS_META[st.key];
  let extra = '';
  if(opts && opts.days && st.dagen!==undefined){
    extra = st.dagen<0 ? ` · ${Math.abs(st.dagen)}d te laat` : ` · nog ${st.dagen}d`;
  }
  return `<span class="badge ${meta.cls}"><span class="dot ${meta.cls}"></span>${meta.label}${extra}</span>`;
}
function worstStatus(klant){
  const order = {actie:0, nadert:1, ingediend:2, schema:3, na:4};
  let worst = 'na';
  ['OB','VPB','LH','JR'].forEach(t=>{
    const s = statusOf(effDL(klant,t)).key;
    if(order[s] < order[worst]) worst = s;
  });
  (STORE[klant.id].dl.overige||[]).forEach(o=>{
    const s = statusOf(o).key;
    if(order[s] < order[worst]) worst = s;
  });
  if(worst==='na') worst='schema';
  return worst;
}
function effDL(klant, type){ return STORE[klant.id].dl[type]; }
// Geen automatische verzending — dit signaleert alleen (voor de boekhouder om zelf een
// herinnering te sturen) wanneer een deadline nadert/verstreken is én er nog openstaande
// banktransacties zijn die nog verwerkt moeten worden.
function heeftUrgenteHerinneringNodig(klant){
  const f = STORE[klant.id];
  if(!f || !((f.txn||0) > 0)) return false;
  const types = ['OB','VPB','LH','JR'];
  const dringend = (entry)=>{ const s = statusOf(entry).key; return s==='actie' || s==='nadert'; };
  if(types.some(t=>{ const e = f.dl[t]; return e && !e.na && dringend(e); })) return true;
  if((f.dl.overige||[]).some(o=>dringend(o))) return true;
  return false;
}

/* ============================= BIJTELLING-REKENMODULE (Autolijst) =============================
   Deze module rekent bewust EXACT zoals het Excel-bestand "AUTOLIJST BIJTELLING" (kolommen N t/m X op
   het tabblad Checklist, tarieventabel op tabblad Bijtelling): zelfde brontabel, zelfde 60-maanden-
   regeling voor elektrische auto's, zelfde youngtimer- en pro-rata-logica. Twee bewuste verschillen
   t.o.v. het Excel-bestand, allebei nodig om de berekening écht automatisch te laten meelopen met de
   tijd (in plaats van elk jaar handmatig het jaartal in de formules te moeten aanpassen):
     - waar Excel het jaartal 2026 hardcodeert (in de kolommen U/V/X), gebruiken wij hier altijd het
       huidige jaar (TODAY.getFullYear());
     - de tabel met bijtellingspercentages (BIJTELLING_TABEL) is voor beheerders uitbreidbaar met nieuwe
       jaren, i.p.v. vast in een Excel-tabblad te staan. */
function laatsteBijtellingJaar(){
  if(!BIJTELLING_TABEL.length) return TODAY.getFullYear();
  return Math.max(...BIJTELLING_TABEL.map(r=>r.jaar));
}
function eersteBijtellingJaar(){
  if(!BIJTELLING_TABEL.length) return TODAY.getFullYear();
  return Math.min(...BIJTELLING_TABEL.map(r=>r.jaar));
}
// Geeft het tarief (laag/cap/algemeen) voor een gegeven jaar. Jaren vóór het begin van de tabel
// gebruiken altijd 25% (zoals de "<2017"-regel in het Excel-bestand); jaren ná het laatst ingevulde
// tabeljaar (bijv. een auto die dit jaar is geregistreerd, maar de beheerder heeft het nieuwe jaar nog
// niet toegevoegd) vallen terug op het laatst bekende jaar, zodat de berekening nooit vastloopt.
function bijtellingRijVoorJaar(jaar){
  if(!BIJTELLING_TABEL.length) return {laag:0, cap:0, algemeen: jaar<2017?0.25:0.22};
  const minJaar = eersteBijtellingJaar(), maxJaar = laatsteBijtellingJaar();
  if(jaar < minJaar) return {laag:0, cap:0, algemeen:0.25};
  let rij = BIJTELLING_TABEL.find(r=>r.jaar===jaar);
  if(!rij) rij = BIJTELLING_TABEL.find(r=>r.jaar===maxJaar);
  return { laag: rij.laag||0, cap: rij.cap||0, algemeen: (rij.algemeen!==undefined && rij.algemeen!==null) ? rij.algemeen : 0.22 };
}
function bedragVoorTarief(catalogus, tarief){
  const cap = tarief.cap||0;
  return Math.min(catalogus,cap)*(tarief.laag||0) + Math.max(0,catalogus-cap)*tarief.algemeen;
}
function jongtimerGrensDatum(){
  return new Date(TODAY.getFullYear()-16, TODAY.getMonth(), TODAY.getDate());
}
function isJongtimer(auto){
  if(!auto || !auto.datumEersteInschrijving) return false;
  const l = new Date(auto.datumEersteInschrijving+'T00:00:00');
  if(isNaN(l.getTime())) return false;
  return l <= jongtimerGrensDatum();
}
function vuzgMoetOpgevraagdWorden(auto){
  return auto.type==='bestelauto' && auto.gebruik==='Enkel zakelijk (onder 500 km prive)';
}
function bijtellingVanToepassing(auto){
  if(auto.gebruik==='Enkel zakelijk (onder 500 km prive)') return false;
  if(vuzgMoetOpgevraagdWorden(auto)) return false;
  return true;
}
// Aantal maanden dat de auto dit jaar in gebruik was (rekening houdend met aan-/verkoopdatum),
// exact zoals de pro-rata-formule in kolom U/X van het Excel-bestand.
function maandenGebruiktInJaar(auto){
  const jaar = TODAY.getFullYear();
  const jaarStart = new Date(jaar,0,1), jaarEind = new Date(jaar,11,31);
  const aankoop = auto.aankoopdatum ? new Date(auto.aankoopdatum+'T00:00:00') : jaarStart;
  const verkoop = auto.verkoopdatum ? new Date(auto.verkoopdatum+'T00:00:00') : jaarEind;
  const eind = verkoop < jaarEind ? verkoop : jaarEind;
  const start = aankoop > jaarStart ? aankoop : jaarStart;
  const maanden = (eind.getFullYear()*12+eind.getMonth()) - (start.getFullYear()*12+start.getMonth()) + 1;
  return Math.max(0, maanden);
}
// Bijtelling over 12 maanden (nog vóór de pro-rata-verrekening voor dit jaar) — komt overeen met kolom T.
// Geeft null terug voor "n.v.t." (auto waar geen bijtelling op van toepassing is).
function berekenBijtellingJaarbedrag(auto){
  if(!bijtellingVanToepassing(auto)) return null;
  const catalogus = Number(auto.cataloguswaarde) || 0;
  if(isJongtimer(auto)){
    const dagwaarde = Number(auto.dagwaarde);
    return (isFinite(dagwaarde) ? dagwaarde : 0) * 0.35;
  }
  if(auto.elektrisch === 'ja' && auto.datumEersteInschrijving){
    const l = new Date(auto.datumEersteInschrijving+'T00:00:00');
    if(isNaN(l.getTime())) return null;
    const eindeWindow = new Date(l.getFullYear(), l.getMonth()+60, l.getDate());
    const origTarief = bijtellingRijVoorJaar(l.getFullYear());
    if(TODAY <= eindeWindow){
      // Nog binnen de 60-maanden-periode: het (verlaagde) tarief van het registratiejaar geldt volledig.
      return bedragVoorTarief(catalogus, origTarief);
    }
    const eindJaar = eindeWindow.getFullYear();
    const laatsteJaar = laatsteBijtellingJaar();
    if(eindJaar < laatsteJaar){
      // De 60 maanden zijn al in een eerder jaar verstreken: gebruik het laatst bekende jaartarief.
      return bedragVoorTarief(catalogus, bijtellingRijVoorJaar(laatsteJaar));
    }
    if(eindJaar > laatsteJaar){
      // Randgeval: de tabel is nog niet bijgewerkt tot het jaar waarin de 60 maanden aflopen — val terug
      // op het tarief van het registratiejaar totdat de beheerder het nieuwe jaar toevoegt.
      return bedragVoorTarief(catalogus, origTarief);
    }
    // De 60 maanden lopen af in het huidige laatste tabeljaar: splits naar rato van vóór/na die datum.
    const laatsteTarief = bijtellingRijVoorJaar(laatsteJaar);
    const eersteDeelMaanden = eindeWindow.getMonth(); // 0-11 (komt overeen met MONTH(eindeWindow)-1 in Excel)
    const tweedeDeelMaanden = 12 - eersteDeelMaanden;
    return bedragVoorTarief(catalogus, origTarief)*(eersteDeelMaanden/12) + bedragVoorTarief(catalogus, laatsteTarief)*(tweedeDeelMaanden/12);
  }
  // Elektrisch zonder (geldige) datum 1e inschrijving, of een gewone (niet-elektrische) auto.
  const jaarInschrijving = auto.datumEersteInschrijving ? new Date(auto.datumEersteInschrijving+'T00:00:00').getFullYear() : TODAY.getFullYear();
  return catalogus * (jaarInschrijving < 2017 ? 0.25 : 0.22);
}
// Uiteindelijke, pro-rata bijtelling voor dit jaar — komt overeen met kolom U.
function berekenBijtellingProRata(auto){
  const jaarbedrag = berekenBijtellingJaarbedrag(auto);
  if(jaarbedrag===null) return null;
  return jaarbedrag * (maandenGebruiktInJaar(auto)/12);
}
// BTW-correctiepercentage — komt overeen met kolom V.
function berekenBtwCorrectiePercentage(auto){
  if(auto.gebruik === 'Enkel zakelijk (onder 500 km prive)') return null;
  const jaar = TODAY.getFullYear();
  const aankoopJaar = auto.aankoopdatum ? new Date(auto.aankoopdatum+'T00:00:00').getFullYear() : jaar;
  if(jaar >= aankoopJaar + 5) return 0.015;
  return auto.btwAuto === 'ja' ? 0.027 : 0.015;
}
// BTW-correctie over 12 maanden — komt overeen met kolom W.
function berekenBtwCorrectieJaarbedrag(auto){
  const perc = berekenBtwCorrectiePercentage(auto);
  if(perc===null) return null;
  return (Number(auto.cataloguswaarde)||0) * perc;
}
// Uiteindelijke, pro-rata BTW-correctie voor dit jaar — komt overeen met kolom X.
function berekenBtwCorrectieProRata(auto){
  const jaarbedrag = berekenBtwCorrectieJaarbedrag(auto);
  if(jaarbedrag===null) return null;
  return jaarbedrag * (maandenGebruiktInJaar(auto)/12);
}
function klantVanAuto(auto){ return RAW_KLANTEN.find(k=>k.id===auto.klant) || null; }

const GEEN_VPB_VORMEN = ['Eenmanszaak','V.O.F.','VOF','Maatschap'];
function lhTakenDefinitie(heeftDga){ return heeftDga ? LH_TAKEN_DGA : LH_TAKEN_GEEN_DGA; }
function nieuwLhTaken(heeftDga){ return lhTakenDefinitie(heeftDga).map(t=>({naam:t.naam, done:false, door:null, ts:null, aantekeningen:[]})); }
/* Zorgt dat f.lh.taken altijd exact overeenkomt met de takenlijst die bij klant.heeftDga hoort (zowel
   qua aantal als volgorde), zodat de rij-index die in de checkbox/aantekening-handlers wordt gebruikt
   (data-lh-toggle="klantId|idx") altijd naar de juiste taak wijst. Bestaande voortgang/aantekeningen
   worden op naam gematcht en dus behouden; alleen echt ontbrekende taken worden nieuw aangemaakt. */
function syncLhTaken(klant){
  const f = STORE[klant.id];
  if(!f) return null;
  if(!f.lh) f.lh = { taken: nieuwLhTaken(klant.heeftDga), log:[], volgendeMaandNotitie:'', overigeNotitie:'' };
  if(f.lh.volgendeMaandNotitie===undefined) f.lh.volgendeMaandNotitie = '';
  if(f.lh.overigeNotitie===undefined) f.lh.overigeNotitie = '';
  if(!f.lh.log) f.lh.log = [];
  const definitie = lhTakenDefinitie(klant.heeftDga);
  const bestaand = f.lh.taken || [];
  f.lh.taken = definitie.map(t => bestaand.find(x=>x.naam===t.naam) || {naam:t.naam, done:false, door:null, ts:null, aantekeningen:[]});
  return f;
}
function huidigeGebruiker(){ return SYNC.account ? (SYNC.account.name || SYNC.account.username) : 'Onbekende gebruiker'; }
function isTypingInField(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  if(tag === 'TEXTAREA') return true;
  if(tag === 'INPUT'){
    const t = (el.type||'text').toLowerCase();
    return t !== 'checkbox' && t !== 'radio' && t !== 'file' && t !== 'button' && t !== 'submit';
  }
  return false;
}
// Zoekt de kleur van de boekhouder die een taak heeft afgevinkt. "naam" komt van huidigeGebruiker(),
// dus dat is de naam/gebruikersnaam van het INGELOGDE MICROSOFT-ACCOUNT — dat komt lang niet altijd
// letterlijk overeen met wat er als boekhouder-"naam" in het dashboard staat (bijv. account "Gemma de
// Vries" vs. boekhouder "Gemma", of net andersom). Daarom eerst een exacte match proberen (naam of
// e-mail), en pas als dat niets oplevert een soepelere "bevat elkaar"-match, zodat het bolletje toch de
// juiste kleur krijgt in plaats van grijs te blijven.
function boekhouderKleurVoorNaam(naam){
  if(!naam) return null;
  const n = naam.trim().toLowerCase();
  let match = BOEKHOUDERS.find(b => (b.naam && b.naam.trim().toLowerCase()===n) || (b.email && b.email.trim().toLowerCase()===n));
  if(match) return match.kleur;
  match = BOEKHOUDERS.find(b => b.naam && b.naam.trim().length>=2 && (n.includes(b.naam.trim().toLowerCase()) || b.naam.trim().toLowerCase().includes(n)));
  if(match) return match.kleur;
  match = BOEKHOUDERS.find(b => b.email && b.email.includes('@') && n === b.email.split('@')[0].trim().toLowerCase());
  return match ? match.kleur : null;
}
function advanceDate(datum, herhaling){
  const dt = new Date(datum+'T00:00:00');
  if(herhaling==='maandelijks') dt.setMonth(dt.getMonth()+1);
  else if(herhaling==='kwartaal') dt.setMonth(dt.getMonth()+3);
  else if(herhaling==='jaarlijks') dt.setFullYear(dt.getFullYear()+1);
  else return datum;
  // Let op: bewust geen toISOString() — dat rekent om naar UTC en zou de datum een dag
  // kunnen laten verschuiven in de Nederlandse tijdzone. We bouwen de datumstring op uit
  // de lokale jaar/maand/dag-onderdelen, zodat "15 januari" ook echt "15 januari" blijft.
  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function completeLhPeriode(klant, door){
  const f = syncLhTaken(klant);
  const entry = f.dl.LH;
  const logEntry = {id:'log'+Date.now()+Math.floor(Math.random()*1000), ts:new Date().toISOString(), actie:'periode-afgerond', door};
  if(entry && !entry.na){
    logEntry.voorgaandeDatum = entry.datum;
    logEntry.voorgaandeStatus = entry.status===undefined ? null : entry.status;
    const herh = entry.herhaling || 'geen';
    if(herh !== 'geen'){ entry.datum = advanceDate(entry.datum, herh); entry.status = null; }
    else { entry.status = 'ingediend'; }
  }
  f.lh.log.push(logEntry);
  f.lh.taken.forEach(t=>{ t.done=false; t.door=null; t.ts=null; }); // aantekeningen blijven bewaard over periodes heen
  persist();
}
function verwijderLhLogEntry(klant, logId){
  const f = STORE[klant.id];
  if(!f || !f.lh || !f.lh.log) return false;
  const idx = f.lh.log.findIndex(l=>l.id===logId);
  if(idx===-1) return false;
  const entry = f.lh.log[idx];
  if(entry.actie==='periode-afgerond' && entry.voorgaandeDatum!==undefined){
    const dl = f.dl.LH;
    if(dl && !dl.na){ dl.datum = entry.voorgaandeDatum; dl.status = entry.voorgaandeStatus!==undefined ? entry.voorgaandeStatus : null; }
  }
  f.lh.log.splice(idx,1);
  persist();
  return true;
}
function migrateData(){
  RAW_KLANTEN.forEach(k=>{
    // Elke klant wordt in zijn eigen try/catch gemigreerd: als één klant een onverwachte/beschadigde
    // vorm heeft (bijv. door een oude import of handmatige data-aanpassing), mag dat nooit de migratie
    // van alle ANDERE klanten — en daarmee het opstarten van de hele pagina — laten crashen. Vroeger
    // gebeurde dat wel: één rare klant gaf een volledig wit scherm, alleen op te lossen door de hele
    // browsergeschiedenis (en dus alle lokale data) te wissen.
    try{
      if(!k.dl || typeof k.dl !== 'object') k.dl = {};
      if(k.doetLoonaangifte===undefined) k.doetLoonaangifte=false;
      if(k.heeftDga===undefined) k.heeftDga=false;
      if(k.staatOpHold===undefined) k.staatOpHold=false;
      if(k.opHoldReden===undefined) k.opHoldReden='';
      ['OB','VPB','LH','JR'].forEach(t=>{
        // Een ontbrekende of onverwacht gevormde deadline-invoer (bijv. door een oude import) wordt
        // hersteld naar "niet van toepassing" i.p.v. de pagina te laten crashen zodra deze klant
        // ergens getoond wordt.
        if(!k.dl[t] || typeof k.dl[t] !== 'object') k.dl[t] = {na:true};
        else if(!k.dl[t].na && k.dl[t].herhaling===undefined) k.dl[t].herhaling='geen';
      });
      if(!Array.isArray(k.dl.overige)) k.dl.overige = [];
      const f = STORE[k.id];
      if(f){
        if(!f.dl || typeof f.dl !== 'object') f.dl = JSON.parse(JSON.stringify(k.dl));
        ['OB','VPB','LH','JR'].forEach(t=>{
          if(!f.dl[t] || typeof f.dl[t] !== 'object') f.dl[t] = {na:true};
          else if(!f.dl[t].na && f.dl[t].herhaling===undefined) f.dl[t].herhaling='geen';
        });
        if(!Array.isArray(f.dl.overige)) f.dl.overige = [];
        // syncLhTaken() en de aantekeningen/log-migratie zijn alleen relevant voor klanten die
        // daadwerkelijk loonaangifte doen — dat scheelt bij honderden klanten een hoop overbodig werk
        // op elke sync-cyclus, voor data die toch nergens getoond wordt.
        if(k.doetLoonaangifte){
          syncLhTaken(k);
          if(f.lh && f.lh.taken){
            f.lh.taken.forEach(t=>{
              if(t.aantekeningen===undefined){
                t.aantekeningen = t.notitie ? [{id:'n'+Date.now()+Math.floor(Math.random()*1000), tekst:t.notitie, door:'Onbekend (gemigreerd)', ts:new Date().toISOString()}] : [];
                delete t.notitie;
              }
            });
          }
          if(f.lh && f.lh.log){
            f.lh.log.forEach(l=>{ if(!l.id) l.id = 'log'+Date.now()+Math.floor(Math.random()*10000); });
          }
        }
        if(f.saldoDebet===undefined) f.saldoDebet = 0;
        if(f.saldoCredit===undefined) f.saldoCredit = 0;
        if(f.saldo===undefined) f.saldo = 0;
        if(f.txn===undefined) f.txn = 0;
        if(!f.sync) f.sync = new Date().toISOString().slice(0,10);
        if(!Array.isArray(f.items)) f.items = [];
        if(!Array.isArray(f.kanalen)) f.kanalen = ['email'];
        if(f.dagen1===undefined) f.dagen1 = 7;
        if(f.dagen2===undefined) f.dagen2 = 14;
        if(!Array.isArray(f.log)) f.log = [];
        if(f.notities===undefined) f.notities = '';
      } else {
        // Klant staat wel in RAW_KLANTEN maar heeft helemaal geen STORE-record (bijv. door een
        // onderbroken import) — zonder dit zou elke pagina die deze klant toont alsnog crashen.
        STORE[k.id] = { dl:JSON.parse(JSON.stringify(k.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn:0, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'' };
      }
    }catch(e){
      console.error('Migratie van klant "'+(k && k.naam)+'" ('+(k && k.id)+') mislukt, klant wordt overgeslagen:', e);
    }
  });
  // Auto's (Autolijst): net als bij klanten migreert elke auto in zijn eigen try/catch, zodat één
  // beschadigd record nooit de hele opstart (en dus de hele pagina) kan laten crashen.
  if(!Array.isArray(AUTOS)) AUTOS = [];
  AUTOS.forEach(a=>{
    try{
      if(a.klant===undefined) a.klant = null;
      if(typeof a.merk !== 'string') a.merk = a.merk ? String(a.merk) : '';
      if(typeof a.kenteken !== 'string') a.kenteken = a.kenteken ? String(a.kenteken).toUpperCase() : '';
      if(a.klantBtwVrijgesteld !== 'ja') a.klantBtwVrijgesteld = 'nee';
      if(a.btwAuto !== 'ja') a.btwAuto = 'nee';
      if(a.gebruik !== 'Enkel zakelijk (onder 500 km prive)') a.gebruik = 'Zakelijk en prive (boven 500km prive)';
      if(a.elektrisch !== 'ja') a.elektrisch = 'nee';
      if(!['personenauto','bestelauto','motor','fiets'].includes(a.type)) a.type = 'personenauto';
      if(typeof a.aankoopdatum !== 'string') a.aankoopdatum = '';
      if(typeof a.verkoopdatum !== 'string') a.verkoopdatum = '';
      if(typeof a.datumEersteInschrijving !== 'string') a.datumEersteInschrijving = '';
      if(a.cataloguswaarde===undefined || a.cataloguswaarde===null || isNaN(Number(a.cataloguswaarde))) a.cataloguswaarde = 0;
      else a.cataloguswaarde = Number(a.cataloguswaarde);
      if(a.dagwaarde!==null && a.dagwaarde!==undefined && (a.dagwaarde==='' || isNaN(Number(a.dagwaarde)))) a.dagwaarde = null;
      else if(a.dagwaarde!==null && a.dagwaarde!==undefined) a.dagwaarde = Number(a.dagwaarde);
      else a.dagwaarde = null;
      if(a.vuzgAanwezig !== 'ja') a.vuzgAanwezig = 'nee';
      if(a.bijtellingViaSalaris !== 'Ja') a.bijtellingViaSalaris = 'Nee';
      if(typeof a.notities !== 'string') a.notities = '';
    }catch(e){
      console.error('Migratie van auto "'+(a && a.id)+'" mislukt:', e);
    }
  });
  // Bijtellingstabel: nooit leeg laten (anders vallen alle berekeningen terug op het forfaitaire
  // 25%-tarief) — vul zo nodig de standaardtabel opnieuw in.
  if(!Array.isArray(BIJTELLING_TABEL) || !BIJTELLING_TABEL.length){
    BIJTELLING_TABEL = [
      {jaar:2017, laag:null, cap:null, algemeen:0.22},
      {jaar:2018, laag:null, cap:null, algemeen:0.22},
      {jaar:2019, laag:0.04, cap:50000, algemeen:0.22},
      {jaar:2020, laag:0.08, cap:45000, algemeen:0.22},
      {jaar:2021, laag:0.12, cap:40000, algemeen:0.22},
      {jaar:2022, laag:0.16, cap:35000, algemeen:0.22},
      {jaar:2023, laag:0.16, cap:30000, algemeen:0.22},
      {jaar:2024, laag:0.16, cap:30000, algemeen:0.22},
      {jaar:2025, laag:0.17, cap:30000, algemeen:0.22},
      {jaar:2026, laag:0.18, cap:30000, algemeen:0.22},
    ];
  }
  if(!Array.isArray(ACTIVITEITENLOG)) ACTIVITEITENLOG = [];
  if(!KPI_OPERATIONEEL || typeof KPI_OPERATIONEEL !== 'object') KPI_OPERATIONEEL = {};
  if(!KPI_TACTISCH || typeof KPI_TACTISCH !== 'object') KPI_TACTISCH = {};
  ['Q1','Q2','Q3','Q4'].forEach(q=>{
    if(!KPI_TACTISCH[q] || typeof KPI_TACTISCH[q] !== 'object') KPI_TACTISCH[q] = { doel:'', pijlers:[] };
    if(typeof KPI_TACTISCH[q].doel !== 'string') KPI_TACTISCH[q].doel = '';
    if(!Array.isArray(KPI_TACTISCH[q].pijlers)) KPI_TACTISCH[q].pijlers = [];
  });
  if(!KPI_COMMERCIEEL || typeof KPI_COMMERCIEEL !== 'object') KPI_COMMERCIEEL = { week:null, teams:{} };
  if(!KPI_COMMERCIEEL.teams || typeof KPI_COMMERCIEEL.teams !== 'object') KPI_COMMERCIEEL.teams = {};
}

function kpiPill(n, kls){
  const k = kls || kpiTellingKlasse(n);
  return `<span class="badge ${k}"><span class="dot ${k}"></span>${n}</span>`;
}
function kpiMetricCel(week, totaal, suffix){
  suffix = suffix || '';
  return `<div style="font-size:13.5px; font-weight:700;">${week}${suffix}</div><div style="font-size:10.5px; color:var(--muted); margin-top:2px;">totaal: ${totaal}${suffix}</div>`;
}
function kpiOperationeelHTML(){
  const bewerkbaar = isAdmin();
  const editMode = bewerkbaar && STATE.kpiOpEdit;
  const velden = [['inbox','Inbox'],['bankmutaties','Bankmut.'],['jaarrekeningen','Jaarrek.'],['klanten','Klanten']];
  const btwVelden = ['btwQ1','btwQ2','btwQ3','btwQ4'];
  const rijen = TEAMS.map(t=>{
    const d = kpiOpVoorTeam(t.id);
    if(editMode){
      const cellen = velden.map(([key])=>`<td style="text-align:center; padding:4px;"><input type="number" min="0" data-kpi-op-input="${t.id}|${key}" value="${d[key]}" style="width:56px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; font-size:11.5px; text-align:center;"></td>`).join('');
      const btwCellen = btwVelden.map(key=>`<td style="text-align:center; padding:4px;"><input type="number" min="0" data-kpi-op-input="${t.id}|${key}" value="${d[key]}" style="width:44px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; font-size:11.5px; text-align:center;"></td>`).join('');
      return `<tr><td style="padding:7px 4px; font-weight:700;">${t.naam}</td>${cellen}${btwCellen}</tr>`;
    }
    const cellen = velden.map(([key])=>`<td style="text-align:center; padding:7px 4px;">${d[key]}</td>`).join('');
    const btwCellen = btwVelden.map(key=>`<td style="text-align:center; padding:7px 4px;">${kpiPill(d[key])}</td>`).join('');
    return `<tr><td style="padding:7px 4px; font-weight:700;">${t.naam}</td>${cellen}${btwCellen}</tr>`;
  }).join('');
  return `<div class="section" style="margin-bottom:18px;">
    <div class="section-head">
      <h3>📊 Operationele KPI's</h3>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="hint">Per team · handmatig ingevuld</span>
        ${bewerkbaar ? (editMode
          ? `<div style="display:flex; gap:6px;"><button class="btn sm primary" data-kpi-op-save>Opslaan</button><button class="btn sm ghost" data-kpi-op-cancel>Annuleren</button></div>`
          : `<button class="btn sm ghost" data-kpi-op-edit>✎ Bewerken</button>`) : ''}
      </div>
    </div>
    <div class="section-body" style="overflow-x:auto; padding:12px 20px;">
      ${TEAMS.length ? `<table style="width:100%; min-width:600px; border-collapse:collapse; font-size:12px;">
        <thead><tr style="border-bottom:1px solid var(--border);">
          <th style="text-align:left; padding:6px 4px; font-size:11.5px; color:var(--muted);">Team</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Inbox</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Bankmut.</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Jaarrek.</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Klanten</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Q1</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Q2</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Q3</th>
          <th style="padding:6px 4px; font-size:11.5px; color:var(--muted);">Q4</th>

      </table>` : `<div class="empty-state">Nog geen teams aangemaakt. Voeg teams toe bij "Teams" in het menu.</div>`}

  const teamOpts = TEAMS.map(t=>`<option value="${t.id}" ${bestaand && bestaand.teamId===t.id ? 'selected':''}>${t.naam}</option>`).join('');
  const statusOpts = ['Op schema','Actie nodig','Afgerond','Achterstand'].map(s=>`<option value="${s}" ${bestaand && bestaand.status===s ? 'selected':''}>${s}</option>`).join('');
  return `<div style="margin-top:12px; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px;">
    <div style="font-size:12px; font-weight:700; margin-bottom:8px;">${bestaand ? 'Pijler bewerken' : 'Nieuwe pijler'}</div>

      <select id="kpiPijlerTeam" style="flex:1; min-width:120px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:11.5px;">${teamOpts}</select>

      <input type="number" id="kpiPijlerWeek" min="1" max="53" placeholder="Week" value="${bestaand ? bestaand.week : ''}" style="width:70px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:11.5px;">

function kpiTactischGroepenHTML(kwartaal){
  const bewerkbaar = isAdmin();
  const pijlers = KPI_TACTISCH[kwartaal].pijlers;
  if(!TEAMS.length) return `<div class="empty-state">Nog geen teams aangemaakt.</div>`;
  return TEAMS.map(t=>{
    const lijst = pijlers.filter(p=>p.teamId===t.id);
    const rijen = lijst.length ? lijst.map(p=>{
      const kls = kpiStatusKlasse(p.status);
      return `<tr style="border-bottom:1px solid var(--border);">
        <td style="padding:6px 4px;">${p.naam}</td>
        <td style="text-align:center; padding:6px 4px; width:50px;">${p.week}</td>
        <td style="padding:6px 4px; color:var(--muted);">${p.target}</td>
        <td style="padding:6px 4px;"><span class="badge ${kls}"><span class="dot ${kls}"></span>${p.status}</span></td>
        ${bewerkbaar ? `<td style="text-align:right; padding:6px 4px; white-space:nowrap;">
          <button class="btn sm ghost" title="Bewerken" data-kpi-pijler-edit="${kwartaal}|${p.id}" style="padding:2px 6px;">✎</button>
          <button class="btn sm ghost" title="Verwijderen" data-kpi-pijler-delete="${kwartaal}|${p.id}" style="padding:2px 6px; color:var(--red);">🗑</button>
        </td>` : ''}
      </tr>`;
    }).join('') : `<tr><td colspan="5" style="padding:6px 4px; color:var(--muted); font-size:11.5px;">Nog geen pijlers voor dit team.</td></tr>`;
    return `<div style="margin-bottom:14px;">
      <div style="font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;">${t.naam}</div>
      <table style="width:100%; border-collapse:collapse; font-size:12px;"><tbody>${rijen}</tbody></table>
    </div>`;
  }).join('');
}

function kpiOverzichtHTML(){
  return `${kpiOperationeelHTML()}${kpiTactischHTML()}${kpiCommercieelHTML()}`;
}

function dashboardHTML(){
  const rows = allDeadlineRows();
  const cnt = {actie:0, nadert:0, schema:0, ingediend:0};
  rows.forEach(r=>cnt[r.st.key]++);
  const totalSaldo = RAW_KLANTEN.reduce((s,k)=>s+STORE[k.id].saldo,0);

  const urgent = rows.filter(r=>r.st.key==='actie' || r.st.key==='nadert')
    .sort((a,b)=> (a.entry.status==='ingediend'?9999:daysDiff(a.entry.datum)) - (b.entry.status==='ingediend'?9999:daysDiff(b.entry.datum)))
    .slice(0,8);

  const types = ['OB','VPB','LH','JR','Overige'];
  const distRows = types.map(t=>{
    const trows = rows.filter(r=>r.type===t);
    const c = {actie:0,nadert:0,schema:0,ingediend:0};
    trows.forEach(r=>c[r.st.key]++);
    const total = trows.length || 1;
    return `<div class="distbar">
      <div class="label">${TYPE_LABEL[t]}</div>
      <div class="track">
        ${c.actie?`<div class="seg" style="width:${c.actie/total*100}%; background:var(--red)"></div>`:''}
        ${c.nadert?`<div class="seg" style="width:${c.nadert/total*100}%; background:var(--amber)"></div>`:''}
        ${c.ingediend?`<div class="seg" style="width:${c.ingediend/total*100}%; background:var(--blue)"></div>`:''}
        ${c.schema?`<div class="seg" style="width:${c.schema/total*100}%; background:var(--green)"></div>`:''}
      </div>
      <div class="nums">${c.actie} rood · ${c.nadert} oranje · ${c.schema} groen</div>
    </div>`;
  }).join('');

  const remindDue = RAW_KLANTEN.filter(k=>{
    const f = STORE[k.id];
    return f.saldo>0 || f.items.some(i=>!i.done);
  }).slice(0,6);

  return `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Totaal klanten</div><div class="kpi-value">${RAW_KLANTEN.length}</div><div class="kpi-sub" style="color:var(--muted)">Verdeeld over ${BOEKHOUDERS.length} boekhouders</div></div>
    <div class="kpi-card red"><div class="kpi-label">Actie vereist</div><div class="kpi-value">${cnt.actie}</div><div class="kpi-sub" style="color:var(--red)">Deadlines verlopen of ≤ 7 dagen</div></div>
    <div class="kpi-card amber"><div class="kpi-label">Deadline nadert</div><div class="kpi-value">${cnt.nadert}</div><div class="kpi-sub" style="color:var(--amber)">Binnen 8–30 dagen</div></div>
    <div class="kpi-card green"><div class="kpi-label">Op schema</div><div class="kpi-value">${cnt.schema}</div><div class="kpi-sub" style="color:var(--green)">Ruim op tijd</div></div>
    <div class="kpi-card blue"><div class="kpi-label">Open banksaldo</div><div class="kpi-value" style="font-size:22px;">${fmtEUR(totalSaldo)}</div><div class="kpi-sub" style="color:var(--muted)">Over alle klanten</div></div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Urgente acties</h3><span class="hint">Gesorteerd op resterende tijd</span></div>
    <div class="section-body">
      ${urgent.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Type</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>
        ${urgent.map(r=>`<tr class="row-click" data-open-klant="${r.klant.id}">
          <td><div class="klant-name">${r.klant.naam}</div><div class="klant-meta">${r.klant.vorm}</div></td>
          <td>${bh(r.klant.bh).naam}</td>
          <td>${typeof r.type==='string' && TYPE_LABEL[r.type] ? TYPE_LABEL[r.type] : (r.entry.naam||r.type)}</td>
          <td>${fmtDate(r.entry.datum)}</td>
          <td>${badge(r.entry,{days:true})}</td>
          <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${r.klant.id}">Bekijk →</button></td>
        </tr>`).join('')}
      </tbody></table>` : `<div class="empty-state">Geen urgente acties — alles op schema. 🎉</div>`}
    </div>
  </div>

  ${kpiOverzichtHTML()}

  <div class="section">
    <div class="section-head"><h3>🚩 Stuur een herinnering</h3><span class="hint">Deadline nadert/verstreken én banktransacties nog niet verwerkt</span></div>
    <div class="section-body">
      ${(()=>{ const flagged = RAW_KLANTEN.filter(k=>heeftUrgenteHerinneringNodig(k));
        return flagged.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Status</th><th>Openstaande transacties</th><th></th></tr></thead><tbody>
        ${flagged.map(k=>{ const w = worstStatus(k); const meta = STATUS_META[w];
          return `<tr class="row-click" data-open-klant="${k.id}">
            <td><div class="klant-name">${k.naam}</div></td>
            <td>${bh(k.bh).naam}</td>
            <td><span class="badge ${meta.cls}"><span class="dot ${meta.cls}"></span>${meta.label}</span></td>
            <td>${STORE[k.id].txn} transactie(s)</td>
            <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${k.id}">Bekijk →</button></td>
          </tr>`; }).join('')}
        </tbody></table>` : `<div class="empty-state">Niets dat nu om een herinnering vraagt. 🎉</div>`; })()}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Status per deadlinecategorie</h3><span class="hint">${rows.length} deadlines totaal</span></div>
    <div class="section-body" style="padding:10px 0;">${distRows}</div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Aanlevering & banksaldo — aandachtspunten</h3><span class="hint">Klanten met openstaand saldo of ontbrekende stukken</span></div>
    <div class="section-body">
      ${remindDue.length ? `<table><thead><tr><th>Klant</th><th>Boekhouder</th><th>Open saldo</th><th>Aan te leveren</th><th></th></tr></thead><tbody>
      ${remindDue.map(k=>{ const f=STORE[k.id]; const open=f.items.filter(i=>!i.done).length;
        return `<tr class="row-click" data-open-klant="${k.id}">
          <td><div class="klant-name">${k.naam}</div></td>
          <td>${bh(k.bh).naam}</td>
          <td>${fmtEUR(f.saldo)}</td>
          <td>${open? `<span class="badge amber"><span class="dot amber"></span>${open} item(s) open</span>` : `<span class="badge green"><span class="dot green"></span>Compleet</span>`}</td>
          <td style="text-align:right"><button class="btn sm ghost" data-open-klant="${k.id}">Bekijk →</button></td>
        </tr>`; }).join('')}
      </tbody></table>` : `<div class="empty-state">Niets openstaand.</div>`}
    </div>
  </div>
  `;
}

/* ============================= VIEW: BOEKHOUDERS ============================= */

  const cards = BOEKHOUDERS.map(b=>{
    const klanten = klantsOf(b.id);
    const c = {actie:0, nadert:0, schema:0};
    klanten.forEach(k=>{ const w = worstStatus(k); if(c[w]!==undefined) c[w]++; else c.schema++; });
    return `<div class="bh-card" data-nav-bh="${b.id}" style="position:relative;">
      <div style="position:absolute; top:10px; right:10px; display:flex; gap:4px;">
        <button class="btn sm ghost" data-edit-bh-btn="${b.id}" title="Boekhouder bewerken (o.a. kleur)" style="padding:4px 7px;">✎</button>
        ${isAdmin() ? `<button class="btn sm ghost" data-delete-bh="${b.id}" title="Boekhouder verwijderen" style="padding:4px 7px; color:var(--red);">🗑</button>` : ''}
      </div>
      <div class="bh-top">
        <div class="avatar" style="background:${b.kleur}">${initials(b.naam)}</div>
        <div><div class="bh-name">${b.naam}</div><div class="bh-role">${b.rol}${b.team && teamOf(b.team) ? ' · '+teamOf(b.team).naam : ''}</div></div>
      </div>
      <div class="bh-stats">
        <div class="bh-stat"><b style="color:var(--red)">${c.actie}</b><span>Actie</span></div>
        <div class="bh-stat"><b style="color:var(--amber)">${c.nadert}</b><span>Nadert</span></div>

/* ============================= VIEW: LOONHEFFINGEN ============================= */
function volgendeMaandTweedeWeek(){
  const d = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 14);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function bulkSetLhDeadlines(klantList){
  const datum = volgendeMaandTweedeWeek();
  klantList.forEach(k=>{
    const f = STORE[k.id];
    if(!f) return;
    f.dl.LH = { datum, status:null, herhaling:'maandelijks' };
  });
  persist();
  return datum;
}
function lhNotitiesJaarHTML(k, f){
  const jaarFilter = STATE.lhNotitiesJaar || TODAY.getFullYear();
  const alle = [];
  (f.lh.taken||[]).forEach(t=>{

      if(n.ts) alle.push({ taak:t.naam, tekst:n.tekst, door:n.door, ts:n.ts });
    });
  });
  const jarenSet = new Set(alle.map(n=>new Date(n.ts).getFullYear()));
  jarenSet.add(TODAY.getFullYear());
  const jaren = Array.from(jarenSet).sort((a,b)=>b-a);
  const gefilterd = alle.filter(n=>new Date(n.ts).getFullYear()===jaarFilter).sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  const maandNaam = (ts)=> new Date(ts).toLocaleString('nl-NL',{month:'long'});
  const maandenVolgorde = [];
  gefilterd.forEach(n=>{ const m = maandNaam(n.ts); if(!maandenVolgorde.includes(m)) maandenVolgorde.push(m); });
  const perMaand = {};
  gefilterd.forEach(n=>{ const m = maandNaam(n.ts); (perMaand[m] = perMaand[m]||[]).push(n); });
  const inhoud = maandenVolgorde.length ? maandenVolgorde.map(maand => `
    <div style="margin-top:10px;">
      <div style="font-weight:600; font-size:11.5px; text-transform:capitalize; color:var(--muted); margin-bottom:4px;">${maand}</div>

          <div style="color:var(--muted); font-size:10px; margin-top:2px;">${n.door||''} · ${new Date(n.ts).toLocaleString('nl-NL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>

    </div>`).join('') : `<div class="hint" style="margin-top:8px;">Geen notities in ${jaarFilter}.</div>`;
  return `
    <div style="margin-top:14px; padding:12px; background:#fff; border:1px solid var(--border); border-radius:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <b style="font-size:12px;">Notities ${jaarFilter} <span style="font-weight:400; color:var(--muted);">(${gefilterd.length})</span></b>

    if(l.actie==='aantekening-bewerkt') return `bewerkte een aantekening bij "${l.taak}"`;

      <b style="font-size:12px;">Recente activiteit</b>
      ${recentLog.length ? recentLog.map(l=>`<div class="rem-log-item" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span>📝 <b>${l.door}</b> ${logLine(l)} — ${new Date(l.ts).toLocaleString('nl-NL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>

}
function loonheffingOverzichtHTML(list, heeftDga, titel){
  if(!list.length) return '';
  const jaarNu = TODAY.getFullYear();
  const takenDef = lhTakenDefinitie(heeftDga);
  const kolomAantal = 4 + takenDef.length; // Nr. + Werkgever + taken + Periodes + Volgende deadline
  const gesorteerd = list.slice().sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  const rijen = gesorteerd.map((k,i)=>{
    const f = syncLhTaken(k);
    const lhEntry = effDL(k,'LH');
    const periodesDitJaar = (f.lh.log||[]).filter(l=>l.actie==='periode-afgerond' && l.ts && new Date(l.ts).getFullYear()===jaarNu).length;
    const expanded = STATE.lhExpandedKlant === k.id;
    const heeftVolgendeMaandNotitie = !!(f.lh.volgendeMaandNotitie && f.lh.volgendeMaandNotitie.trim());
    const taakCellen = f.lh.taken.map(t=>{
      const kleur = t.done ? boekhouderKleurVoorNaam(t.door) : null;
      const titelTxt = t.naam + (t.done ? ` — ✓ ${t.door}` : ' — nog niet afgerond deze periode');
      return `<td style="text-align:center;" title="${titelTxt.replace(/"/g,'&quot;')}"><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${kleur||'var(--border)'};"></span></td>`;
    }).join('');
    const hoofdRij = `<tr class="row-click" data-lh-toggle-detail="${k.id}" style="${expanded?'background:#f7f9fd;':''}">
      <td style="color:var(--muted);">${expanded?'▾':'▸'} ${i+1}</td>
      <td><div class="klant-name">${heeftVolgendeMaandNotitie ? '<span title="Notitie klaargezet voor volgende maand" style=\'margin-right:4px;\'>⭐</span>' : ''}${k.naam}</div><div class="klant-meta">${bh(k.bh).naam}</div></td>
      ${taakCellen}
      <td style="text-align:center;">${periodesDitJaar}</td>
      <td>${lhEntry.na ? 'n.v.t.' : fmtDate(lhEntry.datum)}</td>
    </tr>`;
    const detailRij = expanded ? `<tr><td colspan="${kolomAantal}" style="background:#fbfcfe; padding:16px 20px; border-bottom:1px solid var(--border);">${loonheffingKlantDetailHTML(k)}</td></tr>` : '';
    return hoofdRij + detailRij;
  }).join('');
  const taakHeaders = takenDef.map((t,idx)=>`<th style="text-align:center;" title="${t.naam.replace(/"/g,'&quot;')}">${idx+1}</th>`).join('');
  const taakLegenda = takenDef.map((t,idx)=>`<span style="margin-right:14px;"><b>${idx+1}.</b> ${t.naam}</span>`).join('');
  return `<div class="section" style="margin-bottom:18px;">
    <div class="section-head">
      <h3>${titel} — ${TODAY.toLocaleDateString('nl-NL',{month:'long', year:'numeric'})}</h3>
      <span class="hint">Klik op een klant voor aantekeningen en het afvinken van taken · ${gesorteerd.length} klant(en)</span>
    </div>
    <div style="padding:12px 20px 0; font-size:11px; color:var(--muted); line-height:1.8;">${taakLegenda}</div>
    <div class="section-body" style="overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Werkgever</th>${taakHeaders}<th style="text-align:center;">Periodes ${jaarNu}</th><th>Volgende deadline</th></tr></thead>
        <tbody>${rijen}</tbody>
      </table>
    </div>
  </div>`;
}

function autoBedragCel(bedrag){
  if(bedrag===null) return `<span class="badge gray"><span class="dot gray"></span>N.v.t.</span>`;
  return fmtEUR(bedrag);
}
function autoWaarschuwingen(auto){
  const w = [];
  if(!auto.datumEersteInschrijving) w.push('Geen datum 1e inschrijving ingevuld — berekening kan niet kloppen.');
  if(!auto.cataloguswaarde) w.push('Geen cataloguswaarde ingevuld.');
  if(isJongtimer(auto) && (auto.dagwaarde===null || auto.dagwaarde===undefined)) w.push('Youngtimer zonder dagwaarde — bijtelling staat nu op €0.');
  return w;
}
