    }
    STATE.showAddAuto=false; STATE.editAuto=null;
    closePanel();
    render();
  });
}
/* Excel-import voor de Autolijst: leest het bestaande "Checklist"-werkblad (kolomkoppen op rij 5,
   data vanaf rij 6) en koppelt elke rij aan een klant op naam — dezelfde matching als bij de
   Loonheffingen-import, zodat bestaande workflows en verwachtingen herbruikt worden. */
function leesJaJa(v){ return String(v||'').trim().toLowerCase()==='ja' ? 'ja' : 'nee'; }
function leesExcelDatum(v){
  if(v===null || v===undefined || v==='') return '';
  if(v instanceof Date && !isNaN(v.getTime())){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
// Leest een getal uit een Excel-cel. Bij een numerieke cel (raw:true-waarde) geven we het getal
// gewoon direct terug — géén tekst-parsing nodig, dus geen risico dat Excel's eigen (Engelstalige)
// getalnotatie ("1,234.56") per ongeluk wordt aangezien voor de Nederlandse notatie ("1.234,56").
// Alleen als er daadwerkelijk een TEKST-waarde binnenkomt (bijv. een cel die als tekst is opgemaakt,
// of handmatig ingevoerd/geplakt) passen we de Nederlandse notatie toe: "." is dan een duizendtal-
// scheidingsteken en "," de decimaalscheiding — zoals in "42.170,00" = 42170,00 euro.
function leesExcelGetal(v){
  if(v===null || v===undefined || v==='') return 0;
  if(typeof v === 'number') return isNaN(v) ? 0 : v;
  let s = String(v).trim().replace(/[^\d.,-]/g,'');
  const laatsteKomma = s.lastIndexOf(',');
  const laatstePunt = s.lastIndexOf('.');
  if(laatsteKomma > -1 && laatsteKomma > laatstePunt){
    // Nederlandse notatie: "." = duizendtallen, "," = decimaal (bijv. "42.170,00").
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(laatstePunt > -1 && laatstePunt > laatsteKomma){
    // Engelse/Excel-notatie: "," = duizendtallen, "." = decimaal (bijv. "42,170.00").
    s = s.replace(/,/g,'');
  } else {
    // Geen duizendtalscheiding, hooguit één scheidingsteken dat als decimaal bedoeld is.
    s = s.replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function readAutoExcelRowsPromise(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Bestand kon niet gelezen worden'));
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets['Checklist'] || wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null, dateNF:'yyyy-mm-dd'});
        const gridRaw = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        // Kolomkoppen staan op rij 5 (index 4); data begint op rij 6 (index 5).
        const headerRow = (grid[4]||[]).map(h=>(h||'').toString().trim().toLowerCase());
        const col = (naam)=> headerRow.indexOf(naam.toLowerCase());
        const idx = {
          klantnaam: col('Klantnaam'), merk: col('Merk'), kenteken: col('Kenteken'),
          klantBtwVrijgesteld: col('Klant BTW vrijgesteld'), btwAuto: col('BTW auto'),
          gebruik: col('Enkel zakelijk of zakelijk en prive'), elektrisch: col('Elektrische auto'),
          type: col('Type transportmiddel'), aankoopdatum: col('Aankoopdatum'), verkoopdatum: col('Verkoopdatum'),
          datumInschrijving: col('Datum 1e inschrijving'), cataloguswaarde: col('Cataloguswaarde'),
          dagwaarde: col('Dagwaarde'), vuzgAanwezig: col('VUZG aanwezig'), bijtellingViaSalaris: col('Bijtelling via salaris'),
        };
        if(idx.klantnaam===-1) throw new Error('Kon de kolom "Klantnaam" niet vinden op rij 5. Is dit het juiste bestand?');
        const rows = [];
        for(let r=5; r<grid.length; r++){
          const row = grid[r]; const rowRaw = gridRaw[r];
          if(!row || !row[idx.klantnaam] || String(row[idx.klantnaam]).trim()==='') continue;
          rows.push({
            klantnaam: String(row[idx.klantnaam]).trim(),
            merk: idx.merk>-1 ? (row[idx.merk]||'') : '',
            kenteken: idx.kenteken>-1 ? (row[idx.kenteken]||'') : '',
            klantBtwVrijgesteld: idx.klantBtwVrijgesteld>-1 ? leesJaJa(row[idx.klantBtwVrijgesteld]) : 'nee',
            btwAuto: idx.btwAuto>-1 ? leesJaJa(row[idx.btwAuto]) : 'nee',
            gebruik: idx.gebruik>-1 && row[idx.gebruik] ? row[idx.gebruik] : 'Zakelijk en prive (boven 500km prive)',
            elektrisch: idx.elektrisch>-1 ? leesJaJa(row[idx.elektrisch]) : 'nee',
            type: idx.type>-1 && row[idx.type] ? String(row[idx.type]).trim().toLowerCase() : 'personenauto',
            aankoopdatum: idx.aankoopdatum>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.aankoopdatum] : row[idx.aankoopdatum]) : '',
            verkoopdatum: idx.verkoopdatum>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.verkoopdatum] : row[idx.verkoopdatum]) : '',
            datumEersteInschrijving: idx.datumInschrijving>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.datumInschrijving] : row[idx.datumInschrijving]) : '',
            cataloguswaarde: idx.cataloguswaarde>-1 ? leesExcelGetal(rowRaw ? rowRaw[idx.cataloguswaarde] : row[idx.cataloguswaarde]) : 0,
            dagwaarde: idx.dagwaarde>-1 && rowRaw && rowRaw[idx.dagwaarde]!==null && rowRaw[idx.dagwaarde]!==undefined && rowRaw[idx.dagwaarde]!=='' ? leesExcelGetal(rowRaw[idx.dagwaarde]) : null,
            vuzgAanwezig: idx.vuzgAanwezig>-1 ? leesJaJa(row[idx.vuzgAanwezig]) : 'nee',
            bijtellingViaSalaris: idx.bijtellingViaSalaris>-1 && String(row[idx.bijtellingViaSalaris]||'').trim().toLowerCase()==='ja' ? 'Ja' : 'Nee',
          });
        }
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
async function handleAutoImport(e){
  const getResultBox = ()=> document.getElementById('autoImportResult');
  try{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const box0 = getResultBox();
    if(box0) box0.innerHTML = '<div class="hint">Bestand wordt gelezen…</div>';
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek (XLSX) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina, en probeer het daarna opnieuw.');
    }
    const rows = await readAutoExcelRowsPromise(file);
    if(!rows.length){
      const boxEmpty = getResultBox();
      if(boxEmpty) boxEmpty.innerHTML = `<div class="banner" style="border-color:var(--amber-brd); color:#8a4b06;"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Er zijn geen auto's herkend in "${String(file.name).replace(/</g,'&lt;')}". Controleer of dit het juiste bestand is (tabblad "Checklist", koppen op rij 5).</div>`;
      return;
    }
    // Opnieuw hetzelfde bestand importeren mag nooit dubbele auto's opleveren, en moet foutieve
    // waarden uit een eerdere (bijv. verkeerd-uitgelezen) import gewoon overschrijven met de nieuwe,
    // correcte waarden. Daarom wordt hier ge-"upsert": een auto van dezelfde klant met hetzelfde
    // kenteken wordt bijgewerkt in plaats van nogmaals toegevoegd. Alleen auto's zonder kenteken (of
    // met een kenteken dat nog niet bestaat) worden als nieuw toegevoegd.
    let toegevoegd = 0, bijgewerkt = 0; const nietGevonden = [];
    rows.forEach(row=>{
      const klant = vindKlantOpNaam(row.klantnaam);
      if(!klant){ nietGevonden.push(row.klantnaam); return; }
      const data = { klant: klant.id, merk:row.merk, kenteken:row.kenteken, klantBtwVrijgesteld:row.klantBtwVrijgesteld,
        btwAuto:row.btwAuto, gebruik:row.gebruik, elektrisch:row.elektrisch, type:row.type,
        aankoopdatum:row.aankoopdatum, verkoopdatum:row.verkoopdatum, datumEersteInschrijving:row.datumEersteInschrijving,
        cataloguswaarde:row.cataloguswaarde, dagwaarde:row.dagwaarde, vuzgAanwezig:row.vuzgAanwezig, bijtellingViaSalaris:row.bijtellingViaSalaris };
      const kentekenNorm = (row.kenteken||'').trim().toUpperCase();
      const bestaande = kentekenNorm ? AUTOS.find(a=>a.klant===klant.id && (a.kenteken||'').trim().toUpperCase()===kentekenNorm) : null;
      if(bestaande){ updateAuto(bestaande.id, data); bijgewerkt++; }
      else { addAuto(data); toegevoegd++; }
    });
    logActiviteit(`Auto-import uit "${file.name}": ${toegevoegd} toegevoegd, ${bijgewerkt} bijgewerkt${nietGevonden.length ? `, ${nietGevonden.length} klant(en) niet gevonden` : ''}`);
    const box = getResultBox();
    if(box){
      const escaped = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      box.innerHTML = `<div class="banner"><i class="ti ti-circle-check" aria-hidden="true"></i> <b>${toegevoegd}</b> nieuwe auto('s) toegevoegd, <b>${bijgewerkt}</b> bestaande auto('s) bijgewerkt (op klant + kenteken) uit "${escaped(file.name)}".`
        + (nietGevonden.length ? `<br><i class="ti ti-alert-triangle" aria-hidden="true"></i> <b>${nietGevonden.length}</b> klant(en) niet gevonden op naam — voeg deze klant(en) eerst toe: ${nietGevonden.slice(0,30).map(escaped).join(', ')}${nietGevonden.length>30?', …':''}` : '')
        + `</div>`;
    }
    render();
  }catch(err){
    console.error('Autolijst-import mislukt:', err);
    const boxErr = getResultBox();
    const msg = `<div class="banner" style="border-color:var(--red); color:var(--red);"><i class="ti ti-alert-circle" aria-hidden="true"></i> Fout bij inlezen: ${((err&&err.message)||err)}</div>`;
    if(boxErr) boxErr.innerHTML = msg; else alert('Fout bij inlezen van het Excel-bestand: '+((err&&err.message)||err));
  }
}

function ibAanhefLabel(a){ return a==='Mw' ? 'Mw.' : 'Dhr.'; }

function akkoordverklaringValidatie(klant){
  const ib = klant.ib;
  if(!ib) return 'Geen IB-gegevens ingevuld voor deze klant. Vul deze eerst in bij "Bewerken".';
  const ontbreekt = [];
  if(!ib.boekjaar) ontbreekt.push('boekjaar');
  if(!ib.straat) ontbreekt.push('straat + huisnummer');
  if(!ib.postcode) ontbreekt.push('postcode');
  if(!ib.plaats) ontbreekt.push('plaats');
  if(!ib.persoon1.voorletters || !ib.persoon1.achternaam) ontbreekt.push('naam persoon 1');
  if(!ib.persoon1.fiscaalnummer) ontbreekt.push('fiscaalnummer persoon 1');
  if(ib.tweePersonen){
    if(!ib.persoon2.voorletters || !ib.persoon2.achternaam) ontbreekt.push('naam persoon 2');
    if(!ib.persoon2.fiscaalnummer) ontbreekt.push('fiscaalnummer persoon 2');
  }
  if(!klant.email) ontbreekt.push('e-mailadres van de klant');
  if(ontbreekt.length) return `Vul eerst het volgende in bij "Bewerken" vóór je dit document verstuurt: ${ontbreekt.join(', ')}.`;
  return null;
}

/* scrollX/scrollY:0 compenseren voor de scrollpositie van de pagina op het moment van genereren —
   zonder dit levert html2canvas soms een leeg canvas op als de gebruiker niet bovenaan de pagina staat. */
const AKKOORD_PDF_OPTS = { margin:0, image:{type:'jpeg', quality:0.95}, html2canvas:{scale:2, useCORS:true, scrollX:0, scrollY:0, backgroundColor:'#ffffff'}, jsPDF:{unit:'pt', format:'a4', orientation:'portrait'}, pagebreak:{ mode:['css','legacy'] } };
/* Rendert willekeurige documenthtml (via htmlFn(klant)) in een tijdelijk, voor de gebruiker onzichtbaar
   element, zodat html2pdf.js er een PDF van kan maken zonder dat er iets op het scherm flitst. Generiek
   gemaakt zodat elk documenttype (IB, VPB, en toekomstige) dezelfde PDF-plumbing hergebruikt i.p.v. een
   eigen kopie.
   BELANGRIJK: eerdere versie plaatste dit element ver buiten de pagina (left:-99999px). Daardoor leverde
   html2canvas soms een volledig LEEG canvas/PDF op — een bekend probleem: html2canvas berekent het te
   fotograferen gebied op basis van getBoundingClientRect(), en bij zulke extreme negatieve posities valt
   dat gebied buiten wat de (intern door html2canvas gekloonde) pagina daadwerkelijk rendert. Oplossing:
   het element blijft op een "normale" plek (links­boven, binnen het document), maar wordt onzichtbaar
   gemaakt met een negatieve z-index (zit dus achter de rest van de pagina) i.p.v. buiten beeld geschoven. */
function maakVerborgenDocumentElement(htmlFn, klant){
  const el = document.createElement('div');
  // Belangrijk: onze document-templates zijn ontworpen op een WITTE achtergrond met donkere tekst.
  // In dark mode zouden CSS-variabelen die de templates gebruiken (bijv. --text) donker worden en zou
  // html2canvas een onleesbare PDF genereren. Deze wrapper forceert daarom altijd light-mode kleuren
  // door color-scheme:light én een expliciete witte achtergrond op de wrapper te zetten.
  el.style.position = 'fixed'; el.style.top = '0'; el.style.left = '0'; el.style.zIndex = '-1000';
  el.style.pointerEvents = 'none'; el.style.background = '#ffffff'; el.style.color = '#0f172a';
  el.style.colorScheme = 'light';
  el.setAttribute('data-theme', 'light'); // schakelt eventuele [data-theme=dark] regels uit binnen deze subtree
  el.innerHTML = htmlFn(klant);
  document.body.appendChild(el);
  return el;
}
async function genereerDocumentPdfBase64(htmlFn, klant, bestandsnaam){
  if(typeof html2pdf === 'undefined') throw new Error('PDF-bibliotheek kon niet worden geladen (geen internetverbinding?).');
  const el = maakVerborgenDocumentElement(htmlFn, klant);
  try{
    const opt = Object.assign({filename: bestandsnaam}, AKKOORD_PDF_OPTS);
    const dataUri = await html2pdf().set(opt).from(el.firstElementChild).outputPdf('datauristring');
    return dataUri.slice(dataUri.indexOf(',')+1);
  } finally {
    document.body.removeChild(el);
  }
}
function downloadDocumentPdf(htmlFn, klant, bestandsnaam){
  if(typeof html2pdf === 'undefined'){ toast('PDF-bibliotheek kon niet worden geladen (geen internetverbinding?).'); return; }
  let el;
  try{
    el = maakVerborgenDocumentElement(htmlFn, klant);
  }catch(e){
    toast('Kon documentinhoud niet opbouwen: ' + (e && e.message ? e.message : e));
    console.error('downloadDocumentPdf HTML-fout:', e);
    return;
  }
  const bron = el.firstElementChild;
  if(!bron){
    toast('Interne fout: documentinhoud is leeg. Controleer of alle velden ingevuld zijn.');
    console.error('downloadDocumentPdf: el.firstElementChild is null', el);
    try{ document.body.removeChild(el); }catch(_e){}
    return;
  }
  const opt = Object.assign({filename: bestandsnaam}, AKKOORD_PDF_OPTS);
  toast('PDF wordt aangemaakt…');
  html2pdf().set(opt).from(bron).save()
    .then(()=>{ toast('PDF gedownload: ' + bestandsnaam); })
    .catch(err=>{
      toast('PDF-generatie mislukt: ' + (err && err.message ? err.message : err));
      console.error('downloadDocumentPdf html2pdf-fout:', err);
    })
    .finally(()=>{ try{ document.body.removeChild(el); }catch(_e){} });
}

   een echte verstuur-knop, net als de IB/VPB-akkoordverklaringen. Tekst is 1-op-1 overgenomen uit het
   geuploade sjabloon "Arbeidsovereenkomst DGA concept.docx"; alleen de expliciete invulplekken (namen,
   adres, geboortedata, datums, salaris) zijn vervangen door de klantgegevens. De ondertekendatum wordt,
   net als bij de andere documenten, altijd automatisch ingevuld met vandaag. */
function aanhefLangDga(a){ return a==='Mw' ? 'mevrouw' : 'de heer'; }
function arbeidsovereenkomstDgaValidatie(klant){
  const ao = klant.arbeidsovereenkomstDga;
  if(!ao) return 'Geen gegevens ingevuld voor deze klant. Vul deze eerst in bij "Bewerken".';
  const ontbreekt = [];
  if(!ao.bestuurderNaam) ontbreekt.push('naam bestuurder');
  if(!ao.bestuurderGeboortedatum) ontbreekt.push('geboortedatum bestuurder');
  if(!ao.dgaNaam) ontbreekt.push('naam DGA');
  if(!ao.dgaStraat) ontbreekt.push('straat + huisnummer DGA');
  if(!ao.dgaPostcode) ontbreekt.push('postcode DGA');
  if(!ao.dgaPlaats) ontbreekt.push('woonplaats DGA');
  if(!ao.dgaGeboortedatum) ontbreekt.push('geboortedatum DGA');
  if(!ao.datumBesluitBestuurder) ontbreekt.push('datum besluit bestuurderswijziging');
  if(!ao.datumBesluitActiviteiten) ontbreekt.push('datum besluit activiteitenwijziging');
  if(!ao.datumIndiensttreding) ontbreekt.push('datum indiensttreding');
  if(!ao.salarisBedrag) ontbreekt.push('salaris');
  if(!ao.ondertekeningsplaats) ontbreekt.push('ondertekeningsplaats');
  if(!klant.email) ontbreekt.push('e-mailadres van de klant');
  if(ontbreekt.length) return `Vul eerst het volgende in bij "Bewerken" vóór je dit document verstuurt: ${ontbreekt.join(', ')}.`;
  return null;
}
function arbeidsovereenkomstDgaHTML(klant){
  const ao = klant.arbeidsovereenkomstDga;
  const vandaag = fmtDatumLang(new Date());
  const stip = (n)=> '.'.repeat(n);
  return `
  <div style="font-family: Arial, Helvetica, sans-serif; font-size:10.5pt; color:#1a1a1a; line-height:1.5; padding:40px 48px; width:718px; box-sizing:border-box; background:#fff;">
    <div style="text-align:center; font-weight:700; font-size:12.5pt; margin-bottom:22px;">ARBEIDSOVEREENKOMST BV DGA</div>

    <p style="margin:0 0 12px;">De ondergetekenden:</p>

    <p style="margin:0 0 10px;">1. ${klant.naam}, ten deze vertegenwoordigd door ${ao.bestuurderNaam} geboren op ${ao.bestuurderGeboortedatum}, hierna te noemen: <b>werkgever</b></p>

    <p style="margin:0 0 10px;">en</p>

    <p style="margin:0 0 14px;">2. ${aanhefLangDga(ao.dgaAanhef)} ${ao.dgaNaam}, wonende te ${ao.dgaPlaats}; ${ao.dgaStraat}; ${ao.dgaPostcode}, geboren op ${ao.dgaGeboortedatum}, hierna te noemen: <b>werknemer</b>,</p>

    <p style="margin:0 0 10px;">in aanmerking nemende dat:</p>

    <p style="margin:0 0 18px;">- in de algemene vergadering d.d. ${ao.datumBesluitBestuurder} is besloten tot vastlegging c.q. wijziging van bestuurder en d.d. ${ao.datumBesluitActiviteiten} wijzigingen van actieve activiteiten als bestuurder de arbeidsvoorwaarden van de directeur-grootaandeelhouder in onderstaande overeenkomst worden vastgelegd.</p>

    <p style="margin:0 0 18px;">verklaren een arbeidsovereenkomst met elkaar te zijn aangegaan onder de volgende voorwaarden:</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 1</div>
    <p style="margin:0 0 6px;">1. Werkgever neemt werknemer in dienst in de functie van <i>directeur</i>.</p>
    <p style="margin:0 0 6px;">2. De taak van werknemer is het leiden van de onderneming van werkgever in de ruimste zin van het woord.</p>
    <p style="margin:0 0 6px;">3. Werknemer heeft alle rechten, verplichtingen en bevoegdheden van een bestuurder in de zin van Boek 2 van het Burgerlijk Wetboek, indien en voor zover deze niet door de statuten van ${klant.naam}, zijn beperkt of uitgebreid.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 2</div>
    <p style="margin:0 0 6px;">1. De dienstbetrekking vangt aan op ${ao.datumIndiensttreding} en is aangegaan voor <i>onbepaalde tijd</i>. Werknemer is aangesteld in een voltijdsdienstverband.</p>
    <p style="margin:0 0 6px;">2. Hetgeen in de statuten van de bv is bepaald omtrent beëindiging van de dienstbetrekking geldt.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 3</div>
    <p style="margin:0 0 6px;">1. Bij het aangaan van deze overeenkomst bedraagt het salaris ${fmtEUR(ao.salarisBedrag)} bruto per maand ${ao.vakantietoeslagInclusief ? 'inclusief' : 'exclusief'} vakantietoeslag.</p>
    <p style="margin:0 0 6px;">2. Het salaris wordt uitbetaald op uiterlijk de laatste werkdag van de maand op een door werknemer aan werkgever op te geven bankrekeningnummer.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 4</div>
    <p style="margin:0 0 6px;">1. Werknemer ontvangt van werkgever een vaste onkostenvergoeding van het maximum vastgestelde % in het kader van de werkkostenregeling per maand. Deze onkostenvergoeding is bedoeld ter dekking van kosten van geringe uitgaven (o.a. koffie en versnaperingen onderweg etc.) welke niet als gerichte vrijstellingen kunnen worden gedeclareerd of vanuit praktische overwegingen niet worden gedeclareerd t.b.v. de functie directeur.</p>
    <p style="margin:0 0 6px;">2. Overige door werknemer gemaakte kosten ten behoeve van de dienstbetrekking worden op declaratiebasis vergoed.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 5</div>
    <p style="margin:0 0 6px;">Werknemer heeft recht op 25 vakantiedagen per jaar bij een voltijdsdienstverband.</p>
    <p style="margin:0 0 6px;">Het vakantiejaar loopt van 1 januari tot en met 31 december.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 6</div>
    <p style="margin:0 0 6px;">1. Bij arbeidsongeschiktheid van werknemer zal werkgever gedurende de eerste 24 maanden 80% van het salaris doorbetalen.</p>
    <p style="margin:0 0 6px;">2. Doorbetaling van het salaris tijdens arbeidsongeschiktheid zal niet plaatsvinden indien en voor zover werknemer een uitkering uit een arbeidsongeschiktheidsverzekering ontvangt.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 7</div>
    <p style="margin:0 0 6px;">Werkgever zal aan werknemer geen pensioenrechten verlenen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 8</div>
    <p style="margin:0 0 6px;">Werknemer is zowel tijdens de duur als na het beëindigen van deze arbeidsovereenkomst gehouden tot strikte geheimhouding van alles wat hem omtrent de onderneming van werkgever als die van opdrachtgevers, relaties en/of cliënten op welke wijze dan ook bekend is geworden en waaromtrent hem geheimhouding is opgelegd of waarvan hij het vertrouwelijk karakter redelijkerwijs kan vermoeden.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 9</div>
    <p style="margin:0 0 6px;">1. Op deze arbeidsovereenkomst is uitsluitend het Nederlandse recht van toepassing.</p>
    <p style="margin:0 0 18px;">2. Alle geschillen, die naar aanleiding van deze overeenkomst tussen werkgever en werknemer mochten ontstaan, zullen worden beslist door de bevoegde rechter in het arrondissement waarin werkgever gevestigd is.</p>

    <p style="margin:24px 0 30px;">Aldus overeengekomen en in tweevoud opgemaakt en ondertekend te ${ao.ondertekeningsplaats} op ${vandaag}.</p>

    <div style="display:flex; gap:70px; font-weight:700; margin-bottom:34px;">
      <div>Werkgever</div>
      <div>Werknemer</div>
    </div>
    <div style="display:flex; gap:70px;">
      <div>${stip(34)}</div>
      <div>${stip(34)}</div>
    </div>
    <div style="display:flex; gap:70px; margin-top:6px; font-size:10pt;">
      <div>${klant.naam}</div>
      <div>${ao.dgaNaam}</div>
    </div>
    <div style="margin-top:14px;">Namens deze: ${ao.bestuurderNaam}</div>
  </div>`;
}
function arbeidsovereenkomstDgaMailBodyHTML(klant){
  const naam = (klant.contact || klant.naam || '').trim();
  const boekhouderNaam = (bh(klant.bh)||{naam:'AdministratieBox'}).naam;
  return `<div style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#1a1a1a;">
    <p>Beste ${naam || klant.naam},</p>
    <p>Bijgaand ontvangt u de arbeidsovereenkomst voor de DGA van ${klant.naam}. Wilt u deze controleren, ondertekenen en aan ons retourneren?</p>
    <p>Met vriendelijke groet,<br>${boekhouderNaam}<br>AdministratieBox</p>
  </div>`;
}
function arbeidsovereenkomstDgaBestandsnaam(klant){
  return `Arbeidsovereenkomst DGA - ${klant.naam}.pdf`.replace(/[\/\\:*?"<>|]/g,'').replace(/\s+/g,' ').trim();
}
function genereerArbeidsovereenkomstDgaPdfBase64(klant){
  return genereerDocumentPdfBase64(arbeidsovereenkomstDgaHTML, klant, arbeidsovereenkomstDgaBestandsnaam(klant));
}
function downloadArbeidsovereenkomstDgaPdf(klant){
  downloadDocumentPdf(arbeidsovereenkomstDgaHTML, klant, arbeidsovereenkomstDgaBestandsnaam(klant));
}
/* ============================= DOCUMENT: MANAGEMENTOVEREENKOMST DGA =============================
   Overeenkomst tussen twee gekoppelde klanten: deze klant ("de vennootschap"/werkmaatschappij) en een
   gekoppelde Holding B.V. ("Management B.V.", klant.managementovereenkomstDga.holdingKlantId) — zelfde
   koppel-patroon als het fiscale-eenheid-verzoek, maar dit document hoort wél onder "Documenten" met een
   echte verstuur-knop (het is een overeenkomst tussen de partijen, geen brief aan de Belastingdienst).
   "Gevestigd te" van beide vennootschappen wordt hergebruikt uit hun eigen VPB-vestigingsplaats
   (klant.vpb.plaats) i.p.v. nog een keer apart ingevoerd te worden. */
function managementovereenkomstDgaValidatie(klant){
  const mo = klant.managementovereenkomstDga;
  if(!mo) return 'Geen gegevens ingevuld voor deze klant. Vul deze eerst in bij "Bewerken".';
  const holding = RAW_KLANTEN.find(k=>k.id===mo.holdingKlantId);
  const ontbreekt = [];
  if(!holding) ontbreekt.push('gekoppelde Holding B.V. (koppel een bestaande klant)');
  if(!mo.bestuurderNaam) ontbreekt.push('naam bestuurder/manager');
  if(!mo.datumBenoemingBestuurder) ontbreekt.push('datum benoeming bestuurder');
  if(!mo.ingangsdatum) ontbreekt.push('ingangsdatum');
  if(!mo.managementfeeBedrag) ontbreekt.push('managementfee');
  if(!mo.managementfeeBedragInWoorden) ontbreekt.push('managementfee in woorden');
  if(!mo.eersteJaarAanpassing) ontbreekt.push('eerste jaar tariefaanpassing');
  if(!mo.ondertekeningsplaats) ontbreekt.push('ondertekeningsplaats');
  if(!klant.vpb || !klant.vpb.plaats) ontbreekt.push('vestigingsplaats van deze vennootschap (zie VPB-gegevens bij "Bewerken")');
  if(holding && (!holding.vpb || !holding.vpb.plaats)) ontbreekt.push('vestigingsplaats van de Holding (zie VPB-gegevens van die klant)');
  if(!klant.email) ontbreekt.push('e-mailadres van de klant');
  if(ontbreekt.length) return `Vul eerst het volgende in bij "Bewerken" vóór je dit document verstuurt: ${ontbreekt.join(', ')}.`;
  return null;
}
function managementovereenkomstDgaHTML(klant){
  const mo = klant.managementovereenkomstDga;
  if(!mo) throw new Error('managementovereenkomstDga is niet aanwezig op klant');
  const holding = RAW_KLANTEN.find(k=>k.id===mo.holdingKlantId) || {naam:'(Holding niet gekoppeld)', vpb:{plaats:'...'}};
  const holdingPlaats = (holding.vpb && holding.vpb.plaats) || '...';
  const klantPlaats = (klant.vpb && klant.vpb.plaats) || '...';
  const aanhefLang = aanhefLangDga(mo.bestuurderAanhef);
  const vandaag = fmtDatumLang(new Date());
  const stip = (n)=> '.'.repeat(n);
  return `
  <div style="font-family: Arial, Helvetica, sans-serif; font-size:10.5pt; color:#1a1a1a; line-height:1.5; padding:40px 48px; width:718px; box-sizing:border-box; background:#fff;">
    <div style="text-align:center; font-weight:700; text-decoration:underline; font-size:12.5pt; margin-bottom:22px;">MANAGEMENTOVEREENKOMST</div>

    <p style="margin:0 0 10px;"><b>De ondergetekenden</b>:</p>

    <p style="margin:0 0 10px;">1. De besloten vennootschap met beperkte aansprakelijkheid <b>${holding.naam}</b>, gevestigd te ${holdingPlaats}, rechtsgeldig vertegenwoordigd door haar directeur ${aanhefLang} ${mo.bestuurderNaam}, hierna genoemd: "Management B.V."</p>

    <p style="margin:0 0 10px;">en</p>

    <p style="margin:0 0 16px;">2. De besloten vennootschap met beperkte aansprakelijkheid <b>${klant.naam}</b>, gevestigd te ${klantPlaats}, rechtsgeldig vertegenwoordigd door ${holding.naam}, de besloten vennootschap met beperkte aansprakelijkheid rechtsgeldig vertegenwoordigd door haar directeur ${aanhefLang} ${mo.bestuurderNaam}, hierna genoemd: "de vennootschap"</p>

    <p style="margin:0 0 8px;"><b>In aanmerking nemende dat:</b></p>
    <p style="margin:0 0 6px;">- ${aanhefLang} ${mo.bestuurderNaam}, voormeld (hierna tevens genoemd: "Manager"), enige aandeelhouder en tevens enige statutair directeur is van Management B.V.;</p>
    <p style="margin:0 0 6px;">- Management B.V. d.d. ${mo.datumBenoemingBestuurder} is benoemd tot bestuurder van de vennootschap met de titel directeur;</p>
    <p style="margin:0 0 6px;">- de vennootschap het management van haar onderneming (mede) aan Management B.V. wenst op te dragen, met ingang van ${mo.ingangsdatum};</p>
    <p style="margin:0 0 6px;">- Management B.V. bereid is het gewenste management op zich te nemen per voormelde datum, één en ander onder de voorwaarden als hierna omschreven;</p>
    <p style="margin:0 0 18px;">- dat partijen in deze overeenkomst de afspraken omtrent het management en de directievoering van de vennootschap nader wensen vast te leggen.</p>

    <p style="margin:0 0 18px;"><b>Verklaren te zijn overeengekomen als volgt:</b></p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 1. Opdracht</div>
    <p style="margin:0 0 6px;">1.1 Management B.V. is met ingang van ${mo.ingangsdatum} benoemd tot directeur van de vennootschap; als zodanig heeft zij alle rechten en verplichtingen, taken en bevoegdheden, die in de statuten van de vennootschap aan de directeur zijn toegekend, respectievelijk opgelegd.</p>
    <p style="margin:0 0 6px;">1.2 Management B.V. zal met ingang van ${mo.ingangsdatum} en voor de duur van deze overeenkomst als bepaald in artikel 4, haar opdracht vervullen met inachtneming van de wettelijke voorschriften geldend voor het bestuur van vennootschappen, de statutaire bepalingen, besluiten en richtlijnen van de bevoegde organen van de vennootschap en voorts met inachtneming van de bepalingen van deze overeenkomst. Management B.V. is voorts verplicht alles te doen en na te laten wat een goed directeur behoort te doen en na te laten en zal zich naar beste vermogen inzetten om de belangen van de vennootschap -en de daaraan verbonden ondernemingen- zoveel mogelijk te bevorderen.</p>
    <p style="margin:0 0 6px;">1.3 Voor de feitelijke uitvoering van voormelde opdracht wordt Manager door Management B.V. ingezet. Management B.V. is niet bevoegd naast of in plaats van Manager ook andere personen in te zetten voor de feitelijke uitvoering van de hiervoor vermelde opdracht, tenzij met voorafgaande schriftelijke toestemming door de vennootschap, aan welke toestemming door de vennootschap voorwaarden kunnen worden verboden.</p>
    <p style="margin:0 0 6px;">1.4 Management B.V. staat ervoor in dat Manager en de andere door Management B.V. ingezette personen als omschreven in artikel 1.3 voor de uitvoering van de opdracht voldoende arbeid, vlijt en kennis ten dienste van de vennootschap zullen stellen en dat de hiervoor bedoelde personen de statuten, besluiten en richtlijnen van de bevoegde organen van de vennootschap zullen naleven.</p>
    <p style="margin:0 0 6px;">1.5 Management B.V. verplicht zich tevens de vennootschappen waarin de vennootschap direct of indirect aandeelhouder zal zijn (hierna te noemen de "Groepsmaatschappijen") te zullen besturen.</p>
    <p style="margin:0 0 18px;">1.6 Management B.V. en Manager (laatstgenoemde in zijn hoedanigheid van enig aandeelhouder en statutair bestuurder van Management B.V.) verplichten zich om al hun arbeidstijd en -kracht ter beschikking te stellen voor de uitoefening van de op elk van hen rustende taken en verantwoordelijkheden en zich te onthouden van directe of indirecte betrokkenheid bij nevenactiviteiten welke substantiële inspanningen vergen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 2. Managementfee</div>
    <p style="margin:0 0 6px;">2.1 Ter vergoeding van de door Management B.V. in het kader van deze overeenkomst te verrichten diensten is de vennootschap aan Management B.V. een managementfee verschuldigd ten belope van ${fmtEUR(mo.managementfeeBedrag)} (zegge ${mo.managementfeeBedragInWoorden}) exclusief btw per maand, welke maandelijks wordt voldaan. Daarnaast vergoedt de vennootschap aan Management B.V. in het belang van de uitvoering van deze overeenkomst gemaakte kosten. Deze kosten zullen door Management B.V. worden gemotiveerd en gespecificeerd. Over de vergoedingen zal btw worden berekend, tenzij dit als gevolg van het bestaan van een fiscale eenheid voor de omzetbelasting achterwege gelaten kan worden.</p>
    <p style="margin:0 0 6px;">2.2 De volgende kosten zullen door Management B.V. zelf worden gedragen: eigen beheerskosten.</p>
    <p style="margin:0 0 6px;">2.3 Met ingang van 1 januari van ieder jaar -voor het eerst in ${mo.eersteJaarAanpassing}- zal de managementfee in onderling overleg kunnen worden aangepast (o.a. in verband met prijscompensatie/inflatiecorrectie). Instemming van de vennootschap is vereist.</p>
    <p style="margin:0 0 6px; font-style:italic;">2.4 De vennootschap zal aan Management B.V. een bedrijfswagen ter beschikking (doen) stellen, dan wel een nader overeen te komen vergoeding aan Management B.V. verstrekken ten behoeve van een auto voor Manager.</p>
    <p style="margin:0 0 6px;">2.5 Indien Management B.V. door ziekte van Manager in enig kalenderjaar niet in staat is op alle overeengekomen werkdagen ten behoeve van de vennootschap werkzaam te zijn, wordt de managementfee na zes maanden aaneengesloten ziekte verminderd met 50% (vijftig procent), totdat Manager hersteld is dan wel deze overeenkomst beëindigd is. Onder aaneengesloten ziekte wordt mede verstaan dat Manager tussen twee of meer periodes van ziekte minder dan 2 weken achter elkaar hersteld is.</p>
    <p style="margin:0 0 18px;">2.6 Partijen hebben zich ervan vergewist dat heffing van loonbelasting en werknemersverzekeringspremies ter zake van de uit te betalen managementvergoedingen sub 2 achterwege kan blijven.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 3. Externe werkzaamheden, geheimhouding, bescheiden</div>
    <p style="margin:0 0 6px;">1. Management B.V. is verplicht, zowel gedurende de looptijd van deze overeenkomst als na beëindiging daarvan, strikte geheimhouding te betrachten omtrent alle aangelegenheden van de vennootschap en de daaraan verbonden ondernemingen, waarvan het vertrouwelijke karakter geacht kan worden haar bekend te zijn. Het voorgaande lijdt uitzondering voor zover nodig in het kader van de nominale uitvoering door Management B.V. van haar opdracht.</p>
    <p style="margin:0 0 6px;">2. Alle correspondentie, documenten en andere zaken met inbegrip van kopieën ter zake van de vennootschap en de daaraan verbonden ondernemingen, welke Management B.V. onder zich heeft of krijgt, zijn en blijven eigendom van de vennootschap en zullen bij beëindiging van deze overeenkomst terstond aan de vennootschap ter beschikking worden gesteld.</p>
    <p style="margin:0 0 18px;">3. Bij overtreding van artikel 3 lid 1 en lid 2 door Management B.V. en/of bij Management B.V. in dienst zijnde personeelsleden zal Management B.V. jegens de vennootschap een direct opeisbare en niet voor rechterlijke matiging vatbare boete verbeuren van € 5.000 voor iedere overtreding en € 500 voor iedere dag dat zodanige overtreding voortduurt, onverminderd het recht van de vennootschap volledige vergoeding van haar schade te vorderen, alsmede in rechte een verbod tot stopzetting daarvan te vorderen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 4. Looptijd en beëindiging</div>
    <p style="margin:0 0 6px;">4.1 Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door ieder der partijen te allen tijde worden beëindigd door opzegging aan de wederpartij met inachtneming, van een opzegtermijn van drie maanden.</p>
    <p style="margin:0 0 6px;">4.2 Indien een der partijen een of meer van haar uit deze overeenkomst voortvloeiende verplichtingen niet, niet tijdig of niet behoorlijk nakomt, en niet binnen dertig dagen nadat de andere partij haar schriftelijk in gebreke heeft gesteld, alsnog voor een juiste nakoming van deze overeenkomst zorgdraagt, zal de andere partij deze overeenkomst kunnen opzeggen zonder tot inachtneming van enige opzegtermijn gehouden te zijn.</p>
    <p style="margin:0 0 6px;">4.3 Ieder der partijen is gerechtigd deze overeenkomst met onmiddellijke ingang zonder dat rechterlijke tussenkomst vereist is, te beëindigen indien de andere partij in staat van faillissement wordt verklaard dan wel een aanvraag daartoe is ingediend, indien aan haar surséance van betaling wordt verleend, een regeling met al haar crediteuren treft of wordt ontbonden of in liquidatie treedt;</p>
    <p style="margin:0 0 6px;">4.4 De vennootschap is bovendien gerechtigd deze overeenkomst met onmiddellijke ingang, zonder dat rechterlijke tussenkomst vereist is, te beëindigen indien:</p>
    <p style="margin:0 0 4px; padding-left:16px;">a) Management B.V. niet langer aandeelhoudster is van ten minste 25% van het geplaatste aandelenkapitaal van de vennootschap.</p>
    <p style="margin:0 0 4px; padding-left:16px;">b) Management B.V. Manager als statutair bestuurder van Management B.V. ontslaat en/of indien aan het dienstverband van Manager met Management B.V. om welke reden dan ook een einde komt casu quo indien Manager om welke reden dan ook niet langer statutair directeur van Management B.V. is.</p>
    <p style="margin:0 0 4px; padding-left:16px;">c) Manager is overleden of ten gevolge van langdurige arbeidsongeschiktheid niet meer in staat is zijn arbeidskracht ter beschikking van Management B.V. en/of de vennootschap te stellen. Als langdurige arbeidsongeschiktheid zal gelden een aaneengesloten periode van 12 maanden of langer, waarbij een tussentijdse hervatting, van de werkzaamheden gedurende twee weken of minder niet geacht wordt de aaneengesloten periode te doorbreken.</p>
    <p style="margin:0 0 10px; padding-left:16px;">d) in strijd wordt gehandeld met een der bepalingen van artikel 3 van deze overeenkomst.</p>
    <p style="margin:0 0 6px;">4.5 Iedere opzegging dient te geschieden bij een aan de wederpartij gericht aangetekend schrijven, dan wel deurwaardersexploot.</p>
    <p style="margin:0 0 6px;">4.6 Management B.V. zal in geval van beëindiging van deze overeenkomst op eerste verzoek van de vennootschap alle functies neerleggen welke zij ter uitvoering van deze overeenkomst vervult bij de vennootschap of bij de met de vennootschap gelieerde ondernemingen. Management B.V. zal tevens volledige medewerking verlenen aan de overdracht van haar taken aan haar opvolger, en alle documentatie en informatie met betrekking tot de zaken van de vennootschap waarover zij beschikt aan de vennootschap ter beschikking stellen. Management B.V. zal bewerkstelligen dat Manager het in dit artikellid bepaalde eveneens zal doen. Management B.V. en/of Manager kunnen jegens de vennootschap geen aanspraak maken op enigerlei vergoeding voor de verplichtingen uit hoofde van dit artikellid.</p>
    <p style="margin:0 0 18px;">4.7 Het bepaalde in dit artikel laat onverlet de mogelijkheid van ieder der partijen tot het instellen van andere rechtsmiddelen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 5. Slotbepalingen</div>
    <p style="margin:0 0 6px;">5.1 Partijen verklaren over en weer de verbintenissen uit deze overeenkomst bij deze te aanvaarden en alle medewerking te verlenen aan de uitvoering of toepassing van deze overeenkomst en alle handelingen te verrichten welke in de ruimste zin daarmede verband houden.</p>
    <p style="margin:0 0 6px;">5.2 Partijen stellen vast dat buiten deze overeenkomst geen mondelinge overeenkomsten tussen hen tot stand gekomen zijn in strijd hiermee, in afwijking hiervan of in aanvulling hierop. Na de totstandkoming van deze overeenkomst zullen afwijkingen hiervan of aanvullingen hierop alleen in schriftelijke vorm overeengekomen worden en alleen in deze vorm bindend zijn.</p>
    <p style="margin:0 0 6px;">5.3 Partijen zien af van het recht om jegens elkaar ontbinding van deze overeenkomst te vorderen op grond van het bepaalde in de artikelen 6:265 en 6:266 van het Burgerlijk Wetboek.</p>
    <p style="margin:0 0 6px;">5.4 Op deze overeenkomst is uitsluitend het Nederlandse recht van toepassing.</p>
    <p style="margin:0 0 26px;">5.5 Geschillen met betrekking tot deze overeenkomst zullen worden voorgelegd aan de bevoegde Nederlandse rechter.</p>

    <p style="margin:0 0 30px;">Aldus overeengekomen en in tweevoud opgemaakt en ondertekend te ${mo.ondertekeningsplaats} op ${vandaag}.</p>

    <table style="width:100%; border-collapse:collapse; margin-bottom:8px;"><tr>
      <td style="width:50%; vertical-align:top; padding-right:35px;">${stip(34)}</td>
      <td style="width:50%; vertical-align:top; padding-left:35px;">${stip(34)}</td>
    </tr></table>
    <table style="width:100%; border-collapse:collapse; font-size:10pt;"><tr>
      <td style="width:50%; vertical-align:top; padding-right:35px;"><b>1. ${holding.naam}</b>,<br>namens deze: ${mo.bestuurderNaam}</td>
      <td style="width:50%; vertical-align:top; padding-left:35px;"><b>2. ${klant.naam}</b>,<br>namens deze: ${holding.naam}, namens deze: ${mo.bestuurderNaam}</td>
    </tr></table>
  </div>`;
}

/* "Documenten"-sectie op de klantkaart: het eerste van (naar verwachting) meerdere geautomatiseerde
   document-versturingen op deze plek, naast de bestaande "Automatische herinneringen". Bewust als eigen

  // boekjaar hebben) blijft ongewijzigd; nieuwere documenttypes zonder boekjaar (bijv. de DGA-
  // overeenkomsten) geven hun eigen, simpelere logRegel mee.
  const logRegel = opts.logRegel || (l=>`${opts.logLabel} ${l.boekjaar} verstuurd naar ${l.naar}`);
  return `<div style="border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px;">
    <div style="font-weight:700; font-size:12.5px;">${opts.titel}</div>
    <div style="font-size:11.5px; color:var(--muted); margin:4px 0 10px;">${opts.uitleg}</div>

      <button class="btn sm" ${opts.previewAttr}>⬇ Voorbeeld downloaden</button>
      <button class="btn sm primary" ${opts.sendAttr} ${opts.actief?'':'disabled title="Staat op hold — zie Instellingen"'}><i class="ti ti-send" aria-hidden="true"></i> Versturen</button>
    </div>
    <div class="rem-log" style="margin-top:10px;">
      <b style="font-size:12px;">Verzendgeschiedenis</b>
      ${opts.log.length ? opts.log.slice().reverse().map(l=>`<div class="rem-log-item"><i class="ti ti-mail" aria-hidden="true"></i> ${logRegel(l)} — ${fmtDate(l.ts)}</div>`).join('') : '<div class="rem-log-empty">Nog geen documenten verstuurd.</div>'}
    </div>
  </div>`;
}

function openAddKlantPanel(silent){
  const panel = document.getElementById('panel'); const overlay = document.getElementById('overlay');
  panel.innerHTML = addKlantFormHTML();
  requestAnimationFrame(()=>{ panel.classList.add('open'); overlay.classList.add('open'); });
  document.querySelectorAll('[data-panel-focus]').forEach(el=>el.addEventListener('click', ()=>{
    const panel = document.getElementById('panel');
    if(panel){ panel.classList.toggle('is-focus'); }
  }));
  document.querySelector('[data-close-panel]').addEventListener('click', closePanel);
  document.querySelector('[data-save-new-klant]').addEventListener('click', ()=>{
    const naam = document.getElementById('newKlantNaam').value.trim();
    const bhId = document.getElementById('newKlantBh').value;
    if(!naam){ toast('Vul een klantnaam in.'); return; }
    if(!bhId){ toast('Voeg eerst een boekhouder toe.'); return; }
    const dateOrEmpty = (v)=> invoerNaarDatum(v);
    addKlant({
      naam, vorm:document.getElementById('newKlantVorm').value, bh:bhId,
      kvk:document.getElementById('newKlantKvk').value.trim(),
      extId:document.getElementById('newKlantExtId').value.trim(),
      contact:document.getElementById('newKlantContact').value.trim(),
      email:document.getElementById('newKlantEmail').value.trim(),
      tel:document.getElementById('newKlantTel').value.trim(),
      ob:dateOrEmpty(document.getElementById('newKlantOb').value), obHerh:document.getElementById('newKlantObHerh').value,
      vpb:dateOrEmpty(document.getElementById('newKlantVpb').value), vpbHerh:document.getElementById('newKlantVpbHerh').value,
      lh:dateOrEmpty(document.getElementById('newKlantLh').value), lhHerh:document.getElementById('newKlantLhHerh').value,
      jr:dateOrEmpty(document.getElementById('newKlantJr').value), jrHerh:document.getElementById('newKlantJrHerh').value,
      doetLoonaangifte:document.getElementById('newKlantLoonaangifte').checked,
      heeftDga:document.getElementById('newKlantDga').checked,
      salarisdossierWerknemer:document.getElementById('newKlantSalarisdossier').checked,
      staatOpHold:document.getElementById('newKlantOpHold').checked,
    });
    STATE.showAddKlant=false;
    toast('Klant toegevoegd: '+naam);
    render();
  });
}

/* ============================= HANDLERS ============================= */
// Elementen buiten #contentArea (de zoekbalk, de sidebar-navigatie, de sync-knop, de overlay) blijven
// bij een "lichte" update (alleen #contentArea vervangen) gewoon dezelfde DOM-node — zonder deze guard
// zou elke aanroep van attachHandlers()/attachHandlersLite() daar een NIEUWE listener bovenop de oude
// zetten. Bij honderden klanten en veel interacties per sessie stapelen die zich op, waardoor bijv. het
// zoekveld na verloop van tijd bij elke toetsaanslag de zware klantentabel-herbouw tien, twintig, dertig
// keer achter elkaar uitvoert — precies het "pagina reageert niet"-gedrag. bindOnce() zorgt dat zo'n
// element maar één keer per DOM-node een listener krijgt; na een volledige render() is de node sowieso
// vervangen en telt het weer opnieuw als "nog niet gebonden".
function bindOnce(el, event, handler){
  if(!el) return;
  const key = '__bound_'+event;
  if(el[key]) return;
  el[key] = true;
  el.addEventListener(event, handler);
}

function handleCSVUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let updated=0, skipped=0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<2) return;
      const [naam, saldoStr, txnStr] = parts;
      if(/^klant/i.test(naam) && /saldo/i.test(saldoStr||'')) return; // header row
      const match = RAW_KLANTEN.find(k=>k.naam.toLowerCase().includes(naam.toLowerCase()) || naam.toLowerCase().includes(k.naam.toLowerCase()));
      if(match){
        const saldo = parseFloat((saldoStr||'0').replace(',', '.')) || 0;
        STORE[match.id].saldo = saldo;
        if(txnStr!==undefined) STORE[match.id].txn = parseInt(txnStr)||0;
        STORE[match.id].sync = new Date().toISOString().slice(0,10);
        updated++;
      } else skipped++;
    });
    persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast(`CSV verwerkt: ${updated} klant(en) bijgewerkt${skipped?`, ${skipped} regel(s) niet herkend`:''}.`);
  };
  reader.readAsText(file);
}

/* ============================= BANKTRANSACTIE-IMPORT PER KLANT ============================= */
function computeTxnStats(rows){
  const hasStatusCol = rows.length > 0 && Object.keys(rows[0]).some(k=>k.toLowerCase().trim()==='status');
  let relevant = rows;
  if(hasStatusCol){
    relevant = rows.filter(r=> (findField(r,['Status'])||'').toLowerCase().includes('niet verwerkt'));
  }
  // Een bedrag mét minteken ervoor is een crediteur (credit), zonder minteken een debiteur (debet) —
  // deze twee worden apart opgeteld i.p.v. als één absolute som.
  let debetSaldo = 0, debetAantal = 0, creditSaldo = 0, creditAantal = 0;
  relevant.forEach(r=>{
    const bedrag = parseDutchAmount(findField(r,['Bedrag','Amount']));
    if(bedrag < 0){ creditSaldo += Math.abs(bedrag); creditAantal++; }
    else { debetSaldo += Math.abs(bedrag); debetAantal++; }
  });
  debetSaldo = Math.round(debetSaldo*100)/100;
  creditSaldo = Math.round(creditSaldo*100)/100;
  return {
    debetSaldo, debetAantal, creditSaldo, creditAantal,
    saldo: Math.round((debetSaldo+creditSaldo)*100)/100,
    aantal: relevant.length, totaalRegels: rows.length, hasStatusCol
  };
}
function guessKlantFromFilename(filename){
  const base = filename.replace(/\.(csv|xlsx|xls|txt)$/i,'');
  const prefix = base.split(/[-_]/)[0].trim();
  if(!prefix) return null;
  const match = RAW_KLANTEN.find(k=> k.naam.toLowerCase().includes(prefix.toLowerCase()) || prefix.toLowerCase().includes(k.naam.toLowerCase()));
  return match ? match.id : null;
}

function parseLhKlantNaam(raw){
  let s = (raw||'').trim();
  const parenIdx = s.indexOf('(');
  if(parenIdx > 0) s = s.slice(0, parenIdx).trim();
  return s.replace(/[.,]+$/,'').trim();
}
function normalizeKlantNaam(s){
  return (s||'').toLowerCase()
    .replace(/\bb\.?v\.?\b/g,'bv')
    .replace(/\bv\.?o\.?f\.?\b/g,'vof')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');
}
function vindKlantOpNaam(naam){
  const norm = normalizeKlantNaam(naam);
  if(!norm || norm.length < 3) return null;
  let match = RAW_KLANTEN.find(k => normalizeKlantNaam(k.naam) === norm);
  if(match) return match;
  const prefixMatches = RAW_KLANTEN.filter(k => {
    const kn = normalizeKlantNaam(k.naam);
    return kn && kn.length >= 4 && (norm.startsWith(kn) || kn.startsWith(norm));
  });
  return prefixMatches.length === 1 ? prefixMatches[0] : null;
}
function isLhMetaRow(v){
  if(v===undefined || v===null) return true;
  if(typeof v !== 'string') return true;
  const s = v.trim();
  if(s==='') return true;
  if(s.startsWith('Email')) return true;
  if(s==='Verwerker') return true;
  if(s.startsWith('Salarissen')) return true;
  if(s.startsWith('Salaris') && s.includes('betaallijst')) return true;
  if(s.startsWith('Aangifte')) return true;
  if(s.startsWith('LJP')) return true;
  if(/^let\s*op/i.test(s)) return true;
  if(s.toLowerCase().includes('ter info')) return true;
  if(BOEKHOUDERS.some(b=>b.naam && b.naam.trim()===s)) return true;
  return false;
}
function readLhExcelNamesPromise(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Bestand kon niet gelezen worden'));
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null});
        const names = [];
        const isBlankCell = (v)=> v===null || v===undefined || (typeof v==='string' && v.trim()==='');
        for(let r=0; r<grid.length; r++){
          const v = grid[r] && grid[r][0];
          if(typeof v==='string' && !isLhMetaRow(v)){
            const n1 = grid[r+1] && grid[r+1][0];
            const n2 = grid[r+2] && grid[r+2][0];
            const hasFollowup = (typeof n1==='string' && (n1.trim().startsWith('Email') || n1.trim()==='Verwerker')) ||
                                 (typeof n2==='string' && (n2.trim().startsWith('Email') || n2.trim()==='Verwerker'));
            // Elke echte werkgever-rij in dit bestand wordt vooraf gegaan door een lege rij (de blanco
            // scheidingsregel tussen twee werkgevers). Dit sluit ook de kop-rijen bovenaan het bestand
            // uit (bijv. de namen van de boekhouders zelf, die toevallig ook door "Verwerker" gevolgd
            // kunnen worden en anders ten onrechte als werkgever herkend zouden worden).
            const vorigeRijLeeg = r===0 || isBlankCell(grid[r-1] && grid[r-1][0]);
            if(hasFollowup && vorigeRijLeeg) names.push(v);
          }
        }
        resolve(names);
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
async function handleLhKlantenImport(e){
  // Haalt de resultaat-box telkens opnieuw op (in plaats van één keer vast te leggen), zodat een
  // eventuele tussentijdse her-render (bijv. door de periodieke sync) niet leidt tot een melding die
  // in een losstaand, onzichtbaar DOM-element terechtkomt — daardoor zou een gebruiker denken dat er
  // "niets gebeurt" terwijl de import eigenlijk wel (deels) gelukt of mislukt is.
  const getResultBox = ()=> document.getElementById('lhKlantenImportResult');
  try{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const box0 = getResultBox();
    if(box0) box0.innerHTML = '<div class="hint">Bestand wordt gelezen…</div>';
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek (XLSX) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina, en probeer het daarna opnieuw.');
    }
    const rawNames = await readLhExcelNamesPromise(file);
    if(!rawNames.length){
      const boxEmpty = getResultBox();
      if(boxEmpty) boxEmpty.innerHTML = `<div class="banner" style="border-color:var(--amber-brd); color:#8a4b06;"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Er zijn geen werkgevers herkend in "${String(file.name).replace(/</g,'&lt;')}". Controleer of dit het juiste bestand is en of de structuur (naam, daaronder "Email:", daaronder "Verwerker") ongewijzigd is.</div>`;
      return;
    }
    let nieuwGemarkeerd = 0, algeactiveerd = 0;
    const nietGevonden = [];
    rawNames.forEach(raw=>{
      const naam = parseLhKlantNaam(raw);
      const klant = vindKlantOpNaam(naam);
      if(!klant){ nietGevonden.push(raw); return; }
      if(klant.doetLoonaangifte){ algeactiveerd++; }
      else { klant.doetLoonaangifte = true; nieuwGemarkeerd++; }
    });
    logActiviteit(`LH-klantenimport uit "${file.name}": ${nieuwGemarkeerd} nieuw gemarkeerd, ${algeactiveerd} stonden al aan${nietGevonden.length ? `, ${nietGevonden.length} niet gevonden` : ''}`);
    persistMeta(); persist();
    const box = getResultBox();
    if(box){
      const escaped = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      box.innerHTML = `<div class="banner"><i class="ti ti-circle-check" aria-hidden="true"></i> <b>${rawNames.length}</b> werkgevers gevonden in "${escaped(file.name)}". `
        + `<b>${nieuwGemarkeerd}</b> klant(en) nieuw gemarkeerd met loonaangifte, <b>${algeactiveerd}</b> stonden al aan.`
        + (nietGevonden.length ? `<br><i class="ti ti-alert-triangle" aria-hidden="true"></i> <b>${nietGevonden.length}</b> niet gevonden op naam — voeg deze klant(en) toe of vink handmatig aan: ${nietGevonden.slice(0,30).map(escaped).join(', ')}${nietGevonden.length>30?', …':''}` : '')
        + `</div>`;
    }
    render();
  }catch(err){
    console.error('Loonheffing-klantenimport mislukt:', err);
    const boxErr = getResultBox();
    const msg = `<div class="banner" style="border-color:var(--red); color:var(--red);"><i class="ti ti-alert-circle" aria-hidden="true"></i> Fout bij inlezen: ${((err&&err.message)||err)}</div>`;
    if(boxErr) boxErr.innerHTML = msg; else alert('Fout bij inlezen van het Excel-bestand: '+((err&&err.message)||err));
  }
}
/* ============== KLANTENLIJST OPSCHONEN (admin) ==============
   Herstelt een klantenlijst met duplicaten aan de hand van een AdministratieBox-export als
   waarheidsbron. Duplicaten worden samengevoegd (het record met de meeste dossier-/loonheffing-
   gegevens blijft leidend en verliest niets), klanten die niet in de export staan worden alleen
   verwijderd als hun dossier leeg is — records met loonheffing- of andere ingevulde gegevens
   worden nooit stilletjes weggegooid. Werkt in twee stappen: eerst een voorbeeld, dan pas uitvoeren. */
let OPSCHOON_PLAN = null;
/* Bulk-deadlines (admin): stel in één keer een deadline + herhaling in voor een hele groep
   klanten. Werkt op zowel klant.dl als STORE.dl (effDL leest uit STORE). VPB/JR wordt
   automatisch overgeslagen bij rechtsvormen zonder VPB-plicht. */
/* Bulk-maandnotitie Loonheffingen: zet in één keer dezelfde maand-specifieke notitie bij een
   hele groep loonheffing-klanten (bijv. "WHK premies aanpassen!" voor januari). Idempotent:
   een klant die exact deze notitie voor die maand al heeft, wordt overgeslagen. */
function bulkLhMaandnotitie(opts){
  const { maand, tekst, doelgroep } = opts;
  const verslag = { geplaatst:0, overgeslagenDubbel:0 };
  const schoon = String(tekst||'').trim();
  if(!/^\d{4}-\d{2}$/.test(String(maand||'')) || !schoon) return verslag;
  RAW_KLANTEN.forEach(k=>{
    if(!k.doetLoonaangifte) return;
    if(doelgroep==='geen' && k.heeftDga) return;
    if(doelgroep==='dga' && !k.heeftDga) return;
    const f = STORE[k.id];
    if(!f || !f.lh) return;
    if(!Array.isArray(f.lh.maandNotities)) f.lh.maandNotities = [];
    if(f.lh.maandNotities.some(n=>n.maand===maand && String(n.tekst).trim()===schoon)){ verslag.overgeslagenDubbel++; return; }
    f.lh.maandNotities.push({ id:'mn'+Date.now()+Math.floor(Math.random()*100000), maand, tekst: schoon });
    verslag.geplaatst++;
  });
  const doelTekst = doelgroep==='geen' ? 'geen-DGA' : (doelgroep==='dga' ? 'DGA' : 'alle');
  logActiviteit(`Bulk-maandnotitie geplaatst voor ${maandLabelVanKey(maand)} bij ${verslag.geplaatst} ${doelTekst}-loonheffingklanten: "${schoon}"`);
  persistMeta(); persist();
  return verslag;
}
function bulkLhMaandnotitieVerwijderen(opts){
  const { maand, tekst, doelgroep } = opts;
  const verslag = { verwijderd:0, klanten:0 };
  const schoon = String(tekst||'').trim();
  if(!/^\d{4}-\d{2}$/.test(String(maand||'')) || !schoon) return verslag;
  RAW_KLANTEN.forEach(k=>{
    if(!k.doetLoonaangifte) return;
    if(doelgroep==='geen' && k.heeftDga) return;
    if(doelgroep==='dga' && !k.heeftDga) return;
    const f = STORE[k.id];
    if(!f || !f.lh || !Array.isArray(f.lh.maandNotities)) return;
    const voor = f.lh.maandNotities.length;
    f.lh.maandNotities = f.lh.maandNotities.filter(n=>!(n.maand===maand && String(n.tekst).trim()===schoon));
    if(f.lh.maandNotities.length < voor){ verslag.verwijderd += voor - f.lh.maandNotities.length; verslag.klanten++; }
  });
  logActiviteit(`Bulk-maandnotitie verwijderd voor ${maandLabelVanKey(maand)} bij ${verslag.klanten} klanten: "${schoon}"`);
  persistMeta(); persist();
  return verslag;
}
function lhBannerToevoegen(maand, tekst){
  const schoon = String(tekst||'').trim();
  if(!/^\d{4}-\d{2}$/.test(String(maand||'')) || !schoon) return false;
  LH_MAAND_BANNERS.push({ id:'lb'+Date.now()+Math.floor(Math.random()*1000), maand, tekst: schoon });
  logActiviteit(`Loonheffingen-maandbanner geplaatst voor ${maandLabelVanKey(maand)}: "${schoon}"`);
  persistMeta();
  return true;
}
function lhBannerVerwijderen(id){
  const idx = LH_MAAND_BANNERS.findIndex(b=>b.id===id);
  if(idx===-1) return false;
  const b = LH_MAAND_BANNERS[idx];
  LH_MAAND_BANNERS.splice(idx,1);
  logActiviteit(`Loonheffingen-maandbanner verwijderd (${maandLabelVanKey(b.maand)}): "${b.tekst}"`);
  persistMeta();
  return true;
}
function bulkDeadlineToepassen(opts){
  const { type, datumIso, herhaling, doelgroep, overschrijven } = opts;
  const verslag = { ingesteld:0, overgeslagenBestaand:0, overgeslagenNvt:0 };
  if(!['OB','VPB','LH','JR'].includes(type) || !datumIso) return verslag;
  RAW_KLANTEN.forEach(k=>{
    if(doelgroep==='loonheffing' && !k.doetLoonaangifte) return;
    if((type==='VPB' || type==='JR') && GEEN_VPB_VORMEN.includes(k.vorm)){ verslag.overgeslagenNvt++; return; }
    const f = STORE[k.id];
    if(!f) return;
    const bestaand = f.dl && f.dl[type];
    const heeftAl = bestaand && !bestaand.na && bestaand.datum;
    if(heeftAl && !overschrijven){ verslag.overgeslagenBestaand++; return; }
    const entry = { datum: datumIso, status:'open', herhaling: herhaling||'geen' };
    if(!f.dl) f.dl = {};
    f.dl[type] = Object.assign({}, entry);
    if(!k.dl) k.dl = {};
    k.dl[type] = Object.assign({}, entry);
    verslag.ingesteld++;
  });
  logActiviteit(`Bulk-deadline ingesteld: ${TYPE_LABEL[type]} op ${fmtDate(datumIso)} (${herhaling||'geen'} herhaling) voor ${verslag.ingesteld} klanten${verslag.overgeslagenBestaand?`, ${verslag.overgeslagenBestaand} overgeslagen (had al een deadline)`:''}`);
  persistMeta(); persist();
  return verslag;
}
function klantDossierScore(k){
  const f = STORE[k.id];
  let score = 0;
  if(k.doetLoonaangifte) score += 5000;
  if(k.heeftDga) score += 500;
  if(f){
    try{
      const lh = f.lh || {};
      if(Array.isArray(lh.taken) && lh.taken.some(t=>t && t.done)) score += 5000;
      if(Array.isArray(lh.log) && lh.log.length) score += lh.log.length * 100;
      if(lh.volgendeMaandNotitie) score += 200;
      if(Array.isArray(f.items) && f.items.length) score += f.items.length * 50;
      if(f.notities) score += 200;
      if(Array.isArray(f.log) && f.log.length) score += f.log.length * 20;
      ['akkoordLog','vpbAkkoordLog','fiscaleEenheidLog','betalingsuitstelLog','arbeidsovereenkomstDgaLog','managementovereenkomstDgaLog'].forEach(veld=>{
        if(Array.isArray(f[veld]) && f[veld].length) score += f[veld].length * 100;
      });
      ['OB','VPB','LH','JR'].forEach(t=>{
        const e = f.dl && f.dl[t];
        if(e && !e.na && e.datum) score += 100;
        if(e && e.status === 'ingediend') score += 100;
      });
      score += Math.min(2000, Math.round(JSON.stringify(f).length / 50));
    }catch(err){}
  }
  if(AUTOS.some(a=>a.klant===k.id)) score += 300;
  return score;
}
function maakOpschoonPlan(rows){
  const csvKlanten = [];
  rows.forEach(row=>{
    const naam = (findField(row, ['Bedrijfsnaam','Naam','Klantnaam'])||'').trim();
    const nummer = (findField(row,['Klantnummer'])||'').trim();
    if(naam) csvKlanten.push({ naam, nummer,
      kvk:(findField(row,['KvK nummer','KVK nummer','Kvk nummer'])||'').trim(),
      contact:(findField(row,['Contactpersoon'])||findField(row,['Voornaam'])||'').trim(),
      email:(findField(row,['E-mail','Email'])||'').trim(),
      tel:(findField(row,['Telefoon'])||'').trim(),
      vorm:(findField(row,['Rechtsvorm'])||'').trim() });
  });
  const opNummer = new Map(); const opNaam = new Map();
  csvKlanten.forEach(c=>{
    if(c.nummer) opNummer.set(c.nummer, c);
    const n = normalizeKlantNaam(c.naam);
    if(n) opNaam.set(n, c);
  });
  const groepen = new Map(); // csv-sleutel -> {csv, records:[]}
  const nietInExport = [];
  RAW_KLANTEN.forEach(k=>{
    let csv = (k.extId && opNummer.get(String(k.extId).trim())) || opNaam.get(normalizeKlantNaam(k.naam)) || null;
    if(!csv){ nietInExport.push(k); return; }
    const sleutel = csv.nummer || normalizeKlantNaam(csv.naam);
    if(!groepen.has(sleutel)) groepen.set(sleutel, { csv, records: [] });
    groepen.get(sleutel).records.push(k);
  });
  const dupGroepen = [];
  groepen.forEach(g=>{
    if(g.records.length > 1){
      g.records.sort((a,b)=>klantDossierScore(b)-klantDossierScore(a));
      dupGroepen.push(g);
    }
  });
  // De regel: klanten uit de export blijven + handmatig toegevoegde klanten blijven.
  // Handmatig toegevoegd = geen klantnummer/import-Id (alleen imports zetten extId).
  // Import-restanten (wel een extId, maar niet meer in de export) worden verwijderd.
  // Veiligheidsslot: een klant met loonheffing-gegevens wordt nooit verwijderd.
  const beschermd = nietInExport.filter(k=> !k.extId || k.doetLoonaangifte);
  const teVerwijderen = nietInExport.filter(k=> k.extId && !k.doetLoonaangifte);
  const nieuwUitExport = csvKlanten.filter(c=>{
    const sleutel = c.nummer || normalizeKlantNaam(c.naam);
    return !groepen.has(sleutel);
  });
  return { csvKlanten, groepen, dupGroepen, teVerwijderen, beschermd, nieuwUitExport,
    dubbeleRecords: dupGroepen.reduce((s,g)=>s+g.records.length-1, 0) };
}
function voegDossierSamen(keeperId, dupId){
  const K = STORE[keeperId]; const D = STORE[dupId];
  if(!K || !D) return;
  const keeperKlant = RAW_KLANTEN.find(k=>k.id===keeperId);
  const dupKlant = RAW_KLANTEN.find(k=>k.id===dupId);
  if(keeperKlant && dupKlant && !keeperKlant.doetLoonaangifte && dupKlant.doetLoonaangifte){
    keeperKlant.doetLoonaangifte = true;
    keeperKlant.heeftDga = dupKlant.heeftDga;
    keeperKlant.staatOpHold = dupKlant.staatOpHold;
    keeperKlant.opHoldReden = dupKlant.opHoldReden;
    keeperKlant.salarisdossierWerknemer = dupKlant.salarisdossierWerknemer;
    if(D.lh) K.lh = JSON.parse(JSON.stringify(D.lh));
  }
  if(Array.isArray(D.items) && D.items.length){
    const bestaandeNamen = new Set((K.items||[]).map(i=>i.naam));
    D.items.forEach(i=>{ if(!bestaandeNamen.has(i.naam)) (K.items = K.items||[]).push(i); });
  }
  if(!K.notities && D.notities) K.notities = D.notities;
  if(Array.isArray(D.log) && D.log.length) K.log = (K.log||[]).concat(D.log).slice(-200);
  ['akkoordLog','vpbAkkoordLog','fiscaleEenheidLog','betalingsuitstelLog','arbeidsovereenkomstDgaLog','managementovereenkomstDgaLog','afspraken'].forEach(veld=>{
    if(Array.isArray(D[veld]) && D[veld].length) K[veld] = (Array.isArray(K[veld])?K[veld]:[]).concat(D[veld]);
  });
  ['OB','VPB','LH','JR'].forEach(t=>{
    const ke = K.dl && K.dl[t]; const de = D.dl && D.dl[t];
    if(de && !de.na && de.datum && (!ke || ke.na || !ke.datum)){ if(!K.dl) K.dl = {}; K.dl[t] = JSON.parse(JSON.stringify(de)); if(keeperKlant && keeperKlant.dl) keeperKlant.dl[t] = JSON.parse(JSON.stringify(de)); }
  });
  if((!K.saldo || K.saldo===0) && D.saldo){ K.saldo = D.saldo; K.saldoDebet = D.saldoDebet; K.saldoCredit = D.saldoCredit; }
  if((!K.txn || K.txn===0) && D.txn) K.txn = D.txn;
  AUTOS.forEach(a=>{ if(a.klant===dupId) a.klant = keeperId; });
}
function voerOpschoningUit(){
  const plan = OPSCHOON_PLAN;
  if(!plan) return null;
  const verslag = { samengevoegd:0, verwijderd:0, bijgewerkt:0, beschermd: plan.beschermd.length };
  plan.dupGroepen.forEach(g=>{
    const keeper = g.records[0];
    g.records.slice(1).forEach(dup=>{
      voegDossierSamen(keeper.id, dup.id);
      const idx = RAW_KLANTEN.findIndex(k=>k.id===dup.id);
      if(idx!==-1) RAW_KLANTEN.splice(idx,1);
      delete STORE[dup.id];
      verslag.samengevoegd++;
    });
  });
  plan.teVerwijderen.forEach(k=>{
    const idx = RAW_KLANTEN.findIndex(x=>x.id===k.id);
    if(idx!==-1) RAW_KLANTEN.splice(idx,1);
    delete STORE[k.id];
    verslag.verwijderd++;
  });
  plan.groepen.forEach(g=>{
    const k = RAW_KLANTEN.find(x=>x.id===g.records[0].id);
    if(!k) return;
    const c = g.csv;
    k.naam = c.naam;
    if(c.nummer) k.extId = c.nummer;
    if(c.kvk) k.kvk = c.kvk;
    if(c.contact) k.contact = c.contact;
    if(c.email) k.email = c.email;
    if(c.tel) k.tel = c.tel;
    if(c.vorm) k.vorm = c.vorm;
    verslag.bijgewerkt++;
  });
  (plan.nieuwUitExport||[]).forEach(c=>{
    // Dubbele zekerheid tegen dubbel aanmaken: bestaat er op DIT moment al een klant met dit
    // nummer of deze (genormaliseerde) naam, dan NIET aanmaken maar bijwerken.
    const bestaatAl = (c.nummer && RAW_KLANTEN.find(k=>String(k.extId).trim()===c.nummer)) || vindKlantOpNaam(c.naam);
    if(bestaatAl){
      if(c.nummer) bestaatAl.extId = c.nummer;
      verslag.bijgewerkt++;
      return;
    }
    const id = nextId(RAW_KLANTEN,'k');
    const klant = { id, naam:c.naam, vorm:c.vorm||'Onbekend', bh: (BOEKHOUDERS[0]&&BOEKHOUDERS[0].id)||'', kvk:c.kvk, contact:c.contact, email:c.email, tel:c.tel,
      doetLoonaangifte:false, heeftDga:false, staatOpHold:false, opHoldReden:'', salarisdossierWerknemer:true, extId:c.nummer,
      kvkLaatsteControle:null, ib: defaultIbData(), vpb: defaultVpbData(), fiscaleEenheid: defaultFiscaleEenheid(),
      betalingsuitstel: defaultBetalingsuitstel(), arbeidsovereenkomstDga: defaultArbeidsovereenkomstDga(),
      managementovereenkomstDga: defaultManagementovereenkomstDga(), dl:{ OB:NA(), VPB:NA(), LH:NA(), JR:NA(), overige:[] } };
    RAW_KLANTEN.push(klant);
    STORE[id] = { dl:JSON.parse(JSON.stringify(klant.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn:0, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', akkoordLog:[], vpbAkkoordLog:[], fiscaleEenheidLog:[], betalingsuitstelLog:[], arbeidsovereenkomstDgaLog:[], managementovereenkomstDgaLog:[], lh:{taken:nieuwLhTaken(false), log:[], volgendeMaandNotitie:''} };
    verslag.nieuwAangemaakt = (verslag.nieuwAangemaakt||0)+1;
  });
  logActiviteit(`Klantenlijst opgeschoond: ${verslag.samengevoegd} duplicaten samengevoegd, ${verslag.verwijderd} verwijderd, ${verslag.bijgewerkt} bijgewerkt uit export${verslag.nieuwAangemaakt?`, ${verslag.nieuwAangemaakt} nieuw aangemaakt uit export`:''}${verslag.beschermd?`, ${verslag.beschermd} handmatige klanten behouden`:''}`);
  migrateData();
  persistMeta(); persist();
  OPSCHOON_PLAN = null;
  return verslag;
}
function handleKlantenCSVUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const resultBox = document.getElementById('klantImportResult');
  if(resultBox) resultBox.innerHTML = `<div class="banner">Bezig met inlezen van "${file.name}"…</div>`;
  readTabularFile(file, (rows, err)=>{
    if(err){ toast(err); if(resultBox) resultBox.innerHTML=''; return; }
    if(!rows || !rows.length){ toast('Geen rijen gevonden in het bestand.'); if(resultBox) resultBox.innerHTML=''; return; }

    const report = { nieuw:0, bijgewerkt:0, overgeslagen:0, gecorrigeerdKlantnr:0, nieuweBoekhouders:[], nieuweTeams:[] };
    let fallbackBhId = null;
    const getFallbackBh = ()=>{
      if(fallbackBhId) return fallbackBhId;
      let existing = BOEKHOUDERS.find(b=>b.naam==='Niet toegewezen');
      if(!existing){ existing = addBoekhouder({naam:'Niet toegewezen'}); report.nieuweBoekhouders.push('Niet toegewezen'); }
      fallbackBhId = existing.id;
      return fallbackBhId;
    };

    rows.forEach(row=>{
      const naam = (findField(row, ['Bedrijfsnaam','Naam','Klantnaam'])||'').trim();
      if(!naam){ report.overgeslagen++; return; }
      const extId = (findField(row,['Klantnummer']) || findField(row,['Id'])||'').trim();
      const vorm = (findField(row,['Rechtsvorm'])||'').trim();
      const kvk = (findField(row,['KvK nummer','KVK nummer','Kvk nummer'])||'').trim();
      const contact = (findField(row,['Contactpersoon'])||findField(row,['Voornaam'])||'').trim();
      const email = (findField(row,['E-mail','Email'])||'').trim();
      const tel = (findField(row,['Telefoon'])||'').trim();
      const txn = parseInt(findField(row,['Onverwerkte banktransacties'])||'0',10)||0;
      const teamLetter = (findField(row,['Team'])||'').trim();
      const boekhouderNaam = (findField(row,['Boekhouder'])||'').trim();

      let teamObj = null;
      if(teamLetter){
        const teamNaam = 'Team '+teamLetter;
        teamObj = TEAMS.find(t=>t.naam.toLowerCase()===teamNaam.toLowerCase());
        if(!teamObj){ teamObj = addTeam({naam:teamNaam}); report.nieuweTeams.push(teamNaam); }
      }
      let bhId;
      if(boekhouderNaam){
        let bhObj = BOEKHOUDERS.find(b=>b.naam.toLowerCase().trim()===boekhouderNaam.toLowerCase());
        if(!bhObj){ bhObj = addBoekhouder({naam:boekhouderNaam, team: teamObj?teamObj.id:''}); report.nieuweBoekhouders.push(boekhouderNaam); }
        else if(teamObj && !bhObj.team){ bhObj.team = teamObj.id; }
        bhId = bhObj.id;
      } else {
        bhId = getFallbackBh();
      }

      // Eerst proberen te matchen op extId (het exportbestand se eigen klant-Id/klantnummer, als dat
      // aanwezig is). Is er geen extId of geen match, dan valt de import terug op de klantnaam — zelfde
      // normalisatie (hoofdletters/leestekens/BV-schrijfwijzen genegeerd) als bij de Loonheffingen- en
      // Autolijst-import — zodat eenzelfde klant nooit twee keer wordt aangemaakt, ook niet als het
      // klantnummer een keer ontbreekt of tussen exports verandert.
      let bestaand = extId ? RAW_KLANTEN.find(k=>k.extId===extId) : null;
      if(!bestaand) bestaand = vindKlantOpNaam(naam);
      if(bestaand){
        bestaand.naam = naam;
        if(vorm) bestaand.vorm = vorm;
        if(kvk) bestaand.kvk = kvk;
        if(contact) bestaand.contact = contact;
        if(email) bestaand.email = email;
        if(tel) bestaand.tel = tel;
        if(extId && bestaand.extId && bestaand.extId !== extId) report.gecorrigeerdKlantnr++;
        if(extId) bestaand.extId = extId;
        bestaand.bh = bhId;
        if(!STORE[bestaand.id]) STORE[bestaand.id] = { dl:JSON.parse(JSON.stringify(bestaand.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn:0, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', akkoordLog:[], vpbAkkoordLog:[], fiscaleEenheidLog:[], betalingsuitstelLog:[], arbeidsovereenkomstDgaLog:[], managementovereenkomstDgaLog:[], lh:{taken:nieuwLhTaken(bestaand.heeftDga), log:[], volgendeMaandNotitie:''} };
        STORE[bestaand.id].txn = txn;
        STORE[bestaand.id].sync = new Date().toISOString().slice(0,10);
        report.bijgewerkt++;
      } else {
        const id = nextId(RAW_KLANTEN,'k');
        const klant = {
          id, naam, vorm: vorm||'Onbekend', bh:bhId, kvk, contact, email, tel,
          doetLoonaangifte:false, heeftDga:false, staatOpHold:false, opHoldReden:'', extId,
          ib: defaultIbData(),
          vpb: defaultVpbData(),
          fiscaleEenheid: defaultFiscaleEenheid(),
          betalingsuitstel: defaultBetalingsuitstel(),
          arbeidsovereenkomstDga: defaultArbeidsovereenkomstDga(),
          managementovereenkomstDga: defaultManagementovereenkomstDga(),
          dl:{ OB:NA(), VPB:NA(), LH:NA(), JR:NA(), overige:[] }
        };
        RAW_KLANTEN.push(klant);
        STORE[id] = { dl:JSON.parse(JSON.stringify(klant.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', akkoordLog:[], vpbAkkoordLog:[], fiscaleEenheidLog:[], betalingsuitstelLog:[], arbeidsovereenkomstDgaLog:[], managementovereenkomstDgaLog:[], lh:{taken:nieuwLhTaken(false), log:[], volgendeMaandNotitie:''} };
        report.nieuw++;
      }
    });

    logActiviteit(`Klantenimport uit "${file.name}": ${report.nieuw} nieuw, ${report.bijgewerkt} bijgewerkt${report.gecorrigeerdKlantnr?`, ${report.gecorrigeerdKlantnr} klantnummer(s) gecorrigeerd`:''}${report.overgeslagen?`, ${report.overgeslagen} overgeslagen`:''}`);
    migrateData();
    persistMeta(); persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();

    const bhList = [...new Set(report.nieuweBoekhouders)];
    const teamList = [...new Set(report.nieuweTeams)];
    const box = document.getElementById('klantImportResult');
    if(box){
      box.innerHTML = `<div class="banner">
        <i class="ti ti-circle-check" aria-hidden="true"></i> Import klaar uit <b>${file.name}</b>: <b>${report.nieuw}</b> nieuwe klant(en), <b>${report.bijgewerkt}</b> bijgewerkt${report.gecorrigeerdKlantnr?`, <b>${report.gecorrigeerdKlantnr}</b> klantnummer(s) gecorrigeerd`:''}${report.overgeslagen?`, <b>${report.overgeslagen}</b> overgeslagen (geen naam gevonden)`:''}.<br>
        ${bhList.length ? `Nieuwe boekhouders aangemaakt: ${bhList.join(', ')}.<br>` : ''}
        ${teamList.length ? `Nieuwe teams aangemaakt: ${teamList.join(', ')}.<br>` : ''}
        Let op: deadlinedata (OB/VPB/LH/JR) zaten niet in dit bestand en zijn dus niet ingevuld — die stel je per klant handmatig in (met eventueel een herhaling).
      </div>`;
    }
    toast(`Import klaar: ${report.nieuw} nieuw, ${report.bijgewerkt} bijgewerkt${report.gecorrigeerdKlantnr?`, ${report.gecorrigeerdKlantnr} klantnummer(s) gecorrigeerd`:''}.`);
  });
}

function handleTxnImport(e){
  const file = e.target.files[0]; if(!file) return;
  const nameSpan = document.getElementById('txnImportFileName');
  if(nameSpan) nameSpan.textContent = file.name;
  readTabularFile(file, (objects, err)=>{
    if(err){ toast(err); return; }
    const stats = computeTxnStats(objects);
    const guessId = guessKlantFromFilename(file.name);
    const sel = document.getElementById('txnImportKlant');
    if(sel && !sel.value && guessId) sel.value = guessId;
    renderTxnPreview(stats, file.name);
  });

function readTabularFilePromise(file){
  return new Promise((resolve)=>{ readTabularFile(file, (objects, err)=> resolve({file, objects, err})); });
}
async function handleBulkTxnImport(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const box = document.getElementById('bulkTxnImportPreview');
  if(box) box.innerHTML = `<div class="banner">Bezig met inlezen van ${files.length} bestand(en)…</div>`;
  const results = await Promise.all(files.map(readTabularFilePromise));
  const rows = results.map(r=>{
    if(r.err) return { filename:r.file.name, error:r.err };
    const stats = computeTxnStats(r.objects);
    const guessId = guessKlantFromFilename(r.file.name);
    return { filename:r.file.name, stats, klantId: guessId || '' };
  });
  renderBulkTxnPreview(rows);
}
function renderBulkTxnPreview(rows){
  const box = document.getElementById('bulkTxnImportPreview');
  if(!box) return;
  const gevonden = rows.filter(r=>!r.error && r.klantId).length;
  const nietGevonden = rows.filter(r=>!r.error && !r.klantId).length;
  const fouten = rows.filter(r=>r.error).length;
  box.innerHTML = `
    <div class="banner">${rows.length} bestand(en) ingelezen — ${gevonden} automatisch gekoppeld op bestandsnaam${nietGevonden?`, ${nietGevonden} niet herkend (kies handmatig)`:''}${fouten?`, ${fouten} met een leesfout`:''}. Controleer de koppeling voor je toepast.</div>
    <table><thead><tr><th>Bestand</th><th>Klant</th><th>Debet</th><th>Credit</th><th>Aantal</th></tr></thead><tbody>
      ${rows.map((r,idx)=> r.error ? `<tr><td style="font-size:11.5px;">${r.filename}</td><td colspan="4" style="color:var(--red); font-size:11.5px;">${r.error}</td></tr>` : `
      <tr>
        <td style="font-size:11.5px;">${r.filename}</td>
        <td><select id="bulkTxnKlant-${idx}" style="padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12px;">
          <option value="">— niet koppelen —</option>
          ${RAW_KLANTEN.map(k=>`<option value="${k.id}" ${k.id===r.klantId?'selected':''}>${k.naam}</option>`).join('')}
        </select></td>
        <td><input type="number" step="0.01" id="bulkTxnDebet-${idx}" value="${r.stats.debetSaldo}" style="width:80px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12px;"></td>
        <td><input type="number" step="0.01" id="bulkTxnCredit-${idx}" value="${r.stats.creditSaldo}" style="width:80px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12px;"></td>
        <td><input type="number" id="bulkTxnAantal-${idx}" value="${r.stats.aantal}" style="width:60px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-size:12px;"></td>
      </tr>`).join('')}
    </tbody></table>
    <button class="btn sm primary" data-apply-bulk-txn style="margin-top:10px;">Alles toepassen</button>
  `;
  const btn = box.querySelector('[data-apply-bulk-txn]');
  if(btn) btn.addEventListener('click', ()=>{
    let toegepast=0, overgeslagen=0;
    rows.forEach((r, idx)=>{
      if(r.error){ overgeslagen++; return; }
      const klantSel = document.getElementById('bulkTxnKlant-'+idx);
      const klantId = klantSel ? klantSel.value : '';
      if(!klantId){ overgeslagen++; return; }
      const debet = parseFloat(document.getElementById('bulkTxnDebet-'+idx).value)||0;
      const credit = parseFloat(document.getElementById('bulkTxnCredit-'+idx).value)||0;
      const aantal = parseInt(document.getElementById('bulkTxnAantal-'+idx).value)||0;
      STORE[klantId].saldoDebet = debet;
      STORE[klantId].saldoCredit = credit;
      STORE[klantId].saldo = Math.round((debet+credit)*100)/100;
      STORE[klantId].txn = aantal;
      STORE[klantId].sync = new Date().toISOString().slice(0,10);
      toegepast++;
    });
    persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast(`Bulk-import klaar: ${toegepast} klant(en) bijgewerkt${overgeslagen?`, ${overgeslagen} overgeslagen (geen klant gekoppeld)`:''}.`);
  });
}
