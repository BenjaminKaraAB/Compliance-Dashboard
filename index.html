/* Excel-import voor de Autolijst: leest het bestaande "Checklist"-werkblad (kolomkoppen op rij 5,
   data vanaf rij 6) en koppelt elke rij aan een klant op naam — dezelfde matching als bij de
   Loonheffingen-import, zodat bestaande workflows en verwachtingen herbruikt worden. */
function leesJaJa(v){ return String(v||'').trim().toLowerCase()==='ja' ? 'ja' : 'nee'; }
function leesExcelDatum(v){
  if(v===null || v===undefined || v==='') return '';
  if(v instanceof Date && !isNaN(v.getTime())){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
// Leest een getal uit een Excel-cel. Bij een numerieke cel (raw:true-waarde) geven we het getal
// gewoon direct terug — géén tekst-parsing nodig, dus geen risico dat Excel's eigen (Engelstalige)
// getalnotatie ("1,234.56") per ongeluk wordt aangezien voor de Nederlandse notatie ("1.234,56").
// Alleen als er daadwerkelijk een TEKST-waarde binnenkomt (bijv. een cel die als tekst is opgemaakt,
// of handmatig ingevoerd/geplakt) passen we de Nederlandse notatie toe: "." is dan een duizendtal-
// scheidingsteken en "," de decimaalscheiding — zoals in "42.170,00" = 42170,00 euro.
function leesExcelGetal(v){
  if(v===null || v===undefined || v==='') return 0;
  if(typeof v === 'number') return isNaN(v) ? 0 : v;
  let s = String(v).trim().replace(/[^\d.,-]/g,'');
  const laatsteKomma = s.lastIndexOf(',');
  const laatstePunt = s.lastIndexOf('.');
  if(laatsteKomma > -1 && laatsteKomma > laatstePunt){
    // Nederlandse notatie: "." = duizendtallen, "," = decimaal (bijv. "42.170,00").
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(laatstePunt > -1 && laatstePunt > laatsteKomma){
    // Engelse/Excel-notatie: "," = duizendtallen, "." = decimaal (bijv. "42,170.00").
    s = s.replace(/,/g,'');
  } else {
    // Geen duizendtalscheiding, hooguit één scheidingsteken dat als decimaal bedoeld is.
    s = s.replace(',', '.');
  }
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function readAutoExcelRowsPromise(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Bestand kon niet gelezen worden'));
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets['Checklist'] || wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null, dateNF:'yyyy-mm-dd'});
        const gridRaw = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
        // Kolomkoppen staan op rij 5 (index 4); data begint op rij 6 (index 5).
        const headerRow = (grid[4]||[]).map(h=>(h||'').toString().trim().toLowerCase());
        const col = (naam)=> headerRow.indexOf(naam.toLowerCase());
        const idx = {
          klantnaam: col('Klantnaam'), merk: col('Merk'), kenteken: col('Kenteken'),
          klantBtwVrijgesteld: col('Klant BTW vrijgesteld'), btwAuto: col('BTW auto'),
          gebruik: col('Enkel zakelijk of zakelijk en prive'), elektrisch: col('Elektrische auto'),
          type: col('Type transportmiddel'), aankoopdatum: col('Aankoopdatum'), verkoopdatum: col('Verkoopdatum'),
          datumInschrijving: col('Datum 1e inschrijving'), cataloguswaarde: col('Cataloguswaarde'),
          dagwaarde: col('Dagwaarde'), vuzgAanwezig: col('VUZG aanwezig'), bijtellingViaSalaris: col('Bijtelling via salaris'),
        };
        if(idx.klantnaam===-1) throw new Error('Kon de kolom "Klantnaam" niet vinden op rij 5. Is dit het juiste bestand?');
        const rows = [];
        for(let r=5; r<grid.length; r++){
          const row = grid[r]; const rowRaw = gridRaw[r];
          if(!row || !row[idx.klantnaam] || String(row[idx.klantnaam]).trim()==='') continue;
          rows.push({
            klantnaam: String(row[idx.klantnaam]).trim(),
            merk: idx.merk>-1 ? (row[idx.merk]||'') : '',
            kenteken: idx.kenteken>-1 ? (row[idx.kenteken]||'') : '',
            klantBtwVrijgesteld: idx.klantBtwVrijgesteld>-1 ? leesJaJa(row[idx.klantBtwVrijgesteld]) : 'nee',
            btwAuto: idx.btwAuto>-1 ? leesJaJa(row[idx.btwAuto]) : 'nee',
            gebruik: idx.gebruik>-1 && row[idx.gebruik] ? row[idx.gebruik] : 'Zakelijk en prive (boven 500km prive)',
            elektrisch: idx.elektrisch>-1 ? leesJaJa(row[idx.elektrisch]) : 'nee',
            type: idx.type>-1 && row[idx.type] ? String(row[idx.type]).trim().toLowerCase() : 'personenauto',
            aankoopdatum: idx.aankoopdatum>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.aankoopdatum] : row[idx.aankoopdatum]) : '',
            verkoopdatum: idx.verkoopdatum>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.verkoopdatum] : row[idx.verkoopdatum]) : '',
            datumEersteInschrijving: idx.datumInschrijving>-1 ? leesExcelDatum(rowRaw ? rowRaw[idx.datumInschrijving] : row[idx.datumInschrijving]) : '',
            cataloguswaarde: idx.cataloguswaarde>-1 ? leesExcelGetal(rowRaw ? rowRaw[idx.cataloguswaarde] : row[idx.cataloguswaarde]) : 0,
            dagwaarde: idx.dagwaarde>-1 && rowRaw && rowRaw[idx.dagwaarde]!==null && rowRaw[idx.dagwaarde]!==undefined && rowRaw[idx.dagwaarde]!=='' ? leesExcelGetal(rowRaw[idx.dagwaarde]) : null,
            vuzgAanwezig: idx.vuzgAanwezig>-1 ? leesJaJa(row[idx.vuzgAanwezig]) : 'nee',
            bijtellingViaSalaris: idx.bijtellingViaSalaris>-1 && String(row[idx.bijtellingViaSalaris]||'').trim().toLowerCase()==='ja' ? 'Ja' : 'Nee',
          });
        }
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
async function handleAutoImport(e){
  const getResultBox = ()=> document.getElementById('autoImportResult');
  try{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const box0 = getResultBox();
    if(box0) box0.innerHTML = '<div class="hint">Bestand wordt gelezen…</div>';
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek (XLSX) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina, en probeer het daarna opnieuw.');
    }
    const rows = await readAutoExcelRowsPromise(file);
    if(!rows.length){
      const boxEmpty = getResultBox();
      if(boxEmpty) boxEmpty.innerHTML = `<div class="banner" style="border-color:var(--amber-brd); color:#8a4b06;">⚠️ Er zijn geen auto's herkend in "${String(file.name).replace(/</g,'&lt;')}". Controleer of dit het juiste bestand is (tabblad "Checklist", koppen op rij 5).</div>`;
      return;
    }
    // Opnieuw hetzelfde bestand importeren mag nooit dubbele auto's opleveren, en moet foutieve
    // waarden uit een eerdere (bijv. verkeerd-uitgelezen) import gewoon overschrijven met de nieuwe,
    // correcte waarden. Daarom wordt hier ge-"upsert": een auto van dezelfde klant met hetzelfde
    // kenteken wordt bijgewerkt in plaats van nogmaals toegevoegd. Alleen auto's zonder kenteken (of
    // met een kenteken dat nog niet bestaat) worden als nieuw toegevoegd.
    let toegevoegd = 0, bijgewerkt = 0; const nietGevonden = [];
    rows.forEach(row=>{
      const klant = vindKlantOpNaam(row.klantnaam);
      if(!klant){ nietGevonden.push(row.klantnaam); return; }
      const data = { klant: klant.id, merk:row.merk, kenteken:row.kenteken, klantBtwVrijgesteld:row.klantBtwVrijgesteld,
        btwAuto:row.btwAuto, gebruik:row.gebruik, elektrisch:row.elektrisch, type:row.type,
        aankoopdatum:row.aankoopdatum, verkoopdatum:row.verkoopdatum, datumEersteInschrijving:row.datumEersteInschrijving,
        cataloguswaarde:row.cataloguswaarde, dagwaarde:row.dagwaarde, vuzgAanwezig:row.vuzgAanwezig, bijtellingViaSalaris:row.bijtellingViaSalaris };
      const kentekenNorm = (row.kenteken||'').trim().toUpperCase();
      const bestaande = kentekenNorm ? AUTOS.find(a=>a.klant===klant.id && (a.kenteken||'').trim().toUpperCase()===kentekenNorm) : null;
      if(bestaande){ updateAuto(bestaande.id, data); bijgewerkt++; }
      else { addAuto(data); toegevoegd++; }
    });
    logActiviteit(`Auto-import uit "${file.name}": ${toegevoegd} toegevoegd, ${bijgewerkt} bijgewerkt${nietGevonden.length ? `, ${nietGevonden.length} klant(en) niet gevonden` : ''}`);
    const box = getResultBox();
    if(box){
      const escaped = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      box.innerHTML = `<div class="banner">✅ <b>${toegevoegd}</b> nieuwe auto('s) toegevoegd, <b>${bijgewerkt}</b> bestaande auto('s) bijgewerkt (op klant + kenteken) uit "${escaped(file.name)}".`
        + (nietGevonden.length ? `<br>⚠️ <b>${nietGevonden.length}</b> klant(en) niet gevonden op naam — voeg deze klant(en) eerst toe: ${nietGevonden.slice(0,30).map(escaped).join(', ')}${nietGevonden.length>30?', …':''}` : '')
        + `</div>`;
    }
    render();
  }catch(err){
    console.error('Autolijst-import mislukt:', err);
    const boxErr = getResultBox();
    const msg = `<div class="banner" style="border-color:var(--red); color:var(--red);">❌ Fout bij inlezen: ${((err&&err.message)||err)}</div>`;
    if(boxErr) boxErr.innerHTML = msg; else alert('Fout bij inlezen van het Excel-bestand: '+((err&&err.message)||err));
  }
}

/* ============================= PANEL: KLANT DETAIL ============================= */
function deadlineCard(type, entry){
  if(entry.na){
    return `<div class="dl-card"><div class="dl-top"><span class="dl-name">${TYPE_LABEL[type]}</span></div><div class="dl-na" style="padding:0;">Niet van toepassing</div></div>`;
  }
  const st = statusOf(entry); const meta = STATUS_META[st.key];
  const daysTxt = entry.status==='ingediend' ? `Ingediend op ${fmtDate(entry.datum)}` : (st.dagen<0 ? `${Math.abs(st.dagen)} dagen te laat` : `Nog ${st.dagen} dagen`);
  const herh = entry.herhaling || 'geen';
  return `<div class="dl-card">
    <div class="dl-top"><span class="dl-name">${TYPE_LABEL[type]}</span>${badge(entry)}</div>
    <div class="dl-date">Deadline: ${fmtDate(entry.datum)}</div>
    <div class="dl-days" style="color:var(--${meta.cls==='gray'?'muted':meta.cls})">${daysTxt}</div>
    <div style="margin-top:6px; display:flex; align-items:center; gap:6px;">
      <label style="font-size:11px; color:var(--muted);">Herhaling:</label>
      <select data-set-herhaling="${type}" style="padding:3px 6px; border:1px solid var(--border); border-radius:6px; font-size:11px;">
        <option value="geen" ${herh==='geen'?'selected':''}>Geen</option>
        <option value="maandelijks" ${herh==='maandelijks'?'selected':''}>Maandelijks</option>
        <option value="kwartaal" ${herh==='kwartaal'?'selected':''}>Per kwartaal</option>
        <option value="jaarlijks" ${herh==='jaarlijks'?'selected':''}>Jaarlijks</option>
      </select>
    </div>
    <div class="dl-actions">
      ${entry.status!=='ingediend' ? `<button class="btn sm" data-mark-ingediend="${type}">Markeer als ingediend</button>` : `<button class="btn sm ghost" data-unmark-ingediend="${type}">Ongedaan maken</button>`}
    </div>
  </div>`;
}

function reminderMessage(klant, ronde){
  const f = STORE[klant.id];
  const openItems = f.items.filter(i=>!i.done).map(i=>i.naam);
  const lines = openItems.length ? openItems.map(i=>`- ${i}`).join('\n') : '- (zie portaal voor actuele lijst)';
  const saldoLine = f.saldo>0 ? `Openstaand banksaldo dat nog toegelicht moet worden: ${fmtEUR(f.saldo)} (${f.txn} transacties).\n\n` : '';
  const woord = ronde===1 ? 'Herinnering' : 'Tweede herinnering';
  const body = `Beste ${klant.contact},\n\n${woord}: voor een tijdige verwerking van uw administratie ontvangen wij graag op korte termijn de volgende stukken:\n${lines}\n\n${saldoLine}Met vriendelijke groet,\n${bh(klant.bh).naam}\nAdministratiebox`;
  return {subject:`${woord} — aanlevering stukken ${klant.naam}`, body};
}

function attachEditKlantHandlers(klant){
  document.querySelector('[data-close-panel]').addEventListener('click', closePanel);
  const cancelBtn = document.querySelector('[data-cancel-edit-klant]');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ STATE.editKlant=null; openPanel(klant.id); });
  const saveBtn = document.querySelector('[data-save-edit-klant]');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{

    if(!naam){ toast('Vul een klantnaam in.'); return; }
    const bhId = document.getElementById('editKlantBh').value;
    if(!bhId){ toast('Kies een boekhouder.'); return; }
    klant.naam = naam;
    klant.vorm = document.getElementById('editKlantVorm').value;
    klant.bh = bhId;
    klant.kvk = document.getElementById('editKlantKvk').value.trim();
    klant.contact = document.getElementById('editKlantContact').value.trim();
    klant.email = document.getElementById('editKlantEmail').value.trim();
    klant.tel = document.getElementById('editKlantTel').value.trim();

    const f = STORE[klant.id];
    [['OB','editKlantOBDatum','editKlantOBHerh'],['VPB','editKlantVPBDatum','editKlantVPBHerh'],['LH','editKlantLHDatum','editKlantLHHerh'],['JR','editKlantJRDatum','editKlantJRHerh']].forEach(([type,dateId,herhId])=>{
      const dateValRaw = document.getElementById(dateId).value.trim();
      const dateVal = invoerNaarDatum(dateValRaw);
      const herhVal = document.getElementById(herhId).value;
      const existing = f.dl[type];
      if(dateVal){
        const unchanged = existing && !existing.na && existing.datum === dateVal;
        f.dl[type] = { datum: dateVal, status: unchanged ? existing.status : null, herhaling: herhVal };
      } else {
        f.dl[type] = { na:true };
      }
    });

    persistMeta(); persist();
    toast('Klantgegevens bijgewerkt.');
    STATE.editKlant = null;
    render();
  });
}

/* ============================= HANDLERS ============================= */
// Elementen buiten #contentArea (de zoekbalk, de sidebar-navigatie, de sync-knop, de overlay) blijven
// bij een "lichte" update (alleen #contentArea vervangen) gewoon dezelfde DOM-node — zonder deze guard
// zou elke aanroep van attachHandlers()/attachHandlersLite() daar een NIEUWE listener bovenop de oude
// zetten. Bij honderden klanten en veel interacties per sessie stapelen die zich op, waardoor bijv. het
// zoekveld na verloop van tijd bij elke toetsaanslag de zware klantentabel-herbouw tien, twintig, dertig
// keer achter elkaar uitvoert — precies het "pagina reageert niet"-gedrag. bindOnce() zorgt dat zo'n
// element maar één keer per DOM-node een listener krijgt; na een volledige render() is de node sowieso
// vervangen en telt het weer opnieuw als "nog niet gebonden".
function bindOnce(el, event, handler){
  if(!el) return;
  const key = '__bound_'+event;
  if(el[key]) return;
  el[key] = true;
  el.addEventListener(event, handler);
}
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>bindOnce(el, 'click', ()=>{
    STATE.view = el.getAttribute('data-nav'); STATE.bhFilter=''; STATE.statusFilter=''; STATE.showAddKlant=false; STATE.showAddBh=false; STATE.showAddTeam=false; STATE.showAddAuto=false; STATE.editAuto=null; STATE.editBh=null;
    render();
  }));
  document.querySelectorAll('[data-add-klant-btn]').forEach(el=>el.addEventListener('click', ()=>{ STATE.showAddKlant=true; render(); }));
  const klantenCsvUpload = document.getElementById('klantenCsvUpload');
  if(klantenCsvUpload) klantenCsvUpload.addEventListener('change', handleKlantenCSVUpload);
  const lhKlantenImportFile = document.getElementById('lhKlantenImportFile');
  if(lhKlantenImportFile) lhKlantenImportFile.addEventListener('change', handleLhKlantenImport);
  const autoExcelUpload = document.getElementById('autoExcelUpload');
  if(autoExcelUpload) autoExcelUpload.addEventListener('change', handleAutoImport);
  document.querySelectorAll('[data-add-auto-btn]').forEach(el=>el.addEventListener('click', ()=>{ STATE.editAuto=null; STATE.showAddAuto=true; render(); }));
  document.querySelectorAll('[data-edit-auto]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); STATE.editAuto = el.getAttribute('data-edit-auto'); STATE.showAddAuto=true; render();
  }));
  document.querySelectorAll('[data-delete-auto]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); confirmDeleteAuto(el.getAttribute('data-delete-auto'));
  }));
  document.querySelectorAll('[data-log-meer-tonen]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.logboekLimiet = (STATE.logboekLimiet||50) + 50;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-clear-log]').forEach(el=>el.addEventListener('click', ()=>{
    if(!isAdmin()) return;
    if(!confirm(`Weet je zeker dat je het hele activiteitenlogboek (${ACTIVITEITENLOG.length} gebeurtenis(sen)) wilt wissen? Dit kan niet ongedaan worden gemaakt.`)) return;
    ACTIVITEITENLOG = [];
    persistMeta();
    toast('Activiteitenlogboek gewist.');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-clear-all-autos]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm(`Weet je zeker dat je ALLE ${AUTOS.length} auto('s) wilt verwijderen? Dit kan niet ongedaan worden gemaakt — gebruik dit alleen als je met een schone lei opnieuw wilt importeren.`)) return;
    logActiviteit(`Alle ${AUTOS.length} auto('s) verwijderd (Alles wissen)`);
    AUTOS = [];
    persistMeta();
    toast('Alle auto\'s verwijderd.');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  const filterAutoKlant = document.getElementById('filterAutoKlant');
  if(filterAutoKlant) filterAutoKlant.addEventListener('change', e=>{ STATE.autoKlantFilter=e.target.value; document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers(); });
  const filterAutoElektrisch = document.getElementById('filterAutoElektrisch');
  if(filterAutoElektrisch) filterAutoElektrisch.addEventListener('change', e=>{ STATE.autoElektrischFilter=e.target.value; document.getElementById('contentArea').innerHTML=viewHTML(); attachHandlers(); });
  document.querySelectorAll('[data-toggle-bijtelling-beheer]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.showBijtellingBeheer = !STATE.showBijtellingBeheer;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-bt-verwijder]').forEach(el=>el.addEventListener('click', ()=>{
    const jaar = Number(el.getAttribute('data-bt-verwijder'));
    if(!confirm(`Jaartarief ${jaar} verwijderen?`)) return;
    logActiviteit(`Bijtellingstarief ${jaar} verwijderd`);
    BIJTELLING_TABEL = BIJTELLING_TABEL.filter(r=>r.jaar!==jaar);
    persistMeta();
    toast('Jaartarief verwijderd.');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-bt-jaar-toevoegen]').forEach(el=>el.addEventListener('click', ()=>{
    const nieuwJaar = laatsteBijtellingJaar()+1;
    if(BIJTELLING_TABEL.some(r=>r.jaar===nieuwJaar)){ toast('Dat jaar staat al in de tabel.'); return; }
    const laatste = BIJTELLING_TABEL.find(r=>r.jaar===laatsteBijtellingJaar());
    BIJTELLING_TABEL.push({jaar:nieuwJaar, laag:laatste?laatste.laag:null, cap:laatste?laatste.cap:null, algemeen:laatste?laatste.algemeen:0.22});
    logActiviteit(`Bijtellingstarief ${nieuwJaar} toegevoegd`);
    persistMeta();
    STATE.showBijtellingBeheer = true;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-bt-opslaan]').forEach(el=>el.addEventListener('click', ()=>{
    const nieuweTabel = [];
    document.querySelectorAll('[data-bt-jaar]').forEach(input=>{
      const origJaar = Number(input.getAttribute('data-bt-jaar'));
      const nieuwJaar = Number(input.value) || origJaar;
      const laagInput = document.querySelector(`[data-bt-laag="${origJaar}"]`);
      const capInput = document.querySelector(`[data-bt-cap="${origJaar}"]`);
      const algInput = document.querySelector(`[data-bt-algemeen="${origJaar}"]`);
      const laag = laagInput && laagInput.value!=='' ? Number(laagInput.value) : null;
      const cap = capInput && capInput.value!=='' ? Number(capInput.value) : null;
      const algemeen = algInput && algInput.value!=='' ? Number(algInput.value) : 0.22;
      nieuweTabel.push({jaar:nieuwJaar, laag, cap, algemeen});
    });
    if(nieuweTabel.some(r=>isNaN(r.jaar))){ toast('Ongeldig jaartal ingevoerd.'); return; }
    BIJTELLING_TABEL = nieuweTabel;
    logActiviteit('Bijtellingstabel gewijzigd en opgeslagen');
    persistMeta();
    toast('Bijtellingstabel opgeslagen.');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();

function handleCSVUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let updated=0, skipped=0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<2) return;
      const [naam, saldoStr, txnStr] = parts;
      if(/^klant/i.test(naam) && /saldo/i.test(saldoStr||'')) return; // header row
      const match = RAW_KLANTEN.find(k=>k.naam.toLowerCase().includes(naam.toLowerCase()) || naam.toLowerCase().includes(k.naam.toLowerCase()));
      if(match){
        const saldo = parseFloat((saldoStr||'0').replace(',', '.')) || 0;
        STORE[match.id].saldo = saldo;
        if(txnStr!==undefined) STORE[match.id].txn = parseInt(txnStr)||0;
        STORE[match.id].sync = new Date().toISOString().slice(0,10);
        updated++;
      } else skipped++;
    });
    persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast(`CSV verwerkt: ${updated} klant(en) bijgewerkt${skipped?`, ${skipped} regel(s) niet herkend`:''}.`);
  };
  reader.readAsText(file);
}

function computeTxnStats(rows){
  const hasStatusCol = rows.length > 0 && Object.keys(rows[0]).some(k=>k.toLowerCase().trim()==='status');
  let relevant = rows;
  if(hasStatusCol){
    relevant = rows.filter(r=> (findField(r,['Status'])||'').toLowerCase().includes('niet verwerkt'));
  }
  // Een bedrag mét minteken ervoor is een crediteur (credit), zonder minteken een debiteur (debet) —
  // deze twee worden apart opgeteld i.p.v. als één absolute som.
  let debetSaldo = 0, debetAantal = 0, creditSaldo = 0, creditAantal = 0;
  relevant.forEach(r=>{
    const bedrag = parseDutchAmount(findField(r,['Bedrag','Amount']));
    if(bedrag < 0){ creditSaldo += Math.abs(bedrag); creditAantal++; }
    else { debetSaldo += Math.abs(bedrag); debetAantal++; }
  });
  debetSaldo = Math.round(debetSaldo*100)/100;
  creditSaldo = Math.round(creditSaldo*100)/100;
  return {
    debetSaldo, debetAantal, creditSaldo, creditAantal,
    saldo: Math.round((debetSaldo+creditSaldo)*100)/100,
    aantal: relevant.length, totaalRegels: rows.length, hasStatusCol
  };
}
function guessKlantFromFilename(filename){
  const base = filename.replace(/\.(csv|xlsx|xls|txt)$/i,'');
  const prefix = base.split(/[-_]/)[0].trim();
  if(!prefix) return null;
  const match = RAW_KLANTEN.find(k=> k.naam.toLowerCase().includes(prefix.toLowerCase()) || prefix.toLowerCase().includes(k.naam.toLowerCase()));
  return match ? match.id : null;
}

function parseLhKlantNaam(raw){
  let s = (raw||'').trim();
  const parenIdx = s.indexOf('(');
  if(parenIdx > 0) s = s.slice(0, parenIdx).trim();
  return s.replace(/[.,]+$/,'').trim();
}
function normalizeKlantNaam(s){
  return (s||'').toLowerCase()
    .replace(/\bb\.?v\.?\b/g,'bv')
    .replace(/\bv\.?o\.?f\.?\b/g,'vof')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');
}
function vindKlantOpNaam(naam){
  const norm = normalizeKlantNaam(naam);
  if(!norm || norm.length < 3) return null;
  let match = RAW_KLANTEN.find(k => normalizeKlantNaam(k.naam) === norm);
  if(match) return match;
  const prefixMatches = RAW_KLANTEN.filter(k => {
    const kn = normalizeKlantNaam(k.naam);
    return kn && kn.length >= 4 && (norm.startsWith(kn) || kn.startsWith(norm));
  });
  return prefixMatches.length === 1 ? prefixMatches[0] : null;
}
function isLhMetaRow(v){
  if(v===undefined || v===null) return true;
  if(typeof v !== 'string') return true;
  const s = v.trim();
  if(s==='') return true;
  if(s.startsWith('Email')) return true;
  if(s==='Verwerker') return true;
  if(s.startsWith('Salarissen')) return true;
  if(s.startsWith('Salaris') && s.includes('betaallijst')) return true;
  if(s.startsWith('Aangifte')) return true;
  if(s.startsWith('LJP')) return true;
  if(/^let\s*op/i.test(s)) return true;
  if(s.toLowerCase().includes('ter info')) return true;
  if(BOEKHOUDERS.some(b=>b.naam && b.naam.trim()===s)) return true;
  return false;
}
function readLhExcelNamesPromise(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Bestand kon niet gelezen worden'));
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null});
        const names = [];
        const isBlankCell = (v)=> v===null || v===undefined || (typeof v==='string' && v.trim()==='');
        for(let r=0; r<grid.length; r++){
          const v = grid[r] && grid[r][0];
          if(typeof v==='string' && !isLhMetaRow(v)){
            const n1 = grid[r+1] && grid[r+1][0];
            const n2 = grid[r+2] && grid[r+2][0];
            const hasFollowup = (typeof n1==='string' && (n1.trim().startsWith('Email') || n1.trim()==='Verwerker')) ||
                                 (typeof n2==='string' && (n2.trim().startsWith('Email') || n2.trim()==='Verwerker'));
            // Elke echte werkgever-rij in dit bestand wordt vooraf gegaan door een lege rij (de blanco
            // scheidingsregel tussen twee werkgevers). Dit sluit ook de kop-rijen bovenaan het bestand
            // uit (bijv. de namen van de boekhouders zelf, die toevallig ook door "Verwerker" gevolgd
            // kunnen worden en anders ten onrechte als werkgever herkend zouden worden).
            const vorigeRijLeeg = r===0 || isBlankCell(grid[r-1] && grid[r-1][0]);
            if(hasFollowup && vorigeRijLeeg) names.push(v);
          }
        }
        resolve(names);
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
async function handleLhKlantenImport(e){
  // Haalt de resultaat-box telkens opnieuw op (in plaats van één keer vast te leggen), zodat een
  // eventuele tussentijdse her-render (bijv. door de periodieke sync) niet leidt tot een melding die
  // in een losstaand, onzichtbaar DOM-element terechtkomt — daardoor zou een gebruiker denken dat er
  // "niets gebeurt" terwijl de import eigenlijk wel (deels) gelukt of mislukt is.
  const getResultBox = ()=> document.getElementById('lhKlantenImportResult');
  try{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const box0 = getResultBox();
    if(box0) box0.innerHTML = '<div class="hint">Bestand wordt gelezen…</div>';
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek (XLSX) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina, en probeer het daarna opnieuw.');
    }
    const rawNames = await readLhExcelNamesPromise(file);
    if(!rawNames.length){
      const boxEmpty = getResultBox();
      if(boxEmpty) boxEmpty.innerHTML = `<div class="banner" style="border-color:var(--amber-brd); color:#8a4b06;">⚠️ Er zijn geen werkgevers herkend in "${String(file.name).replace(/</g,'&lt;')}". Controleer of dit het juiste bestand is en of de structuur (naam, daaronder "Email:", daaronder "Verwerker") ongewijzigd is.</div>`;
      return;
    }
    let nieuwGemarkeerd = 0, algeactiveerd = 0;
    const nietGevonden = [];
    rawNames.forEach(raw=>{
      const naam = parseLhKlantNaam(raw);
      const klant = vindKlantOpNaam(naam);
      if(!klant){ nietGevonden.push(raw); return; }
      if(klant.doetLoonaangifte){ algeactiveerd++; }
      else { klant.doetLoonaangifte = true; nieuwGemarkeerd++; }
    });
    logActiviteit(`LH-klantenimport uit "${file.name}": ${nieuwGemarkeerd} nieuw gemarkeerd, ${algeactiveerd} stonden al aan${nietGevonden.length ? `, ${nietGevonden.length} niet gevonden` : ''}`);
    persistMeta(); persist();
    const box = getResultBox();
    if(box){
      const escaped = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      box.innerHTML = `<div class="banner">✅ <b>${rawNames.length}</b> werkgevers gevonden in "${escaped(file.name)}". `
        + `<b>${nieuwGemarkeerd}</b> klant(en) nieuw gemarkeerd met loonaangifte, <b>${algeactiveerd}</b> stonden al aan.`
        + (nietGevonden.length ? `<br>⚠️ <b>${nietGevonden.length}</b> niet gevonden op naam — voeg deze klant(en) toe of vink handmatig aan: ${nietGevonden.slice(0,30).map(escaped).join(', ')}${nietGevonden.length>30?', …':''}` : '')
        + `</div>`;
    }
    render();
  }catch(err){
    console.error('Loonheffing-klantenimport mislukt:', err);
    const boxErr = getResultBox();
    const msg = `<div class="banner" style="border-color:var(--red); color:var(--red);">❌ Fout bij inlezen: ${((err&&err.message)||err)}</div>`;
    if(boxErr) boxErr.innerHTML = msg; else alert('Fout bij inlezen van het Excel-bestand: '+((err&&err.message)||err));
  }
}
function handleKlantenCSVUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const resultBox = document.getElementById('klantImportResult');
  if(resultBox) resultBox.innerHTML = `<div class="banner">Bezig met inlezen van "${file.name}"…</div>`;
  readTabularFile(file, (rows, err)=>{
    if(err){ toast(err); if(resultBox) resultBox.innerHTML=''; return; }
    if(!rows || !rows.length){ toast('Geen rijen gevonden in het bestand.'); if(resultBox) resultBox.innerHTML=''; return; }

    const report = { nieuw:0, bijgewerkt:0, overgeslagen:0, nieuweBoekhouders:[], nieuweTeams:[] };
    let fallbackBhId = null;
    const getFallbackBh = ()=>{
      if(fallbackBhId) return fallbackBhId;
      let existing = BOEKHOUDERS.find(b=>b.naam==='Niet toegewezen');
      if(!existing){ existing = addBoekhouder({naam:'Niet toegewezen'}); report.nieuweBoekhouders.push('Niet toegewezen'); }
      fallbackBhId = existing.id;
      return fallbackBhId;
    };

    rows.forEach(row=>{
      const naam = (findField(row, ['Bedrijfsnaam','Naam','Klantnaam'])||'').trim();
      if(!naam){ report.overgeslagen++; return; }
      const extId = (findField(row,['Id']) || findField(row,['Klantnummer'])||'').trim();
      const vorm = (findField(row,['Rechtsvorm'])||'').trim();
      const kvk = (findField(row,['KvK nummer','KVK nummer','Kvk nummer'])||'').trim();
      const contact = (findField(row,['Contactpersoon'])||findField(row,['Voornaam'])||'').trim();
      const email = (findField(row,['E-mail','Email'])||'').trim();
      const tel = (findField(row,['Telefoon'])||'').trim();
      const txn = parseInt(findField(row,['Onverwerkte banktransacties'])||'0',10)||0;
      const teamLetter = (findField(row,['Team'])||'').trim();
      const boekhouderNaam = (findField(row,['Boekhouder'])||'').trim();

      let teamObj = null;
      if(teamLetter){
        const teamNaam = 'Team '+teamLetter;
        teamObj = TEAMS.find(t=>t.naam.toLowerCase()===teamNaam.toLowerCase());
        if(!teamObj){ teamObj = addTeam({naam:teamNaam}); report.nieuweTeams.push(teamNaam); }
      }
      let bhId;
      if(boekhouderNaam){
        let bhObj = BOEKHOUDERS.find(b=>b.naam.toLowerCase().trim()===boekhouderNaam.toLowerCase());
        if(!bhObj){ bhObj = addBoekhouder({naam:boekhouderNaam, team: teamObj?teamObj.id:''}); report.nieuweBoekhouders.push(boekhouderNaam); }
        else if(teamObj && !bhObj.team){ bhObj.team = teamObj.id; }
        bhId = bhObj.id;
      } else {
        bhId = getFallbackBh();
      }

      // Eerst proberen te matchen op extId (het exportbestand se eigen klant-Id/klantnummer, als dat
      // aanwezig is). Is er geen extId of geen match, dan valt de import terug op de klantnaam — zelfde
      // normalisatie (hoofdletters/leestekens/BV-schrijfwijzen genegeerd) als bij de Loonheffingen- en
      // Autolijst-import — zodat eenzelfde klant nooit twee keer wordt aangemaakt, ook niet als het
      // klantnummer een keer ontbreekt of tussen exports verandert.
      let bestaand = extId ? RAW_KLANTEN.find(k=>k.extId===extId) : null;
      if(!bestaand) bestaand = vindKlantOpNaam(naam);
      if(bestaand){
        bestaand.naam = naam;
        if(vorm) bestaand.vorm = vorm;
        if(kvk) bestaand.kvk = kvk;
        if(contact) bestaand.contact = contact;
        if(email) bestaand.email = email;
        if(tel) bestaand.tel = tel;
        if(extId && !bestaand.extId) bestaand.extId = extId;
        bestaand.bh = bhId;
        if(!STORE[bestaand.id]) STORE[bestaand.id] = { dl:JSON.parse(JSON.stringify(bestaand.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn:0, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', lh:{taken:nieuwLhTaken(bestaand.heeftDga), log:[], volgendeMaandNotitie:''} };
        STORE[bestaand.id].txn = txn;
        STORE[bestaand.id].sync = new Date().toISOString().slice(0,10);
        report.bijgewerkt++;
      } else {
        const id = nextId(RAW_KLANTEN,'k');
        const klant = {
          id, naam, vorm: vorm||'Onbekend', bh:bhId, kvk, contact, email, tel,
          doetLoonaangifte:false, heeftDga:false, staatOpHold:false, opHoldReden:'', extId,
          dl:{ OB:NA(), VPB:NA(), LH:NA(), JR:NA(), overige:[] }
        };
        RAW_KLANTEN.push(klant);
        STORE[id] = { dl:JSON.parse(JSON.stringify(klant.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', lh:{taken:nieuwLhTaken(false), log:[], volgendeMaandNotitie:''} };
        report.nieuw++;
      }
    });

    logActiviteit(`Klantenimport uit "${file.name}": ${report.nieuw} nieuw, ${report.bijgewerkt} bijgewerkt${report.overgeslagen?`, ${report.overgeslagen} overgeslagen`:''}`);
    persistMeta(); persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();

    const bhList = [...new Set(report.nieuweBoekhouders)];
    const teamList = [...new Set(report.nieuweTeams)];
    const box = document.getElementById('klantImportResult');
    if(box){
      box.innerHTML = `<div class="banner">
        ✅ Import klaar uit <b>${file.name}</b>: <b>${report.nieuw}</b> nieuwe klant(en), <b>${report.bijgewerkt}</b> bijgewerkt${report.overgeslagen?`, <b>${report.overgeslagen}</b> overgeslagen (geen naam gevonden)`:''}.<br>
        ${bhList.length ? `Nieuwe boekhouders aangemaakt: ${bhList.join(', ')}.<br>` : ''}
        ${teamList.length ? `Nieuwe teams aangemaakt: ${teamList.join(', ')}.<br>` : ''}
        Let op: deadlinedata (OB/VPB/LH/JR) zaten niet in dit bestand en zijn dus niet ingevuld — die stel je per klant handmatig in (met eventueel een herhaling).
      </div>`;
    }
    toast(`Import klaar: ${report.nieuw} nieuw, ${report.bijgewerkt} bijgewerkt.`);
  });
}

      const d = kpiOpVoorTeam(teamId);

    });
    STATE.kpiOpEdit = false;
    logActiviteit("KPI: operationele KPI's bijgewerkt");
    persistMeta();
    toast("Operationele KPI's opgeslagen.");
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-kwartaal-tab]').forEach(el=>el.addEventListener('click',()=>{
    STATE.kpiTactKwartaal = el.getAttribute('data-kpi-kwartaal-tab');
    STATE.kpiPijlerForm = null;
    STATE.kpiTactDoelEdit = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-doel-edit]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    STATE.kpiTactDoelEdit = el.getAttribute('data-kpi-doel-edit');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-doel-cancel]').forEach(el=>el.addEventListener('click',()=>{
    STATE.kpiTactDoelEdit = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-doel-save]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    const kwartaal = el.getAttribute('data-kpi-doel-save');
    const input = document.getElementById('kpiDoelInput');
    KPI_TACTISCH[kwartaal].doel = input ? input.value.trim() : '';
    STATE.kpiTactDoelEdit = null;
    logActiviteit(`KPI: doel voor ${kwartaal} bijgewerkt`);
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-pijler-add]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    STATE.kpiPijlerForm = { kwartaal: el.getAttribute('data-kpi-pijler-add'), editId: null };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-pijler-edit]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    const [kwartaal, editId] = el.getAttribute('data-kpi-pijler-edit').split('|');
    STATE.kpiPijlerForm = { kwartaal, editId };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-pijler-cancel]').forEach(el=>el.addEventListener('click',()=>{
    STATE.kpiPijlerForm = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-pijler-save]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    const [kwartaal, editId] = el.getAttribute('data-kpi-pijler-save').split('|');
    const teamId = document.getElementById('kpiPijlerTeam') ? document.getElementById('kpiPijlerTeam').value : '';
    const naam = document.getElementById('kpiPijlerNaam') ? document.getElementById('kpiPijlerNaam').value.trim() : '';
    const week = parseInt(document.getElementById('kpiPijlerWeek') ? document.getElementById('kpiPijlerWeek').value : '') || null;
    const target = document.getElementById('kpiPijlerTarget') ? document.getElementById('kpiPijlerTarget').value.trim() : '';
    const status = document.getElementById('kpiPijlerStatus') ? document.getElementById('kpiPijlerStatus').value : 'Op schema';
    if(!teamId || !naam){ toast('Vul in elk geval een team en een omschrijving in.'); return; }
    const pijlers = KPI_TACTISCH[kwartaal].pijlers;
    if(editId){
      const bestaand = pijlers.find(p=>p.id===editId);
      if(bestaand){ Object.assign(bestaand, {teamId, naam, week, target, status}); }
      logActiviteit(`KPI: pijler "${naam}" bijgewerkt (${kwartaal})`);
    } else {
      const id = nextId(pijlers, 'pijler');
      pijlers.push({id, teamId, naam, week, target, status});
      logActiviteit(`KPI: pijler "${naam}" toegevoegd (${kwartaal})`);
    }
    STATE.kpiPijlerForm = null;
    persistMeta();
    toast('Pijler opgeslagen.');
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-pijler-delete]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    const [kwartaal, pijlerId] = el.getAttribute('data-kpi-pijler-delete').split('|');
    const pijlers = KPI_TACTISCH[kwartaal].pijlers;
    const idx = pijlers.findIndex(p=>p.id===pijlerId);
    if(idx===-1) return;
    if(!confirm('Deze pijler verwijderen?')) return;
    const naam = pijlers[idx].naam;
    pijlers.splice(idx,1);
    logActiviteit(`KPI: pijler "${naam}" verwijderd (${kwartaal})`);
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-comm-edit]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    STATE.kpiCommEdit = true;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-comm-cancel]').forEach(el=>el.addEventListener('click',()=>{
    STATE.kpiCommEdit = false;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kpi-comm-save]').forEach(el=>el.addEventListener('click',()=>{
    if(!isAdmin()) return;
    const weekInput = document.getElementById('kpiCommWeekInput');
    if(weekInput) KPI_COMMERCIEEL.week = parseInt(weekInput.value)||null;
    document.querySelectorAll('[data-kpi-comm-input]').forEach(inp=>{
      const [teamId, veld] = inp.getAttribute('data-kpi-comm-input').split('|');
      const d = kpiCommVoorTeam(teamId);
      d[veld] = Math.max(0, parseInt(inp.value)||0);
    });
    STATE.kpiCommEdit = false;
    logActiviteit("KPI: commerciële KPI's bijgewerkt");
    persistMeta();
    toast("Commerciële KPI's opgeslagen.");
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
}

function attachPanelHandlers(klant){
  const f = STORE[klant.id];
  document.querySelector('[data-close-panel]').addEventListener('click', closePanel);

  const editBtn = document.querySelector('[data-edit-klant]');
  if(editBtn) editBtn.addEventListener('click', ()=>{ STATE.editKlant = klant.id; openPanel(klant.id); });

  document.querySelectorAll('[data-mark-ingediend]').forEach(el=>el.addEventListener('click',()=>{
    const type = el.getAttribute('data-mark-ingediend');
    if(type==='LH'){
      completeLhPeriode(klant, huidigeGebruiker());
    } else {
      const entry = STORE[klant.id].dl[type];
      const herh = entry.herhaling || 'geen';
      if(herh !== 'geen'){ entry.datum = advanceDate(entry.datum, herh); entry.status = null; }
      else { entry.status = 'ingediend'; }
      persist();
    }
    refreshPanel(klant);
  }));
  document.querySelectorAll('[data-unmark-ingediend]').forEach(el=>el.addEventListener('click',()=>{
    const type = el.getAttribute('data-unmark-ingediend');
    STORE[klant.id].dl[type].status=null; persist(); refreshPanel(klant);
  }));
  document.querySelectorAll('[data-set-herhaling]').forEach(el=>el.addEventListener('change',()=>{
    const type = el.getAttribute('data-set-herhaling');
    STORE[klant.id].dl[type].herhaling = el.value;
    persist();
    toast('Herhaling ingesteld.');
  }));
  const loonToggle = document.getElementById('loonaangifteToggle');
  if(loonToggle) loonToggle.addEventListener('change', (e)=>{
    klant.doetLoonaangifte = e.target.checked;
    persistMeta();
    toast(e.target.checked ? 'Klant toegevoegd aan Loonheffingen.' : 'Klant verwijderd uit Loonheffingen.');
  });
  const dgaToggle = document.getElementById('dgaToggle');
  if(dgaToggle) dgaToggle.addEventListener('change', (e)=>{
    klant.heeftDga = e.target.checked;
    persistMeta();
    toast(e.target.checked ? 'Gemarkeerd als DGA-klant.' : 'Gemarkeerd als geen-DGA-klant.');
  });
  const opHoldToggle = document.getElementById('opHoldToggle');
  if(opHoldToggle) opHoldToggle.addEventListener('change', (e)=>{
    klant.staatOpHold = e.target.checked;
    persistMeta();
    toast(e.target.checked ? 'Klant gemarkeerd als "op hold".' : 'Klant niet meer op hold.');
    refreshPanel(klant);
  });
  const opHoldRedenSave = document.getElementById('opHoldRedenSave');
  if(opHoldRedenSave) opHoldRedenSave.addEventListener('click', ()=>{
    const input = document.getElementById('opHoldRedenInput');
    klant.opHoldReden = input ? input.value.trim() : '';
    persistMeta();
    toast('Reden opgeslagen.');
    refreshPanel(klant);
  });
  document.querySelectorAll('[data-mark-overige]').forEach(el=>el.addEventListener('click',()=>{
    const idx = +el.getAttribute('data-mark-overige');
    STORE[klant.id].dl.overige[idx].status='ingediend'; persist(); refreshPanel(klant);
  }));
  document.querySelectorAll('[data-unmark-overige]').forEach(el=>el.addEventListener('click',()=>{
    const idx = +el.getAttribute('data-unmark-overige');
    STORE[klant.id].dl.overige[idx].status=null; persist(); refreshPanel(klant);
  }));
  const addOv = document.querySelector('[data-add-overige]');
  if(addOv) addOv.addEventListener('click', ()=>{
    const naam = document.getElementById('newOvNaam').value.trim();
    const datum = invoerNaarDatum(document.getElementById('newOvDatum').value);
    if(!naam || !datum){ toast('Vul een geldige naam en datum (DD-MM-JJJJ) in.'); return; }
    STORE[klant.id].dl.overige.push({naam, datum, status:null}); persist(); refreshPanel(klant);
  });

  const saveFin = document.querySelector('[data-save-financieel]');
  if(saveFin) saveFin.addEventListener('click', ()=>{
    STORE[klant.id].saldo = parseFloat(document.getElementById('saldoInput').value)||0;
    STORE[klant.id].saldoDebet = parseFloat(document.getElementById('saldoDebetInput').value)||0;
    STORE[klant.id].saldoCredit = parseFloat(document.getElementById('saldoCreditInput').value)||0;
    STORE[klant.id].txn = parseInt(document.getElementById('txnInput').value)||0;
    persist(); toast('Financiële gegevens opgeslagen.'); refreshPanel(klant);
  });

  document.querySelectorAll('[data-toggle-item]').forEach(el=>el.addEventListener('change',()=>{
    const idx = +el.getAttribute('data-toggle-item');
    STORE[klant.id].items[idx].done = el.checked; persist(); refreshPanel(klant);
  }));
  document.querySelectorAll('[data-remove-item]').forEach(el=>el.addEventListener('click',()=>{
    const idx = +el.getAttribute('data-remove-item');
    STORE[klant.id].items.splice(idx,1); persist(); refreshPanel(klant);
  }));
  const addItem = document.querySelector('[data-add-item]');
  if(addItem) addItem.addEventListener('click', ()=>{
    const val = document.getElementById('newItemNaam').value.trim();
    if(!val) return;
    STORE[klant.id].items.push({naam:val, done:false}); persist(); refreshPanel(klant);
  });

  document.querySelectorAll('[data-chan]').forEach(el=>el.addEventListener('change',()=>{
    const chan = el.getAttribute('data-chan');
    const set = new Set(STORE[klant.id].kanalen);
    if(el.checked) set.add(chan); else set.delete(chan);
    STORE[klant.id].kanalen = [...set]; persist();
  }));
  const saveRem = document.querySelector('[data-save-reminder-settings]');
  if(saveRem) saveRem.addEventListener('click', ()=>{
    STORE[klant.id].dagen1 = parseInt(document.getElementById('dagen1Input').value)||7;
    STORE[klant.id].dagen2 = parseInt(document.getElementById('dagen2Input').value)||14;
    persist(); toast('Herinneringsinstellingen opgeslagen.');
  });
  document.querySelectorAll('[data-send-reminder]').forEach(el=>el.addEventListener('click',()=>{
    const ronde = +el.getAttribute('data-send-reminder');
    const msg = reminderMessage(klant, ronde);
    const kanalen = STORE[klant.id].kanalen;
    if(kanalen.includes('email')){
      window.open(`mailto:${klant.email}?subject=${encodeURIComponent(msg.subject)}&body=${encodeURIComponent(msg.body)}`, '_blank');
    }
    if(kanalen.includes('whatsapp')){
      window.open(`https://wa.me/${klant.tel.replace(/[^\d]/g,'')}?text=${encodeURIComponent(msg.body)}`, '_blank');
    }
    if(!kanalen.length){ toast('Selecteer eerst een kanaal (e-mail of WhatsApp).'); return; }
    STORE[klant.id].log.push({ts:new Date().toISOString().slice(0,10), ronde, kanaal:kanalen.join(' + ')});
    persist(); toast(`${ronde}e herinnering klaargezet voor ${klant.naam}.`); refreshPanel(klant);
  }));

  const saveNot = document.querySelector('[data-save-notities]');
  if(saveNot) saveNot.addEventListener('click', ()=>{
    STORE[klant.id].notities = document.getElementById('notitiesInput').value; persist(); toast('Notitie opgeslagen.');
  });

  const delKlantPanelBtn = document.querySelector('[data-delete-klant-panel]');
  if(delKlantPanelBtn) delKlantPanelBtn.addEventListener('click', ()=>{
    confirmDeleteKlant(klant.id);
  });
}
function refreshPanel(klant){
  document.getElementById('panel').innerHTML = panelHTML(klant);
  attachPanelHandlers(klant);
  if(STATE.view!=='dashboard'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlersLite(); }
}
function attachHandlersLite(){
  // Was ooit een handmatige deelverzameling van handlers (bedoeld om een dure volledige re-render te
  // vermijden na een achtergrond-refresh), maar raakte daardoor telkens achter bij nieuwe knoppen op
  // de pagina's (Loonheffingen, Teams, Klanten, enz.) — die werden dan onklikbaar zodra het klantpaneel
  // open stond tijdens een refresh. Nu bindOnce() dubbele listeners op de vaste buiten-#contentArea
  // elementen toch al voorkomt, is het veilig én correcter om gewoon de volledige attachHandlers() te
  // hergebruiken.
  attachHandlers();
}

// Elke stap hieronder is defensief in een try/catch gezet: een fout in de Microsoft-sync
// (bijv. een verkeerd ingevuld App ID) mag de rest van het dashboard nooit blokkeren of
// een blanco pagina veroorzaken — render() moet hoe dan ook draaien.

// MSAL kan een 'interaction in progress'-vlag laten hangen in sessionStorage als een vorige
// inlogpoging (bijv. een gesloten pop-up, of een gecrashte pagina) niet netjes werd afgerond.
// Die vlag blokkeert daarna alle volgende inlogpogingen/stille token-ververste tot de gebruiker
// zijn browsergeschiedenis (en daarmee sessionStorage) wist. Bij het laden van deze pagina is er
// per definitie nog geen interactie bezig, dus we ruimen een eventueel achtergebleven vlag hier
// veilig op — dat voorkomt dat de gebruiker steeds handmatig zijn browsergeschiedenis moet wissen.
try{
  Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf('interaction.status')>-1) sessionStorage.removeItem(k); });
}catch(e){}

// De laatst bekeken pagina (uit localStorage) bepaalt bij het laden op welke pagina we starten,
// zodat een refresh je niet terugzet naar het Overzicht.
try{
  const laatstePagina = laatstBekekenPagina();
  if(laatstePagina) STATE.view = laatstePagina;
}catch(e){}

try{ loadSync(); }catch(e){ console.error('Sync-instellingen laden mislukt:', e); }
try{ render(); }catch(e){
  console.error('Render mislukt:', e);
  const appEl = document.getElementById('app');
  if(appEl) appEl.innerHTML = '<div style="padding:40px; font-family:sans-serif; max-width:600px; margin:0 auto;">'
    + '<h2>Er ging iets mis bij het laden</h2>'
    + '<p>Technische foutmelding: ' + (e && e.message ? e.message : e) + '</p>'
    + '<p>Probeer de pagina te verversen. Blijft dit gebeuren, stuur deze foutmelding door.</p></div>';
}
try{ if(SYNC.enabled) fetchRemoteAndMerge(false); }catch(e){ console.error('Sync mislukt:', e); }
setInterval(()=>{
  if(SYNC.enabled && !STATE.panelKlant && !STATE.showAddKlant && !STATE.showAddBh && !isTypingInField()){
    try{ fetchRemoteAndMerge(false); }catch(e){ console.error('Sync mislukt:', e); }
  }
}, 45000);


// Vang op dat gedebouncede localStorage-writes (persist/persistMeta) niet verloren gaan als het
// tabblad direct na een wijziging wordt gesloten.
window.addEventListener('beforeunload', ()=>{
  try{ flushPersistStore(); }catch(e){}
  try{ flushPersistMeta(); }catch(e){}
});


</script>
