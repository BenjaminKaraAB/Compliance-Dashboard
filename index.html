/* ============================= BIJTELLING-REKENMODULE (Autolijst) =============================
   Deze module rekent bewust EXACT zoals het Excel-bestand "AUTOLIJST BIJTELLING" (kolommen N t/m X op
   het tabblad Checklist, tarieventabel op tabblad Bijtelling): zelfde brontabel, zelfde 60-maanden-
   regeling voor elektrische auto's, zelfde youngtimer- en pro-rata-logica. Twee bewuste verschillen
   t.o.v. het Excel-bestand, allebei nodig om de berekening écht automatisch te laten meelopen met de
   tijd (in plaats van elk jaar handmatig het jaartal in de formules te moeten aanpassen):
     - waar Excel het jaartal 2026 hardcodeert (in de kolommen U/V/X), gebruiken wij hier altijd het
       huidige jaar (TODAY.getFullYear());
     - de tabel met bijtellingspercentages (BIJTELLING_TABEL) is voor beheerders uitbreidbaar met nieuwe
       jaren, i.p.v. vast in een Excel-tabblad te staan. */
function laatsteBijtellingJaar(){
  if(!BIJTELLING_TABEL.length) return TODAY.getFullYear();
  return Math.max(...BIJTELLING_TABEL.map(r=>r.jaar));
}
function eersteBijtellingJaar(){
  if(!BIJTELLING_TABEL.length) return TODAY.getFullYear();
  return Math.min(...BIJTELLING_TABEL.map(r=>r.jaar));
}
// Geeft het tarief (laag/cap/algemeen) voor een gegeven jaar. Jaren vóór het begin van de tabel
// gebruiken altijd 25% (zoals de "<2017"-regel in het Excel-bestand); jaren ná het laatst ingevulde
// tabeljaar (bijv. een auto die dit jaar is geregistreerd, maar de beheerder heeft het nieuwe jaar nog
// niet toegevoegd) vallen terug op het laatst bekende jaar, zodat de berekening nooit vastloopt.
function bijtellingRijVoorJaar(jaar){
  if(!BIJTELLING_TABEL.length) return {laag:0, cap:0, algemeen: jaar<2017?0.25:0.22};
  const minJaar = eersteBijtellingJaar(), maxJaar = laatsteBijtellingJaar();
  if(jaar < minJaar) return {laag:0, cap:0, algemeen:0.25};
  let rij = BIJTELLING_TABEL.find(r=>r.jaar===jaar);
  if(!rij) rij = BIJTELLING_TABEL.find(r=>r.jaar===maxJaar);
  return { laag: rij.laag||0, cap: rij.cap||0, algemeen: (rij.algemeen!==undefined && rij.algemeen!==null) ? rij.algemeen : 0.22 };
}
function bedragVoorTarief(catalogus, tarief){
  const cap = tarief.cap||0;
  return Math.min(catalogus,cap)*(tarief.laag||0) + Math.max(0,catalogus-cap)*tarief.algemeen;
}
function jongtimerGrensDatum(){
  return new Date(TODAY.getFullYear()-16, TODAY.getMonth(), TODAY.getDate());
}
function isJongtimer(auto){
  if(!auto || !auto.datumEersteInschrijving) return false;
  const l = new Date(auto.datumEersteInschrijving+'T00:00:00');
  if(isNaN(l.getTime())) return false;
  return l <= jongtimerGrensDatum();
}
function vuzgMoetOpgevraagdWorden(auto){
  return auto.type==='bestelauto' && auto.gebruik==='Enkel zakelijk (onder 500 km prive)';
}
function bijtellingVanToepassing(auto){
  if(auto.gebruik==='Enkel zakelijk (onder 500 km prive)') return false;
  if(vuzgMoetOpgevraagdWorden(auto)) return false;
  return true;
}
// Aantal maanden dat de auto dit jaar in gebruik was (rekening houdend met aan-/verkoopdatum),
// exact zoals de pro-rata-formule in kolom U/X van het Excel-bestand.
function maandenGebruiktInJaar(auto){
  const jaar = TODAY.getFullYear();
  const jaarStart = new Date(jaar,0,1), jaarEind = new Date(jaar,11,31);
  const aankoop = auto.aankoopdatum ? new Date(auto.aankoopdatum+'T00:00:00') : jaarStart;
  const verkoop = auto.verkoopdatum ? new Date(auto.verkoopdatum+'T00:00:00') : jaarEind;
  const eind = verkoop < jaarEind ? verkoop : jaarEind;
  const start = aankoop > jaarStart ? aankoop : jaarStart;
  const maanden = (eind.getFullYear()*12+eind.getMonth()) - (start.getFullYear()*12+start.getMonth()) + 1;
  return Math.max(0, maanden);
}
// Bijtelling over 12 maanden (nog vóór de pro-rata-verrekening voor dit jaar) — komt overeen met kolom T.
// Geeft null terug voor "n.v.t." (auto waar geen bijtelling op van toepassing is).
function berekenBijtellingJaarbedrag(auto){
  if(!bijtellingVanToepassing(auto)) return null;
  const catalogus = Number(auto.cataloguswaarde) || 0;
  if(isJongtimer(auto)){
    const dagwaarde = Number(auto.dagwaarde);
    return (isFinite(dagwaarde) ? dagwaarde : 0) * 0.35;
  }
  if(auto.elektrisch === 'ja' && auto.datumEersteInschrijving){
    const l = new Date(auto.datumEersteInschrijving+'T00:00:00');
    if(isNaN(l.getTime())) return null;
    const eindeWindow = new Date(l.getFullYear(), l.getMonth()+60, l.getDate());
    const origTarief = bijtellingRijVoorJaar(l.getFullYear());
    if(TODAY <= eindeWindow){
      // Nog binnen de 60-maanden-periode: het (verlaagde) tarief van het registratiejaar geldt volledig.
      return bedragVoorTarief(catalogus, origTarief);
    }
    const eindJaar = eindeWindow.getFullYear();
    const laatsteJaar = laatsteBijtellingJaar();
    if(eindJaar < laatsteJaar){
      // De 60 maanden zijn al in een eerder jaar verstreken: gebruik het laatst bekende jaartarief.
      return bedragVoorTarief(catalogus, bijtellingRijVoorJaar(laatsteJaar));
    }
    if(eindJaar > laatsteJaar){
      // Randgeval: de tabel is nog niet bijgewerkt tot het jaar waarin de 60 maanden aflopen — val terug
      // op het tarief van het registratiejaar totdat de beheerder het nieuwe jaar toevoegt.
      return bedragVoorTarief(catalogus, origTarief);
    }
    // De 60 maanden lopen af in het huidige laatste tabeljaar: splits naar rato van vóór/na die datum.
    const laatsteTarief = bijtellingRijVoorJaar(laatsteJaar);
    const eersteDeelMaanden = eindeWindow.getMonth(); // 0-11 (komt overeen met MONTH(eindeWindow)-1 in Excel)
    const tweedeDeelMaanden = 12 - eersteDeelMaanden;
    return bedragVoorTarief(catalogus, origTarief)*(eersteDeelMaanden/12) + bedragVoorTarief(catalogus, laatsteTarief)*(tweedeDeelMaanden/12);
  }
  // Elektrisch zonder (geldige) datum 1e inschrijving, of een gewone (niet-elektrische) auto.
  const jaarInschrijving = auto.datumEersteInschrijving ? new Date(auto.datumEersteInschrijving+'T00:00:00').getFullYear() : TODAY.getFullYear();
  return catalogus * (jaarInschrijving < 2017 ? 0.25 : 0.22);
}
// Uiteindelijke, pro-rata bijtelling voor dit jaar — komt overeen met kolom U.
function berekenBijtellingProRata(auto){
  const jaarbedrag = berekenBijtellingJaarbedrag(auto);
  if(jaarbedrag===null) return null;
  return jaarbedrag * (maandenGebruiktInJaar(auto)/12);
}
// BTW-correctiepercentage — komt overeen met kolom V.
function berekenBtwCorrectiePercentage(auto){
  if(auto.gebruik === 'Enkel zakelijk (onder 500 km prive)') return null;
  const jaar = TODAY.getFullYear();
  const aankoopJaar = auto.aankoopdatum ? new Date(auto.aankoopdatum+'T00:00:00').getFullYear() : jaar;
  if(jaar >= aankoopJaar + 5) return 0.015;
  return auto.btwAuto === 'ja' ? 0.027 : 0.015;
}
// BTW-correctie over 12 maanden — komt overeen met kolom W.
function berekenBtwCorrectieJaarbedrag(auto){
  const perc = berekenBtwCorrectiePercentage(auto);
  if(perc===null) return null;
  return (Number(auto.cataloguswaarde)||0) * perc;
}
// Uiteindelijke, pro-rata BTW-correctie voor dit jaar — komt overeen met kolom X.
function berekenBtwCorrectieProRata(auto){
  const jaarbedrag = berekenBtwCorrectieJaarbedrag(auto);
  if(jaarbedrag===null) return null;
  return jaarbedrag * (maandenGebruiktInJaar(auto)/12);
}
function klantVanAuto(auto){ return RAW_KLANTEN.find(k=>k.id===auto.klant) || null; }

/* ============================= ARCHIEF-UPLOADER =============================

const ARCHIEF_HOOFDMAP = 'AB- ZAKELIJKE KLANTEN';

async function archiefVindRoot(allowInteractive){
  if(ARCHIEF.cfg && ARCHIEF.cfg.driveId && ARCHIEF.cfg.rootId) return ARCHIEF.cfg;
  const sitesRes = await graphFetch('https://graph.microsoft.com/v1.0/sites?search=AdministratieBox', {}, allowInteractive);
  const sites = (sitesRes.value||[]);
  for(const site of sites){
    let drivesRes;
    try{ drivesRes = await graphFetch(`https://graph.microsoft.com/v1.0/sites/${site.id}/drives`, {}, allowInteractive); }catch(e){ continue; }
    for(const drive of (drivesRes.value||[])){
      // Probeer de hoofdmap direct in de bibliotheekroot, en ook één niveau dieper (General/),
      // want Teams-gekoppelde bibliotheken nestelen kanaalmappen soms onder "General".
      for(const pad of [ARCHIEF_HOOFDMAP, `General/${ARCHIEF_HOOFDMAP}`]){
        try{
          const item = await graphFetch(`https://graph.microsoft.com/v1.0/drives/${drive.id}/root:/${encodeURIComponent(pad).replace(/%2F/g,'/')}`, {}, false);
          if(item && item.id && item.folder){
            ARCHIEF.cfg = { driveId: drive.id, rootId: item.id, siteNaam: site.displayName||site.name||'', driveNaam: drive.name||'', pad };
            archiefBewaarCfg();
            return ARCHIEF.cfg;
          }
        }catch(e){ /* map bestaat niet in deze drive — volgende proberen */ }
      }
    }
  }
  throw new Error(`Map "${ARCHIEF_HOOFDMAP}" niet gevonden in de SharePoint-bibliotheken waar je toegang toe hebt.`);
}
async function archiefLaadKlantmappen(allowInteractive){
  const cfg = await archiefVindRoot(allowInteractive);
  const mappen = [];
  let url = `https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${cfg.rootId}/children?$top=999&$select=id,name,folder`;
  while(url){
    const res = await graphFetch(url, {}, allowInteractive);
    (res.value||[]).forEach(it=>{
      if(!it.folder) return;
      const m = it.name.match(/\((\d+)\)\s*$/);
      mappen.push({ id: it.id, naam: it.name, nummer: m ? m[1] : null });
    });
    url = res['@odata.nextLink'] || null;
  }
  mappen.sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  ARCHIEF.klantmappen = mappen;
  return mappen;
}
async function archiefLaadSubmappen(klantmapId){
  if(ARCHIEF.submappen[klantmapId]) return ARCHIEF.submappen[klantmapId];
  const cfg = ARCHIEF.cfg;
  const res = await graphFetch(`https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${klantmapId}/children?$top=200&$select=id,name,folder`, {}, false);
  const subs = (res.value||[]).filter(it=>it.folder).map(it=>({id:it.id, naam:it.name}));
  subs.sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  ARCHIEF.submappen[klantmapId] = subs;
  return subs;
}
// Raad de klantmap op basis van de bestandsnaam: eerst klantnummer-match (betrouwbaarst),
// daarna naam-match op de mapnaam zonder het (nummer)-deel.
function archiefRaadKlantmap(bestandsnaam){
  if(!ARCHIEF.klantmappen) return null;
  const naamLower = bestandsnaam.toLowerCase();
  const nummers = bestandsnaam.match(/\d{2,}/g) || [];
  for(const map of ARCHIEF.klantmappen){
    if(map.nummer && nummers.includes(map.nummer)) return map;
  }
  // extId van dashboardklanten wiens naam in het bestand voorkomt → map met dat nummer
  for(const k of RAW_KLANTEN){
    if(k.extId && k.naam && k.naam.length>3 && naamLower.includes(k.naam.toLowerCase().replace(/\s*(b\.?v\.?|holding)\s*$/i,'').trim())){
      const map = ARCHIEF.klantmappen.find(m=>m.nummer===String(k.extId).trim());
      if(map) return map;
    }
  }
  for(const map of ARCHIEF.klantmappen){
    const kaal = map.naam.replace(/\s*\(\d+\)\s*$/,'').trim().toLowerCase();
    if(kaal.length>3 && naamLower.includes(kaal)) return map;
  }
  return null;
}
function archiefDoelmapId(item){
  return (item.pad && item.pad.length) ? item.pad[item.pad.length-1].id : item.klantmapId;

function archiefDoelmapPad(item){

  const namen = [];

async function archiefPriveInit(allowInteractive){

  const subs = (res.value||[]).filter(it=>it.folder).map(it=>({id:it.id, naam:it.name}));

async function archiefUploadBestand(item){
  const prive = item.doel === 'prive';
  const cfg = prive ? { driveId: ARCHIEF.priveDriveId } : ARCHIEF.cfg;
  const parentId = prive ? archiefPriveDoelId() : archiefDoelmapId(item);
  const bestandsnaam = item.file.name.replace(/[\\/:*?"<>|#%]/g,'_');
  const token = await getGraphToken(true);
  if(item.file.size < 3800000){
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${parentId}:/${encodeURIComponent(bestandsnaam)}:/content?@microsoft.graph.conflictBehavior=rename`, {
      method:'PUT', headers:{ 'Authorization':'Bearer '+token }, body: item.file
    });
    if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error(`Upload mislukt (${res.status})${t?': '+t.slice(0,150):''}`); }
    return await res.json();
  }
  // Grote bestanden: upload-sessie in delen van 3,2 MB (Graph vereist veelvouden van 320 KiB).
  const sesRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${parentId}:/${encodeURIComponent(bestandsnaam)}:/createUploadSession`, {
    method:'POST', headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior':'rename', name: bestandsnaam } })
  });
  if(!sesRes.ok) throw new Error(`Upload-sessie starten mislukt (${sesRes.status})`);
  const ses = await sesRes.json();
  const CHUNK = 3276800;
  let start = 0, laatste = null;
  while(start < item.file.size){
    const end = Math.min(start+CHUNK, item.file.size);
    const blob = item.file.slice(start, end);
    const up = await fetch(ses.uploadUrl, {
      method:'PUT',
      headers:{ 'Content-Range':`bytes ${start}-${end-1}/${item.file.size}`, 'Content-Length': String(end-start) },
      body: blob
    });
    if(!up.ok && up.status!==202){ throw new Error(`Upload afgebroken bij ${Math.round(start/item.file.size*100)}% (${up.status})`); }
    laatste = up.status===202 ? null : await up.json().catch(()=>null);
    start = end;
  }
  return laatste;
}

function pdfMergeVoegToe(fileList){
  let overgeslagen = 0;
  for(const file of Array.from(fileList||[])){
    const isPdf = (file.type === 'application/pdf') || /\.pdf$/i.test(file.name||'');
    if(!isPdf){ overgeslagen++; continue; }
    PDF_MERGE.wachtrij.push({ file, naam: file.name || 'naamloos.pdf', grootte: file.size || 0 });
  }
  PDF_MERGE.resultaat = null; PDF_MERGE.fout = null;
  if(overgeslagen) toast(`${overgeslagen} bestand(en) overgeslagen: alleen PDF-bestanden kunnen worden samengevoegd.`);
  pdfMergeRerender();
}
function pdfMergeVerplaats(idx, richting){
  const j = idx + richting;
  if(idx < 0 || j < 0 || j >= PDF_MERGE.wachtrij.length) return;
  [PDF_MERGE.wachtrij[idx], PDF_MERGE.wachtrij[j]] = [PDF_MERGE.wachtrij[j], PDF_MERGE.wachtrij[idx]];
  pdfMergeRerender();
}
async function pdfMergeSamenvoegen(){
  if(PDF_MERGE.bezig || PDF_MERGE.wachtrij.length < 2) return;
  if(typeof PDFLib === 'undefined' || !PDFLib || !PDFLib.PDFDocument){
    PDF_MERGE.fout = 'De PDF-bibliotheek kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina.';
    pdfMergeRerender(); return;
  }
  PDF_MERGE.bezig = true; PDF_MERGE.fout = null; PDF_MERGE.resultaat = null;
  pdfMergeRerender();
  try{
    const doel = await PDFLib.PDFDocument.create();
    let totaalPaginas = 0;
    for(const item of PDF_MERGE.wachtrij){
      let bron;
      try{
        const bytes = await item.file.arrayBuffer();
        bron = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      }catch(e){
        throw new Error(`"${item.naam}" kon niet gelezen worden — is dit een geldig, niet-beveiligd PDF-bestand?`);
      }
      const paginas = await doel.copyPages(bron, bron.getPageIndices());
      paginas.forEach(p=>doel.addPage(p));
      totaalPaginas += paginas.length;
    }
    const uitBytes = await doel.save();
    const naam = `Samengevoegd-${new Date().toISOString().slice(0,10)}.pdf`;
    const blob = new Blob([uitBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = naam;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    PDF_MERGE.resultaat = { naam, aantal: PDF_MERGE.wachtrij.length, paginas: totaalPaginas };
    logActiviteit(`PDF-samenvoeger: ${PDF_MERGE.wachtrij.length} bestanden samengevoegd (${totaalPaginas} pagina's)`);
    PDF_MERGE.wachtrij = [];
    toast('PDF samengevoegd en gedownload.');
  }catch(e){
    PDF_MERGE.fout = e.message || 'Samenvoegen mislukt.';
  }
  PDF_MERGE.bezig = false;
  pdfMergeRerender();
}

async function archiefInit(){

  try{
    await archiefLaadKlantmappen(true);
  }catch(e){

  }
  ARCHIEF.laden = false;
  if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
async function archiefVoegBestandenToe(fileList){
  const jaarNu = String(TODAY.getFullYear());
  if(ARCHIEF.doel === 'prive'){
    for(const file of Array.from(fileList)){
      ARCHIEF.wachtrij.push({ file, doel:'prive', klantmapId:null, pad:[], status:'wachten', fout:null, geraden:false });
    }
    if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
    return;
  }
  for(const file of Array.from(fileList)){
    const geraden = archiefRaadKlantmap(file.name);
    const item = { file, klantmapId: geraden?geraden.id:null, pad: [], status:'wachten', fout:null, geraden: !!geraden };
    ARCHIEF.wachtrij.push(item);
    if(item.klantmapId){
      try{
        const subs = await archiefLaadSubmappen(item.klantmapId);
        const jaarmap = subs.find(sm=>sm.naam===jaarNu);
        if(jaarmap){
          item.pad = [{id:jaarmap.id, naam:jaarmap.naam}];
          try{ await archiefLaadSubmappen(jaarmap.id); }catch(e){}
        }
      }catch(e){}
    }
  }
  if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
async function archiefPriveInitFlow(allowInteractive){
  if(ARCHIEF.laden) return;
  ARCHIEF.laden = true; ARCHIEF.fout = null;
  try{
    await archiefPriveInit(allowInteractive);
    await archiefPriveLaadSubmappen(ARCHIEF.priveRootId);
    // Onthouden pad valideren en de kinderen van elk niveau alvast laden
    let parentId = ARCHIEF.priveRootId;
    const geldigPad = [];
    for(const stap of ARCHIEF.privePad){
      const subs = ARCHIEF.priveSubmappen[parentId] || await archiefPriveLaadSubmappen(parentId);
      const gevonden = subs.find(sm=>sm.id===stap.id || sm.naam===stap.naam);
      if(!gevonden) break;
      geldigPad.push({id:gevonden.id, naam:gevonden.naam});
      await archiefPriveLaadSubmappen(gevonden.id).catch(()=>{});
      parentId = gevonden.id;
    }
    ARCHIEF.privePad = geldigPad;
    try{ localStorage.setItem('cd_archief_prive', JSON.stringify(ARCHIEF.privePad)); }catch(e){}
  }catch(e){
    ARCHIEF.fout = e.message || 'Kon je OneDrive niet bereiken.';
  }
  ARCHIEF.laden = false;
  if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}

  document.querySelectorAll('[data-pdfmerge-omhoog]').forEach(el=>el.addEventListener('click', ()=>pdfMergeVerplaats(Number(el.getAttribute('data-pdfmerge-omhoog')), -1)));
  document.querySelectorAll('[data-pdfmerge-omlaag]').forEach(el=>el.addEventListener('click', ()=>pdfMergeVerplaats(Number(el.getAttribute('data-pdfmerge-omlaag')), 1)));

    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-archief-map]').forEach(el=>el.addEventListener('change', async ()=>{
    const [idxStr, levelStr] = el.getAttribute('data-archief-map').split('|');
    const idx = Number(idxStr), level = Number(levelStr);
    const item = ARCHIEF.wachtrij[idx]; if(!item) return;
    item.pad = item.pad.slice(0, level);
    if(el.value){
      const parentId = level===0 ? item.klantmapId : item.pad[level-1].id;
      const subs = ARCHIEF.submappen[parentId] || [];
      const gekozen = subs.find(s=>s.id===el.value);
      item.pad.push({ id: el.value, naam: gekozen ? gekozen.naam : '' });
      try{ await archiefLaadSubmappen(el.value); }catch(e){}
    }
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-archief-verwijder]').forEach(el=>el.addEventListener('click', ()=>{
    const idx = Number(el.getAttribute('data-archief-verwijder'));
    ARCHIEF.wachtrij.splice(idx, 1);
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-archief-upload]').forEach(el=>el.addEventListener('click', async ()=>{
    const idx = Number(el.getAttribute('data-archief-upload'));
    const item = ARCHIEF.wachtrij[idx];
    if(!item || item.status==='bezig') return;
    if(item.doel!=='prive' && !item.klantmapId) return;
    item.status = 'bezig'; item.fout = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    try{
      await archiefUploadBestand(item);
      item.status = 'klaar';
      const doel = item.doel==='prive' ? archiefPrivePadNamen().join(' › ') : (archiefDoelmapPad(item).join(' › ') || '?');
      ARCHIEF.log.push({ bestand: item.file.name, doel, ts: new Date().toISOString() });
      archiefBewaarLog();
      logActiviteit(`Archief: "${item.file.name}" gearchiveerd bij ${doel}`);
      toast('Bestand gearchiveerd in SharePoint.');
      setTimeout(()=>{
        const i = ARCHIEF.wachtrij.indexOf(item);
        if(i>-1){ ARCHIEF.wachtrij.splice(i,1); if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); } }
      }, 2500);
    }catch(e){
      item.status = 'fout'; item.fout = e.message || 'onbekende fout';
    }
    if(STATE.view==='archief'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
  }));
}
/* ============================= KENNISBANK / OPLEIDING =============================
   Interne opleidingssectie voor (nieuwe/junior) boekhouders: categorieën met artikelen
   (stappenplannen, uitleg). Alleen beheerders kunnen content aanmaken/bewerken/verwijderen — de
   bestaande AI-assistent (topbar) dient als het "vragen stellen"-kanaal; er is bewust geen aparte
   vraag-functie gebouwd. De kennisbank-inhoud wordt daarnaast meegegeven aan de AI-context (zie
   aiContextSamenvatting) zodat de assistent ook onze eigen werkwijze kent, niet alleen dashboarddata. */
function kbCategorieNaam(id){
  const c = KENNISBANK.categorieen.find(c=>c.id===id);
  return c ? c.naam : 'Algemeen';
}
function kbArtikelenVoorCategorie(catId){
  // Bewust geen alfabetische sortering: de volgorde in het array is de handmatig
  // gesleepte volgorde (drag & drop door een beheerder) en synct mee naar collega's.
  return KENNISBANK.artikelen.filter(a=>(a.categorieId||null)===(catId||null));
}
let kbSleepArtikelId = null;
let kbSleepCatId = null;
// Verplaatst een artikel: vóór een doel-artikel (zelfde of andere categorie), of naar het
// einde van een categorie (doelCatId, bij droppen op de categorie zelf/lege lijst).
function kbVerplaatsArtikel(bronId, doelId, doelCatId){
  if(!bronId || bronId===doelId) return false;
  const idx = KENNISBANK.artikelen.findIndex(a=>a.id===bronId);
  if(idx===-1) return false;
  const art = KENNISBANK.artikelen.splice(idx,1)[0];
  if(doelId){
    const doelIdx = KENNISBANK.artikelen.findIndex(a=>a.id===doelId);
    if(doelIdx===-1){ KENNISBANK.artikelen.push(art); }
    else {
      art.categorieId = KENNISBANK.artikelen[doelIdx].categorieId || null;
      KENNISBANK.artikelen.splice(doelIdx, 0, art);
    }
  } else {
    art.categorieId = doelCatId || null;
    KENNISBANK.artikelen.push(art);
  }
  persistMeta();
  return true;
}
function kbVerplaatsCategorie(bronId, doelId){
  if(!bronId || bronId===doelId) return false;
  const idx = KENNISBANK.categorieen.findIndex(c=>c.id===bronId);
  if(idx===-1) return false;
  const cat = KENNISBANK.categorieen.splice(idx,1)[0];
  const doelIdx = doelId ? KENNISBANK.categorieen.findIndex(c=>c.id===doelId) : -1;
  if(doelIdx===-1) KENNISBANK.categorieen.push(cat);
  else KENNISBANK.categorieen.splice(doelIdx, 0, cat);
  persistMeta();
  return true;
}

  return LEERPAD_VOORTGANG[wie];

/* Zet artikel-inhoud om naar HTML: gewone tekst blijft geescapete tekst (pre-wrap), en
   [video]https://...[/video]-blokken worden afspeelbare spelers. Ondersteund: YouTube en
   Vimeo (embed-iframe), directe videobestanden (.mp4/.webm/.mov), en SharePoint/Stream-links
   (iframe + altijd een "Open video"-knop als vangnet, want SharePoint embed vereist dat je in
   dezelfde browser bij Microsoft bent ingelogd). */
function kbVideoEmbedHTML(rawUrl){
  const url = String(rawUrl||'').trim();
  if(!/^https?:\/\//i.test(url)) return '';
  const esc = url.replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const wrap = (inner)=>`<div style="margin:10px 0;">${inner}</div>`;
  const openKnop = `<div style="margin-top:6px;"><a class="btn sm" href="${esc}" target="_blank" rel="noopener"><i class="ti ti-external-link" aria-hidden="true"></i> Open video in nieuw tabblad</a></div>`;
  let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,20})/);
  if(m) return wrap(`<iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%; aspect-ratio:16/9; border:none; border-radius:10px;" allowfullscreen loading="lazy"></iframe>`);
  m = url.match(/vimeo\.com\/(\d+)/);
  if(m) return wrap(`<iframe src="https://player.vimeo.com/video/${m[1]}" style="width:100%; aspect-ratio:16/9; border:none; border-radius:10px;" allowfullscreen loading="lazy"></iframe>`);
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)) return wrap(`<video controls preload="metadata" src="${esc}" style="width:100%; max-height:420px; border-radius:10px; background:#000;"></video>`);
  if(/sharepoint\.com|microsoftstream\.com|onedrive/i.test(url)){
    return wrap(`<iframe src="${esc}" style="width:100%; aspect-ratio:16/9; border:1px solid var(--border); border-radius:10px;" allowfullscreen loading="lazy"></iframe>${openKnop}`);
  }
  return wrap(openKnop);
}
function kbRenderInhoud(inhoud){
  const tekst = String(inhoud||'');
  if(!tekst.trim()) return '(geen inhoud)';
  const delen = tekst.split(/\[video\]([\s\S]*?)\[\/video\]/gi);
  return delen.map((deel, i)=>{
    if(i % 2 === 1) return kbVideoEmbedHTML(deel);
    return deel.replace(/</g,'&lt;');
  }).join('');
}

function kennisbankBindHandlers(){
  if(STATE.view!=='kennisbank') return;
  document.querySelectorAll('[data-kb-open-ai]').forEach(el=>el.addEventListener('click', ()=>{ aiOpen(); }));
  document.querySelectorAll('[data-kb-artikel-toggle]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-kb-stop-toggle]')) return;
    const id = el.getAttribute('data-kb-artikel-toggle');
    STATE.kbOpenArtikel = STATE.kbOpenArtikel===id ? null : id;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  if(!isAdmin()) return;
  // --- drag & drop sorteren ---
  const kbRerender = ()=>{ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); };
  document.querySelectorAll('[data-kb-drag]').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{
      kbSleepArtikelId = el.getAttribute('data-kb-drag'); kbSleepCatId = null;
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; }
      e.stopPropagation();
    });
    el.addEventListener('dragover', (e)=>{ if(!kbSleepArtikelId) return; e.preventDefault(); e.stopPropagation(); el.style.boxShadow = 'inset 0 2px 0 var(--primary)'; });
    el.addEventListener('dragleave', ()=>{ el.style.boxShadow = ''; });
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); e.stopPropagation(); el.style.boxShadow = '';
      if(kbSleepArtikelId && kbVerplaatsArtikel(kbSleepArtikelId, el.getAttribute('data-kb-drag'))){ kbSleepArtikelId = null; kbRerender(); toast('Volgorde aangepast.'); }
    });
  });
  document.querySelectorAll('[data-kb-dropcat]').forEach(el=>{
    el.addEventListener('dragover', (e)=>{ if(!kbSleepArtikelId) return; e.preventDefault(); el.style.outline = '2px dashed var(--primary)'; });
    el.addEventListener('dragleave', ()=>{ el.style.outline = ''; });
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); el.style.outline = '';
      if(kbSleepArtikelId && kbVerplaatsArtikel(kbSleepArtikelId, null, el.getAttribute('data-kb-dropcat') || null)){ kbSleepArtikelId = null; kbRerender(); toast('Artikel verplaatst.'); }
    });
  });
  document.querySelectorAll('[data-kb-cat-drag]').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{ kbSleepCatId = el.getAttribute('data-kb-cat-drag'); kbSleepArtikelId = null; if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; } });
    el.addEventListener('dragover', (e)=>{ if(!kbSleepCatId) return; e.preventDefault(); el.style.boxShadow = 'inset 0 2px 0 var(--primary)'; });
    el.addEventListener('dragleave', ()=>{ el.style.boxShadow = ''; });
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); el.style.boxShadow = '';
      if(kbSleepCatId && kbVerplaatsCategorie(kbSleepCatId, el.getAttribute('data-kb-cat-drag'))){ kbSleepCatId = null; kbRerender(); toast('Categorie-volgorde aangepast.'); }
    });
  });
  document.querySelectorAll('[data-kb-cat-nieuw-open]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.kbCatNieuwOpen = true;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    const inp = document.getElementById('kbCatNaam'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-kb-cat-annuleer]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.kbCatNieuwOpen = false;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kb-cat-opslaan]').forEach(el=>el.addEventListener('click', ()=>{
    const inp = document.getElementById('kbCatNaam');
    const naam = inp ? inp.value.trim() : '';
    if(!naam){ toast('Vul een naam in.'); return; }
    KENNISBANK.categorieen.push({ id:'cat'+Date.now()+Math.floor(Math.random()*1000), naam });
    STATE.kbCatNieuwOpen = false;
    logActiviteit(`Kennisbank: categorie "${naam}" toegevoegd`);
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast('Categorie toegevoegd.');
  }));
  document.querySelectorAll('[data-kb-cat-verwijder]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-kb-cat-verwijder');
    const cat = KENNISBANK.categorieen.find(c=>c.id===id); if(!cat) return;
    const aantal = kbArtikelenVoorCategorie(id).length;
    const melding = aantal ? `Categorie "${cat.naam}" verwijderen? De ${aantal} artikel(en) hierin worden dan ook verwijderd.` : `Categorie "${cat.naam}" verwijderen?`;
    if(!confirm(melding)) return;
    KENNISBANK.artikelen = KENNISBANK.artikelen.filter(a=>a.categorieId!==id);
    KENNISBANK.categorieen = KENNISBANK.categorieen.filter(c=>c.id!==id);
    logActiviteit(`Kennisbank: categorie "${cat.naam}" verwijderd`);
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast('Categorie verwijderd.');
  }));
  document.querySelectorAll('[data-kb-artikel-nieuw]').forEach(el=>el.addEventListener('click', ()=>{
    const categorieId = el.getAttribute('data-kb-artikel-nieuw') || null;
    STATE.kbArtikelForm = { id:null, categorieId };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    const inp = document.getElementById('kbArtikelTitel'); if(inp) inp.focus();
  }));
  document.querySelectorAll('[data-kb-artikel-bewerk]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.getAttribute('data-kb-artikel-bewerk');
    const a = KENNISBANK.artikelen.find(x=>x.id===id); if(!a) return;
    STATE.kbArtikelForm = { id, categorieId: a.categorieId||null };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kb-artikel-annuleer]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.kbArtikelForm = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-kb-video-insert]').forEach(el=>el.addEventListener('click', ()=>{
    const urlInput = document.getElementById('kbVideoUrl');
    const inhoud = document.getElementById('kbArtikelInhoud');
    const url = urlInput ? urlInput.value.trim() : '';
    if(!url){ toast('Plak eerst een videolink.'); return; }
    if(!/^https?:\/\//i.test(url)){ toast('Dat lijkt geen geldige link (moet met https:// beginnen).'); return; }
    if(inhoud){
      const blok = `[video]${url}[/video]`;
      const pos = typeof inhoud.selectionStart === 'number' ? inhoud.selectionStart : inhoud.value.length;
      const voor = inhoud.value.slice(0, pos), na = inhoud.value.slice(pos);
      inhoud.value = voor + (voor && !voor.endsWith('\n') ? '\n' : '') + blok + (na && !na.startsWith('\n') ? '\n' : '') + na;
    }
    if(urlInput) urlInput.value = '';
    toast('Video ingevoegd — sla het artikel op om \'m te bewaren.');
  }));
  document.querySelectorAll('[data-kb-artikel-opslaan]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-kb-artikel-opslaan') || null;
    const titel = (document.getElementById('kbArtikelTitel')||{}).value || '';
    const categorieId = (document.getElementById('kbArtikelCategorie')||{}).value || null;
    const inhoud = (document.getElementById('kbArtikelInhoud')||{}).value || '';
    if(!titel.trim()){ toast('Vul een titel in.'); return; }
    if(id){
      const a = KENNISBANK.artikelen.find(x=>x.id===id);
      if(a){ a.titel=titel.trim(); a.categorieId=categorieId||null; a.inhoud=inhoud; a.bijgewerkt=new Date().toISOString(); a.bijgewerktDoor=huidigeGebruiker(); }
      logActiviteit(`Kennisbank: artikel "${titel.trim()}" bewerkt`);
    } else {
      const nieuw = { id:'art'+Date.now()+Math.floor(Math.random()*1000), titel:titel.trim(), categorieId:categorieId||null, inhoud, bijgewerkt:new Date().toISOString(), bijgewerktDoor:huidigeGebruiker() };
      KENNISBANK.artikelen.push(nieuw);
      logActiviteit(`Kennisbank: artikel "${titel.trim()}" toegevoegd`);
    }
    STATE.kbArtikelForm = null;
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast('Artikel opgeslagen.');
  }));
  document.querySelectorAll('[data-kb-artikel-verwijder]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.getAttribute('data-kb-artikel-verwijder');
    const a = KENNISBANK.artikelen.find(x=>x.id===id); if(!a) return;
    if(!confirm(`Artikel "${a.titel}" verwijderen?`)) return;
    KENNISBANK.artikelen = KENNISBANK.artikelen.filter(x=>x.id!==id);
    if(STATE.kbOpenArtikel===id) STATE.kbOpenArtikel = null;
    logActiviteit(`Kennisbank: artikel "${a.titel}" verwijderd`);
    persistMeta();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast('Artikel verwijderd.');
  }));
}
/* ============================= TEAMS-CHAT (Microsoft Teams koppeling) =============================
   Werkt via officiële Teams-deeplinks (https://teams.microsoft.com/l/chat/...): opent de Teams-app
   of browser met een chat naar de gekozen collega, optioneel met voorgevuld bericht. Bewust GEEN
   Graph-API voor het posten van kanaalberichten — dat zou extra Azure-permissies (ChannelMessage.Send)
   en team/kanaal-configuratie vragen. Deeplinks werken direct, zonder nieuwe rechten. */
function msteamsChatUrl(emails, bericht){
  let url = 'https://teams.microsoft.com/l/chat/0/0?users=' + encodeURIComponent(emails.join(','));
  if(bericht && bericht.trim()) url += '&message=' + encodeURIComponent(bericht.trim());
  return url;
}
/* Mini-chat: leest en verstuurt echte Teams-chatberichten via Microsoft Graph (Chat.ReadWrite).
   Polling elke 15s (Teams-embedding in een iframe blokkeert Microsoft; dit is de werkbare weg).
   Bij ontbrekende toestemming (eerste keer na deze update) toont de pagina een "Verbind met
   Teams"-knop die de interactieve Microsoft-toestemmingsvraag opent. */
const MSCHAT = { chats:null, laden:false, fout:null, actieveChat:null, berichten:{}, berichtenLaden:false, laatstVerverst:null, timerGestart:false,
  zoek:'', railTab:'chats', presence:{}, presenceStatus:null, emojiOpen:false, nieuweChatOpen:false,
  kanalen:null, kanaalStatus:null, actiefKanaal:null, kanaalBerichten:{}, meldingenGevraagd:false, vorigeOngelezen:{} };
/* Presence (aanwezigheid): kleuren zoals de echte Teams-app. Vereist de Graph-permissie
   Presence.Read.All — is die er (nog) niet, dan degraderen we stil naar grijze bolletjes. */
const TM_PRESENCE_KLEUR = { Available:'#6BB700', AvailableIdle:'#6BB700', Busy:'#C4314B', BusyIdle:'#C4314B', DoNotDisturb:'#C4314B', InACall:'#C4314B', InAMeeting:'#C4314B', Presenting:'#C4314B', Away:'#FFAA44', BeRightBack:'#FFAA44', Offline:'#8A8886', PresenceUnknown:'#8A8886' };
const TM_PRESENCE_LABEL = { Available:'Beschikbaar', Busy:'Bezet', DoNotDisturb:'Niet storen', InACall:'In gesprek', InAMeeting:'In vergadering', Presenting:'Presenteert', Away:'Afwezig', BeRightBack:'Zo terug', Offline:'Offline', PresenceUnknown:'Onbekend' };
function tmPresenceKleur(userId){
  const p = MSCHAT.presence[userId];
  return (p && TM_PRESENCE_KLEUR[p.availability]) || '#8A8886';
}
function tmPresenceLabel(userId){
  const p = MSCHAT.presence[userId];
  return (p && (TM_PRESENCE_LABEL[p.availability] || p.availability)) || '';
}
async function mschatLaadPresence(){
  if(MSCHAT.presenceStatus === 'geen-permissie' || !MSCHAT.chats) return;
  try{
    const ids = new Set();
    MSCHAT.chats.forEach(c=>(c.members||[]).forEach(m=>{ if(m.userId) ids.add(m.userId); }));
    if(!ids.size) return;
    const res = await graphFetch('https://graph.microsoft.com/v1.0/communications/getPresencesByUserId', {
      method:'POST', body: JSON.stringify({ ids: Array.from(ids).slice(0, 80) })
    }, false);
    (res.value||[]).forEach(p=>{ MSCHAT.presence[p.id] = p; });
    MSCHAT.presenceStatus = 'ok';
  }catch(e){
    // 403/consent: permissie ontbreekt in de Azure app-registratie — stil degraderen.
    MSCHAT.presenceStatus = 'geen-permissie';
  }
}
/* Berichttekst renderen met behoud van @mentions als highlight-chip. */
function tmRenderBericht(m){
  let html = String((m.body && m.body.content)||'');
  const mentions = [];
  html = html.replace(/<at[^>]*>([\s\S]*?)<\/at>/gi, (_, naam)=>{ mentions.push(naam); return `\u0001${mentions.length-1}\u0001`; });
  let tekst = mschatStripHtml(html);
  const heeftAfbeelding = /<img/i.test(String((m.body && m.body.content)||''));
  tekst = mschatEsc(tekst).replace(/\u0001(\d+)\u0001/g, (_, i)=>`<span class="tm-mention">@${mschatEsc(mschatStripHtml(mentions[Number(i)]||''))}</span>`);
  if(heeftAfbeelding) tekst += `${tekst?'<br>':''}<span style="color:var(--muted); font-size:11px;"><i class="ti ti-photo" aria-hidden="true"></i> afbeelding — open in Teams om te bekijken</span>`;
  return tekst;
}
const TM_REACTIE_EMOJI = { like:'👍', heart:'❤️', laugh:'😆', surprised:'😮', sad:'😢', angry:'😠' };
function tmReactiesHTML(m){
  const r = m.reactions || [];
  if(!r.length) return '';
  const telling = {};
  r.forEach(x=>{ const e = TM_REACTIE_EMOJI[x.reactionType] || '👍'; telling[e] = (telling[e]||0)+1; });
  return '<div>' + Object.entries(telling).map(([e,n])=>`<span class="tm-reactie">${e} ${n}</span>`).join(' ') + '</div>';
}
function tmDagLabel(iso){
  const d = new Date(iso); const nu = new Date();
  const gisteren = new Date(); gisteren.setDate(nu.getDate()-1);
  if(d.toDateString()===nu.toDateString()) return 'Vandaag';
  if(d.toDateString()===gisteren.toDateString()) return 'Gisteren';
  return d.toLocaleDateString('nl-NL',{weekday:'long', day:'numeric', month:'long'});
}
function tmOngelezenTotaal(){
  return (MSCHAT.chats||[]).filter(c=>mschatIsOngelezen(c)).length;
}
function tmMailOngelezen(){
  return (MSMAIL.mails||[]).filter(m=>!m.isRead).length;
}
/* Browsermelding bij nieuw chatbericht (alleen als de gebruiker dat heeft toegestaan). */
function tmMeldNieuweBerichten(){
  try{
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    (MSCHAT.chats||[]).forEach(c=>{
      const laatste = c.lastMessagePreview && c.lastMessagePreview.createdDateTime;
      if(!laatste || !mschatIsOngelezen(c)) return;
      const vorig = MSCHAT.vorigeOngelezen[c.id];
      if(vorig === laatste) return;
      MSCHAT.vorigeOngelezen[c.id] = laatste;
      if(vorig === undefined) return; // eerste keer: niets melden, alleen registreren
      const van = (c.lastMessagePreview.from && c.lastMessagePreview.from.user && c.lastMessagePreview.from.user.displayName) || mschatTitel(c);
      if(van && mschatEigenNaam() && van.toLowerCase()===mschatEigenNaam().toLowerCase()) return;
      new Notification(`${van} — Teams`, { body: mschatStripHtml(c.lastMessagePreview.body && c.lastMessagePreview.body.content).slice(0,120), silent:false });
    });
  }catch(e){}
}
/* Badges in sidebar + tabbladtitel, vanaf elke pagina actueel. */
function updateAppBadges(){
  try{
    const chatN = tmOngelezenTotaal();
    const mailN = tmMailOngelezen();
    const zet = (nav, n)=>{
      const el = document.querySelector(`[data-nav="${nav}"]`);
      if(!el) return;
      let b = el.querySelector('.nav-app-teller');
      if(n > 0){
        if(!b){ b = document.createElement('span'); b.className = 'nav-app-teller'; el.appendChild(b); }
        b.textContent = n > 9 ? '9+' : String(n);
      } else if(b) b.remove();
    };
    zet('msteams', chatN); zet('outlook', mailN);
    ['topTellerChat','topTellerMail'].forEach((id, i)=>{
      const el = document.getElementById(id);
      if(el){ const n = i===0?chatN:mailN; el.style.display = n>0?'':'none'; el.textContent = n>9?'9+':String(n); }
    });
    const totaal = chatN + mailN;
    const basisTitel = 'Compliance Dashboard';
    document.title = totaal > 0 ? `(${totaal}) ${basisTitel}` : basisTitel;
  }catch(e){}
}
/* Globale achtergrond-poll: chats + inbox stil verversen zodat badges overal kloppen. */
let tmGlobalePollGestart = false;
function tmStartGlobalePoll(){
  if(tmGlobalePollGestart) return;
  tmGlobalePollGestart = true;
  setInterval(async ()=>{
    if(!SYNC.account) return;
    try{
      if(MSCHAT.chats && !MSCHAT.laden && STATE.view!=='msteams'){ await mschatLaadChats(false); }
      if(MSMAIL.mails && !MSMAIL.laden && STATE.view!=='outlook'){ await msmailLaadInbox(false); }
      tmMeldNieuweBerichten();
      updateAppBadges();
    }catch(e){}
  }, 60000);
}
function mschatEigenNaam(){ return (SYNC.account && (SYNC.account.name||'')) || ''; }
function mschatStripHtml(html){
  const zonderTags = String(html||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  return zonderTags.replace(/\s+/g,' ').trim();
}
function mschatEsc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mschatTitel(chat){
  if(chat.topic) return chat.topic;
  const eigen = mschatEigenNaam().toLowerCase();
  const namen = (chat.members||[]).map(m=>m.displayName).filter(n=>n && n.toLowerCase()!==eigen);
  return namen.join(', ') || 'Chat';
}
function mschatTijd(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const nu = new Date();
  const zelfdeDag = d.toDateString() === nu.toDateString();
  return zelfdeDag ? d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
function mschatIsOngelezen(chat){
  try{
    const laatste = chat.lastMessagePreview && chat.lastMessagePreview.createdDateTime;
    const gelezen = chat.viewpoint && chat.viewpoint.lastMessageReadDateTime;
    if(!laatste) return false;
    if(!gelezen) return true;
    return new Date(laatste).getTime() > new Date(gelezen).getTime();
  }catch(e){ return false; }
}
async function mschatLaadChats(allowInteractive){
  const res = await graphFetch('https://graph.microsoft.com/v1.0/me/chats?$expand=members,lastMessagePreview&$top=50', {}, allowInteractive);
  const chats = (res.value||[]).filter(c=>c.chatType==='oneOnOne' || c.chatType==='group');
  chats.sort((a,b)=>{
    const ta = (a.lastMessagePreview && a.lastMessagePreview.createdDateTime) || a.lastUpdatedDateTime || '';
    const tb = (b.lastMessagePreview && b.lastMessagePreview.createdDateTime) || b.lastUpdatedDateTime || '';
    return tb.localeCompare(ta);
  });
  MSCHAT.chats = chats;
  MSCHAT.laatstVerverst = Date.now();
}
async function mschatLaadBerichten(chatId, allowInteractive){
  const res = await graphFetch(`https://graph.microsoft.com/v1.0/me/chats/${chatId}/messages?$top=30`, {}, allowInteractive);
  const msgs = (res.value||[]).filter(m=>m.messageType==='message' && !(m.deletedDateTime));
  msgs.reverse(); // Graph geeft nieuwste eerst; wij tonen chronologisch
  MSCHAT.berichten[chatId] = msgs;
}
async function mschatInit(allowInteractive){
  if(MSCHAT.laden || !SYNC.account) return;
  MSCHAT.laden = true; MSCHAT.fout = null;
  try{
    await mschatLaadChats(allowInteractive);
    if(MSCHAT.actieveChat) await mschatLaadBerichten(MSCHAT.actieveChat, false).catch(()=>{});
    mschatLaadPresence().catch(()=>{});
    tmMeldNieuweBerichten();
    updateAppBadges();
  }catch(e){
    MSCHAT.fout = e.message || 'Kon Teams niet bereiken.';
  }
  MSCHAT.laden = false;
  if(STATE.view==='msteams'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
function mschatStartPolling(){
  if(MSCHAT.timerGestart) return;
  MSCHAT.timerGestart = true;
  setInterval(async ()=>{
    if(STATE.view!=='msteams' || !SYNC.account || !MSCHAT.chats || MSCHAT.laden) return;
    // Stil verversen op de achtergrond; invoerveld-inhoud bewaren over de re-render heen.
    try{
      await mschatLaadChats(false);
      if(MSCHAT.actieveChat) await mschatLaadBerichten(MSCHAT.actieveChat, false);
      mschatLaadPresence().catch(()=>{});
      tmMeldNieuweBerichten();
      updateAppBadges();
      const inputEl = document.getElementById('mschatInput');
      const invoer = inputEl ? inputEl.value : '';
      const berichtEl = document.getElementById('msteamsBericht');
      const berichtInvoer = berichtEl ? berichtEl.value : '';
      if(STATE.view==='msteams'){
        document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
        const nieuwInput = document.getElementById('mschatInput');
        if(nieuwInput && invoer) nieuwInput.value = invoer;
        const nieuwBericht = document.getElementById('msteamsBericht');
        if(nieuwBericht && berichtInvoer) nieuwBericht.value = berichtInvoer;
      }
    }catch(e){}
  }, 15000);
}
function tmChatlijstHTML(){
  const eigenNaam = mschatEigenNaam();
  const zoek = (MSCHAT.zoek||'').toLowerCase();
  let chats = MSCHAT.chats || [];
  if(zoek) chats = chats.filter(c=>{
    const titel = mschatTitel(c).toLowerCase();
    const preview = c.lastMessagePreview ? mschatStripHtml(c.lastMessagePreview.body && c.lastMessagePreview.body.content).toLowerCase() : '';
    return titel.includes(zoek) || preview.includes(zoek);
  });
  return chats.slice(0, 30).map(c=>{
    const actief = MSCHAT.actieveChat === c.id;
    const titel = mschatTitel(c);
    const preview = c.lastMessagePreview ? mschatStripHtml(c.lastMessagePreview.body && c.lastMessagePreview.body.content) : '';
    const previewVan = c.lastMessagePreview && c.lastMessagePreview.from && c.lastMessagePreview.from.user && c.lastMessagePreview.from.user.displayName;
    const eigenPreview = previewVan && eigenNaam && previewVan.toLowerCase()===eigenNaam.toLowerCase();
    const ongelezen = mschatIsOngelezen(c);
    const ander = (c.members||[]).find(m=>m.displayName && m.displayName.toLowerCase()!==eigenNaam.toLowerCase());
    const presenceKleur = c.chatType==='oneOnOne' && ander && ander.userId ? tmPresenceKleur(ander.userId) : null;
    const tijd = c.lastMessagePreview ? mschatTijd(c.lastMessagePreview.createdDateTime).split(' ')[0] : '';
    return `<div class="tm-item ${actief?'is-actief':''}" data-mschat-open="${c.id}">
      <span class="tm-avatar">
        <span class="cirkel" style="background:${boekhouderKleurVoorNaam(titel)||'#5B5FC7'};">${mschatEsc(initialenVoor(titel))}</span>
        ${presenceKleur ? `<span class="tm-presence" style="background:${presenceKleur};" title="${mschatEsc(tmPresenceLabel(ander.userId))}"></span>` : ''}
      </span>
      <div style="flex:1; min-width:0;">
        <div style="display:flex; justify-content:space-between; gap:6px;">
          <span style="font-size:12.5px; font-weight:${ongelezen?'700':'500'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${mschatEsc(titel)}</span>
          <span style="font-size:10px; color:var(--muted2); flex-shrink:0;">${mschatEsc(tijd)}</span>
        </div>
        <div style="font-size:11px; color:${ongelezen?'var(--text)':'var(--muted2)'}; font-weight:${ongelezen?'600':'400'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${eigenPreview?'Jij: ':''}${mschatEsc(preview.slice(0,55))}</div>
      </div>
      ${ongelezen?'<span style="width:8px; height:8px; border-radius:50%; background:#5B5FC7; flex-shrink:0;"></span>':''}
    </div>`;
  }).join('') || '<div style="padding:16px; font-size:12px; color:var(--muted2);">Geen chats gevonden.</div>';
}
function tmGesprekHTML(){
  const eigenNaam = mschatEigenNaam();
  const actieveChat = MSCHAT.actieveChat ? (MSCHAT.chats||[]).find(c=>c.id===MSCHAT.actieveChat) : null;
  if(!actieveChat){
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted2); font-size:12.5px; background:var(--bg); gap:8px;">
      <i class="ti ti-messages" style="font-size:32px;" aria-hidden="true"></i>Kies links een chat om te lezen en te reageren.</div>`;
  }
  const titel = mschatTitel(actieveChat);
  const ander = (actieveChat.members||[]).find(m=>m.displayName && m.displayName.toLowerCase()!==eigenNaam.toLowerCase());
  const presenceKleur = actieveChat.chatType==='oneOnOne' && ander && ander.userId ? tmPresenceKleur(ander.userId) : null;
  const presenceTekst = actieveChat.chatType==='oneOnOne' && ander && ander.userId ? tmPresenceLabel(ander.userId) : `${(actieveChat.members||[]).length} leden`;
  const isAanwezigheidschat = /aanwezig/i.test(actieveChat.topic||'');
  const msgs = MSCHAT.berichten[actieveChat.id] || [];
  let vorigeDag = '';
  const bubbels = msgs.map(m=>{
    const van = (m.from && m.from.user && m.from.user.displayName) || 'Onbekend';
    const eigen = eigenNaam && van.toLowerCase() === eigenNaam.toLowerCase();
    const inhoud = tmRenderBericht(m);
    if(!inhoud) return '';
    const dag = new Date(m.createdDateTime).toDateString();
    const dagScheider = dag !== vorigeDag ? `<div class="tm-dag">${tmDagLabel(m.createdDateTime)}</div>` : '';
    vorigeDag = dag;
    const tijd = new Date(m.createdDateTime).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const naamRegel = eigen ? '' : `<div style="font-size:10.5px; color:var(--muted2); margin-bottom:2px;">${mschatEsc(van.split(' ')[0])} · ${tijd}</div>`;
    const eigenTijd = eigen ? `<div style="font-size:10px; color:var(--muted2); text-align:right; margin-top:2px;">${tijd}</div>` : '';
    const avatar = eigen ? '' : `<span class="tm-avatar" style="align-self:flex-end;"><span class="cirkel" style="width:24px; height:24px; font-size:9.5px; background:${boekhouderKleurVoorNaam(van)||'#5B5FC7'};">${mschatEsc(initialenVoor(van))}</span></span>`;
    return `${dagScheider}<div style="display:flex; gap:8px; ${eigen?'flex-direction:row-reverse;':''} align-items:flex-end;">
      ${avatar}
      <div style="max-width:70%; display:flex; flex-direction:column; ${eigen?'align-items:flex-end;':''}">
        ${naamRegel}
        <div class="tm-bubbel ${eigen?'is-eigen':''}" style="max-width:100%;">${inhoud}</div>
        ${tmReactiesHTML(m)}${eigenTijd}
      </div>
    </div>`;
  }).join('');
  const emojiGrid = MSCHAT.emojiOpen ? `<div class="tm-emoji-grid">${['👍','❤️','😂','🎉','👌','🙏','😉','😢','🔥','💪','☕','👋'].map(e=>`<button data-tm-emoji="${e}">${e}</button>`).join('')}</div>` : '';
  return `
    <div style="padding:11px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;">
      <span class="tm-avatar">
        <span class="cirkel" style="background:${boekhouderKleurVoorNaam(titel)||'#5B5FC7'};">${mschatEsc(initialenVoor(titel))}</span>
        ${presenceKleur?`<span class="tm-presence" style="background:${presenceKleur}; border-color:var(--card);"></span>`:''}
      </span>
      <div style="min-width:0;">
        <div style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${mschatEsc(titel)}</div>
        <div style="font-size:10.5px; color:var(--muted2);">${mschatEsc(presenceTekst||'')}</div>
      </div>
      ${isAanwezigheidschat ? `<button class="btn sm" data-tm-goedemorgen style="margin-left:auto; background:#E8EBFA; color:#4F52B2; border:none;"><i class="ti ti-hand-stop" aria-hidden="true"></i> Zeg goedemorgen</button>` : ''}
      <a class="btn sm ghost" style="${isAanwezigheidschat?'':'margin-left:auto;'} font-size:11px; flex-shrink:0;" href="https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent((actieveChat.members||[]).map(m=>m.email||'').filter(Boolean).join(','))}" target="_blank" rel="noopener">Open in Teams ↗</a>
    </div>
    <div id="mschatBerichten" style="flex:1; padding:14px 16px; display:flex; flex-direction:column; gap:9px; background:var(--bg); overflow-y:auto;">
      ${MSCHAT.berichtenLaden && !msgs.length ? '<div style="color:var(--muted2); font-size:12px;">Berichten laden…</div>' : (bubbels || '<div style="color:var(--muted2); font-size:12px;">Nog geen berichten in deze chat.</div>')}
    </div>
    <div class="tm-compose">
      ${emojiGrid}
      <input id="mschatInput" placeholder="Typ een bericht…">
      <button class="btn sm ghost" data-tm-emoji-toggle title="Emoji" style="font-size:16px; padding:8px 10px;"><i class="ti ti-mood-smile" aria-hidden="true"></i></button>
      <button data-mschat-verstuur title="Versturen" style="background:#5B5FC7; color:#fff; border:none; border-radius:6px; padding:9px 13px; cursor:pointer;"><i class="ti ti-send" aria-hidden="true"></i></button>
    </div>`;
}

async function mschatVerstuur(){
  const input = document.getElementById('mschatInput');
  const tekst = input ? input.value.trim() : '';
  if(!tekst || !MSCHAT.actieveChat) return;
  const chatId = MSCHAT.actieveChat;
  if(input) input.value = '';
  try{
    await graphFetch(`https://graph.microsoft.com/v1.0/chats/${chatId}/messages`, {
      method:'POST', body: JSON.stringify({ body: { content: tekst } })
    }, true);
    await mschatLaadBerichten(chatId, false).catch(()=>{});
    if(STATE.view==='msteams'){
      document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
      const el = document.getElementById('mschatBerichten'); if(el) el.scrollTop = el.scrollHeight;
    }
  }catch(e){
    toast('Versturen mislukt: ' + (e.message||'onbekende fout'));
    if(input) input.value = tekst;
  }
}
async function tmLaadKanalen(){
  MSCHAT.kanaalStatus = 'laden';
  if(STATE.view==='msteams'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
  try{
    const teamsRes = await graphFetch('https://graph.microsoft.com/v1.0/me/joinedTeams', {}, false);
    const kanalen = [];
    for(const team of (teamsRes.value||[]).slice(0, 8)){
      try{
        const kRes = await graphFetch(`https://graph.microsoft.com/v1.0/teams/${team.id}/channels`, {}, false);
        (kRes.value||[]).forEach(kn=>kanalen.push({ sleutel:`${team.id}|${kn.id}`, teamId:team.id, kanaalId:kn.id, teamNaam:team.displayName||'', kanaalNaam:kn.displayName||'' }));
      }catch(e){}
    }
    MSCHAT.kanalen = kanalen;
    MSCHAT.kanaalStatus = 'ok';
  }catch(e){
    MSCHAT.kanaalStatus = 'geen-permissie';
  }
  if(STATE.view==='msteams'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
async function tmLaadKanaalBerichten(sleutel){
  const kn = (MSCHAT.kanalen||[]).find(x=>x.sleutel===sleutel);
  if(!kn) return;
  try{
    const res = await graphFetch(`https://graph.microsoft.com/v1.0/teams/${kn.teamId}/channels/${kn.kanaalId}/messages?$top=25`, {}, false);
    const msgs = (res.value||[]).filter(m=>m.messageType==='message' && !m.deletedDateTime);
    msgs.reverse();
    MSCHAT.kanaalBerichten[sleutel] = msgs;
  }catch(e){
    MSCHAT.kanaalBerichten[sleutel] = [];
  }
  if(STATE.view==='msteams'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}

/* ============================= OUTLOOK MINI-INBOX =============================
   Outlook zelf insluiten (iframe) blokkeert Microsoft; dit is een eigen mini-inbox via Graph:
   inbox lezen (Mail.ReadWrite), beantwoorden/doorsturen/nieuwe mail (Mail.Send, al aanwezig).
   Berichten worden als platte tekst getoond (HTML gestript) — veilig tegen scripts in mails.
   Bij openen wordt de mail als gelezen gemarkeerd; "Open in Outlook" gebruikt de webLink. */
const MSMAIL = { mails:null, laden:false, fout:null, actieveMail:null, detail:{}, compose:null, laatstVerverst:null, timerGestart:false, bezig:false };
function msmailTekst(html){
  return String(html||'')
    .replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<script[\s\S]*?<\/script>/gi,' ')
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n\n').replace(/<\/div>/gi,'\n')
    .replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\n{3,}/g,'\n\n').trim();
}
async function msmailLaadInbox(allowInteractive){
  const res = await graphFetch('https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=25&$select=id,subject,from,receivedDateTime,bodyPreview,isRead,hasAttachments,webLink&$orderby=receivedDateTime desc', {}, allowInteractive);
  MSMAIL.mails = res.value || [];
  MSMAIL.laatstVerverst = Date.now();
}
async function msmailLaadDetail(id){
  if(MSMAIL.detail[id]) return;
  const res = await graphFetch(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(id)}?$select=id,subject,from,toRecipients,receivedDateTime,body,webLink`, {}, false);
  MSMAIL.detail[id] = res;
  // Als gelezen markeren (best effort — mislukt stilletjes als het niet kan)
  graphFetch(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(id)}`, { method:'PATCH', body: JSON.stringify({isRead:true}) }, false)
    .then(()=>{ const m = (MSMAIL.mails||[]).find(x=>x.id===id); if(m) m.isRead = true; })
    .catch(()=>{});
}
async function msmailInit(allowInteractive){
  if(MSMAIL.laden || !SYNC.account) return;
  MSMAIL.laden = true; MSMAIL.fout = null;
  try{ await msmailLaadInbox(allowInteractive); }

async function msmailVerstuur(){
  if(MSMAIL.bezig || !MSMAIL.compose) return;
  const c = MSMAIL.compose;
  const aanEl = document.getElementById('msmailAan');
  const ondEl = document.getElementById('msmailOnderwerp');
  const tekstEl = document.getElementById('msmailTekst');
  const aan = aanEl ? aanEl.value.trim() : '';
  const onderwerp = ondEl ? ondEl.value.trim() : '';
  const tekst = tekstEl ? tekstEl.value.trim() : '';
  if(c.type!=='reply' && !aan){ toast('Vul een ontvanger in.'); return; }
  if(!tekst){ toast('Typ eerst een bericht.'); return; }
  MSMAIL.bezig = true;
  try{
    if(c.type==='nieuw'){
      await sendGraphMail(aan, onderwerp || '(geen onderwerp)', mschatEsc(tekst).replace(/\n/g,'<br>'));
    } else if(c.type==='reply'){
      await graphFetch(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(c.mailId)}/reply`, { method:'POST', body: JSON.stringify({ comment: tekst }) }, true);
    } else if(c.type==='forward'){
      await graphFetch(`https://graph.microsoft.com/v1.0/me/messages/${encodeURIComponent(c.mailId)}/forward`, { method:'POST', body: JSON.stringify({ comment: tekst, toRecipients: [{ emailAddress: { address: aan } }] }) }, true);
    }
    toast('Verstuurd.');
    MSMAIL.compose = null;
  }catch(e){
    toast('Versturen mislukt: ' + (e.message||'onbekende fout'));
  }
  MSMAIL.bezig = false;
  if(STATE.view==='outlook'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
function msmailBindHandlers(){
  if(STATE.view!=='outlook') return;
  msmailStartPolling();
  if(SYNC.account && !MSMAIL.mails && !MSMAIL.laden && !MSMAIL.fout){ msmailInit(false); }
  document.querySelectorAll('[data-msmail-verbind]').forEach(el=>el.addEventListener('click', ()=>{
    MSMAIL.fout = null; MSMAIL.mails = null;
    msmailInit(true);
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  document.querySelectorAll('[data-msmail-open]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.getAttribute('data-msmail-open');
    MSMAIL.actieveMail = id; MSMAIL.compose = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    try{ await msmailLaadDetail(id); }catch(e){ toast('Mail laden mislukt.'); }
    if(STATE.view==='outlook' && MSMAIL.actieveMail===id){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
  }));
  document.querySelectorAll('[data-msmail-nieuw]').forEach(el=>el.addEventListener('click', ()=>{
    MSMAIL.compose = { type:'nieuw', aan:'' };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    const aan = document.getElementById('msmailAan'); if(aan) aan.focus();
  }));
  document.querySelectorAll('[data-msmail-reply]').forEach(el=>el.addEventListener('click', ()=>{
    const det = MSMAIL.detail[MSMAIL.actieveMail];
    MSMAIL.compose = { type:'reply', mailId: MSMAIL.actieveMail, onderwerpVast: det ? ('Re: '+(det.subject||'')) : '' };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    const t = document.getElementById('msmailTekst'); if(t) t.focus();
  }));
  document.querySelectorAll('[data-msmail-forward]').forEach(el=>el.addEventListener('click', ()=>{
    const det = MSMAIL.detail[MSMAIL.actieveMail];
    MSMAIL.compose = { type:'forward', mailId: MSMAIL.actieveMail, aan:'', onderwerpVast: det ? ('Fw: '+(det.subject||'')) : '' };
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    const aan = document.getElementById('msmailAan'); if(aan) aan.focus();
  }));
  document.querySelectorAll('[data-msmail-compose-sluit]').forEach(el=>el.addEventListener('click', ()=>{
    MSMAIL.compose = null;
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
  }));
  const verstuur = document.querySelector('[data-msmail-verstuur]');
  if(verstuur) verstuur.addEventListener('click', ()=>msmailVerstuur());
}
/* ---- Notion via de eigen worker (Notion-API, alleen-lezen) ---- */
async function notionWorkerFetch(pad, allowInteractive){
  const basis = String(NOTION_CFG.workerUrl||'').replace(/\/+$/,'');
  if(!basis) throw new Error('Geen worker-URL ingesteld.');
  const token = await getGraphToken(!!allowInteractive);
  const res = await fetch(basis + pad, { headers: { 'Authorization': 'Bearer ' + token } });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.fout || ('Worker gaf status ' + res.status));
  return data;
}
async function notionAppLaden(allowInteractive){
  if(NOTION_APP.laden || !NOTION_CFG.workerUrl || !SYNC.account) return;
  NOTION_APP.laden = true; NOTION_APP.fout = null;
  try{
    const data = await notionWorkerFetch('/paginas', allowInteractive);
    NOTION_APP.paginas = data.paginas || [];
    if(!NOTION_APP.actief && NOTION_APP.paginas.length) NOTION_APP.actief = NOTION_APP.paginas[0].id;
    if(NOTION_APP.actief) await notionBlokkenLaden(NOTION_APP.actief);
  }catch(e){
    NOTION_APP.fout = e.message || 'Kon de Notion-worker niet bereiken.';
  }
  NOTION_APP.laden = false;
  if(STATE.view==='notion'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
async function notionBlokkenLaden(paginaId){
  try{
    const data = await notionWorkerFetch('/blokken/' + paginaId);
    const blokken = data.blokken || [];
    // Kinderen van toggles/lijsten één niveau diep meeladen (max 12 om het snel te houden)
    const metKinderen = blokken.filter(b=>b.has_children && ['toggle','bulleted_list_item','numbered_list_item','to_do','callout','quote'].includes(b.type)).slice(0,12);
    for(const b of metKinderen){
      try{ const kind = await notionWorkerFetch('/blokken/' + b.id); b._kinderen = kind.blokken || []; }catch(e){}
    }
    NOTION_APP.blokken[paginaId] = blokken;
  }catch(e){
    NOTION_APP.blokken[paginaId] = [{ type:'_fout', melding: e.message }];
  }
  if(STATE.view==='notion'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers(); }
}
function notionRichText(rt){
  return (rt||[]).map(t=>{
    let s = escHtml(t.plain_text||'');
    const a = t.annotations || {};
    if(a.code) s = `<code style="background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px;">${s}</code>`;
    if(a.bold) s = `<b>${s}</b>`;
    if(a.italic) s = `<i>${s}</i>`;
    if(a.strikethrough) s = `<s>${s}</s>`;
    if(a.underline) s = `<u>${s}</u>`;
    if(t.href) s = `<a href="${escHtml(t.href)}" target="_blank" rel="noopener" style="color:var(--primary-dark);">${s}</a>`;
    return s;
  }).join('');
}
function notionBlokHTML(b){
  const d = b[b.type] || {};
  const rt = ()=>notionRichText(d.rich_text);
  const kinderen = b._kinderen ? `<div style="margin-left:20px;">${b._kinderen.map(notionBlokHTML).join('')}</div>` : '';
  switch(b.type){
    case '_fout': return `<div class="banner" style="background:var(--amber-bg); border-color:var(--amber-brd); color:#8a4b06;">${escHtml(b.melding||'Fout bij laden')}</div>`;
    case 'heading_1': return `<h2 style="font-size:19px; margin:20px 0 8px;">${rt()}</h2>`;
    case 'heading_2': return `<h3 style="font-size:16px; margin:16px 0 6px;">${rt()}</h3>`;
    case 'heading_3': return `<h4 style="font-size:14px; margin:14px 0 5px;">${rt()}</h4>`;
    case 'paragraph': return `<p style="margin:6px 0; line-height:1.7;">${rt()||'&nbsp;'}</p>${kinderen}`;
    case 'bulleted_list_item': return `<div style="display:flex; gap:8px; margin:3px 0;"><span style="flex-shrink:0;">•</span><div style="flex:1;">${rt()}${kinderen}</div></div>`;
    case 'numbered_list_item': return `<div style="display:flex; gap:8px; margin:3px 0;"><span style="flex-shrink:0; color:var(--muted);">·</span><div style="flex:1;">${rt()}${kinderen}</div></div>`;
    case 'to_do': return `<div style="display:flex; gap:8px; margin:3px 0; align-items:flex-start;"><input type="checkbox" ${d.checked?'checked':''} disabled style="margin-top:3px;"><div style="${d.checked?'color:var(--muted); text-decoration:line-through;':''}">${rt()}</div></div>${kinderen}`;
    case 'toggle': return `<details style="margin:6px 0;"><summary style="cursor:pointer; font-weight:600;">${rt()}</summary>${kinderen||'<div style="color:var(--muted2); font-size:12px; margin-left:20px;">(inhoud niet geladen)</div>'}</details>`;
    case 'quote': return `<blockquote style="border-left:3px solid var(--border); margin:8px 0; padding:4px 14px; color:var(--muted);">${rt()}${kinderen}</blockquote>`;
    case 'callout': return `<div style="display:flex; gap:10px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin:8px 0;"><span>${escHtml((d.icon&&d.icon.emoji)||'💡')}</span><div>${rt()}${kinderen}</div></div>`;
    case 'divider': return `<hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">`;
    case 'code': return `<pre style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12px; overflow-x:auto; margin:8px 0;">${notionRichText(d.rich_text)}</pre>`;
    case 'image': {
      const src = (d.file&&d.file.url) || (d.external&&d.external.url) || '';
      return src ? `<img src="${escHtml(src)}" style="max-width:100%; border-radius:10px; margin:8px 0;" loading="lazy">` : '';
    }
    case 'child_page': return `<div style="margin:4px 0;"><i class="ti ti-file" aria-hidden="true"></i> ${escHtml(d.title||'Subpagina')} <span style="font-size:11px; color:var(--muted2);">(open in Notion)</span></div>`;
    case 'bookmark': case 'link_preview': {
      const u = d.url || '';
      return u ? `<div style="margin:6px 0;"><a href="${escHtml(u)}" target="_blank" rel="noopener" style="color:var(--primary-dark); font-size:12.5px;"><i class="ti ti-link" aria-hidden="true"></i> ${escHtml(u)}</a></div>` : '';
    }
    case 'table': return b._kinderen ? `<table style="margin:8px 0;"><tbody>${b._kinderen.map(r=>{
      const cellen = (r.table_row && r.table_row.cells) || [];
      return `<tr>${cellen.map(c=>`<td style="border:1px solid var(--border); padding:6px 10px; font-size:12.5px;">${notionRichText(c)}</td>`).join('')}</tr>`;
    }).join('')}</tbody></table>` : '<div style="color:var(--muted2); font-size:12px;">(tabel — open in Notion)</div>';
    default: return '';
  }
}

function advanceDate(datum, herhaling){
  const dt = new Date(datum+'T00:00:00');

  else if(herhaling==='kwartaal') dt.setMonth(dt.getMonth()+3);
  else if(herhaling==='jaarlijks') dt.setFullYear(dt.getFullYear()+1);
  else return datum;
  // Let op: bewust geen toISOString() — dat rekent om naar UTC en zou de datum een dag
  // kunnen laten verschuiven in de Nederlandse tijdzone. We bouwen de datumstring op uit
  // de lokale jaar/maand/dag-onderdelen, zodat "15 januari" ook echt "15 januari" blijft.
  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

  if(entry && !entry.na){

  if(!Array.isArray(f.lh.periodes)) f.lh.periodes = [];

  if(idx===-1) return false;
  const snap = f.lh.periodes[idx];

  (snap.taken||[]).forEach(st=>{
