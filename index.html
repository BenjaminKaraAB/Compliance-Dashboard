   "Gevestigd te" van beide vennootschappen wordt hergebruikt uit hun eigen VPB-vestigingsplaats
   (klant.vpb.plaats) i.p.v. nog een keer apart ingevoerd te worden. */
function managementovereenkomstDgaValidatie(klant){
  const mo = klant.managementovereenkomstDga;
  if(!mo) return 'Geen gegevens ingevuld voor deze klant. Vul deze eerst in bij "Bewerken".';
  const holding = RAW_KLANTEN.find(k=>k.id===mo.holdingKlantId);
  const ontbreekt = [];
  if(!holding) ontbreekt.push('gekoppelde Holding B.V. (koppel een bestaande klant)');
  if(!mo.bestuurderNaam) ontbreekt.push('naam bestuurder/manager');
  if(!mo.datumBenoemingBestuurder) ontbreekt.push('datum benoeming bestuurder');
  if(!mo.ingangsdatum) ontbreekt.push('ingangsdatum');
  if(!mo.managementfeeBedrag) ontbreekt.push('managementfee');
  if(!mo.managementfeeBedragInWoorden) ontbreekt.push('managementfee in woorden');
  if(!mo.eersteJaarAanpassing) ontbreekt.push('eerste jaar tariefaanpassing');
  if(!mo.ondertekeningsplaats) ontbreekt.push('ondertekeningsplaats');
  if(!klant.vpb || !klant.vpb.plaats) ontbreekt.push('vestigingsplaats van deze vennootschap (zie VPB-gegevens bij "Bewerken")');
  if(holding && (!holding.vpb || !holding.vpb.plaats)) ontbreekt.push('vestigingsplaats van de Holding (zie VPB-gegevens van die klant)');
  if(!klant.email) ontbreekt.push('e-mailadres van de klant');
  if(ontbreekt.length) return `Vul eerst het volgende in bij "Bewerken" vóór je dit document verstuurt: ${ontbreekt.join(', ')}.`;
  return null;
}
function managementovereenkomstDgaHTML(klant){
  const mo = klant.managementovereenkomstDga;
  const holding = RAW_KLANTEN.find(k=>k.id===mo.holdingKlantId) || {naam:'(Holding niet gekoppeld)', vpb:{plaats:'...'}};
  const holdingPlaats = (holding.vpb && holding.vpb.plaats) || '...';
  const klantPlaats = (klant.vpb && klant.vpb.plaats) || '...';
  const aanhefLang = aanhefLangDga(mo.bestuurderAanhef);
  const vandaag = fmtDatumLang(new Date());
  const stip = (n)=> '.'.repeat(n);
  return `
  <div style="font-family: Arial, Helvetica, sans-serif; font-size:10.5pt; color:#1a1a1a; line-height:1.5; padding:40px 48px; width:718px; box-sizing:border-box; background:#fff;">
    <div style="text-align:center; font-weight:700; text-decoration:underline; font-size:12.5pt; margin-bottom:22px;">MANAGEMENTOVEREENKOMST</div>

    <p style="margin:0 0 10px;"><b>De ondergetekenden</b>:</p>

    <p style="margin:0 0 10px;">1. De besloten vennootschap met beperkte aansprakelijkheid <b>${holding.naam}</b>, gevestigd te ${holdingPlaats}, rechtsgeldig vertegenwoordigd door haar directeur ${aanhefLang} ${mo.bestuurderNaam}, hierna genoemd: "Management B.V."</p>

    <p style="margin:0 0 10px;">en</p>

    <p style="margin:0 0 16px;">2. De besloten vennootschap met beperkte aansprakelijkheid <b>${klant.naam}</b>, gevestigd te ${klantPlaats}, rechtsgeldig vertegenwoordigd door ${holding.naam}, de besloten vennootschap met beperkte aansprakelijkheid rechtsgeldig vertegenwoordigd door haar directeur ${aanhefLang} ${mo.bestuurderNaam}, hierna genoemd: "de vennootschap"</p>

    <p style="margin:0 0 8px;"><b>In aanmerking nemende dat:</b></p>
    <p style="margin:0 0 6px;">- ${aanhefLang} ${mo.bestuurderNaam}, voormeld (hierna tevens genoemd: "Manager"), enige aandeelhouder en tevens enige statutair directeur is van Management B.V.;</p>
    <p style="margin:0 0 6px;">- Management B.V. d.d. ${mo.datumBenoemingBestuurder} is benoemd tot bestuurder van de vennootschap met de titel directeur;</p>
    <p style="margin:0 0 6px;">- de vennootschap het management van haar onderneming (mede) aan Management B.V. wenst op te dragen, met ingang van ${mo.ingangsdatum};</p>
    <p style="margin:0 0 6px;">- Management B.V. bereid is het gewenste management op zich te nemen per voormelde datum, één en ander onder de voorwaarden als hierna omschreven;</p>
    <p style="margin:0 0 18px;">- dat partijen in deze overeenkomst de afspraken omtrent het management en de directievoering van de vennootschap nader wensen vast te leggen.</p>

    <p style="margin:0 0 18px;"><b>Verklaren te zijn overeengekomen als volgt:</b></p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 1. Opdracht</div>
    <p style="margin:0 0 6px;">1.1 Management B.V. is met ingang van ${mo.ingangsdatum} benoemd tot directeur van de vennootschap; als zodanig heeft zij alle rechten en verplichtingen, taken en bevoegdheden, die in de statuten van de vennootschap aan de directeur zijn toegekend, respectievelijk opgelegd.</p>
    <p style="margin:0 0 6px;">1.2 Management B.V. zal met ingang van ${mo.ingangsdatum} en voor de duur van deze overeenkomst als bepaald in artikel 4, haar opdracht vervullen met inachtneming van de wettelijke voorschriften geldend voor het bestuur van vennootschappen, de statutaire bepalingen, besluiten en richtlijnen van de bevoegde organen van de vennootschap en voorts met inachtneming van de bepalingen van deze overeenkomst. Management B.V. is voorts verplicht alles te doen en na te laten wat een goed directeur behoort te doen en na te laten en zal zich naar beste vermogen inzetten om de belangen van de vennootschap -en de daaraan verbonden ondernemingen- zoveel mogelijk te bevorderen.</p>
    <p style="margin:0 0 6px;">1.3 Voor de feitelijke uitvoering van voormelde opdracht wordt Manager door Management B.V. ingezet. Management B.V. is niet bevoegd naast of in plaats van Manager ook andere personen in te zetten voor de feitelijke uitvoering van de hiervoor vermelde opdracht, tenzij met voorafgaande schriftelijke toestemming door de vennootschap, aan welke toestemming door de vennootschap voorwaarden kunnen worden verboden.</p>
    <p style="margin:0 0 6px;">1.4 Management B.V. staat ervoor in dat Manager en de andere door Management B.V. ingezette personen als omschreven in artikel 1.3 voor de uitvoering van de opdracht voldoende arbeid, vlijt en kennis ten dienste van de vennootschap zullen stellen en dat de hiervoor bedoelde personen de statuten, besluiten en richtlijnen van de bevoegde organen van de vennootschap zullen naleven.</p>
    <p style="margin:0 0 6px;">1.5 Management B.V. verplicht zich tevens de vennootschappen waarin de vennootschap direct of indirect aandeelhouder zal zijn (hierna te noemen de "Groepsmaatschappijen") te zullen besturen.</p>
    <p style="margin:0 0 18px;">1.6 Management B.V. en Manager (laatstgenoemde in zijn hoedanigheid van enig aandeelhouder en statutair bestuurder van Management B.V.) verplichten zich om al hun arbeidstijd en -kracht ter beschikking te stellen voor de uitoefening van de op elk van hen rustende taken en verantwoordelijkheden en zich te onthouden van directe of indirecte betrokkenheid bij nevenactiviteiten welke substantiële inspanningen vergen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 2. Managementfee</div>
    <p style="margin:0 0 6px;">2.1 Ter vergoeding van de door Management B.V. in het kader van deze overeenkomst te verrichten diensten is de vennootschap aan Management B.V. een managementfee verschuldigd ten belope van ${fmtEUR(mo.managementfeeBedrag)} (zegge ${mo.managementfeeBedragInWoorden}) exclusief btw per maand, welke maandelijks wordt voldaan. Daarnaast vergoedt de vennootschap aan Management B.V. in het belang van de uitvoering van deze overeenkomst gemaakte kosten. Deze kosten zullen door Management B.V. worden gemotiveerd en gespecificeerd. Over de vergoedingen zal btw worden berekend, tenzij dit als gevolg van het bestaan van een fiscale eenheid voor de omzetbelasting achterwege gelaten kan worden.</p>
    <p style="margin:0 0 6px;">2.2 De volgende kosten zullen door Management B.V. zelf worden gedragen: eigen beheerskosten.</p>
    <p style="margin:0 0 6px;">2.3 Met ingang van 1 januari van ieder jaar -voor het eerst in ${mo.eersteJaarAanpassing}- zal de managementfee in onderling overleg kunnen worden aangepast (o.a. in verband met prijscompensatie/inflatiecorrectie). Instemming van de vennootschap is vereist.</p>
    <p style="margin:0 0 6px; font-style:italic;">2.4 De vennootschap zal aan Management B.V. een bedrijfswagen ter beschikking (doen) stellen, dan wel een nader overeen te komen vergoeding aan Management B.V. verstrekken ten behoeve van een auto voor Manager.</p>
    <p style="margin:0 0 6px;">2.5 Indien Management B.V. door ziekte van Manager in enig kalenderjaar niet in staat is op alle overeengekomen werkdagen ten behoeve van de vennootschap werkzaam te zijn, wordt de managementfee na zes maanden aaneengesloten ziekte verminderd met 50% (vijftig procent), totdat Manager hersteld is dan wel deze overeenkomst beëindigd is. Onder aaneengesloten ziekte wordt mede verstaan dat Manager tussen twee of meer periodes van ziekte minder dan 2 weken achter elkaar hersteld is.</p>
    <p style="margin:0 0 18px;">2.6 Partijen hebben zich ervan vergewist dat heffing van loonbelasting en werknemersverzekeringspremies ter zake van de uit te betalen managementvergoedingen sub 2 achterwege kan blijven.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 3. Externe werkzaamheden, geheimhouding, bescheiden</div>
    <p style="margin:0 0 6px;">1. Management B.V. is verplicht, zowel gedurende de looptijd van deze overeenkomst als na beëindiging daarvan, strikte geheimhouding te betrachten omtrent alle aangelegenheden van de vennootschap en de daaraan verbonden ondernemingen, waarvan het vertrouwelijke karakter geacht kan worden haar bekend te zijn. Het voorgaande lijdt uitzondering voor zover nodig in het kader van de nominale uitvoering door Management B.V. van haar opdracht.</p>
    <p style="margin:0 0 6px;">2. Alle correspondentie, documenten en andere zaken met inbegrip van kopieën ter zake van de vennootschap en de daaraan verbonden ondernemingen, welke Management B.V. onder zich heeft of krijgt, zijn en blijven eigendom van de vennootschap en zullen bij beëindiging van deze overeenkomst terstond aan de vennootschap ter beschikking worden gesteld.</p>
    <p style="margin:0 0 18px;">3. Bij overtreding van artikel 3 lid 1 en lid 2 door Management B.V. en/of bij Management B.V. in dienst zijnde personeelsleden zal Management B.V. jegens de vennootschap een direct opeisbare en niet voor rechterlijke matiging vatbare boete verbeuren van € 5.000 voor iedere overtreding en € 500 voor iedere dag dat zodanige overtreding voortduurt, onverminderd het recht van de vennootschap volledige vergoeding van haar schade te vorderen, alsmede in rechte een verbod tot stopzetting daarvan te vorderen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 4. Looptijd en beëindiging</div>
    <p style="margin:0 0 6px;">4.1 Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door ieder der partijen te allen tijde worden beëindigd door opzegging aan de wederpartij met inachtneming, van een opzegtermijn van drie maanden.</p>
    <p style="margin:0 0 6px;">4.2 Indien een der partijen een of meer van haar uit deze overeenkomst voortvloeiende verplichtingen niet, niet tijdig of niet behoorlijk nakomt, en niet binnen dertig dagen nadat de andere partij haar schriftelijk in gebreke heeft gesteld, alsnog voor een juiste nakoming van deze overeenkomst zorgdraagt, zal de andere partij deze overeenkomst kunnen opzeggen zonder tot inachtneming van enige opzegtermijn gehouden te zijn.</p>
    <p style="margin:0 0 6px;">4.3 Ieder der partijen is gerechtigd deze overeenkomst met onmiddellijke ingang zonder dat rechterlijke tussenkomst vereist is, te beëindigen indien de andere partij in staat van faillissement wordt verklaard dan wel een aanvraag daartoe is ingediend, indien aan haar surséance van betaling wordt verleend, een regeling met al haar crediteuren treft of wordt ontbonden of in liquidatie treedt;</p>
    <p style="margin:0 0 6px;">4.4 De vennootschap is bovendien gerechtigd deze overeenkomst met onmiddellijke ingang, zonder dat rechterlijke tussenkomst vereist is, te beëindigen indien:</p>
    <p style="margin:0 0 4px; padding-left:16px;">a) Management B.V. niet langer aandeelhoudster is van ten minste 25% van het geplaatste aandelenkapitaal van de vennootschap.</p>
    <p style="margin:0 0 4px; padding-left:16px;">b) Management B.V. Manager als statutair bestuurder van Management B.V. ontslaat en/of indien aan het dienstverband van Manager met Management B.V. om welke reden dan ook een einde komt casu quo indien Manager om welke reden dan ook niet langer statutair directeur van Management B.V. is.</p>
    <p style="margin:0 0 4px; padding-left:16px;">c) Manager is overleden of ten gevolge van langdurige arbeidsongeschiktheid niet meer in staat is zijn arbeidskracht ter beschikking van Management B.V. en/of de vennootschap te stellen. Als langdurige arbeidsongeschiktheid zal gelden een aaneengesloten periode van 12 maanden of langer, waarbij een tussentijdse hervatting, van de werkzaamheden gedurende twee weken of minder niet geacht wordt de aaneengesloten periode te doorbreken.</p>
    <p style="margin:0 0 10px; padding-left:16px;">d) in strijd wordt gehandeld met een der bepalingen van artikel 3 van deze overeenkomst.</p>
    <p style="margin:0 0 6px;">4.5 Iedere opzegging dient te geschieden bij een aan de wederpartij gericht aangetekend schrijven, dan wel deurwaardersexploot.</p>
    <p style="margin:0 0 6px;">4.6 Management B.V. zal in geval van beëindiging van deze overeenkomst op eerste verzoek van de vennootschap alle functies neerleggen welke zij ter uitvoering van deze overeenkomst vervult bij de vennootschap of bij de met de vennootschap gelieerde ondernemingen. Management B.V. zal tevens volledige medewerking verlenen aan de overdracht van haar taken aan haar opvolger, en alle documentatie en informatie met betrekking tot de zaken van de vennootschap waarover zij beschikt aan de vennootschap ter beschikking stellen. Management B.V. zal bewerkstelligen dat Manager het in dit artikellid bepaalde eveneens zal doen. Management B.V. en/of Manager kunnen jegens de vennootschap geen aanspraak maken op enigerlei vergoeding voor de verplichtingen uit hoofde van dit artikellid.</p>
    <p style="margin:0 0 18px;">4.7 Het bepaalde in dit artikel laat onverlet de mogelijkheid van ieder der partijen tot het instellen van andere rechtsmiddelen.</p>

    <div style="font-weight:700; margin:16px 0 6px;">Artikel 5. Slotbepalingen</div>
    <p style="margin:0 0 6px;">5.1 Partijen verklaren over en weer de verbintenissen uit deze overeenkomst bij deze te aanvaarden en alle medewerking te verlenen aan de uitvoering of toepassing van deze overeenkomst en alle handelingen te verrichten welke in de ruimste zin daarmede verband houden.</p>
    <p style="margin:0 0 6px;">5.2 Partijen stellen vast dat buiten deze overeenkomst geen mondelinge overeenkomsten tussen hen tot stand gekomen zijn in strijd hiermee, in afwijking hiervan of in aanvulling hierop. Na de totstandkoming van deze overeenkomst zullen afwijkingen hiervan of aanvullingen hierop alleen in schriftelijke vorm overeengekomen worden en alleen in deze vorm bindend zijn.</p>
    <p style="margin:0 0 6px;">5.3 Partijen zien af van het recht om jegens elkaar ontbinding van deze overeenkomst te vorderen op grond van het bepaalde in de artikelen 6:265 en 6:266 van het Burgerlijk Wetboek.</p>
    <p style="margin:0 0 6px;">5.4 Op deze overeenkomst is uitsluitend het Nederlandse recht van toepassing.</p>
    <p style="margin:0 0 26px;">5.5 Geschillen met betrekking tot deze overeenkomst zullen worden voorgelegd aan de bevoegde Nederlandse rechter.</p>

    <p style="margin:0 0 30px;">Aldus overeengekomen en in tweevoud opgemaakt en ondertekend te ${mo.ondertekeningsplaats} op ${vandaag}.</p>

    <div style="display:flex; gap:70px; margin-bottom:8px;">
      <div>${stip(34)}</div>
      <div>${stip(34)}</div>
    </div>
    <div style="display:flex; gap:70px; font-size:10pt;">
      <div><b>1. ${holding.naam}</b>,<br>namens deze: ${mo.bestuurderNaam}</div>
      <div><b>2. ${klant.naam}</b>,<br>namens deze: ${holding.naam}, namens deze: ${mo.bestuurderNaam}</div>
    </div>
  </div>`;
}

/* "Documenten"-sectie op de klantkaart: het eerste van (naar verwachting) meerdere geautomatiseerde
   document-versturingen op deze plek, naast de bestaande "Automatische herinneringen". Bewust als eigen
   functie i.p.v. inline in panelHTML() opgezet, zodat een volgend document-type hier straks gewoon een

   documenttype hier straks gewoon een extra aanroep van deze functie worden. */

  // boekjaar hebben) blijft ongewijzigd; nieuwere documenttypes zonder boekjaar (bijv. de DGA-
  // overeenkomsten) geven hun eigen, simpelere logRegel mee.
  const logRegel = opts.logRegel || (l=>`${opts.logLabel} ${l.boekjaar} verstuurd naar ${l.naar}`);
  return `<div style="border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px;">
    <div style="font-weight:700; font-size:12.5px;">${opts.titel}</div>
    <div style="font-size:11.5px; color:var(--muted); margin:4px 0 10px;">${opts.uitleg}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn sm" ${opts.previewAttr}>⬇ Voorbeeld downloaden</button>
      <button class="btn sm primary" ${opts.sendAttr} ${opts.actief?'':'disabled title="Staat op hold — zie Instellingen"'}>✉ Versturen</button>
    </div>
    <div class="rem-log" style="margin-top:10px;">
      <b style="font-size:12px;">Verzendgeschiedenis</b>
      ${opts.log.length ? opts.log.slice().reverse().map(l=>`<div class="rem-log-item">📨 ${logRegel(l)} — ${fmtDate(l.ts)}</div>`).join('') : '<div class="rem-log-empty">Nog geen documenten verstuurd.</div>'}
    </div>
  </div>`;
}

function openPanel(klantId, silent){
  STATE.panelKlant = klantId;
  const klant = RAW_KLANTEN.find(k=>k.id===klantId);
  const panel = document.getElementById('panel');
  const overlay = document.getElementById('overlay');
  const editing = STATE.editKlant === klantId;
  panel.innerHTML = editing ? editKlantFormHTML(klant) : panelHTML(klant);
  requestAnimationFrame(()=>{ panel.classList.add('open'); overlay.classList.add('open'); });
  if(editing) attachEditKlantHandlers(klant); else attachPanelHandlers(klant);
}
function closePanelDom(){
  const panel = document.getElementById('panel');
  const overlay = document.getElementById('overlay');
  if(panel) panel.classList.remove('open');
  if(overlay) overlay.classList.remove('open');
}
function closePanel(){ STATE.panelKlant=null; STATE.editKlant=null; STATE.showAddKlant=false; STATE.showAddBh=false; STATE.showAddTeam=false; STATE.showAddAuto=false; STATE.editAuto=null; STATE.editBh=null; closePanelDom(); }
function attachEditKlantHandlers(klant){
  document.querySelector('[data-close-panel]').addEventListener('click', closePanel);

/* ============================= HANDLERS ============================= */
// Elementen buiten #contentArea (de zoekbalk, de sidebar-navigatie, de sync-knop, de overlay) blijven
// bij een "lichte" update (alleen #contentArea vervangen) gewoon dezelfde DOM-node — zonder deze guard
// zou elke aanroep van attachHandlers()/attachHandlersLite() daar een NIEUWE listener bovenop de oude
// zetten. Bij honderden klanten en veel interacties per sessie stapelen die zich op, waardoor bijv. het
// zoekveld na verloop van tijd bij elke toetsaanslag de zware klantentabel-herbouw tien, twintig, dertig
// keer achter elkaar uitvoert — precies het "pagina reageert niet"-gedrag. bindOnce() zorgt dat zo'n
// element maar één keer per DOM-node een listener krijgt; na een volledige render() is de node sowieso
// vervangen en telt het weer opnieuw als "nog niet gebonden".
function bindOnce(el, event, handler){
  if(!el) return;
  const key = '__bound_'+event;
  if(el[key]) return;
  el[key] = true;
  el.addEventListener(event, handler);
}
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>bindOnce(el, 'click', ()=>{
    STATE.view = el.getAttribute('data-nav'); STATE.bhFilter=''; STATE.statusFilter=''; STATE.showAddKlant=false; STATE.showAddBh=false; STATE.showAddTeam=false; STATE.showAddAuto=false; STATE.editAuto=null; STATE.editBh=null;

  document.querySelectorAll('[data-toggle-bijtelling-beheer]').forEach(el=>el.addEventListener('click', ()=>{

    BIJTELLING_TABEL.push({jaar:nieuwJaar, laag:laatste?laatste.laag:null, cap:laatste?laatste.cap:null, algemeen:laatste?laatste.algemeen:0.22});

  document.querySelectorAll('[data-bt-opslaan]').forEach(el=>el.addEventListener('click', ()=>{

      const nieuwJaar = Number(input.value) || origJaar;

      const capInput = document.querySelector(`[data-bt-cap="${origJaar}"]`);
      const algInput = document.querySelector(`[data-bt-algemeen="${origJaar}"]`);
      const laag = laagInput && laagInput.value!=='' ? Number(laagInput.value) : null;

    // STATE.search wordt meteen bijgewerkt, maar het herbouwen van de (mogelijk grote) klantentabel
    // wordt gedebouncet: bij honderden klanten is die herbouw op ELKE toetsaanslag zwaar genoeg om de
    // pagina tijdelijk te laten "vastlopen" tijdens snel typen. Door pas 200ms na de laatste

function handleCSVUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let updated=0, skipped=0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<2) return;
      const [naam, saldoStr, txnStr] = parts;
      if(/^klant/i.test(naam) && /saldo/i.test(saldoStr||'')) return; // header row
      const match = RAW_KLANTEN.find(k=>k.naam.toLowerCase().includes(naam.toLowerCase()) || naam.toLowerCase().includes(k.naam.toLowerCase()));
      if(match){
        const saldo = parseFloat((saldoStr||'0').replace(',', '.')) || 0;
        STORE[match.id].saldo = saldo;
        if(txnStr!==undefined) STORE[match.id].txn = parseInt(txnStr)||0;
        STORE[match.id].sync = new Date().toISOString().slice(0,10);
        updated++;
      } else skipped++;
    });
    persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast(`CSV verwerkt: ${updated} klant(en) bijgewerkt${skipped?`, ${skipped} regel(s) niet herkend`:''}.`);
  };
  reader.readAsText(file);
}

/* ============================= BANKTRANSACTIE-IMPORT PER KLANT ============================= */
function computeTxnStats(rows){
  const hasStatusCol = rows.length > 0 && Object.keys(rows[0]).some(k=>k.toLowerCase().trim()==='status');
  let relevant = rows;
  if(hasStatusCol){
    relevant = rows.filter(r=> (findField(r,['Status'])||'').toLowerCase().includes('niet verwerkt'));
  }
  // Een bedrag mét minteken ervoor is een crediteur (credit), zonder minteken een debiteur (debet) —
  // deze twee worden apart opgeteld i.p.v. als één absolute som.
  let debetSaldo = 0, debetAantal = 0, creditSaldo = 0, creditAantal = 0;
  relevant.forEach(r=>{
    const bedrag = parseDutchAmount(findField(r,['Bedrag','Amount']));
    if(bedrag < 0){ creditSaldo += Math.abs(bedrag); creditAantal++; }
    else { debetSaldo += Math.abs(bedrag); debetAantal++; }
  });
  debetSaldo = Math.round(debetSaldo*100)/100;
  creditSaldo = Math.round(creditSaldo*100)/100;
  return {
    debetSaldo, debetAantal, creditSaldo, creditAantal,
    saldo: Math.round((debetSaldo+creditSaldo)*100)/100,
    aantal: relevant.length, totaalRegels: rows.length, hasStatusCol
  };
}
function guessKlantFromFilename(filename){
  const base = filename.replace(/\.(csv|xlsx|xls|txt)$/i,'');
  const prefix = base.split(/[-_]/)[0].trim();
  if(!prefix) return null;
  const match = RAW_KLANTEN.find(k=> k.naam.toLowerCase().includes(prefix.toLowerCase()) || prefix.toLowerCase().includes(k.naam.toLowerCase()));
  return match ? match.id : null;
}

/* ============================= KLANTEN BULK-IMPORT (CSV/Excel export vanuit Administratiebox) ============================= */
function parseLhKlantNaam(raw){
  let s = (raw||'').trim();
  const parenIdx = s.indexOf('(');
  if(parenIdx > 0) s = s.slice(0, parenIdx).trim();
  return s.replace(/[.,]+$/,'').trim();
}
function normalizeKlantNaam(s){
  return (s||'').toLowerCase()
    .replace(/\bb\.?v\.?\b/g,'bv')
    .replace(/\bv\.?o\.?f\.?\b/g,'vof')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');
}
function vindKlantOpNaam(naam){
  const norm = normalizeKlantNaam(naam);
  if(!norm || norm.length < 3) return null;
  let match = RAW_KLANTEN.find(k => normalizeKlantNaam(k.naam) === norm);
  if(match) return match;
  const prefixMatches = RAW_KLANTEN.filter(k => {
    const kn = normalizeKlantNaam(k.naam);
    return kn && kn.length >= 4 && (norm.startsWith(kn) || kn.startsWith(norm));
  });
  return prefixMatches.length === 1 ? prefixMatches[0] : null;
}
function isLhMetaRow(v){
  if(v===undefined || v===null) return true;
  if(typeof v !== 'string') return true;
  const s = v.trim();
  if(s==='') return true;
  if(s.startsWith('Email')) return true;
  if(s==='Verwerker') return true;
  if(s.startsWith('Salarissen')) return true;
  if(s.startsWith('Salaris') && s.includes('betaallijst')) return true;
  if(s.startsWith('Aangifte')) return true;
  if(s.startsWith('LJP')) return true;
  if(/^let\s*op/i.test(s)) return true;
  if(s.toLowerCase().includes('ter info')) return true;
  if(BOEKHOUDERS.some(b=>b.naam && b.naam.trim()===s)) return true;
  return false;
}
function readLhExcelNamesPromise(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Bestand kon niet gelezen worden'));
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null});
        const names = [];
        const isBlankCell = (v)=> v===null || v===undefined || (typeof v==='string' && v.trim()==='');
        for(let r=0; r<grid.length; r++){
          const v = grid[r] && grid[r][0];
          if(typeof v==='string' && !isLhMetaRow(v)){
            const n1 = grid[r+1] && grid[r+1][0];
            const n2 = grid[r+2] && grid[r+2][0];
            const hasFollowup = (typeof n1==='string' && (n1.trim().startsWith('Email') || n1.trim()==='Verwerker')) ||
                                 (typeof n2==='string' && (n2.trim().startsWith('Email') || n2.trim()==='Verwerker'));
            // Elke echte werkgever-rij in dit bestand wordt vooraf gegaan door een lege rij (de blanco
            // scheidingsregel tussen twee werkgevers). Dit sluit ook de kop-rijen bovenaan het bestand
            // uit (bijv. de namen van de boekhouders zelf, die toevallig ook door "Verwerker" gevolgd
            // kunnen worden en anders ten onrechte als werkgever herkend zouden worden).
            const vorigeRijLeeg = r===0 || isBlankCell(grid[r-1] && grid[r-1][0]);
            if(hasFollowup && vorigeRijLeeg) names.push(v);
          }
        }
        resolve(names);
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
async function handleLhKlantenImport(e){
  // Haalt de resultaat-box telkens opnieuw op (in plaats van één keer vast te leggen), zodat een
  // eventuele tussentijdse her-render (bijv. door de periodieke sync) niet leidt tot een melding die
  // in een losstaand, onzichtbaar DOM-element terechtkomt — daardoor zou een gebruiker denken dat er
  // "niets gebeurt" terwijl de import eigenlijk wel (deels) gelukt of mislukt is.
  const getResultBox = ()=> document.getElementById('lhKlantenImportResult');
  try{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const box0 = getResultBox();
    if(box0) box0.innerHTML = '<div class="hint">Bestand wordt gelezen…</div>';
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek (XLSX) kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina, en probeer het daarna opnieuw.');
    }
    const rawNames = await readLhExcelNamesPromise(file);
    if(!rawNames.length){
      const boxEmpty = getResultBox();
      if(boxEmpty) boxEmpty.innerHTML = `<div class="banner" style="border-color:var(--amber-brd); color:#8a4b06;">⚠️ Er zijn geen werkgevers herkend in "${String(file.name).replace(/</g,'&lt;')}". Controleer of dit het juiste bestand is en of de structuur (naam, daaronder "Email:", daaronder "Verwerker") ongewijzigd is.</div>`;
      return;
    }
    let nieuwGemarkeerd = 0, algeactiveerd = 0;
    const nietGevonden = [];
    rawNames.forEach(raw=>{
      const naam = parseLhKlantNaam(raw);
      const klant = vindKlantOpNaam(naam);
      if(!klant){ nietGevonden.push(raw); return; }
      if(klant.doetLoonaangifte){ algeactiveerd++; }
      else { klant.doetLoonaangifte = true; nieuwGemarkeerd++; }
    });
    logActiviteit(`LH-klantenimport uit "${file.name}": ${nieuwGemarkeerd} nieuw gemarkeerd, ${algeactiveerd} stonden al aan${nietGevonden.length ? `, ${nietGevonden.length} niet gevonden` : ''}`);
    persistMeta(); persist();
    const box = getResultBox();
    if(box){
      const escaped = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      box.innerHTML = `<div class="banner">✅ <b>${rawNames.length}</b> werkgevers gevonden in "${escaped(file.name)}". `
        + `<b>${nieuwGemarkeerd}</b> klant(en) nieuw gemarkeerd met loonaangifte, <b>${algeactiveerd}</b> stonden al aan.`
        + (nietGevonden.length ? `<br>⚠️ <b>${nietGevonden.length}</b> niet gevonden op naam — voeg deze klant(en) toe of vink handmatig aan: ${nietGevonden.slice(0,30).map(escaped).join(', ')}${nietGevonden.length>30?', …':''}` : '')
        + `</div>`;
    }
    render();
  }catch(err){
    console.error('Loonheffing-klantenimport mislukt:', err);
    const boxErr = getResultBox();
    const msg = `<div class="banner" style="border-color:var(--red); color:var(--red);">❌ Fout bij inlezen: ${((err&&err.message)||err)}</div>`;
    if(boxErr) boxErr.innerHTML = msg; else alert('Fout bij inlezen van het Excel-bestand: '+((err&&err.message)||err));
  }
}
function handleKlantenCSVUpload(e){

    const report = { nieuw:0, bijgewerkt:0, overgeslagen:0, nieuweBoekhouders:[], nieuweTeams:[] };
    let fallbackBhId = null;
    const getFallbackBh = ()=>{
      if(fallbackBhId) return fallbackBhId;

      const teamLetter = (findField(row,['Team'])||'').trim();
      const boekhouderNaam = (findField(row,['Boekhouder'])||'').trim();

      let teamObj = null;
      if(teamLetter){
        const teamNaam = 'Team '+teamLetter;
        teamObj = TEAMS.find(t=>t.naam.toLowerCase()===teamNaam.toLowerCase());
        if(!teamObj){ teamObj = addTeam({naam:teamNaam}); report.nieuweTeams.push(teamNaam); }

      let bhId;

        let bhObj = BOEKHOUDERS.find(b=>b.naam.toLowerCase().trim()===boekhouderNaam.toLowerCase());
        if(!bhObj){ bhObj = addBoekhouder({naam:boekhouderNaam, team: teamObj?teamObj.id:''}); report.nieuweBoekhouders.push(boekhouderNaam); }
        else if(teamObj && !bhObj.team){ bhObj.team = teamObj.id; }
        bhId = bhObj.id;
      } else {
        bhId = getFallbackBh();
      }

      // Eerst proberen te matchen op extId (het exportbestand se eigen klant-Id/klantnummer, als dat
      // aanwezig is). Is er geen extId of geen match, dan valt de import terug op de klantnaam — zelfde
      // normalisatie (hoofdletters/leestekens/BV-schrijfwijzen genegeerd) als bij de Loonheffingen- en
      // Autolijst-import — zodat eenzelfde klant nooit twee keer wordt aangemaakt, ook niet als het
      // klantnummer een keer ontbreekt of tussen exports verandert.
      let bestaand = extId ? RAW_KLANTEN.find(k=>k.extId===extId) : null;
      if(!bestaand) bestaand = vindKlantOpNaam(naam);
      if(bestaand){

        if(kvk) bestaand.kvk = kvk;

        STORE[bestaand.id].txn = txn;

        const klant = {

          managementovereenkomstDga: defaultManagementovereenkomstDga(),
          dl:{ OB:NA(), VPB:NA(), LH:NA(), JR:NA(), overige:[] }
        };
        RAW_KLANTEN.push(klant);
        STORE[id] = { dl:JSON.parse(JSON.stringify(klant.dl)), saldo:0, saldoDebet:0, saldoCredit:0, txn, sync:new Date().toISOString().slice(0,10), items:[], kanalen:['email'], dagen1:7, dagen2:14, log:[], notities:'', akkoordLog:[], vpbAkkoordLog:[], fiscaleEenheidLog:[], betalingsuitstelLog:[], arbeidsovereenkomstDgaLog:[], managementovereenkomstDgaLog:[], lh:{taken:nieuwLhTaken(false), log:[], volgendeMaandNotitie:''} };
        report.nieuw++;
      }
    });

    logActiviteit(`Klantenimport uit "${file.name}": ${report.nieuw} nieuw, ${report.bijgewerkt} bijgewerkt${report.overgeslagen?`, ${report.overgeslagen} overgeslagen`:''}`);

    const bhList = [...new Set(report.nieuweBoekhouders)];

    if(box){

  });

      const aantal = parseInt(document.getElementById('bulkTxnAantal-'+idx).value)||0;
      STORE[klantId].saldoDebet = debet;
      STORE[klantId].saldoCredit = credit;
      STORE[klantId].saldo = Math.round((debet+credit)*100)/100;
      STORE[klantId].txn = aantal;
      STORE[klantId].sync = new Date().toISOString().slice(0,10);
      toegepast++;
    });
    persist();
    document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlers();
    toast(`Bulk-import klaar: ${toegepast} klant(en) bijgewerkt${overgeslagen?`, ${overgeslagen} overgeslagen (geen klant gekoppeld)`:''}.`);
  });
}

function refreshPanel(klant){
  document.getElementById('panel').innerHTML = panelHTML(klant);
  attachPanelHandlers(klant);
  if(STATE.view!=='dashboard'){ document.getElementById('contentArea').innerHTML = viewHTML(); attachHandlersLite(); }
}
function attachHandlersLite(){
  // Was ooit een handmatige deelverzameling van handlers (bedoeld om een dure volledige re-render te
  // vermijden na een achtergrond-refresh), maar raakte daardoor telkens achter bij nieuwe knoppen op
  // de pagina's (Loonheffingen, Teams, Klanten, enz.) — die werden dan onklikbaar zodra het klantpaneel
  // open stond tijdens een refresh. Nu bindOnce() dubbele listeners op de vaste buiten-#contentArea
  // elementen toch al voorkomt, is het veilig én correcter om gewoon de volledige attachHandlers() te
  // hergebruiken.
  attachHandlers();
}

// Elke stap hieronder is defensief in een try/catch gezet: een fout in de Microsoft-sync
// (bijv. een verkeerd ingevuld App ID) mag de rest van het dashboard nooit blokkeren of
// een blanco pagina veroorzaken — render() moet hoe dan ook draaien.

// MSAL kan een 'interaction in progress'-vlag laten hangen in sessionStorage als een vorige
// inlogpoging (bijv. een gesloten pop-up, of een gecrashte pagina) niet netjes werd afgerond.
// Die vlag blokkeert daarna alle volgende inlogpogingen/stille token-ververste tot de gebruiker
// zijn browsergeschiedenis (en daarmee sessionStorage) wist. Bij het laden van deze pagina is er
// per definitie nog geen interactie bezig, dus we ruimen een eventueel achtergebleven vlag hier
// veilig op — dat voorkomt dat de gebruiker steeds handmatig zijn browsergeschiedenis moet wissen.
try{
  Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf('interaction.status')>-1) sessionStorage.removeItem(k); });
}catch(e){}

// De laatst bekeken pagina (uit localStorage) bepaalt bij het laden op welke pagina we starten,
// zodat een refresh je niet terugzet naar het Overzicht.
try{
  const laatstePagina = laatstBekekenPagina();
  if(laatstePagina) STATE.view = laatstePagina;
}catch(e){}

try{ loadSync(); }catch(e){ console.error('Sync-instellingen laden mislukt:', e); }
try{ render(); }catch(e){
  console.error('Render mislukt:', e);
  const appEl = document.getElementById('app');
  if(appEl) appEl.innerHTML = '<div style="padding:40px; font-family:sans-serif; max-width:600px; margin:0 auto;">'
    + '<h2>Er ging iets mis bij het laden</h2>'
    + '<p>Technische foutmelding: ' + (e && e.message ? e.message : e) + '</p>'
    + '<p>Probeer de pagina te verversen. Blijft dit gebeuren, stuur deze foutmelding door.</p></div>';
}
try{ if(SYNC.enabled) fetchRemoteAndMerge(false); }catch(e){ console.error('Sync mislukt:', e); }
setInterval(()=>{
  if(SYNC.enabled && !STATE.panelKlant && !STATE.showAddKlant && !STATE.showAddBh && !isTypingInField()){
    try{ fetchRemoteAndMerge(false); }catch(e){ console.error('Sync mislukt:', e); }
  }
}, 45000);


// Vang op dat gedebouncede localStorage-writes (persist/persistMeta) niet verloren gaan als het
// tabblad direct na een wijziging wordt gesloten.
window.addEventListener('beforeunload', ()=>{
  try{ flushPersistStore(); }catch(e){}
  try{ flushPersistMeta(); }catch(e){}
});
